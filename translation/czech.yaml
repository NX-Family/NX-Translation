  target: "Do nabídky HOME se vrátíte pomocí <0xE0B9/>.<TAG1/><NL/><L_ROMB/><TAG2/>Stahování bude pokračovat. Po jeho dokončení bude nutné konzoli aktualizovat.<TAG3/>"
- source: "You can see your virtual game cards on this screen.<NL/>Purchased downloadable games will appear here."
