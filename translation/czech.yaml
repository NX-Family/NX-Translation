  target: "Hodnoticí organizace přidělují hrám věková hodnocení podle obsahu. Vyberte organizaci pro svou oblast.<TAG1/><NL/>Více o jednotlivých věkových hodnoceních každé organizace najdete na webu podpory <L_N10/>.<NL/><TAG2/>"
- source: "Software shared using <L_TGS/>.<NL/>To learn more about it, visit <L_NEP/>."
