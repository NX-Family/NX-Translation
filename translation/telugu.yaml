  target: "సేవ్ డేటా ఆటో డౌన్లోడ్ ఆన్ అయింది.<TAG1/><NL/><L_DOT1/><TAG2/>తొలి డౌన్లోడ్ స్వయంగా చేయాలి.<TAG3/><NL/><L_DOT1/><TAG4/>ఇతర కన్సోల్లలో ఈ ఫీచర్ ఆన్ చేయడానికి ప్రతి కన్సోల్లో అమరికలు మార్చాలి.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>HOME మెనూలో <0xE130/> (సిస్టం అమరికలు) ⇒ డేటా నిర్వహణ ⇒ సేవ్ డేటా క్లౌడ్ నుంచి అమరికలు మార్చవచ్చు.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
