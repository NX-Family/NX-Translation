  target: "ఆటో డౌన్లోడ్ ఆన్ చేస్తే, మరో కన్సోల్లో ఆపిన చోటు నుంచి సులభంగా ఆడవచ్చు.<TAG1/><NL/><TAG2/>తొలి డౌన్లోడ్ మీరే చేయాలి.<TAG3/>"
