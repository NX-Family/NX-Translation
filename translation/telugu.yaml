  target: "HOME మెనూ పై ఎడమ మూలలో కనీసం ఒక యూజర్ చిహ్నంపై <0xE151/> ఉంది.<TAG1/><NL/>సిస్టం బదిలీకి ముందు అలాంటి ప్రతి యూజర్ పేజీ తెరిచి అక్కడి వివరాలు చూడటం మంచిది.<TAG2/><NL/>సిస్టం బదిలీ చేయవచ్చు, కానీ ఆ యూజర్ల <L_N10/> ఖాతాలు ప్రస్తుతం పనిచేయడం లేదు. దీంతో సాఫ్ట్వేర్ డౌన్లోడ్ వంటి కొన్ని పనుల్లో లోపాలు రావచ్చు.<NL/><TAG3/><TAG4/>అయినా బదిలీ కొనసాగించాలని ఎంచుకుంటే, సేవ్ డేటా వంటి ముఖ్య డేటా పోదు.<TAG5/><TAG6/>"
