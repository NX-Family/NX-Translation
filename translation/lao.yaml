  target: "ມີຜູ້ໃຊ້ຢ່າງໜ້ອຍໜຶ່ງຄົນທີ່ມີເຄື່ອງໝາຍ <0xE151/> ເທິງໄອຄອນຜູ້ໃຊ້ຢູ່ມຸມຊ້າຍເທິງຂອງເມນູ HOME.<TAG1/><NL/>ກ່ອນເລີ່ມການໂອນລະບົບ ຂໍແນະນຳໃຫ້ເປີດໜ້າຜູ້ໃຊ້ຂອງແຕ່ລະຄົນທີ່ມີເຄື່ອງໝາຍນີ້ ແລ້ວອ່ານຂໍ້ມູນທີ່ສະແດງ.<TAG2/><NL/>ເຖິງຈະຍັງໂອນລະບົບໄດ້ ແຕ່ບັນຊີ <L_N10/> ຂອງຜູ້ໃຊ້ເຫຼົ່ານັ້ນໃຊ້ບໍ່ໄດ້ໃນຕອນນີ້ ຈຶ່ງອາດເກີດຂໍ້ຜິດພາດໃນບາງຂະບວນການ ລວມທັງການດາວໂຫຼດຊອບແວ.<NL/><TAG3/><TAG4/>ຖ້າທ່ານຍັງເລືອກໂອນລະບົບຕໍ່ ຂໍ້ມູນສຳຄັນ ເຊັ່ນຂໍ້ມູນບັນທຶກ ຈະບໍ່ສູນເສຍ.<TAG5/><TAG6/>"
