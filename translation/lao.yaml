  target: "ເຊື່ອມຕໍ່ອິນເຕີເນັດບໍ່ໄດ້.<TAG1/><NL/>ກະລຸນາລອງໃໝ່.<TAG2/><NL/>ຖ້າຍັງເຊື່ອມຕໍ່ບໍ່ໄດ້ ໃຫ້ເປີດຊອບແວຄືນໃໝ່ແລ້ວລອງໃໝ່.<TAG3/><NL/>ຖ້າຍັງມີບັນຫາ ກະລຸນາເບິ່ງເວັບໄຊຊ່ວຍເຫຼືອຂອງ <L_N10/>.<NL/><L_SNCE/>"
