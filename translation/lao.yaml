  target: "ຈັດເກັບຊອບແວຕໍ່ໄປນີ້ເພື່ອເພີ່ມພື້ນທີ່ຫວ່າງບໍ?<NL/><TAG1/><TAG2/>ຈະເຫຼືອພຽງຂໍ້ມູນບັນທຶກ ແລະໄອຄອນໃນເມນູ HOME ຂອງຊອບແວທີ່ຈັດເກັບ.<NL/>ຕ້ອງດາວໂຫຼດຊອບແວໃໝ່ເພື່ອໃຊ້ອີກຄັ້ງ.<NL/>ຫຼືທ່ານສາມາດຍ້າຍຂໍ້ມູນໂດຍເລືອກ <TAG3/><0xE130/> (ການຕັ້ງຄ່າລະບົບ)<TAG4/> ⇒ <TAG5/>ການຈັດການຂໍ້ມູນ<TAG6/> ຜ່ານ <TAG7/>ເມນູ HOME<TAG8/>.<TAG9/><TAG10/>"
