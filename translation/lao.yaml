  target: "ທ່ານໃຊ້ <L_NS/> ບັນທຶກພາບໜ້າຈໍແລະວິດີໂອໃນເກມ<NL/>ເພີ່ມຄຳເຫັນ ແລະໂພສລົງສື່ສັງຄົມໄດ້.<TAG1/><NL/>ຕັ້ງເປັນ ຈຳກັດ ເພື່ອປິດການໂພສພາບໜ້າຈໍແລະວິດີໂອລົງສື່ສັງຄົມ.<NL/><TAG2/><TAG3/>ຜູ້ໃຊ້ບັນຊີ <L_N10/> ທີ່ມີອາຍຸຕ່ຳກວ່າ 13 ປີ<NL/>ຈະໂພສລົງສື່ສັງຄົມບໍ່ໄດ້ ບໍ່ວ່າຈະຕັ້ງຄ່າເຫຼົ່ານີ້ແນວໃດ.<TAG4/><TAG5/>"
- source: "You can use online licenses to play downloadable software and additional content as long as your console is connected to the Internet.<TAG1/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG2/>"
