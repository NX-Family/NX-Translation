  target: "ເມື່ອແຈ້ງວ່າຜູ້ໃຊ້ຄົນໃດໜຶ່ງເຂົ້າອອນລາຍແລ້ວ ຈະບໍ່ແຈ້ງສຳລັບຄົນນັ້ນອີກເປັນເວລາ 30 ນາທີ."
- source: "Once everyone has reached this screen, one person should create a group and then have the others join it.<NL/><TAG1/><TAG2/>Everyone's software will be updated to match the most recent version in the group.<TAG3/><TAG4/>"
  target: "ເມື່ອທຸກຄົນມາຮອດໜ້າຈໍນີ້ແລ້ວ, ຄົນໜຶ່ງຄວນສ້າງກຸ່ມ ແລະ ຈາກນັ້ນໃຫ້ຄົນອື່ນເຂົ້າຮ່ວມມັນ.<NL/><TAG1/><TAG2/>ຊອບແວຂອງທຸກໆຄົນຈະຖືກອັບເດດເພື່ອໃຫ້ກົງກັບເວີຊັນຫຼ້າສຸດໃນກຸ່ມ.<TAG3/><TAG4/>"
- source: "Once the console has been initialized, any data deleted during initialization cannot be recovered. Do you want to continue?<NL/><L_ROMB/> This process may take some time."
  target: "ເມື່ອຄືນຄ່າເລີ່ມຕົ້ນເຄື່ອງແລ້ວ ຂໍ້ມູນທີ່ຖືກລຶບໃນຂັ້ນຕອນນີ້ຈະກູ້ຄືນບໍ່ໄດ້. ຈະດຳເນີນການຕໍ່ບໍ?<NL/><L_ROMB/> ຂັ້ນຕອນນີ້ອາດໃຊ້ເວລາຊົ່ວໄລຍະໜຶ່ງ."
- source: "Once you save a mapping to a preset slot, you can select<NL/>Load a Preset Mapping to easily swap mappings."
  target: "ເມື່ອບັນທຶກການກຳນົດປຸ່ມໃສ່ຊ່ອງຄ່າຕັ້ງໄວ້ແລ້ວ ເລືອກ<NL/>ໂຫຼດການກຳນົດປຸ່ມທີ່ຕັ້ງໄວ້ ເພື່ອສະຫຼັບຄ່າໄດ້ງ່າຍ."
