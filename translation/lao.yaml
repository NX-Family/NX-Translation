- source: "You can load up to 30 virtual game cards at once."
  target: "ທ່ານໂຫຼດບັດເກມສະເໝືອນໄດ້ສູງສຸດ 30 ບັດພ້ອມກັນ."
- source: "You can make a group with local users and match software versions."
