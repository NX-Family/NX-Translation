  target: "ພົບຂໍ້ມູນເກົ່າຂອງຊອບແວນີ້.<NL/>ຈະລຶບເພື່ອໃຫ້ມີພື້ນທີ່ຫວ່າງບໍ?<TAG1/><NL/><TAG2/><TAG3/>ຕ້ອງດາວໂຫຼດຂໍ້ມູນກ່ອນຫຼິ້ນຊອບແວນີ້.<NL/>ຖ້າຢາກຫຼິ້ນຊອບແວນີ້ໄດ້ທັນທີ ລອງຈັດເກັບຂໍ້ມູນຂອງຊອບແວອື່ນແທນ.<TAG4/><TAG5/>"
