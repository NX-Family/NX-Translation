  target: "ບໍ່ມີພາບໜ້າຈໍຫຼືວິດີໂອບັນທຶກໄວ້ໃນບ່ອນນີ້.<NL/>ລອງບັນທຶກພາບໜ້າຈໍແລະວິດີໂອຫຼາກຫຼາຍໄວ້ເປັນຄວາມຊົງຈຳໃນການຫຼິ້ນ <L_NS/>!<TAG1/><NL/>ໃຊ້ປຸ່ມບັນທຶກພາບເພື່ອຖ່າຍພາບໜ້າຈໍແລະວິດີໂອໄດ້. ກົດສັ້ນໆເພື່ອຖ່າຍພາບໜ້າຈໍປັດຈຸບັນ ຫຼືກົດຄ້າງເພື່ອບັນທຶກວິດີໂອຂອງ 30 ວິນາທີທີ່ຜ່ານມາ.<NL/>ຈາກນັ້ນທ່ານອາດໂພສພາບໜ້າຈໍແລະວິດີໂອໃນສື່ສັງຄົມໄດ້."
