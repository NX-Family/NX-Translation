  target: "ລະບົບນີ້ມີຂໍ້ມູນຈາກບັນຊີ <L_N10/> ທີ່ບໍ່ແມ່ນຂອງຍີ່ປຸ່ນ ຈຶ່ງໂອນ<L_XA0/>ຂໍ້ມູນໃນລະບົບໄປຍັງລະບົບ <L_N10/> <TAG1/><L_SWT2/><TAG2/> (ພາສາຍີ່ປຸ່ນ - ຍີ່ປຸ່ນເທົ່ານັ້ນ) ບໍ່ໄດ້.<TAG3/><NL/>ກະລຸນາອ່ານລາຍລະອຽດລະບົບ <L_N10/> <TAG4/><L_SWT2/><TAG5/> ເພື່ອເບິ່ງ<L_XA0/>ວິທີໂອນຂໍ້ມູນ.<NL/><NL/><L_SQR/> ເມື່ອໃຊ້ <L_N10/> <TAG6/><L_SWT2/><TAG7/><L_XA0/>(ພາສາຍີ່ປຸ່ນ - ຍີ່ປຸ່ນເທົ່ານັ້ນ)<L_DOT3/><TAG8/><NL/><L_WSP/><TAG9/>ເນື່ອງຈາກບັນຊີ <L_N10/> ທີ່ບໍ່ແມ່ນຂອງຍີ່ປຸ່ນໃຊ້ກັບ <L_N10/> <TAG10/><L_SWT2/><TAG11/><L_XA0/>(ພາສາຍີ່ປຸ່ນ -<NL/>ຍີ່ປຸ່ນເທົ່ານັ້ນ) ບໍ່ໄດ້ ຂໍ້ມູນຂອງລະບົບນີ້ຈຶ່ງບໍ່ຮອງຮັບແລະໂອນບໍ່ໄດ້.<NL/><TAG12/><TAG13/>ເພື່ອໃຊ້ບັນຊີ <L_N10/> ທີ່ບໍ່ແມ່ນຂອງຍີ່ປຸ່ນ ທ່ານຕ້ອງໃຊ້<L_XA0/><L_N10/> <TAG14/><L_SWT2/><TAG15/><L_XA0/>(ຫຼາຍພາສາ).<TAG16/><TAG17/><TAG18/><NL/>ໂອນຂໍ້ມູນຈາກບັນຊີ <L_N10/> ຂອງຍີ່ປຸ່ນແຕ່ລະບັນຊີໄດ້ ຫຼັງເພີ່ມຜູ້ໃຊ້ໃນລະບົບ <L_N10/> <TAG19/><L_SWT2/><TAG20/>.<TAG21/><NL/>ຫຼືທ່ານອາດລຶບບັນຊີ <L_N10/> ທີ່ບໍ່ແມ່ນຂອງຍີ່ປຸ່ນທັງໝົດຈາກລະບົບນີ້ ແລ້ວໂອນຂໍ້ມູນລະບົບ.<NL/><TAG22/><TAG23/>ກະລຸນາຈື່ວ່າ ຂໍ້ມູນທີ່ລຶບແລ້ວກູ້ຄືນບໍ່ໄດ້.<TAG24/><TAG25/><TAG26/><NL/><NL/><L_SQR/> ເມື່ອໃຊ້ <L_N10/> <TAG27/><L_SWT2/><TAG28/><L_XA0/>(ຫຼາຍພາສາ)<L_DOT3/><TAG29/><NL/><L_WSP/><TAG30/><L_N10/> <TAG31/><L_SWT2/><TAG32/><L_XA0/>(ຫຼາຍພາສາ) ຮອງຮັບຂໍ້ມູນຜູ້ໃຊ້ທັງໝົດໃນລະບົບນີ້ ແລະທ່ານໂອນຂໍ້ມູນລະບົບຜ່ານການສື່ສານໃນພື້ນທີ່ໄດ້.<TAG33/><TAG34/><TAG35/><NL/>ເພື່ອໂອນຂໍ້ມູນລະບົບໄປລະບົບໃໝ່ ໃຫ້ເລືອກ ເລີ່ມການໂອນລະບົບ ເມື່ອມີ<L_XA0/>ຕົວເລືອກນີ້ໃນການຕັ້ງຄ່າຄັ້ງທຳອິດ.<TAG36/>"
