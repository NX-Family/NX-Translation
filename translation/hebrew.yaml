  target: "הורדה אוטומטית של נתוני שמירה לא תמיד מתבצעת מיד.<NL/><TAG1/><TAG2/>כדי לשחק מיד בקונסולה אחרת עם אותם נתוני שמירה, ניתן לגבות את נתוני השמירה ידנית ואז להוריד אותם ידנית לפי הצורך.<TAG3/><TAG4/>"
