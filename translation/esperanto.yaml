  target: "Datumoj sur ĉi tiu karto <L_MSD/> estas difektitaj kaj neuzeblaj.<TAG1/><NL/>La difektitaj datumoj estos forviŝitaj.<TAG2/><NL/><TAG3/>La konsolo restartos post la forviŝo.<NL/>(Tio fermos paŭzigitan programaron.)<NL/>Konservitaj datumoj, ekrankopioj, videoj kaj aliaj datumoj ne de <L_NS/> ne estos forviŝitaj. Vi povas elpreni la karton <L_MSD/>, se vi ne volas uzi ĝin en ĉi tiu konsolo.<TAG4/>"
