  target: "Por daŭrigi en ĉi tiu sistemo, fermu la programaron en ĉiu alia sistemo, kie ĝin ludas uzanto ligita al ĉi tiu konto <L_N10/>.<TAG1/><NL/>Alternative, vi povas ludi la programaron en ĉi tiu sistemo sen fermi ĝin aliloke, sekvante ĉi tiujn paŝojn:<NL/><L_ROMB/><TAG2/>Iu <L_DLC/> ne disponeblos se vi tiel lanĉos la programaron.<TAG3/><TAG4/><NL/>1. <TAG5/>Iru al la menuo HOME, reliefigu la programaron kaj premu <0xE0E2/> por<L_XA0/>fermi ĝin.<TAG6/><NL/>2. <TAG7/>Premu kaj tenu <0xE0E3/>, poste premu <0xE0E0/> por relanĉi la programaron.<TAG8/>"
- source: "To continue without linking, create a new user.<NL/><TAG1/><TAG2/>You can link a <L_N10/> Account later.<TAG3/><TAG4/>"
  target: "Por daŭrigi sen ligado, kreu novan uzanton.<NL/><TAG1/><TAG2/>Vi povas poste ligi konton <L_N10/>.<TAG3/><TAG4/>"
- source: "To disconnect an unwanted controller, press its SYNC Button briefly."
  target: "Por malkonekti nedeziratan regilon, mallonge premu ĝian butonon SYNC."
- source: "To display Support Information, Important Information, and Intellectual Property Notices, insert the game card or download this software."
  target: "Por montri Subteninformoj, Gravaj informoj kaj Avizoj pri intelekta propraĵo, enmetu la ludkarton aŭ elŝutu ĉi tiun programaron."
- source: "To display your <TAG1/><L_N3D/><TAG2/> friends (<0xE131/>), your <TAG3/><L_N3D/><TAG4/> needs to be linked with a <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>You can do so by going to System Settings on your <TAG8/><L_N3D/><TAG9/>."
  target: "Por montri viajn amikojn en <TAG1/><L_N3D/><TAG2/> (<0xE131/>), via <TAG3/><L_N3D/><TAG4/> devas esti ligita al <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>Vi povas fari tion en Sistemagordoj de via <TAG8/><L_N3D/><TAG9/>."
- source: "To download the save data, the software you're using will now close and restart."
  target: "Por elŝuti la konservitajn datumojn, la programaro, kiun vi uzas, nun fermiĝos kaj relanĉiĝos."
- source: "To earn points for physical software, certain conditions must be fulfilled. For details, see the <L_MNT/> website."
  target: "Por gajni poentojn pro fizika programaro, certaj kondiĉoj devas esti plenumitaj. Por detaloj, vidu la retejon de <L_MNT/>."
- source: "To enjoy surround sound, you will need a device that supports linear PCM 5.1 surround sound. Without a supporting device connected, some sounds may not play correctly.<TAG1/><NL/>Do you want to enable surround sound?"
  target: "Por ĝui ĉirkaŭsonon, vi bezonos aparaton, kiu subtenas ĉirkaŭsonon per lineara PCM 5.1. Sen konektita subtena aparato, iuj sonoj eble ne estos ĝuste ludigataj.<TAG1/><NL/>Ĉu vi volas ŝalti ĉirkaŭsonon?"
- source: "To exit Maintenance Mode, press the POWER Button to turn off the console."
  target: "Por eliri el Prizorga reĝimo, premu la butonon POWER por malŝalti la konsolon."
- source: "To free up enough space, you will also need to archive software for which Prevent Auto Archiving has been enabled.<NL/>Choose software to archive?"
  target: "Por liberigi sufiĉe da spaco, vi ankaŭ devos arkivi programaron kun ŝaltita Malebligi aŭtomatan arkivadon.<NL/>Ĉu elekti programaron por arkivi?"
- source: "To link the two systems, you will need to bring them close to one another.<TAG1/><NL/>If the system shown is unavailable because it has been damaged or lost, please unlink the system from a PC or smart device.<TAG2/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG3/>"
  target: "Por ligi la du sistemojn, vi devos alproksimigi ilin unu al la alia.<TAG1/><NL/>Se la montrita sistemo ne disponeblas pro difektiĝo aŭ perdiĝo, bonvolu malligi ĝin per komputilo aŭ saĝa aparato.<TAG2/><NL/>Por pliaj informoj, vizitu la subtenan retejon de <L_N10/>.<NL/><TAG3/>"
- source: "To load a virtual game card on another system, you must link this system with the other system. Systems only need to<L_XA0/>be linked<L_XA0/>once.<NL/><TAG1/><TAG2/>Each <L_N10/> Account can have a maximum of two systems linked at a time.<TAG3/><TAG4/>"
  target: "Por ŝargi virtualan ludkarton en alia sistemo, vi devas ligi ĉi tiun sistemon kun la alia. La sistemoj devas<L_XA0/>ligiĝi<L_XA0/>nur unufoje.<NL/><TAG1/><TAG2/>Ĉiu konto <L_N10/> povas havi maksimume du sistemojn ligitajn samtempe.<TAG3/><TAG4/>"
- source: "To load a virtual game card on this system, you must link it with the other system <TAG1/> is using, shown below. Systems only need to<L_XA0/>be linked once."
  target: "Por ŝargi virtualan ludkarton ĉi-sistemen, ligu ĉi tiun sistemon kun la sube montrita alia sistemo, kiun uzas <TAG1/>. La sistemoj devas<L_XA0/>ligiĝi nur unufoje."
- source: "To play the <L_DLC/>, load the virtual game card on this system."
  target: "Por ludi la <L_DLC/>, ŝargu la virtualan ludkarton ĉi-sistemen."
- source: "To play this game, you'll first need to load the virtual game card on this system."
  target: "Por ludi ĉi tiun ludon, vi unue devos ŝargi la virtualan ludkarton ĉi-sistemen."
- source: "To play this software, load its virtual game card on <TAG1/>this system<TAG2/>."
  target: "Por ludi ĉi tiun programaron, ŝargu ĝian virtualan ludkarton en <TAG1/>ĉi tiu sistemo<TAG2/>."
- source: "To play, insert a game card or purchase software from <0xE133/> <L_NEP/>."
  target: "Por ludi, enmetu ludkarton aŭ aĉetu programaron ĉe <0xE133/> <L_NEP/>."
- source: "To save a screenshot, tap and hold the image and select Save from the pop-up menu.<NL/>Note: Menus may differ across devices and browsers."
  target: "Por konservi ekrankopion, longe tuŝu la bildon kaj elektu Konservi el la ŝprucmenuo.<NL/>Noto: Menuoj povas varii laŭ aparato kaj retumilo."
- source: "To save a video, tap the download link or tap and hold the video and select Save from the pop-up menu.<NL/>Note: Menus may differ across devices and browsers."
  target: "Por konservi videon, tuŝu la elŝutligilon aŭ longe tuŝu la videon kaj elektu Konservi el la ŝprucmenuo.<NL/>Noto: Menuoj povas varii laŭ aparato kaj retumilo."
- source: "To search for controllers, you will need to turn Airplane Mode off.<NL/><TAG1/><TAG2/>You can do this from the HOME Menu by selecting <0xE130/> (System Settings) ⇒ Airplane Mode.<TAG3/><TAG4/>"
  target: "Por serĉi regilojn, vi devos malŝalti Flugreĝimon.<NL/><TAG1/><TAG2/>En la menuo HOME, elektu <0xE130/> (Sistemagordoj) ⇒ Flugreĝimo.<TAG3/><TAG4/>"
- source: "To transfer save data, you must link the source user's <L_N10/> Account to a user on this console.<TAG1/><NL/>Link the <L_N10/> Account and try again.<NL/><TAG2/><TAG3/>You can link a <L_N10/> Account on your user page.<TAG4/><TAG5/>"
