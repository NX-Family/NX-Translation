  target: "Se la doko <TAG1/><L_NS/><TAG2/> havas LAN-pordon, vi povas konekti Ethernet-kablon rekte al ĝi por uzi kablan konekton."
- source: "If the Import User Data from Another Console option is not displayed, finish setting up the console and then perform a system update by going to <0xE130/> (System Settings) ⇒ System from the HOME Menu."
  target: "Se Importi uzantdatumojn el alia konsolo ne aperas, finu la komencan agordon de la konsolo. Poste ĝisdatigu la sistemon per <0xE130/> (Sistemagordoj) ⇒ Sistemo en la menuo HOME."
- source: "If the Match Version with Local Users option is not displayed on their console, they cannot use this feature right now because their system version is out of date.<TAG1/><NL/>Have them perform a system update by going to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System.<NL/><TAG2/><TAG3/><L_ROMB/> An Internet connection is required to perform a system update.<TAG4/><TAG5/>"
  target: "Se Egaligi version kun lokaj uzantoj ne aperas en ilia konsolo, ili nun ne povas uzi ĉi tiun funkcion, ĉar ilia sistemversio estas malnova.<TAG1/><NL/>Petu ilin ĝisdatigi la sistemon per <0xE130/> (Sistemagordoj) ⇒ Sistemo en la menuo HOME.<NL/><TAG2/><TAG3/><L_ROMB/> Sistema ĝisdatigo postulas retkonekton.<TAG4/><TAG5/>"
