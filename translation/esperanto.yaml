  target: "Vi povas parigi regilon kun la konsolo tenante ĝian butonon SYNC kiam oni petas konekti regilon.<TAG1/><NL/><0xE153/> <TAG2/>Ĉi tiu metodo nun ne uzeblas, ĉar loka komunikado estas aktiva.<TAG3/>"
