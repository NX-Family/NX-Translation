- source: "With these settings turned off, you won't be asked for verification to use the feature, and other users on the system will also be able to freely access the associated feature.<TAG1/><NL/><L_DOT1/><TAG2/>When using <L_NEP/>, other users on this system can use funds and view account information, including payment method, etc.<TAG3/><NL/><L_DOT1/><TAG4/>On the virtual game card menu, other users on this system can view, load, and lend out purchased digital software.<TAG5/>"
  target: "Kun ĉi tiuj agordoj malŝaltitaj, vi ne bezonos konfirmon por uzi la funkcion, kaj aliaj uzantoj en la sistemo ankaŭ povos libere aliri la koncernan funkcion.<TAG1/><NL/><L_DOT1/><TAG2/>Dum uzo de <L_NEP/>, aliaj uzantoj en ĉi tiu sistemo povas uzi monrimedojn kaj vidi kontinformojn, inkluzive de pagmetodo ktp.<TAG3/><NL/><L_DOT1/><TAG4/>En la menuo de virtualaj ludkartoj, aliaj uzantoj en ĉi tiu sistemo povas vidi, ŝargi kaj elprunti aĉetitan ciferecan programaron.<TAG5/>"
