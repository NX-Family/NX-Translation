- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Datumoj en la sistemmemoro estos forviŝitaj, restarigante la fabrikajn agordojn de la konsolo.<NL/>Konservitaj datumoj, ekrankopioj, videoj kaj uzantinformoj ne estos forviŝitaj.<TAG1/><NL/><L_SQR/> Bonvolu noti:<TAG2/><NL/><L_DOT1/><TAG3/>Ĉiuj programdatumoj sur la karto <L_MSD/>, krom ekrankopioj kaj videoj, fariĝos neuzeblaj. (Datumoj sur la karto <L_MSD/> ne estos forviŝitaj.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>La sistemversio ne estos ŝanĝita aŭ revenigita al pli frua versio.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Forigitaj ludoj kaj <L_DLC/> denove estos ludeblaj post reelŝuto de la programaro. (Programaro ne plu distribuata eble ne estos reelŝutebla en iuj kazoj.)<TAG10/>"
