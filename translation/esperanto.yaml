- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Prezentu ĉi tiun QR-kodon por registri vian ĉeeston ĉe elektitaj eventoj kaj lokoj de <L_N10/> kaj ricevi ekskluzivajn avantaĝojn por membroj de <L_MNT/>, kiel poentojn de <L_MNT/> kaj partoprenon en promociaj premolotadoj. La avantaĝoj ĉiufoje varios, do atentu pliajn detalojn dum ĉeestregistriĝo.<TAG1/><NL/><L_DOT1/><TAG2/>Ĉi tiu QR-kodo ebligas al <L_N10/> identigi vian konton <L_N10/>.<TAG3/><NL/><L_DOT1/><TAG4/>Registrante vian ĉeeston, vi povas partopreni specifajn promociojn kaj eble ricevos retmesaĝojn pri tiuj aŭ aliaj promocioj. Pliaj informoj disponeblos en promociaj retejoj.<TAG5/><NL/><L_DOT1/><TAG6/>Validas la uzantinterkonsento kaj privatecreguloj de kontoj <L_N10/>.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR-kodo generita: <TAG11/><TAG12/><TAG13/>"
