  target: "Ho, por ŝanĝi la sendratajn agordojn, iru al la menuo HOME kaj elektu <0xE130/> (Sistemagordoj) ⇒ Flugreĝimo.<NL/><NL/>Bonan ludadon,<NL/>Amelia N."
- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Ho, vi ne povas ŝanĝi la ekranan helecon dum konekto al TV.<NL/>Por ŝanĝi la sendratajn agordojn, iru al la menuo HOME kaj elektu <0xE130/> (Sistemagordoj) ⇒ Flugreĝimo.<NL/><NL/>Bonan ludadon,<NL/>Amelia N."
