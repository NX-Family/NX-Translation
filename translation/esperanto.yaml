  target: "Aŭtomata elŝuto de konservitaj datumoj"
- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Ĉiu konsolo havas apartajn agordojn por aŭtomata elŝuto.<NL/><TAG1/><TAG2/>Por aŭtomate elŝuti konservitajn datumojn en alia konsolo, ŝanĝu la agordojn en tiu konsolo. Por<TAG3/><TAG4/> ŝanĝi ilin, iru al <0xE130/> (Sistemagordoj) ⇒ Datumregado ⇒ Nubaj savkopioj en la menuo HOME.<TAG5/><TAG6/>"
- source: "Automatic save-data backups are currently paused.<NL/>Select an option below to resume automatic backups."
  target: "Aŭtomata savkopiado de konservitaj datumoj estas paŭzigita.<NL/>Elektu suban opcion por rekomenci aŭtomatan savkopiadon."
- source: "Automatic save-data download has been enabled on this console.<TAG1/><NL/>This does not change the settings on other consoles.<NL/>To change settings on other consoles, you will need<NL/>to do so separately on each individual console."
  target: "Aŭtomata elŝuto de konservitaj datumoj estas ŝaltita en ĉi tiu konsolo.<TAG1/><NL/>Tio ne ŝanĝas la agordojn de aliaj konsoloj.<NL/>Vi devos ŝanĝi la agordojn de aliaj konsoloj<NL/>aparte en ĉiu konsolo."
- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Aŭtomata elŝuto de konservitaj datumoj estas ŝaltita.<TAG1/><NL/><L_DOT1/><TAG2/>La unua elŝuto devas esti farita mane.<TAG3/><NL/><L_DOT1/><TAG4/>Por ŝalti ĉi tiun funkcion en aliaj konsoloj, ŝanĝu la agordojn en ĉiu konsolo.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>Vi povas ŝanĝi ilin per <0xE130/> (Sistemagordoj) ⇒ Datumregado ⇒ Nubaj savkopioj en la menuo HOME.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Aŭtomata elŝuto de konservitaj datumoj ne ĉiam okazas tuj.<NL/><TAG1/><TAG2/>Por tuj ludi en alia konsolo kun la samaj konservitaj datumoj, vi povas mane savkopii la konservitajn datumojn kaj poste mane elŝuti ilin laŭdezire.<TAG3/><TAG4/>"
- source: "Automatic save-data downloads are currently paused.<NL/>Select an option below to resume automatic downloads."
  target: "Aŭtomata elŝuto de konservitaj datumoj estas paŭzigita.<NL/>Elektu suban opcion por rekomenci aŭtomatan elŝuton."
