  target: "يسمح بالتنزيل التلقائي لأحدث <TAG1/>بيانات حفظ<TAG2/>.<NL/><TAG3/><TAG4/>يمكنك تغيير الإعداد لاحقًا من قائمة HOME عبر <0xE130/> (إعدادات النظام) ⇒ إدارة البيانات ⇒ سحابة بيانات الحفظ.<TAG5/><TAG6/>"
