  target: "وُجدت بيانات قديمة لهذا البرنامج.<NL/>حذفها لإخلاء مساحة؟<TAG1/><NL/><TAG2/><TAG3/>يلزم تنزيل بيانات قبل تشغيل البرنامج.<NL/>إن أردت تشغيله فورًا، فأرشف بيانات برنامج آخر بدلًا منها.<TAG4/><TAG5/>"
