  target: "راجع موقع دعم <L_N10/> لمزيد من التفاصيل.<NL/><TAG1/><TAG2/>تتضمن المعلومات الأخرى المتاحة هناك:<NL/><L_DOT1/><TAG3/>استخدام البرامج دون تحميل بطاقة لعبة افتراضية.<TAG4/><NL/><L_DOT1/><TAG5/>إلغاء ربط جهاز.<TAG6/><TAG7/><TAG8/>"
