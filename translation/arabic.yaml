- source: "You can continue setup without using a smart device,<NL/>but you will not be able to use these features:<TAG1/><NL/><L_DOT1/><TAG2/>Set up a Play-Time Limit<TAG3/><NL/><L_DOT1/><TAG4/>Set up a Bedtime<TAG5/><NL/><L_DOT1/><TAG6/>Check play activity, such as played software titles and time spent playing<TAG7/><TAG8/><NL/><TAG9/><TAG10/>The <L_NS/> Parental Controls app is required to make use of these features.<TAG11/><TAG12/>"
  target: "يمكنك متابعة الإعداد دون استخدام جهاز ذكي،<NL/>لكن لن تتمكن من استخدام هذه الميزات:<TAG1/><NL/><L_DOT1/><TAG2/>ضبط حد لوقت اللعب<TAG3/><NL/><L_DOT1/><TAG4/>ضبط موعد النوم<TAG5/><NL/><L_DOT1/><TAG6/>مراجعة نشاط اللعب، مثل عناوين البرامج التي لُعبت ومدة اللعب<TAG7/><TAG8/><NL/><TAG9/><TAG10/>يتطلب استخدام هذه الميزات تطبيق <L_NS/> Parental Controls.<TAG11/><TAG12/>"
- source: "You can create your own custom <L_MI/> characters. <L_MI/> characters can be used in compatible software."
  target: "يمكنك إنشاء شخصيات <L_MI/> مخصصة. ويمكن استخدام شخصيات <L_MI/> في البرامج المتوافقة."
- source: "You can customize button mapping for each controller. Customized mapping configurations can be saved as presets for easy access in the future."
  target: "يمكنك تخصيص تعيين أزرار كل وحدة تحكم وحفظ التعيينات المخصصة كإعدادات مسبقة لسهولة استخدامها لاحقًا."
- source: "You can earn <L_MNT/> Gold Points when you purchase certain physical software."
  target: "يمكنك كسب <L_MNT/> Gold Points عند شراء نسخ مادية من برامج معينة."
- source: "You can edit and delete data saved to <L_AMI/>."
  target: "يمكنك تعديل وحذف البيانات المحفوظة في <L_AMI/>."
- source: "You can enter up to 10 characters."
  target: "يمكنك إدخال ما يصل إلى 10 أحرف."
- source: "You can follow channels you like to ensure you get all the latest news."
  target: "تابع القنوات التي تعجبك لتحصل على أحدث الأخبار."
- source: "You can have even more fun playing online with your friends!<NL/>Make lots of friends, and play lots of games!"
  target: "يمكنك الاستمتاع أكثر باللعب مع أصدقائك عبر الإنترنت!<NL/>كوّن أصدقاء كثيرين والعب ألعابًا كثيرة!"
- source: "You can keep playing compatible <L_NS/> software on the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system."
  target: "يمكنك مواصلة لعب برامج <L_NS/> المتوافقة على جهاز <L_N10/> <TAG1/><L_SWT2/><TAG2/>."
- source: "You can leave personal notes about your friends. Use these to help you remember who they are.<NL/><TAG1/><TAG2/>Friends won't be able to see notes you write about them, but your notes may be visible to other users on your device.<TAG3/><TAG4/>"
  target: "يمكنك كتابة ملاحظات شخصية عن أصدقائك لتتذكرهم.<NL/><TAG1/><TAG2/>لن يرى الأصدقاء ما تكتبه عنهم، لكن قد يرى ملاحظاتك مستخدمون آخرون على جهازك.<TAG3/><TAG4/>"
- source: "You can lend up to three virtual game cards out at a time. Once you collect a return, the virtual game card can then be lent out again."
  target: "يمكنك إعارة ثلاث بطاقات ألعاب افتراضية كحد أقصى في الوقت نفسه. وبعد استرداد بطاقة أُعيدت إليك، يمكن إعارتها مجددًا."
- source: "You can lend virtual game cards out to members of the family group your <TAG1/><L_N10/> Account<TAG2/> is in for up to 14 days at a time."
  target: "يمكنك إعارة بطاقات الألعاب الافتراضية لأعضاء مجموعة العائلة التي ينتمي إليها <TAG1/>حساب <L_N10/> الخاص بك<TAG2/> لمدة تصل إلى 14 يومًا في كل مرة."
- source: "You can link a <L_N10/> Account to see what your friends are playing."
  target: "يمكنك ربط حساب <L_N10/> لترى ما يلعبه أصدقاؤك."
- source: "You can load a virtual game card using the system you want to load it on, or you can use a browser on<L_XA0/>a PC or smart device to access the URL above.<NL/><TAG1/><TAG2/>You can also see linked systems on the website.<TAG3/><TAG4/>"
  target: "يمكنك تحميل بطاقة لعبة افتراضية من الجهاز المراد تحميلها عليه، أو فتح الرابط أعلاه بمتصفح على<L_XA0/>كمبيوتر أو جهاز ذكي.<NL/><TAG1/><TAG2/>ويمكنك أيضًا عرض الأجهزة المرتبطة في الموقع.<TAG3/><TAG4/>"
- source: "You can load up to 30 virtual game cards at once."
  target: "يمكنك تحميل حتى 30 بطاقة لعبة افتراضية معًا."
- source: "You can make a group with local users and match software versions."
  target: "يمكنك إنشاء مجموعة مع مستخدمين محليين لمطابقة إصدارات البرامج."
- source: "You can make a group with local users in order to match software versions and play together."
  target: "يمكنك إنشاء مجموعة مع مستخدمين محليين لمطابقة إصدارات البرامج واللعب معًا."
- source: "You can move all the save data linked to a user on another console to this console by using Transfer Your User Data.<NL/><TAG1/><TAG2/>To transfer user data, select Transfer Your User Data below to go to <TAG3/><0xE130/> (System Settings)<TAG4/> ⇒ Users, where the transfer can be performed.<TAG5/><TAG6/>"
  target: "يمكنك نقل كل بيانات الحفظ المرتبطة بمستخدم على جهاز آخر إلى هذا الجهاز باستخدام نقل بيانات المستخدم.<NL/><TAG1/><TAG2/>لنقل بيانات المستخدم، اختر نقل بيانات المستخدم أدناه للذهاب إلى <TAG3/><0xE130/> (إعدادات النظام)<TAG4/> ⇒ المستخدمون، حيث يمكنك إجراء النقل.<TAG5/><TAG6/>"
- source: "You can move save data between systems using <TAG1/>Transfer Your Save Data<TAG2/> or <TAG3/>Save Data Cloud.<TAG4/><NL/>To do this, go to the <TAG5/>HOME Menu<TAG6/>, highlight the software, and press <0xE0B3/> to open the Options menu."
  target: "يمكنك نقل بيانات الحفظ بين الأجهزة عبر <TAG1/>نقل بيانات حفظك<TAG2/> أو <TAG3/>سحابة بيانات الحفظ.<TAG4/><NL/>لذلك، افتح <TAG5/>قائمة HOME<TAG6/> وحدد البرنامج واضغط <0xE0B3/> لفتح قائمة الخيارات."
- source: "You can now choose to enter your Parental Controls PIN using control stick input.<TAG1/><NL/><L_DOT1/><TAG2/>Control stick input allows you to enter numbers more quickly.<TAG3/><NL/><L_DOT1/><TAG4/>When using control stick input, others will not be able to see the numbers you are selecting on screen.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>You can hold <TAG9/> to change to keypad input and enter your PIN as before.<TAG10/><TAG11/>"
  target: "يمكنك الآن اختيار إدخال رمز PIN للرقابة الأبوية بعصا التحكم.<TAG1/><NL/><L_DOT1/><TAG2/>تتيح عصا التحكم إدخال الأرقام بسرعة أكبر.<TAG3/><NL/><L_DOT1/><TAG4/>عند الإدخال بعصا التحكم، لن يرى الآخرون الأرقام التي تختارها على الشاشة.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>يمكنك الضغط مطولًا على <TAG9/> للانتقال إلى الإدخال بلوحة الأرقام وإدخال رمز PIN كالسابق.<TAG10/><TAG11/>"
- source: "You can now link a <L_N10/> Account.<NL/><TAG1/><TAG2/>With a linked account, you can access online play, friend features, <L_NEP/>, and more.<TAG3/><TAG4/>"
  target: "يمكنك الآن ربط حساب <L_N10/>.<NL/><TAG1/><TAG2/>يتيح الحساب المرتبط اللعب عبر الإنترنت وميزات الأصدقاء و<L_NEP/> وغيرها.<TAG3/><TAG4/>"
- source: "You can pair a controller with the console by holding down the controller's SYNC Button when prompted to connect a controller.<NL/><TAG1/><TAG2/>This method cannot be used while local communication is active.<TAG3/><TAG4/>"
  target: "يمكنك إقران وحدة تحكم بالجهاز بالضغط مطولًا على زر SYNC فيها عند مطالبتك بتوصيل وحدة تحكم.<NL/><TAG1/><TAG2/>لا يمكن استخدام هذه الطريقة أثناء نشاط الاتصال المحلي.<TAG3/><TAG4/>"
- source: "You can pair a controller with the console by holding down the controller's SYNC Button when prompted to connect a controller.<TAG1/><NL/><0xE153/> <TAG2/>This method cannot be used right now because local communication is currently active.<TAG3/>"
  target: "يمكنك إقران وحدة تحكم بالجهاز بالضغط مطولًا على زر SYNC فيها عند مطالبتك بتوصيل وحدة تحكم.<TAG1/><NL/><0xE153/> <TAG2/>لا يمكن استخدام هذه الطريقة الآن لأن الاتصال المحلي نشط حاليًا.<TAG3/>"
- source: "You can pair controllers at any time by attaching them to the console."
  target: "يمكنك إقران وحدات التحكم في أي وقت بتثبيتها بالجهاز."
- source: "You can return to the HOME Menu with <0xE0B9/>."
  target: "يمكنك العودة إلى قائمة HOME بالزر <0xE0B9/>."
- source: "You can return to the HOME Menu with <0xE0B9/>.<TAG1/><NL/><L_ROMB/><TAG2/>The download will continue. You will need to update the console once the download is complete.<TAG3/>"
  target: "يمكنك العودة إلى قائمة HOME بالزر <0xE0B9/>.<TAG1/><NL/><L_ROMB/><TAG2/>سيستمر التنزيل. عليك تحديث الجهاز عند اكتماله.<TAG3/>"
- source: "You can see your virtual game cards on this screen.<NL/>Purchased downloadable games will appear here."
  target: "يمكنك عرض بطاقات ألعابك الافتراضية على هذه الشاشة.<NL/>ستظهر هنا الألعاب القابلة للتنزيل التي اشتريتها."
- source: "You can select users to block from the list of users you've played with."
  target: "يمكنك اختيار مستخدمين لحظرهم من قائمة المستخدمين الذين لعبت معهم."
- source: "You can set a PIN instead of signing in to your <L_N10/> Account."
  target: "يمكنك ضبط رمز PIN بدل تسجيل الدخول إلى حساب <L_N10/>."
- source: "You can set a PIN to restrict access to a few select features."
  target: "يمكنك ضبط رمز PIN لتقييد الوصول إلى بعض الميزات المحددة."
- source: "You can set whether your friends can see your online status.<NL/>Friends who cannot see your online status may not be able to join you in online play."
  target: "يمكنك تحديد من يرى حالة اتصالك من أصدقائك.<NL/>قد يتعذر على من لا يراها الانضمام إليك في اللعب عبر الإنترنت."
- source: "You can sort your favorite software titles however you want!<NL/>Using themed groups can help make titles easier to find too."
  target: "يمكنك ترتيب برامجك المفضلة كما تريد!<NL/>ويمكن للمجموعات المصنفة حسب الموضوع تسهيل العثور على البرامج أيضًا."
- source: "You can start the source console preparations by going to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ Users ⇒ Transfer Your User Data.<NL/><TAG1/><TAG2/>If the Transfer Your User Data option is not displayed, please perform a system update from<NL/><0xE130/> (System Settings) ⇒ System.<TAG3/><TAG4/>"
  target: "يمكنك بدء تجهيز الجهاز المصدر من قائمة HOME باختيار <0xE130/> (إعدادات النظام) ⇒ المستخدمون ⇒ نقل بيانات المستخدم.<NL/><TAG1/><TAG2/>إن لم يظهر خيار نقل بيانات المستخدم، فحدّث النظام من<NL/><0xE130/> (إعدادات النظام) ⇒ النظام.<TAG3/><TAG4/>"
- source: "You can start the target console preparations in two ways."
  target: "يمكنك تجهيز الجهاز الهدف بطريقتين."
- source: "You can temporarily access data from another <L_N10/> Account not linked to this console by signing in.<NL/><TAG1/><TAG2/>Your sign-in credentials will not be saved on this console.<TAG3/><TAG4/>"
  target: "يمكنك مؤقتًا الوصول إلى بيانات حساب <L_N10/> آخر غير مرتبط بهذا الجهاز بتسجيل الدخول.<NL/><TAG1/><TAG2/>لن تُحفظ بيانات تسجيل دخولك على هذا الجهاز.<TAG3/><TAG4/>"
- source: "You can temporarily disable Parental Controls from the HOME Menu."
  target: "يمكنك تعطيل الرقابة الأبوية مؤقتًا من قائمة HOME."
- source: "You can transfer the following by moving your <L_MSD/> card to the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system:<NL/><NL/><L_DOT1/> <TAG3/>Screenshots and videos<TAG4/><NL/><L_DOT1/> <TAG5/>Videos created with <TAG6/><TAG7/><NL/><NL/>Keep the <L_MSD/> card in a safe place until the <L_N10/> <TAG8/><L_SWT2/><TAG9/> system is available to use."
  target: "يمكنك نقل الآتي بنقل بطاقة <L_MSD/> إلى جهاز <L_N10/> <TAG1/><L_SWT2/><TAG2/>:<NL/><NL/><L_DOT1/> <TAG3/>لقطات الشاشة ومقاطع الفيديو<TAG4/><NL/><L_DOT1/> <TAG5/>مقاطع فيديو أُنشئت باستخدام <TAG6/><TAG7/><NL/><NL/>احتفظ ببطاقة <L_MSD/> في مكان آمن حتى يتاح جهاز <L_N10/> <TAG8/><L_SWT2/><TAG9/> للاستخدام."
- source: "You can transfer the following by moving your <L_MSD/> card to the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system:<NL/><NL/><L_DOT1/> <TAG3/>Videos created with <TAG4/><TAG5/><NL/><NL/>Keep the <L_MSD/> card in a safe place until the <L_N10/> <TAG6/><L_SWT2/><TAG7/> system is available to use."
  target: "يمكنك نقل الآتي بنقل بطاقة <L_MSD/> إلى جهاز <L_N10/> <TAG1/><L_SWT2/><TAG2/>:<NL/><NL/><L_DOT1/> <TAG3/>مقاطع فيديو أُنشئت باستخدام <TAG4/><TAG5/><NL/><NL/>احتفظ ببطاقة <L_MSD/> في مكان آمن حتى يتاح جهاز <L_N10/> <TAG6/><L_SWT2/><TAG7/> للاستخدام."
- source: "You can unlink your system at this website:<NL/><TAG1/><TAG2/><NL/><TAG3/><TAG4/>Once there, select the system you wish to unlink from the list.<NL/><L_ROMB/><TAG5/>Unlinking a system using the website can only be done once <TAG6/>per year<TAG7/>.<TAG8/><TAG9/><TAG10/>"
  target: "يمكنك إلغاء ربط جهازك من هذا الموقع:<NL/><TAG1/><TAG2/><NL/><TAG3/><TAG4/>اختر هناك الجهاز المراد إلغاء ربطه من القائمة.<NL/><L_ROMB/><TAG5/>يمكن إلغاء ربط جهاز عبر الموقع مرة واحدة <TAG6/>في السنة<TAG7/> فقط.<TAG8/><TAG9/><TAG10/>"
- source: "You can use <L_NS/> to take in-game<NL/>screenshots and videos, add comments to them, and post them on social media.<TAG1/><NL/>Set to Restricted to disable posting screenshots and videos on social media.<NL/><TAG2/><TAG3/>Users with <L_N10/> Accounts under the age of 13 will not<NL/>be able to post on social media regardless of these settings.<TAG4/><TAG5/>"
  target: "يمكنك استخدام <L_NS/> لالتقاط<NL/>لقطات شاشة ومقاطع فيديو داخل اللعبة، وإضافة تعليقات إليها ونشرها على شبكات التواصل.<TAG1/><NL/>اضبط الخيار على \"مقيّد\" لمنع نشر لقطات الشاشة ومقاطع الفيديو على شبكات التواصل.<NL/><TAG2/><TAG3/>لن يتمكن المستخدمون دون سن 13 عامًا الذين لديهم حسابات <L_N10/> من<NL/>النشر على شبكات التواصل مهما كانت هذه الإعدادات.<TAG4/><TAG5/>"
- source: "You can use online licenses to play downloadable software and additional content as long as your console is connected to the Internet.<TAG1/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG2/>"
  target: "يمكنك استخدام التراخيص عبر الإنترنت لتشغيل البرامج القابلة للتنزيل والمحتوى الإضافي ما دام جهازك متصلًا بالإنترنت.<TAG1/><NL/>راجع موقع دعم <L_N10/> لمزيد من المعلومات.<NL/><TAG2/>"
- source: "You can use the console with the <L_JC/> controllers attached or detached. Choose the control style you prefer, then continue."
  target: "يمكنك استخدام الجهاز ووحدات تحكم <L_JC/> مثبتة به أو منفصلة عنه. اختر أسلوب التحكم الذي تفضله ثم تابع."
- source: "You can view detailed information about this software on <L_NEP/>."
  target: "يمكنك عرض معلومات مفصلة حول هذا البرنامج على <L_NEP/>."
- source: "You can view more information about this software by visiting <TAG1/><L_NEP/><TAG2/> from the <TAG3/>HOME Menu<TAG4/>."
  target: "يمكنك رؤية مزيد من معلومات البرنامج بزيارة <TAG1/><L_NEP/><TAG2/> من <TAG3/>قائمة HOME<TAG4/>."
- source: "You can view your virtual game cards here."
  target: "يمكنك عرض بطاقات ألعابك الافتراضية هنا."
- source: "You can zoom in by pressing <0xE0B9/> twice quickly."
  target: "اضغط <0xE0B9/> مرتين بسرعة للتكبير."
- source: "You can't play this software because communicating with others is restricted by parental controls."
  target: "لا يمكنك لعب هذا البرنامج لأن الرقابة الأبوية تقيد التواصل مع الآخرين."
- source: "You can't select any more."
  target: "لا يمكنك اختيار المزيد."
- source: "You can't use a <L_N10/> Account that hasn't already been used on a <L_N10/> <TAG1/><L_SWT2/><TAG2/> or <L_NS/> system."
  target: "لا يمكنك استخدام حساب <L_N10/> لم يُستخدم سابقًا على جهاز <L_N10/> <TAG1/><L_SWT2/><TAG2/> أو <L_NS/>."
- source: "You cannot add a user now.<TAG1/><NL/>Close the suspended software, then select<NL/><0xE130/> (System Settings) ⇒ Users to add a user."
  target: "لا يمكنك إضافة مستخدم الآن.<TAG1/><NL/>أغلق البرنامج المعلق ثم اختر<NL/><0xE130/> (إعدادات النظام) ⇒ المستخدمون لإضافة مستخدم."
- source: "You cannot add any more alarms.<TAG1/><NL/>Please delete any alarms you no longer need so that you will be able to add more.<TAG2/><NL/>Alarms can be deleted in Alarm Notifications via HOME Menu ⇒ <0xE130/> (System Settings) ⇒ Notifications."
  target: "لا يمكنك إضافة منبهات أخرى.<TAG1/><NL/>احذف أي منبهات لم تعد تحتاجها لتتمكن من إضافة المزيد.<TAG2/><NL/>يمكن حذف المنبهات من إشعارات المنبه عبر قائمة HOME ⇒ <0xE130/> (إعدادات النظام) ⇒ الإشعارات."
- source: "You cannot add any more friends.<TAG1/><NL/>To add more friends, remove existing friends in your friend list and/or delete pending sent friend requests."
  target: "لا يمكنك إضافة أصدقاء آخرين.<TAG1/><NL/>لإضافة المزيد، أزل أصدقاء من قائمتك و/أو احذف طلبات الصداقة المرسلة المعلقة."
- source: "You cannot add any more screenshots or videos to the save destination.<TAG1/><NL/>Please delete unnecessary data from <0xE130/> (System Settings) ⇒ Data Management via the HOME Menu."
  target: "لا يمكنك إضافة مزيد من لقطات الشاشة أو مقاطع الفيديو إلى وجهة الحفظ.<TAG1/><NL/>احذف بيانات غير لازمة من قائمة HOME عبر <0xE130/> (إعدادات النظام) ⇒ إدارة البيانات."
- source: "You cannot add any more users because the user account limit on this console has been reached.<NL/>Please delete a user and try again."
  target: "لا يمكنك إضافة مستخدمين لبلوغ حد الحسابات على هذا الجهاز.<NL/>احذف مستخدمًا وحاول مجددًا."
- source: "You cannot add users right now because only certain users can be selected.<TAG1/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG2/>"
  target: "لا يمكنك إضافة مستخدمين الآن لأنه لا يمكن اختيار سوى مستخدمين معينين.<TAG1/><NL/>راجع موقع دعم <L_N10/> لمزيد من المعلومات.<NL/><TAG2/>"
- source: "You cannot allow access to any more pages."
  target: "لا يمكنك السماح بالوصول إلى أي صفحات أخرى."
