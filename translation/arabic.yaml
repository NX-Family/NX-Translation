  target: "سيقيّد ذلك التواصل المفتوح بين المستخدمين، بما فيه إرسال الرسائل والصور وتلقيها.<TAG1/><NL/>بحسب البرنامج، ستُقيّد الأنشطة التالية:<TAG2/><NL/><L_DOT1/><TAG3/>إرسال الرسائل وتلقيها واستخدام ميزات المحادثة.<TAG4/><NL/><L_DOT1/><TAG5/>قراءة ومشاركة معلومات الملف الشخصي التي تسمح للمستخدمين بإدخال نصوصهم الخاصة.<TAG6/><NL/><L_DOT1/><TAG7/>عرض ومشاركة صور أنشأها المستخدمون وقد تتضمن نصًا.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>لن يُقيّد استخدام التطبيقات العاملة خارج <L_NS/>، مثل <L_NS/> App. لتقييد التطبيق، استخدم جهازك الذكي.<TAG12/><TAG13/>"
