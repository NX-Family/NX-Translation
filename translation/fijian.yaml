- source: "Welcome to News! This is where you'll find all sorts of information about <L_NS/>.<NL/><NL/>What kind of information can you expect? Probably stuff like this:<NL/><NL/>★Sales and special offers on games<NL/>★Videos of new and upcoming games<NL/>★News about gaming events<NL/><NL/>So basically a lot of stuff about games! We'll also have news about your <L_NS/> console itself, including tips and updates when we add new features.<NL/><NL/>That'll do to start, but we'll probably have other kinds of news in the future. Just stay tuned!<NL/>"
  target: "Ni bula vinaka ena iTukutuku! O na kunea eke na veimataqali itukutuku me baleta na <L_NS/>.<NL/><NL/>Na mataqali itukutuku cava o rawa ni namaka? E rawa ni vaka oqo:<NL/><NL/>★Veivakalailaitaki ni isau kei na isolisoli talei ni qito<NL/>★Vidio ni qito vou kei na qito ena qai tavoci<NL/>★iTukutuku ni soqo ni qito<NL/><NL/>E levu sara na itukutuku ni qito! Ena tiko tale ga na itukutuku ni nomu misini <L_NS/>, wili kina na ivakasala kei na itukutuku vou ni keimami kuria na cakacaka vou.<NL/><NL/>Oqo me itekivu, ia ena rairai tiko eso tale na mataqali itukutuku e muri. Mo wawa tiko!<NL/>"
- source: "When You Became Friends:"
  target: "Gauna o Drau Veitokani Kina:"
- source: "When playing with a <L_JC/> controller, attach the strap by following<NL/>the steps provided, and hold it securely without letting go.<NL/>Allow adequate room around you during gameplay.<NL/>Be aware of your surroundings."
  target: "Ni o qito ena iyaya ni lewa <L_JC/>, kabita na dali ni o muria<NL/>na idusidusi e soli, ka taura dei na iyaya ni lewa, kua ni sereka.<NL/>Raica me rauta na vanua lala wavoliti iko ni o qito.<NL/>Qarauna na veika wavoliti iko."
- source: "When switching to TV mode with the console docked or when the console exits sleep mode, the TV will turn on. Turning off the TV will put the console in sleep mode.<TAG1/><NL/><L_ROMB/> <TAG2/><L_HDMI/> settings must also be enabled on your TV. Some TV models may be unable to use this feature.<TAG3/>"
  target: "Ni veisau ki na ivakarau TV ka tiko ena doka na misini, se ni yadra mai na moce na misini, ena waqa na TV. Ni bokoci na TV, ena curu ki na ivakarau moce na misini.<TAG1/><NL/><L_ROMB/> <TAG2/>Me waqaci tale ga na ituvatuva <L_HDMI/> ena nomu TV. Eso na mataqali TV e rawa ni sega ni vakayagataka na cakacaka oqo.<TAG3/>"
- source: "When turned on, you can play downloaded software you've purchased while the system is connected to the Internet, even if you don't have a virtual game card loaded. However, only the owner of the purchasing account can play using the software's online license, and other users won't be able to play at the same time.<TAG1/><NL/><L_ROMB/> <TAG2/>Regardless of this setting, you can still play using your virtual game card.<TAG3/><NL/><L_ROMB/> <TAG4/>Online licenses can't be used at the same time on multiple systems.<TAG5/><NL/><L_ROMB/> <TAG6/>Online licenses can't be used at the same time as the virtual game card for the same software.<TAG7/>"
  target: "Ni waqa oqo, o rawa ni qito ena parokaramu o volia ka lavetaka mai ni sema ki na Internet na misini, kevaka mada ga e sega ni utaki e dua na e-kadi ni qito. Ia, o koya ga e taukena na akaude e voli kina e rawa ni qito ena laiseni ena internet ni parokaramu, ka sega ni rawa ni qito na dauvakayagataka tale eso ena gauna vata ga.<TAG1/><NL/><L_ROMB/> <TAG2/>Se mani vakacava na ituvatuva oqo, o rawa tiko ga ni qito ena nomu e-kadi ni qito.<TAG3/><NL/><L_ROMB/> <TAG4/>E sega ni vakayagataki rawa na laiseni ena internet ena misini e levu ena gauna vata ga.<TAG5/><NL/><L_ROMB/> <TAG6/>E sega ni vakayagataki rawa na laiseni ena internet kei na e-kadi ni qito ni parokaramu vata ga ena gauna vata ga.<TAG7/>"
- source: "When using headphones, please listen at a volume that is safe for your ears.<TAG1/><NL/><TAG2/><TAG3/>Set the volume so that you are still able to hear your surroundings, and take breaks when using headphones for long periods of time.<TAG4/><TAG5/>"
  target: "Ni o vakayagataka na iyaya ni daliga, vakarorogo ena rorogo e taqomaka na daligamu.<TAG1/><NL/><TAG2/><TAG3/>Lesia na rorogo mo se rogoca rawa na veika wavoliti iko, ka cegu mada ena so na gauna kevaka o vakayagataka vakadede na iyaya ni daliga.<TAG4/><TAG5/>"
- source: "Whenever the save data stored via the Save Data Cloud service is newer than the save data on the console, that newer data will automatically download and the older data on your console will be overwritten. Save data will not be automatically downloaded if no save data for the software is on the console."
  target: "Ni vou cake na itukutuku maroroi ena veiqaravi Maroroi Cloud mai na itukutuku maroroi ena misini, ena lavetaki mai vakataki koya na itukutuku vou, ka sosomitaki na itukutuku makawa ena nomu misini. Ena sega ni lavetaki mai vakataki koya na itukutuku maroroi kevaka e sega ni tiko ena misini na itukutuku maroroi ni parokaramu."
