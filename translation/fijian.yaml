  target: "Tokitaka ka sega ni waya e dua na dauvakayagataka kei na nona itukutuku maroroi kece ki na misini <L_NS/> voleka.<NL/>Ena boko mai na misini taumada na dauvakayagataka kei na itukutuku maroroi e tokitaki."
- source: "With the Save Data Cloud feature of <L_NSO/>, you can automatically back up your save data whenever you play.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
