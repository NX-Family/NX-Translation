- source: "Send data from this system to <L_N10/> for troubleshooting and analytical purposes. The received data will be handled in accordance with the <L_N10/> Privacy Policy available at <L_UCOM/>. "
  target: "Vakauta na itukutuku mai na misini oqo ki na <L_N10/> me wali kina na leqa ka vakadikevi. Ena qaravi na itukutuku e ciqomi me salavata kei na <L_N10/> iTuvatuva ni Taqomaki ni Nomu iTukutuku e tiko ena <L_UCOM/>. "
- source: "Send save data and associated information from this system to <L_N10/> for troubleshooting and analytical purposes. The data may be sent overseas to other entities in the <L_N10/> Group, and the third-party developer of the software if applicable. Depending on location a third-party developer may not be required to protect the information in a way that provides comparable safeguards to those in Australian and New Zealand privacy laws."
  target: "Vakauta na itukutuku maroroi kei na kena itukutuku veisemati mai na misini oqo ki na <L_N10/> me wali kina na leqa ka vakadikevi. E rawa ni vakau na itukutuku ki na so tale na isoqosoqo ni iLawalawa <L_N10/> mai vanuatani, kei koya e caka parokaramu mai tautuba kevaka e ganita. Me vaka na vanua e tiko kina, e rawa ni sega ni gadrevi vua e caka parokaramu mai tautuba me taqomaka na itukutuku me tautauvata kei na veitaqomaki ena lawa ni taqomaki itukutuku e Ositerelia kei Niusiladi."
- source: "Send save data for which user?"
  target: "Vakauta na itukutuku maroroi ni dauvakayagataka cava?"
- source: "Send save data to <L_N10/> for data investigation and performance of this service.<NL/>To provide you with the requested service, save data and associated information need to be sent to <L_N10/> and processed as further described in the Privacy Policy."
  target: "Vakauta na itukutuku maroroi ki na <L_N10/> me dikevi na itukutuku ka vakayacori na veiqaravi oqo.<NL/>Me soli vei iko na veiqaravi o kerea, me vakau na itukutuku maroroi kei na kena itukutuku veisemati ki na <L_N10/> ka qaravi me vaka e vakamacalataki ena iTuvatuva ni Taqomaki ni Nomu iTukutuku."
