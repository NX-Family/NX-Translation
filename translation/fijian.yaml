  target: "Ni o vola na PIN ni Lewa Vakaitubutubu, ena bokoci vakalekaleka na iyalayala kece me yacova ni <NL/>vakamocei na misini se waqaci tale na Lewa Vakaitubutubu.<TAG1/><NL/>Ena yaga na cakacaka kece a yalani ena Lewa Vakaitubutubu:<NL/><L_DOT1/><TAG2/>Ena yaga na parokaramu kece.<TAG3/><NL/><L_DOT1/><TAG4/>E rawa ni tabaki na itaba ni sikirini kei na vidio ena sala ni veimaliwai.<TAG5/><NL/><L_DOT1/><TAG6/>E rawa ni veitaratara kei na so tale.<TAG7/><NL/><L_DOT1/><TAG8/>Ena yaga na ivakarau VR.<TAG9/><NL/><L_DOT1/><TAG10/>Ena bokoci na iyalayala ni gauna ni qito e tuvanaki ena app <TAG11/><L_NS/><TAG12/> Parental Controls.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>Ni sa bokoci na iyalayala kece ni Lewa Vakaitubutubu, raica vinaka ni qito tiko na luvemu ena<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
