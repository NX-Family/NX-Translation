- source: "We've all had the battery run out at just the wrong moment in a game, right? Not just me? Anyway, you might want to know some things about charging, so you don't have to suffer like I did that terrible, terrible day<L_DOT3S/><NL/><NL/>Q: How do I charge the console?<NL/>A: Two ways: connect it to the <L_NS/> dock or you can plug the AC adapter directly into the console.<NL/><NL/>Q: How do I charge the <L_JC/> controllers?<NL/>A: It couldn't be simpler! Just attach them to the console while it's charging. <NL/><NL/>Q: Where do I check how much battery the console or controllers have left?<NL/>A: The console's battery level is shown on the HOME Menu. You can look at the controllers' charge by selecting <0xE136/> (Controllers) on the HOME Menu.<NL/><NL/>Q: My console ran low on power, and the screen went blank! What happened?<NL/>A: Not to worry! It just went into sleep mode. If you're playing single-player, you can keep going right from where you left off IF you charge the <L_NS/> before its battery runs completely out."
  target: "Eda sa sotava kece na oti ni batiri ena gauna ca sara ena dua na qito, se cava? E sega ni o au duadua ga? O na rairai via kila eso na ka me baleta na vakatawa batiri, mo kua ni sotava na ka au a sotava ena siga ca sara oya<L_DOT3S/><NL/><NL/>T: Au vakatawa vakacava na batiri ni misini?<NL/>S: E rua na sala: semata ki na doka <L_NS/>, se semata vakadodonu na adapta AC ki na misini.<NL/><NL/>T: Au vakatawa vakacava na batiri ni iyaya ni lewa <L_JC/>?<NL/>S: E rawarawa sara! Kabita ga ki na misini ni vakatawani tiko na kena batiri. <NL/><NL/>T: Au raica e vei na levu ni livaliva e vo ena batiri ni misini se iyaya ni lewa?<NL/>S: E laurai na ivakatagedegede ni batiri ni misini ena Menu HOME. O rawa ni raica na batiri ni iyaya ni lewa ni o digia <0xE136/> (iYaya ni Lewa) ena Menu HOME.<NL/><NL/>T: E lailai na livaliva ni noqu misini, ka yali na ka ena sikirini! Na cava e yaco?<NL/>S: Kua ni leqa! E curu ga ki na ivakarau moce. Kevaka o qito duadua, o rawa ni tomana mai na vanua o cegu kina KEVAKA o vakatawa na batiri ni <L_NS/> ni bera ni oti vakadua na kena livaliva."
