- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Me dui vakarautaki na lavetaki mai vakataki koya ena misini yadua.<NL/><TAG1/><TAG2/>Mo lavetaka mai vakataki koya na itukutuku maroroi ena misini tale, veisautaka na ituvatuva ni misini oya. Mo<TAG3/><TAG4/> veisautaka, digitaka <0xE130/> (iTuvatuva ni Misini) ⇒ Qaravi ni iTukutuku ⇒ Maroroi Cloud ena menu HOME.<TAG5/><TAG6/>"
- source: "Automatic save-data backups are currently paused.<NL/>Select an option below to resume automatic backups."
  target: "Sa cegu tu na lavetaki ni itukutuku maroroi vakataki koya.<NL/>Digitaka e dua e ra me toso tale na lavetaki vakataki koya."
- source: "Automatic save-data download has been enabled on this console.<TAG1/><NL/>This does not change the settings on other consoles.<NL/>To change settings on other consoles, you will need<NL/>to do so separately on each individual console."
  target: "Sa vakarautaki ena misini oqo me lavetaki mai vakataki koya na itukutuku maroroi.<TAG1/><NL/>Oqo e sega ni veisautaka na ituvatuva ni misini tale eso.<NL/>Mo veisautaka na kena ituvatuva, mo dui cakava<NL/>ena misini yadua."
- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Sa vakarautaki me lavetaki mai vakataki koya na itukutuku maroroi.<TAG1/><NL/><L_DOT1/><TAG2/>Mo lavetaka mada mai vakataki iko ena imatai ni gauna.<TAG3/><NL/><L_DOT1/><TAG4/>Me yaga ena misini tale eso, veisautaka na ituvatuva ni misini yadua.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>E rawa ni o veisautaka ena <0xE130/> (iTuvatuva ni Misini) ⇒ Qaravi ni iTukutuku ⇒ Maroroi Cloud ena menu HOME.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Ena so na gauna, na lavetaki mai ni maroroi vakataki koya e sega ni yaco vakatotolo.<NL/><TAG1/><TAG2/>Ke o via qito sara ena misini tale ena itukutuku maroroi vata, cakava vakataki iko na kena ilavelave ni veitaqomaki, qai lavetaka mai vakataki iko.<TAG3/><TAG4/>"
- source: "Automatic save-data downloads are currently paused.<NL/>Select an option below to resume automatic downloads."
  target: "Sa cegu na lavetaki mai ni maroroi vakataki koya.<NL/>Digitaka e dua e ra me toso tale na lavetaki mai vakataki koya."
