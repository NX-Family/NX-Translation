- source: "On an adventure and see some striking scenery? <NL/>Bringing the house down with your soulful solo?<NL/><NL/>Quick, press <0xE0BA/> (that's the capture button)!<NL/>You'll take a screenshot that gets saved to your album. <NL/>Keep snapping screens and pretty soon you'll have a treasure trove of happy gaming memories!<NL/><NL/>Oh, but that's not all! You can also add text to a screenshot and post it to your favorite social media sites. Share those gaming moments with your friends!<NL/><NL/>And if you want to relive an extra, extra special moment, you can record the last 30 seconds of your gameplay as a video*. <NL/>Simply hold down <0xE0BA/> until you hear a lil' sound. You can also share videos straight from your album, so show the world your gaming feats!<NL/><NL/><L_SQR/> Attention Avid Screenshotandvideographers:<NL/>If you want to be able to save a lot of pictures or videos, you might want to buy yourself a <L_MSD/> card.<NL/><NL/>The internal storage can hold about 1,000 screenshots or 100 videos, but a big enough <L_MSD/> card, can hold up to 10,000 screenshots or 1,000 videos! That's a lot of memories!<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Ena nomu ilakolako, o raica e dua na vanua totoka? <NL/>O vakamarautaki ira na vakarorogo ena nomu sere duadua e vu mai yalomu?<NL/><NL/>Totolo, tabaka <0xE0BA/> (na Butoni iTaba)!<NL/>Ena tauri e dua na itaba ni sikirini ka maroroi ena nomu ivolaitaba. <NL/>Tomana na tauri itaba ni sikirini, ena sega ni dede sa levu na kemu ivakananumi marautaki ni qito!<NL/><NL/>Ia, e se vo tale! E rawa ni o kuria na vosa ena itaba ni sikirini ka vakauta ina sala ni veimaliwai ena internet o taleitaka. Wasea na gauna ni qito oqori kei ira nomu itokani!<NL/><NL/>Ke o via raica tale e dua na gauna talei sara, e rawa ni o katona na iotioti ni 30 na sekodi ni nomu qito me vidio*. <NL/>Tabaka toka ga <0xE0BA/> me yacova ni o rogoca e dua na rorogo lailai. E rawa tale ga ni o wasea na vidio mai na ivolaitaba, vakaraitaka e vuravura na ka o rawata ena qito!<NL/><NL/><L_SQR/> Vei Kemuni na Dau Taba Sikirini kei na Dau Katona Vidio:<NL/>Ke o via maroroya e levu na itaba se vidio, de o vinakata mo volia e dua na kadi <L_MSD/>.<NL/><NL/>Na ivakananumi e loma e rawa ni maroroya e rauta ni 1,000 na itaba ni sikirini se 100 na vidio, ia na kadi <L_MSD/> e levu vinaka e rawa ni maroroya me yacova na 10,000 na itaba ni sikirini se 1,000 na vidio! Sa levu dina na ivakananumi!<NL/><NL/>Qito marautaki,<NL/>Amelia N."
