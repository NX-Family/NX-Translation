- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Vakaraitaka na QR Code oqo mo rejisitataka nomu yaco ena so na soqo kei na vanua <L_N10/> e digitaki, mo rawata na yaga e soli vakatabakidua vei ira na lewe ni <L_MNT/>, me vaka na poidi <L_MNT/> kei na curu ena vakawirimadigi ni icocovi. E duidui na yaga ena veigauna, raica na kena ivakamacala ni o rejisitataka nomu yaco.<TAG1/><NL/><L_DOT1/><TAG2/>Na QR Code oqo e rawa kina vei <L_N10/> me kila nomu akaude <L_N10/>.<TAG3/><NL/><L_DOT1/><TAG4/>Ni o rejisitataka nomu yaco, e rawa ni o lewena eso na veivakauqeti ni volivoli ka ciqoma na imeli baleta na veika oqori se veivakauqeti tale. E tiko na ikuri ni ivakamacala ena nodra mataveilawa.<TAG5/><NL/><L_DOT1/><TAG6/>E rau vakayagataki na Veiyalayalati ni Dauvakayagataka na Akaude <L_N10/> kei na iTuvatuva ni Taqomaki ni Nomu iTukutuku.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code e buli: <TAG11/><TAG12/><TAG13/>"
