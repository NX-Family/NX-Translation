  target: "Ke o sega ni vakayagataka na butoni e cake, digia ga <0xE133/> ena menu HOME mo lako ina <L_NEP/> ena gauna cava ga.<NL/><NL/>E rawa tale ga ni o vaqara ena <L_NEP/> ena filita duidui me kune na ka o gadreva.<NL/><NL/>Qito vinaka,<NL/>Amelia N."
- source: "If you enable automatic backup, save data will be automatically backed up, even while the console is in sleep mode or after the software has been closed.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Ke o waqaca na lavetaki ni itukutuku maroroi vakataki koya, ena lavetaki vakataki koya na itukutuku maroroi me veitaqomaki, kevaka mada ga e moce na misini se sa sogo na parokaramu.<NL/><TAG1/><TAG2/>Eso na parokaramu e sega ni tokona oqo.<TAG3/><TAG4/>"
- source: "If you enable automatic download, save data will automatically download to this console whenever the save data stored via the Save Data Cloud service is updated from another console. The save data on this console will be overwritten with the data from the server.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Ke o waqaca na lavetaki mai vakataki koya, ena lavetaki vakataki koya mai ena misini oqo na itukutuku maroroi ni vakavoui mai na dua tale na misini na itukutuku maroroi ena Maroroi Cloud. Ena sosomitaki na itukutuku maroroi ni misini oqo ena data mai na seva.<TAG1/><NL/><TAG2/>Mo cakava vakataki iko na imatai ni lavetaki mai.<TAG3/>"
- source: "If you enable automatic download, you can easily pick up playing where you left off on another console.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Ke o waqaca na lavetaki mai vakataki koya, e rawa ni o tomana rawarawa na qito mai na vanua o yala kina ena misini tale.<TAG1/><NL/><TAG2/>Mo cakava vakataki iko na imatai ni lavetaki mai.<TAG3/>"
- source: "If you enter the incorrect PIN <TAG1/><LIST1/>, you<NL/>will have to wait a while before attempting to enter it again."
  target: "Ke o vola na PIN cala <TAG1/><LIST1/>, mo<NL/>wawa vakalailai ni bera ni vola tale."
- source: "If you forget your PIN, you can reset it by signing in to your <L_N10/> Account."
  target: "Ke o guilecava nomu PIN, curu ina nomu <L_N10/> Akaude mo vakavoutaka."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/> system, you can use it to download your data from the server."
  target: "Ke o rawata na misini <L_N10/> <TAG1/><L_SWT2/><TAG2/>, e rawa ni o lavetaka mai kina na nomu data mai na seva."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
  target: "Ke rawati na <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
- source: "If you have existing user data on another system, you can copy or transfer it to this system. Otherwise, create a new user."
  target: "Ke tu na nomu itukutuku ena misini tale, e rawa ni lavetaki se tokitaki ina misini oqo. Ke sega, bulia e dua na dauvakayagataka vou."
- source: "If you have two systems, you can choose which system to play on by moving virtual game cards between them."
  target: "Ke rua nomu misini, digia na misini mo qito kina ni o tokitaka na e-kadi ni qito ena kedrau maliwa."
- source: "If you link to a <L_N10/> Account, you can use various online features."
  target: "Ke sema ina <L_N10/> Akaude, ena yaga eso na cakacaka ena internet."
- source: "If you link to a <L_N10/> Account, you will see users who may want to become friends with you."
  target: "Ke o sema ina <L_N10/> Akaude, o na raici ira era via nomu itokani."
- source: "If you plan to keep using this system, stop here.<NL/>Once data is uploaded to the server, this system will be initialized."
  target: "Ke o na vakayagataka tiko na misini oqo, cegu eke.<NL/>Ni sa vakau na data ina seva, ena lesu na misini ina ituvatuva ni kabani."
- source: "If you plugged the AC<NL/>adapter into the console<NL/>earlier, disconnect it."
  target: "Ke o semata e liu<NL/>na adapta AC ena misini,<NL/>serea."
- source: "If you turn Airplane Mode on, you will no<NL/>longer be able to use wireless controllers."
  target: "Ke o waqaca na iVakarau Vuka, ena sega<NL/>ni yaga na iyaya lewa sega ni waya."
- source: "If you update and are still unable to use downloadable content or an upgrade pack, load the virtual game card from <0xE13D/> (Virtual Game Cards) on the HOME Menu."
  target: "Ke o vakavoutaka ia e se sega ni yaga na ikuri lavetaki mai se pakete ni vakatorocaketaki, vakacuruma na e-kadi ni qito ena <0xE13D/> (E-kadi ni Qito) ena menu HOME."
- source: "If you'd rather download data for a specific user at a later time, uncheck that user. To download the data, go to the <TAG1/>HOME Menu<TAG2/> and open the Options menu for the software, then select <TAG3/>Save Data Cloud<TAG4/>."
  target: "Ke o via lavetaka mai e muri na data nei koya e dua, kauta tani na nona ivakatakilakila. Mo lavetaka mai, dolava na menu Digidigi ni parokaramu ena <TAG1/>menu HOME<TAG2/>, qai digia <TAG3/>Maroroi Cloud<TAG4/>."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Ke o se bera ni vakacuruma na kadi <L_MSD/> ena nomu misini, vaqara mada na kena qara. E vuni vakalailai. <NL/><NL/>Sa soro? Oqo e dua na ivuke: o sa vakayagataka na itoko ena daku ni misini? <NL/><NL/>Dolava na itoko, o na kunea kina! E rawa ni o volia na kadi <L_MSD/> ke o leqataka na lailai ni vanua ni maroroi parokaramu, <L_DLC/> kei na so tale."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand, and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Ke o se bera ni vakacuruma na kadi <L_MSD/> ena nomu misini, vaqara mada na kena qara. E vuni vakalailai. <NL/><NL/>Sa soro? Oqo e dua na ivuke: o sa vakayagataka na itoko ena daku ni misini? <NL/><NL/>Dolava na itoko, o na kunea kina! E rawa ni o volia na kadi <L_MSD/> ke o leqataka na lailai ni vanua ni maroroi parokaramu, <L_DLC/> kei na so tale."
- source: "If your save data is backed up, the save data for supported software on your console has been stored via the Save Data Cloud service.<TAG1/><NL/>If your data is waiting to back up, the save data on your console will be automatically stored via the Save Data Cloud service once the console enters sleep mode, provided it is connected to the Internet.<TAG2/><NL/>Select a user to view more details or manually back up or download data."
  target: "Ke sa lavetaki nomu itukutuku maroroi me veitaqomaki, sa tiko ena Maroroi Cloud na itukutuku maroroi ni parokaramu tokoni ena nomu misini.<TAG1/><NL/>Ke wawa tiko na lavetaki me veitaqomaki, ena maroroi vakataki koya ena Maroroi Cloud na itukutuku maroroi ni nomu misini ni sa moce, kevaka e sema ena internet.<TAG2/><NL/>Digia e dua na dauvakayagataka mo raica eso tale na ivakamacala se lavetaka vakataki iko me veitaqomaki se lavetaka mai na data."
- source: "If your virtual game cards are not appearing, open the HOME Menu and select <0xE13D/> (Virtual Game Cards)."
  target: "Ke sega ni raici na nomu e-kadi ni qito, dolava na menu HOME, qai digia <0xE13D/> (E-kadi ni Qito)."
