- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Ena boko na data ena ivakananumi ni misini, ka vakalesui na misini ina kena ituvaki ni kabani.<NL/>Ena sega ni boko na itukutuku maroroi, itaba ni sikirini, vidio kei na itukutuku ni dauvakayagataka.<TAG1/><NL/><L_SQR/> Nanuma:<TAG2/><NL/><L_DOT1/><TAG3/>Ena sega ni yaga na data ni parokaramu kece ena kadi <L_MSD/>, vakavo na itaba ni sikirini kei na vidio. (Ena sega ni boko na data ena kadi <L_MSD/>.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Ena sega ni veisau na ilavelave ni ivakarau se vakalesui ina ilavelave makawa.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>E rawa ni qitori tale na qito kei na <L_DLC/> e boko ni sa lavetaki tale mai na parokaramu. (Eso na gauna e rawa ni sega ni lavetaki tale mai na parokaramu e sa mudu na kena soli.)<TAG10/>"
