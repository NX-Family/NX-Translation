- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "E rawa ni soli me dinau na e-kadi ni qito vei ira na lewe ni ilawalawa ni vuvale ni sa biu veivolekati ka semati na nomudrau misini ruarua.<TAG1/><NL/><L_DOT1/><TAG2/>Ni soli tu me dinau, e rawa ni qitotaki galala na parokaramu ena misini ni dau dinau, ka sega ni curuma rawa vakalekaleka na parokaramu o koya e solia.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>E rawa ni dinau ena e-kadi ni qito me yacova na 14 na siga. Ni sa yaco na gauna yalataki, ena vakalesui vakataki koya na e-kadi ni qito.<NL/><TAG6/><TAG7/>O koya e solia e rawa tale ga ni taura lesu na nona e-kadi ni qito mai vua e dinau ni bera na gauna yalataki.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>E rawa ni soli e dua na e-kadi ni qito vua na dau dinau yadua, ka yacova e tolu na dau dinau ena dua na gauna. Ia, e rawa ni dinau ga ena dua na kadi ena misini yadua.<NL/><TAG13/><TAG14/>Ni sa tauri lesu na e-kadi ni qito, e rawa ni soli tale me dinau.<TAG15/><TAG16/><TAG17/>"
