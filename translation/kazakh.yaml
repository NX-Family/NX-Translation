- source: "Old data has been found for this software.<NL/>Delete the data to free up space?<TAG1/><NL/><TAG2/><TAG3/>This software will require you to download data before playing.<NL/>If you want to be able to play this software right away, consider archiving data for other software instead.<TAG4/><TAG5/>"
  target: "Осы бағдарламаның ескі деректері табылды.<NL/>Орын босату үшін деректерді жою керек пе?<TAG1/><NL/><TAG2/><TAG3/>Бұл бағдарламаны ойнаудан бұрын деректерді жүктеп алу қажет болады.<NL/>Осы бағдарламаны бірден ойнағыңыз келсе, оның орнына басқа бағдарламалардың деректерін мұрағаттауды қарастырыңыз.<TAG4/><TAG5/>"
- source: "On"
  target: "Қосулы"
- source: "On an adventure and see some striking scenery? <NL/>Bringing the house down with your soulful solo?<NL/><NL/>Quick, press <0xE0BA/> (that's the capture button)!<NL/>You'll take a screenshot that gets saved to your album. <NL/>Keep snapping screens and pretty soon you'll have a treasure trove of happy gaming memories!<NL/><NL/>Oh, but that's not all! You can also add text to a screenshot and post it to your favorite social media sites. Share those gaming moments with your friends!<NL/><NL/>And if you want to relive an extra, extra special moment, you can record the last 30 seconds of your gameplay as a video*. <NL/>Simply hold down <0xE0BA/> until you hear a lil' sound. You can also share videos straight from your album, so show the world your gaming feats!<NL/><NL/><L_SQR/> Attention Avid Screenshotandvideographers:<NL/>If you want to be able to save a lot of pictures or videos, you might want to buy yourself a <L_MSD/> card.<NL/><NL/>The internal storage can hold about 1,000 screenshots or 100 videos, but a big enough <L_MSD/> card, can hold up to 10,000 screenshots or 1,000 videos! That's a lot of memories!<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Шытырман сапарда керемет көрініске тап болдыңыз ба? <NL/>Жанды баурайтын жеке орындауыңызбен жұртты тәнті еттіңіз бе?<NL/><NL/>Тезірек <0xE0BA/> түймесін басыңыз (ол Түсіру түймесі)!<NL/>Альбомыңызға сақталатын скриншот түсіресіз. <NL/>Скриншот түсіре берсеңіз, көп ұзамай ойынның бақытты сәттерінен естеліктер қазынасын жинайсыз!<NL/><NL/>Бірақ мұнымен бітпейді! Скриншотқа мәтін қосып, сүйікті әлеуметтік желілеріңізде жариялауға да болады. Ойын сәттерін достарыңызбен бөлісіңіз!<NL/><NL/>Ерекше сәтті қайта көргіңіз келсе, ойыныңыздың соңғы 30 секундын бейне* ретінде жаза аласыз. <NL/>Жай ғана <0xE0BA/> түймесін қысқа дыбыс естілгенше басып тұрыңыз. Бейнелерді тікелей альбомнан да бөлісуге болады, сондықтан ойын жетістіктеріңізді әлемге көрсетіңіз!<NL/><NL/><L_SQR/> Скриншот пен бейне түсіру әуесқойларының назарына:<NL/>Көп сурет не бейне сақтағыңыз келсе, <L_MSD/> картасын сатып алуды ойластырыңыз.<NL/><NL/>Ішкі жад шамамен 1,000 скриншот не 100 бейне сақтай алады, ал көлемі жеткілікті <L_MSD/> картасы 10,000 скриншотқа не 1,000 бейнеге дейін сақтай алады! Бұл қаншама естелік!<NL/><NL/>Ойыныңыз қызықты болсын,<NL/>Amelia N."
- source: "On the target console, go to the HOME Menu and then select <0xE130/> (System Settings) ⇒ Users ⇒ Transfer Your User Data."
  target: "Қабылдаушы консольде HOME мәзіріне өтіп, <0xE130/> (Жүйе параметрлері) ⇒ Пайдаланушылар ⇒ Пайдаланушы деректерін тасымалдау тармағын таңдаңыз."
- source: "Once data has been uploaded to the server, this system will be initialized.<NL/>Uploaded data will be stored on the server."
  target: "Деректер серверге жүктеп салынған соң, осы жүйе бастапқы күйге қайтарылады.<NL/>Жүктеп салынған деректер серверде сақталады."
- source: "Once displayed, the online-user notification for a particular user will not be displayed again for 30 minutes."
  target: "Белгілі пайдаланушының желіге кіргені туралы хабарландыру бір рет көрсетілген соң, 30 минут бойы қайта көрсетілмейді."
- source: "Once everyone has reached this screen, one person should create a group and then have the others join it.<NL/><TAG1/><TAG2/>Everyone's software will be updated to match the most recent version in the group.<TAG3/><TAG4/>"
  target: "Бәрі осы экранға жеткенде, бір адам топ құрып, басқаларды оған қосылуға шақыруы керек.<NL/><TAG1/><TAG2/>Барлығының бағдарламасы топтағы ең жаңа нұсқаға сәйкестендіріліп жаңартылады.<TAG3/><TAG4/>"
- source: "Once the console has been initialized, any data deleted during initialization cannot be recovered. Do you want to continue?<NL/><L_ROMB/> This process may take some time."
  target: "Консоль бастапқы күйге қайтарылған соң, сол кезде жойылған деректерді қалпына келтіру мүмкін емес. Жалғастырғыңыз келе ме?<NL/><L_ROMB/>Бұл процесс біраз уақыт алуы мүмкін."
- source: "Once you save a mapping to a preset slot, you can select<NL/>Load a Preset Mapping to easily swap mappings."
  target: "Тағайындауды үлгі ұясына сақтаған соң, тағайындауларды оңай ауыстыру үшін<NL/>Тағайындау үлгісін жүктеу пәрменін таңдауға болады."
