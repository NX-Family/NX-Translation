  target: "Сақтау деректерін талдау және қалпына келтіру үшін<NL/>осы бағдарламаның сақтау деректері, лақап атыңыз, ID нөміріңіз<NL/>және сізді анықтауға көмектесетін басқа ақпарат<NL/><L_N10/> компаниясына жіберіледі. Сол мақсатта<NL/>бұл ақпарат осы бағдарламаның әзірлеушілеріне де жіберіледі,<NL/>олар еліңіздің ішінде не сыртында болуы мүмкін."
- source: "In order to analyze and recover the save data, the<NL/>save data for this software, your nickname, your ID,<NL/>and other information that will help identify you will<NL/>be sent to <L_N10/>. For the same reason, the<NL/>above will be sent to the developers of this software,<NL/>who may reside within or outside of your country.<NL/><TAG1/><TAG2/>For matters like this, please acquire the consent of all users<NL/>who have save data with this software.<TAG3/><TAG4/>"
  target: "Сақтау деректерін талдау және қалпына келтіру үшін<NL/>осы бағдарламаның сақтау деректері, лақап атыңыз, ID нөміріңіз<NL/>және сізді анықтауға көмектесетін басқа ақпарат<NL/><L_N10/> компаниясына жіберіледі. Сол мақсатта<NL/>бұл ақпарат осы бағдарламаның әзірлеушілеріне де жіберіледі,<NL/>олар еліңіздің ішінде не сыртында болуы мүмкін.<NL/><TAG1/><TAG2/>Осындай әрекеттер үшін осы бағдарламада сақтау деректері бар<NL/>барлық пайдаланушылардың келісімін алыңыз.<TAG3/><TAG4/>"
