- source: "Hey parents and guardians, you've probably figured out that the <L_NS/> console has Parental Controls built in, but did you know there are other features you can use through your <L_N10/> Account and your smart device?<NL/><NL/>Obviously you can use the built-in controls to do pretty much everything you need-keep the little ones from playing the Teen and Mature rated games and whatnot, but the app is pretty handy!<NL/><NL/>To download the <L_NST/> Parental Controls app, go to the App Store on your iOS device or the Google Play Store on your Android device.<NL/>Once you've got the app registered to your console, it'll keep track of what everyone's playing and lets you set limits on total play time in a day for certain users.<NL/><NL/>Oh, one more thing! If you want to control who can use your credit card or current balance in the <L_NEP/>, you do that through your <L_N10/> Account from the app, or by visiting the site on your PC or smart device.<NL/><NL/>And hey, if you're a kid reading this, maybe show it to your parents so you can all be totally comfortable with your <L_NS/> experience!<NL/>"
  target: "Ата-аналар мен қамқоршылар, <L_NS/> консолінде Ата-ана бақылауы бар екенін білген шығарсыздар. Бірақ <L_N10/> тіркелгіңіз бен смарт құрылғыңыз арқылы басқа мүмкіндіктерді де пайдалануға болатынын білесіз бе?<NL/><NL/>Кіріктірілген бақылау арқылы қажетіңіздің көбін жасауға болады, мысалы, кішкентай балаларға жасөспірімдер мен ересектерге арналған ойындарды ойнатпауға болады. Дегенмен қолданба да өте ыңғайлы!<NL/><NL/><L_NST/> Parental Controls қолданбасын жүктеп алу үшін iOS құрылғыңыздағы App Store немесе Android құрылғыңыздағы Google Play Store дүкеніне өтіңіз.<NL/>Қолданбаны консольге тіркеген соң, ол әркімнің не ойнайтынын қадағалап, белгілі пайдаланушылардың бір күндегі жалпы ойын уақытына шектеу қоюға мүмкіндік береді.<NL/><NL/>Тағы бір нәрсе! Несие картаңызды немесе ағымдағы балансыңызды <L_NEP/> дүкенінде кім пайдалана алатынын басқарғыңыз келсе, мұны <L_N10/> тіркелгіңіз арқылы қолданбадан немесе компьютеріңізбен не смарт құрылғыңызбен сайтқа кіріп жасай аласыз.<NL/><NL/>Ал мұны оқып отырған бала болсаң, ата-анаңа көрсет. Сонда бәрің де <L_NS/> жүйесін алаңсыз пайдалана аласыңдар!<NL/>"
