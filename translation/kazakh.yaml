- source: "All data in the system memory, including software data, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> <TAG2/>Please note:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>The system version will not be changed.<TAG9/>"
  target: "Жүйе жадындағы барлық дерек, соның ішінде бағдарлама деректері, сақтау деректері, скриншоттар, бейнелер және пайдаланушы ақпараты жойылып, консоль зауыттық параметрлерге қайтарылады.<TAG1/><NL/><L_SQR/> <TAG2/>Ескеріңіз:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Скриншоттар мен бейнелерден басқа, <L_MSD/> картасындағы барлық бағдарлама деректері жарамсыз болады. (<L_MSD/> картасындағы деректер жойылмайды.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Жүйе нұсқасы өзгермейді.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "Жүйе жадындағы барлық дерек, соның ішінде бағдарламалар, сақтау деректері, скриншоттар, бейнелер және пайдаланушы ақпараты жойылып, консоль зауыттық параметрлерге қайтарылады.<TAG1/><NL/><L_SQR/> Ескеріңіз:<TAG2/><NL/><L_DOT1/><TAG3/>Скриншоттар мен бейнелерден басқа, <L_MSD/> картасындағы барлық бағдарлама жарамсыз болады. (<L_MSD/> картасындағы деректер жойылмайды.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Жүйе нұсқасы өзгермейді.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Осы консольге байланыстырылған <L_N10/> тіркелгілері жойылмайды, бірақ олардың байланысы үзіледі.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/><L_N10/> тіркелгіңізде <L_NEP/> сатып алу тарихы мен ағымдағы теңгерім сақталады. Консольді бастапқы күйге қайтарғаннан кейін <L_N10/> тіркелгісін қайта байланыстырсаңыз, сол тіркелгімен сатып алынған бағдарламалар мен <L_DLC/> қайта жүктеп алуға қолжетімді болады. (Сатылымнан алынған кейбір бағдарламаларды қайта жүктеп алу мүмкін болмауы мүмкін.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Бұл параметрді консольдегі ақауға байланысты пайдаланып жатсаңыз:<TAG19/><NL/>Қызмет көрсету режимінде консольді сақтау деректері мен пайдаланушы ақпаратын жоймай бастапқы күйге қайтаруға болады. Осы тәсілді байқап көргіңіз келсе, бастапқы күйге қайтарудан бас тартып, мына әрекеттерді орындаңыз:<TAG20/><NL/><L_D1/> <TAG21/>Қуатты өшіріңіз.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>Консольді өшіру үшін Қуат мәзірін ашып (POWER түймесін үш секунд басып тұрыңыз), Қуат параметрлері → Қуатты өшіру тармағын таңдаңыз.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Дыбысты арттыру (+) және азайту (-) түймелерін POWER түймесімен бірге басып тұрып, консольді қосыңыз.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>Консоль Қызмет көрсету режимінде іске қосылады.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Сақтау деректерін жоймай консольді бастапқы күйге қайтару тармағын таңдап, нұсқауларды орындаңыз.<TAG38/>"
