  target: "<L_DASH/> минут қалды"
- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>Қарызға алынған ойындар 14 күннен кейін қайтарылады.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Бөлісу үшін жүйелерді бір-біріне жақындатыңыз.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Кейбір бағдарламаларды қарызға беру мүмкін болмауы мүмкін.<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/><TAG2/> сатып алған жүктелетін бағдарламаларды қабылдаушы жүйеге қайта жүктеп алып, ойнауға болады.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Скриншоттар мен бейнелер тасымалданбады, олар бастапқы жүйеде қалды.<TAG6/><TAG7/><NL/>Қосымша ақпарат алу үшін <L_N10/> қолдау сайтына кіріңіз:<NL/><L_NCOJ/>"
