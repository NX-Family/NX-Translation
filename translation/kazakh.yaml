- source: "Oh, and if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Сымсыз байланыс параметрлерін өзгерткіңіз келсе, HOME мәзіріндегі <0xE130/> (Жүйе параметрлері) ⇒ Ұшақ режимі тармағын таңдаңыз.<NL/><NL/>Ойыныңыз қызықты болсын!<NL/>Amelia N."
- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Теледидарға қосылғанда экран жарықтығын өзгерту мүмкін емес.<NL/>Сымсыз байланыс параметрлерін өзгерткіңіз келсе, HOME мәзіріндегі <0xE130/> (Жүйе параметрлері) ⇒ Ұшақ режимі тармағын таңдаңыз.<NL/><NL/>Ойыныңыз қызықты болсын!<NL/>Amelia N."
