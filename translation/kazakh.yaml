- source: "\"Man, if only there was one place to go and find answers to all my questions about <L_NS/>!\"<NL/><NL/>That's what I was saying yesterday. Luckily, I guess a passing genie heard me and granted my wish, because I found the <L_N10/> Support Website!<NL/>It's got all kinds of super-detailed info on how to use the console, plus the latest on getting system updates and new features! Just enter the URL in your PC or smart device if you've got questions. Go check it out! <NL/>"
  target: "\"Шіркін, <L_NS/> туралы барлық сұрағыма жауап табатын бір жер болса ғой!\"<NL/><NL/>Кеше осылай деген едім. Бақытыма орай, жолай өткен бір жын мені естіп, тілегімді орындаған сияқты, өйткені мен <L_N10/> қолдау сайтын таптым!<NL/>Онда консольді пайдалану туралы жан-жақты ақпарат, жүйені жаңарту және жаңа мүмкіндіктер туралы соңғы мәліметтер бар! Сұрағыңыз болса, URL мекенжайын компьютерге не смарт құрылғыға енгізіңіз. Кіріп көріңіз! <NL/>"
- source: "(Gameplay restrictions only)"
  target: "(Тек ойын шектеулері)"
- source: "(Hold)"
  target: "(Басып тұру)"
- source: "(Oh, and when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. The game card slot is kind of hidden too. Check the top right of the screen!<NL/>"
  target: "(Айтпақшы, <L_MSD/> картасын шығару үшін алдымен сырт еткен дыбыс шыққанша ішке басып, содан кейін тартып шығарыңыз. Қайта салғанда да сырт еткен дыбыс шыққанша басыңыз.)<NL/><NL/>Ойыныңыз қызықты болсын,<NL/>Amelia N.<NL/><NL/>P.S. Ойын картасының ұясы да сәл жасырылған. Экранның жоғарғы оң жағына қараңыз!<NL/>"
- source: "(Oh, but be sure to turn the console off when you remove or insert a <L_MSD/> card.)<NL/><NL/>(Oh, oh! And when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming!<NL/>Amelia N.<NL/><NL/>P.S. If you're not sure what kind of SD card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" They should be able to take care of you."
  target: "(Айтпақшы, <L_MSD/> картасын шығарғанда не салғанда консольді міндетті түрде өшіріңіз.)<NL/><NL/>(Тағы бір нәрсе! <L_MSD/> картасын шығару үшін алдымен сырт еткен дыбыс шыққанша ішке басып, содан кейін тартып шығарыңыз. Қайта салғанда да сырт еткен дыбыс шыққанша басыңыз.)<NL/><NL/>Ойыныңыз қызықты болсын!<NL/>Amelia N.<NL/><NL/>P.S. Қандай SD картасын сатып аларыңызды білмесеңіз, \"<L_UHSI/> немесе одан жоғары санатты <L_MSD/> картасын\" сұраңыз. Сізге көмектесе алады."
- source: "*This feature is available with compatible software.<NL/><NL/>P.S. If you're not sure what kind of <L_MSD/> card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" The folks at the store should know what you mean.<NL/><NL/>"
  target: "*Бұл мүмкіндік үйлесімді бағдарламаларда қолжетімді.<NL/><NL/>P.S. Қандай <L_MSD/> картасын сатып аларыңызды білмесеңіз, \"<L_UHSI/> немесе одан жоғары санатты <L_MSD/> картасын\" сұраңыз. Дүкен қызметкерлері не айтқаныңызды түсінеді.<NL/><NL/>"
