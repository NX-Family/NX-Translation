  target: "<L_DOT1/> <TAG1/><TAG2/> сатып алған жүктелетін бағдарламаларды қабылдаушы жүйеге қайта жүктеп алып, ойнауға болады.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Скриншоттар мен бейнелер тасымалданбады, олар бастапқы жүйеде қалды.<TAG6/><TAG7/><NL/>Қосымша ақпарат алу үшін <L_N10/> қолдау сайтына кіріңіз:<NL/><L_SNC/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_SNCT/>"
  target: "<L_DOT1/> <TAG1/><TAG2/> сатып алған жүктелетін бағдарламаларды қабылдаушы жүйеге қайта жүктеп алып, ойнауға болады.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Скриншоттар мен бейнелер тасымалданбады, олар бастапқы жүйеде қалды.<TAG6/><TAG7/><NL/>Қосымша ақпарат алу үшін <L_N10/> қолдау сайтына кіріңіз:<NL/><L_SNCT/>"
- source: "<L_DOT1/> <TAG1/>Games on physical game cards will <TAG2/>not appear<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Some software, like game demos, will not appear because they are not treated like game cards. <NL/><TAG7/><TAG8/>To play these titles, download them from <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software and downloadable content purchased using other accounts will not appear.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Hidden virtual game cards will not appear.<TAG19/>"
  target: "<L_DOT1/> <TAG1/>Физикалық ойын карталарындағы ойындар <TAG2/>көрсетілмейді<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Демонұсқалар сияқты кейбір бағдарламалар ойын картасы болып саналмайтындықтан көрсетілмейді. <NL/><TAG7/><TAG8/>Оларды ойнау үшін <TAG9/><L_NEP/><TAG10/> дүкенінен жүктеп алыңыз.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Басқа тіркелгілер арқылы сатып алынған бағдарламалар мен жүктелетін мазмұн көрсетілмейді.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Жасырылған виртуалды ойын карталары көрсетілмейді.<TAG19/>"
- source: "<L_DOT1/><TAG1/>If a controller is on top of clothing or a soft object, like a pillow, the vibration may become difficult to hear. Please be as quiet as possible during the searching process.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Controllers that do not have a vibration feature cannot be searched for by using this method.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>If a controller is not vibrating, try moving the console closer to where you think it might be or try searching for the controller using a different console. Controllers may not vibrate if:<TAG8/><NL/><L_DSH/><TAG9/>They are too far away from the console.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>They are out of battery power or have low battery power.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>They are not paired to a console or are paired to a different console.<TAG16/><TAG17/>"
  target: "<L_DOT1/><TAG1/>Контроллер киімнің немесе жастық сияқты жұмсақ заттың үстінде жатса, дірілін есту қиын болуы мүмкін. Іздеу кезінде мүмкіндігінше тыныштық сақтаңыз.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Діріл мүмкіндігі жоқ контроллерлерді бұл әдіспен іздеу мүмкін емес.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Контроллер дірілдемесе, консольді контроллер болуы мүмкін жерге жақындатып көріңіз немесе басқа консольмен іздеңіз. Контроллерлер мына жағдайларда дірілдемеуі мүмкін:<TAG8/><NL/><L_DSH/><TAG9/>Консольден тым алыс болса.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>Батарея қуаты таусылған не аз қалған болса.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>Консольмен жұптастырылмаған немесе басқа консольмен жұптастырылған болса.<TAG16/><TAG17/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try adding this network to your smartphone's <L_WIFI/> settings:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Security: <L_WAES/><NL/>Password: <TAG6/><NL/><TAG7/><TAG8/>This password will change each time you connect.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>If the access point does not change to your <L_NS/>, try temporarily disabling mobile data on your smartphone.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Visit the <L_N10/> Support website for more.<NL/><TAG17/><TAG18/>"
  target: "<L_DOT1/><TAG1/>QR кодын сканерлей алмасаңыз, смартфоныңыздың <L_WIFI/> параметрлеріне осы желіні қосып көріңіз:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Қауіпсіздік: <L_WAES/><NL/>Құпиясөз: <TAG6/><NL/><TAG7/><TAG8/>Құпиясөз әр қосылған сайын өзгереді.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>Кіру нүктесі <L_NS/> жүйесіне ауыспаса, смартфондағы мобильді деректерді уақытша өшіріп көріңіз.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Толығырақ ақпаратты <L_N10/> қолдау сайтынан қараңыз.<NL/><TAG17/><TAG18/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try going to this URL on your smartphone's Internet browser:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>If the access point does not change to your <L_NS/> and no screenshots or videos display, try temporarily disabling mobile data on your smartphone.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Visit the <L_N10/> Support website for more information.<NL/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>QR кодын сканерлей алмасаңыз, смартфон браузерінде осы URL мекенжайын ашып көріңіз:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Кіру нүктесі <L_NS/> жүйесіне ауыспай, скриншоттар не бейнелер көрсетілмесе, смартфондағы мобильді деректерді уақытша өшіріп көріңіз.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Қосымша ақпарат үшін <L_N10/> қолдау сайтына кіріңіз.<NL/><TAG9/><TAG10/>"
