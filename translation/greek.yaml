- source: "Entering your Parental Controls PIN will temporarily disable all restrictions until <NL/>the console is put into sleep mode or until Parental Controls are enabled again.<TAG1/><NL/>All features that may have been restricted by Parental Controls will be available:<NL/><L_DOT1/><TAG2/>Enables all software.<TAG3/><NL/><L_DOT1/><TAG4/>Enables posting of screenshots and videos to social media.<TAG5/><NL/><L_DOT1/><TAG6/>Enables communication with others.<TAG7/><NL/><L_DOT1/><TAG8/>Enables VR mode.<TAG9/><NL/><L_DOT1/><TAG10/>Disables any play timer set using the <TAG11/><L_NS/><TAG12/> Parental Controls app.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>As all Parental Controls restrictions will be lifted, please be mindful when your child is playing<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
  target: "Η εισαγωγή του PIN γονικού ελέγχου απενεργοποιεί προσωρινά όλους τους περιορισμούς μέχρι <NL/>η κονσόλα να μπει σε αναμονή ή να ενεργοποιηθεί ξανά ο γονικός έλεγχος.<TAG1/><NL/>Όλες οι λειτουργίες που είχαν περιοριστεί θα είναι διαθέσιμες:<NL/><L_DOT1/><TAG2/>Ενεργοποιείται όλο το λογισμικό.<TAG3/><NL/><L_DOT1/><TAG4/>Επιτρέπεται η δημοσίευση στιγμιότυπων οθόνης και βίντεο σε κοινωνικά δίκτυα.<TAG5/><NL/><L_DOT1/><TAG6/>Επιτρέπεται η επικοινωνία με άλλους.<TAG7/><NL/><L_DOT1/><TAG8/>Ενεργοποιείται η λειτουργία VR.<TAG9/><NL/><L_DOT1/><TAG10/>Απενεργοποιείται κάθε χρονόμετρο παιχνιδιού που ορίστηκε μέσω της εφαρμογής <TAG11/><L_NS/><TAG12/> Parental Controls.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>Καθώς αίρονται όλοι οι περιορισμοί του γονικού ελέγχου, προσέχετε όταν το παιδί σας παίζει στο<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
