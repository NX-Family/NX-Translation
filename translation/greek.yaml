- source: "Data related to the software will be archived.<TAG1/><NL/>Only save data and the icon on the HOME Menu will remain.<NL/><TAG2/><TAG3/>Update data and/or downloadable content can be redownloaded later.<TAG4/><TAG5/>"
  target: "Τα δεδομένα που σχετίζονται με το λογισμικό θα αρχειοθετηθούν.<TAG1/><NL/>Θα παραμείνουν μόνο τα δεδομένα αποθήκευσης και το εικονίδιο στο μενού HOME.<NL/><TAG2/><TAG3/>Μπορείτε να κατεβάσετε ξανά τα δεδομένα ενημέρωσης και/ή το πρόσθετο περιεχόμενο αργότερα.<TAG4/><TAG5/>"
