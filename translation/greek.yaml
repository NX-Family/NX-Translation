- source: "Link your <L_N10/> Account to this console to download software from <TAG1/><L_NEP/><TAG2/>, transfer data between consoles-and much more!<TAG3/><NL/>Once linked, you can also set this console as your primary console in <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>You must be connected to the Internet to play your software on a console that is not your primary console.<TAG8/><TAG9/><TAG10/><NL/>If you are unable to link your <L_N10/> Account now, check your user page on the <TAG11/>HOME Menu<TAG12/>."
  target: "Συνδέστε τον λογαριασμό <L_N10/> σας με αυτή την κονσόλα για λήψη λογισμικού από το <TAG1/><L_NEP/><TAG2/>, μεταφορά δεδομένων μεταξύ κονσολών και πολλά άλλα!<TAG3/><NL/>Μετά τη σύνδεση, μπορείτε επίσης να ορίσετε αυτή την κονσόλα ως κύρια στο <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>Για να παίξετε το λογισμικό σας σε άλλη κονσόλα που δεν είναι η κύρια, απαιτείται σύνδεση στο διαδίκτυο.<TAG8/><TAG9/><TAG10/><NL/>Αν δεν μπορείτε να συνδέσετε τον λογαριασμό <L_N10/> σας τώρα, ελέγξτε τη σελίδα χρήστη σας στο <TAG11/>μενού HOME<TAG12/>."
