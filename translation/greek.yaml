- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Τα δεδομένα στη μνήμη του συστήματος θα διαγραφούν και η κονσόλα θα επανέλθει στις εργοστασιακές ρυθμίσεις.<NL/>Τα δεδομένα αποθήκευσης, τα στιγμιότυπα οθόνης, τα βίντεο και τα στοιχεία χρηστών δεν θα διαγραφούν.<TAG1/><NL/><L_SQR/> Σημείωση:<TAG2/><NL/><L_DOT1/><TAG3/>Όλα τα δεδομένα λογισμικού στην κάρτα <L_MSD/>, εκτός από στιγμιότυπα οθόνης και βίντεο, θα πάψουν να μπορούν να χρησιμοποιηθούν. (Τα δεδομένα στην κάρτα <L_MSD/> δεν θα διαγραφούν.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Η έκδοση συστήματος δεν θα αλλάξει ούτε θα επανέλθει σε παλαιότερη.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Μπορείτε να παίξετε ξανά τα διαγραμμένα παιχνίδια και το <L_DLC/> μετά από νέα λήψη του λογισμικού. (Σε ορισμένες περιπτώσεις, λογισμικό που έχει αποσυρθεί μπορεί να μην είναι διαθέσιμο για νέα λήψη.)<TAG10/>"
- source: "Data move complete."
