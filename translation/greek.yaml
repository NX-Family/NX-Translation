- source: "Send data from this system to <L_N10/> for troubleshooting and analytical purposes. The received data will be handled in accordance with the <L_N10/> Privacy Policy available at <L_UCOM/>. "
  target: "Αποστολή δεδομένων αυτού του συστήματος στη <L_N10/> για αντιμετώπιση προβλημάτων και ανάλυση. Τα δεδομένα θα υποβληθούν σε επεξεργασία σύμφωνα με την Πολιτική απορρήτου της <L_N10/> στο <L_UCOM/>. "
- source: "Send save data and associated information from this system to <L_N10/> for troubleshooting and analytical purposes. The data may be sent overseas to other entities in the <L_N10/> Group, and the third-party developer of the software if applicable. Depending on location a third-party developer may not be required to protect the information in a way that provides comparable safeguards to those in Australian and New Zealand privacy laws."
  target: "Αποστολή δεδομένων αποθήκευσης και σχετικών πληροφοριών αυτού του συστήματος στη <L_N10/> για αντιμετώπιση προβλημάτων και ανάλυση. Τα δεδομένα ενδέχεται να σταλούν στο εξωτερικό, σε άλλες οντότητες του ομίλου <L_N10/> και, κατά περίπτωση, στον τρίτο δημιουργό του λογισμικού. Ανάλογα με την τοποθεσία του, ο τρίτος δημιουργός μπορεί να μην υποχρεούται να παρέχει προστασία αντίστοιχη με εκείνη των νόμων περί απορρήτου της Αυστραλίας και της Νέας Ζηλανδίας."
- source: "Send save data for which user?"
  target: "Αποστολή δεδομένων αποθήκευσης για ποιον χρήστη;"
- source: "Send save data to <L_N10/> for data investigation and performance of this service.<NL/>To provide you with the requested service, save data and associated information need to be sent to <L_N10/> and processed as further described in the Privacy Policy."
  target: "Αποστολή δεδομένων αποθήκευσης στη <L_N10/> για διερεύνηση δεδομένων και παροχή αυτής της υπηρεσίας.<NL/>Για την παροχή της υπηρεσίας που ζητήσατε, τα δεδομένα αποθήκευσης και οι σχετικές πληροφορίες πρέπει να σταλούν στη <L_N10/> και να υποβληθούν σε επεξεργασία όπως περιγράφεται στην Πολιτική απορρήτου."
