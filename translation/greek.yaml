- source: "Notifies you when information arrives from <L_NSO/>, such as when Platinum Points can be collected.<NL/>Earn Platinum Points by<L_XA0/>doing things like completing <L_NSO/> missions.<TAG1/><NL/><L_ROMB/><TAG2/>For info on missions, go to the <TAG3/>HOME Menu<TAG4/> and check the <L_NSO/><L_XA0/>app.<TAG5/>"
  target: "Σας ειδοποιεί για νέα από το <L_NSO/>, π.χ. πότε μπορείτε να αποκτήσετε πόντους πλατίνας.<NL/>Κερδίστε πόντους πλατίνας<L_XA0/>ολοκληρώνοντας αποστολές <L_NSO/> και άλλες δραστηριότητες.<TAG1/><NL/><L_ROMB/><TAG2/>Για πληροφορίες αποστολών, ανοίξτε το <TAG3/>μενού HOME<TAG4/> και ελέγξτε την εφαρμογή <L_NSO/><L_XA0/>εκεί.<TAG5/>"
