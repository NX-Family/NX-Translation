  target: "Εδώ εμφανίζεται το λογισμικό που έπαιξε αυτός ο χρήστης.<NL/>Εμφανίζονται έως 20 τίτλοι.<TAG1/><NL/>Μπορείτε να αλλάξετε ποιος βλέπει τη δραστηριότητα παιχνιδιού σας<NL/>ή να τη διαγράψετε τελείως από τις Ρυθμίσεις χρήστη.<NL/><TAG2/><TAG3/>Η ενημέρωση αυτών των πληροφοριών μπορεί να καθυστερήσει.<NL/>Δεν περιλαμβάνεται λογισμικό που παίχτηκε χωρίς επιλογή χρήστη.<TAG4/><TAG5/>"
- source: "Software rating organizations give each game an age rating based on its content. Select the software rating organization for your region.<TAG1/><NL/>For more information about the specific age ratings for each software rating organization, visit the <L_N10/> Support website.<NL/><TAG2/>"
  target: "Οι οργανισμοί αξιολόγησης λογισμικού κατατάσσουν τα παιχνίδια ανά ηλικία βάσει του περιεχομένου τους. Επιλέξτε τον οργανισμό της περιοχής σας.<TAG1/><NL/>Για πληροφορίες σχετικά με τις ηλικιακές κατατάξεις κάθε οργανισμού, επισκεφθείτε τον ιστότοπο υποστήριξης της <L_N10/>.<NL/><TAG2/>"
- source: "Software shared using <L_TGS/>.<NL/>To learn more about it, visit <L_NEP/>."
  target: "Λογισμικό που κοινοποιήθηκε μέσω <L_TGS/>.<NL/>Μάθετε περισσότερα στο <L_NEP/>."
- source: "Software update data is available, but in order to install it you must first perform a system update."
  target: "Υπάρχουν δεδομένα ενημέρωσης λογισμικού, αλλά για την εγκατάστασή τους απαιτείται πρώτα ενημέρωση συστήματος."
- source: "Software update will be canceled.<TAG1/><NL/>The update data will have to be re-downloaded. Continue?"
  target: "Η ενημέρωση λογισμικού θα ακυρωθεί.<TAG1/><NL/>Θα χρειαστεί νέα λήψη των δεδομένων ενημέρωσης. Συνέχεια;"
- source: "Software will be downloaded after the system transfer is complete."
  target: "Το λογισμικό θα ληφθεί μετά την ολοκλήρωση της μεταφοράς του συστήματος."
- source: "Software will now be archived.<TAG1/><NL/>Only the save data and software icon on the <TAG2/>HOME Menu<TAG3/> will remain. You can use the software again by redownloading the data."
  target: "Το λογισμικό θα αρχειοθετηθεί τώρα.<TAG1/><NL/>Μόνο τα δεδομένα αποθήκευσης και το εικονίδιο του λογισμικού στο <TAG2/>Μενού HOME<TAG3/> θα παραμείνουν. Μπορείτε να χρησιμοποιήσετε ξανά το λογισμικό κατεβάζοντας ξανά τα δεδομένα."
- source: "Some <L_DLC/> cannot be played.<NL/>It can be purchased from <L_NEP/>.<NL/><TAG1/><TAG2/>If you have the virtual game card, open the HOME Menu, select <TAG3/><0xE13D/> (Virtual<TAG4/> Game Cards), and load the game to play it.<TAG5/><TAG6/>"
  target: "Δεν μπορείτε να παίξετε ορισμένο <L_DLC/>.<NL/>Μπορείτε να το αγοράσετε στο <L_NEP/>.<NL/><TAG1/><TAG2/>Αν έχετε την εικονική κάρτα παιχνιδιού, ανοίξτε το μενού HOME, επιλέξτε <TAG3/><0xE13D/> (Εικονικές<TAG4/> κάρτες παιχνιδιού) και φορτώστε το παιχνίδι για να παίξετε.<TAG5/><TAG6/>"
- source: "Some <L_NEP/> services are currently unavailable.<TAG1/><NL/>We apologize for any inconvenience.<NL/>Please try again later."
  target: "Ορισμένες υπηρεσίες του <L_NEP/> δεν είναι διαθέσιμες τώρα.<TAG1/><NL/>Ζητούμε συγγνώμη για την ταλαιπωρία.<NL/>Δοκιμάστε ξανά αργότερα."
- source: "Some <L_NS/> games may not be supported or fully compatible with <L_N10/> <TAG1/><L_SWT2/><TAG2/>.<NL/>Visit <L_N10/>'s website for compatibility information.<NL/><TAG3/>"
  target: "Ορισμένα παιχνίδια <L_NS/> ενδέχεται να μην υποστηρίζονται ή να μην είναι πλήρως συμβατά με το <L_N10/> <TAG1/><L_SWT2/><TAG2/>.<NL/>Δείτε τον ιστότοπο της <L_N10/> για πληροφορίες συμβατότητας.<NL/><TAG3/>"
- source: "Some content on this page is not encrypted."
  target: "Ορισμένο περιεχόμενο σε αυτήν τη σελίδα δεν είναι κρυπτογραφημένο."
- source: "Some data can be transferred to <L_N10/> <TAG1/><L_SWT2/><TAG2/>, but not all."
  target: "Ορισμένα δεδομένα μεταφέρονται στο <L_N10/> <TAG1/><L_SWT2/><TAG2/>, αλλά όχι όλα."
