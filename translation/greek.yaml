  target: "Αθήνα"
- source: "Attach the <L_JC/> controllers to the console.<NL/>The <L_JC/> cannot be used wirelessly<NL/>when Airplane Mode is enabled.<TAG1/><NL/><TAG2/>You can turn Airplane Mode On/Off in Quick Settings (hold <0xE0B9/>).<TAG3/>"
  target: "Προσαρτήστε τα χειριστήρια <L_JC/> στην κονσόλα.<NL/>Τα <L_JC/> δεν μπορούν να χρησιμοποιηθούν ασύρματα<NL/>όταν είναι ενεργή η Λειτουργία πτήσης.<TAG1/><NL/><TAG2/>Μπορείτε να αλλάξετε τη Λειτουργία πτήσης σε Ενεργό/Ανενεργό από τις Γρήγορες ρυθμίσεις (κρατήστε πατημένο το <0xE0B9/>).<TAG3/>"
