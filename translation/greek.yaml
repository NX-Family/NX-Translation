- source: "<L_ROMB/> <TAG1/>Download will continue even if you leave this screen. Update your console after the download is complete.<TAG2/>"
  target: "<L_ROMB/> <TAG1/>Η λήψη θα συνεχιστεί ακόμα κι αν φύγετε από αυτήν την οθόνη. Ενημερώστε την κονσόλα σας μετά την ολοκλήρωση της λήψης.<TAG2/>"
- source: "<L_ROMB/> <TAG1/>Press <TAG2/> to calibrate a different controller.<TAG3/>"
  target: "<L_ROMB/> <TAG1/>Πατήστε <TAG2/> για να βαθμονομήσετε ένα διαφορετικό χειριστήριο.<TAG3/>"
- source: "<L_ROMB/> <TAG1/>This can also be changed from Quick Settings (hold <0xE0B9/>).<TAG2/>"
  target: "<L_ROMB/> <TAG1/>Μπορείτε επίσης να το αλλάξετε από τις Γρήγορες ρυθμίσεις (κρατήστε πατημένο το <0xE0B9/>).<TAG2/>"
- source: "<L_ROMB/> <TAG1/>This news feature is not currently available in English.<TAG2/>"
  target: "<L_ROMB/> <TAG1/>Αυτή η λειτουργία ειδήσεων δεν διατίθεται προς το παρόν στα αγγλικά.<TAG2/>"
- source: "<L_ROMB/> If your <L_NS/> screen isn't displaying on the TV, here are some things to check:<NL/><L_DOT1/>Is the TV on?<NL/><L_DOT1/>Is the TV set to the right input? <NL/><L_DOT1/>Are the AC adapter and the <L_HDMI/> cable connected properly?<NL/><L_DOT1/>Is the <L_NS/> console centered nicely on the dock, and did you press down lightly to connect it?<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> Αν η οθόνη του <L_NS/> δεν εμφανίζεται στην τηλεόραση, ελέγξτε τα εξής:<NL/><L_DOT1/>Είναι αναμμένη η τηλεόραση;<NL/><L_DOT1/>Έχει επιλεγεί η σωστή είσοδος στην τηλεόραση; <NL/><L_DOT1/>Είναι σωστά συνδεδεμένα το τροφοδοτικό και το καλώδιο <L_HDMI/>;<NL/><L_DOT1/>Είναι η κονσόλα <L_NS/> καλά κεντραρισμένη στη βάση και την πιέσατε ελαφρά προς τα κάτω για να συνδεθεί;<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N."
- source: "<L_ROMB/> This setting will not affect the colors displayed in TV mode."
  target: "<L_ROMB/> Αυτή η ρύθμιση δεν θα επηρεάσει τα χρώματα που εμφανίζονται σε λειτουργία τηλεόρασης."
- source: "<L_ROMB/> To receive the latest news, you'll need to have an Internet connection and link your <L_N10/> Account with your <L_NS/> console.<NL/><NL/><L_ROMB/> If news channels are available for a certain game, you'll be automatically subscribed to them when you first play that game. Channel settings can be changed in System Settings ⇒ System ⇒ News Channel Settings.<NL/><NL/><L_ROMB/> Some channels may only be available for a limited time.<NL/><NL/><L_ROMB/> You can get news from the <L_NS/> Information Center even without linking an account. You just need to be connected to the Internet.<NL/><NL/><L_ROMB/> This feature is included in \"System Version 3.0.0\". You can verify the system version in Settings ⇒ System.<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. I forgot to mention, but you can jump between news entries by pressing  <0xE0A4/> or <0xE0A5/>!"
  target: "<L_ROMB/> Για να λαμβάνετε τις τελευταίες ειδήσεις, χρειάζεστε σύνδεση στο διαδίκτυο και πρέπει να συνδέσετε τον λογαριασμό <L_N10/> σας με την κονσόλα <L_NS/> σας.<NL/><NL/><L_ROMB/> Αν ένα παιχνίδι διαθέτει κανάλια ειδήσεων, θα εγγραφείτε αυτόματα σε αυτά όταν το παίξετε πρώτη φορά. Μπορείτε να αλλάξετε τις ρυθμίσεις από Ρυθμίσεις συστήματος ⇒ Σύστημα ⇒ Ρυθμίσεις καναλιών ειδήσεων.<NL/><NL/><L_ROMB/> Ορισμένα κανάλια μπορεί να διατίθενται μόνο για περιορισμένο χρόνο.<NL/><NL/><L_ROMB/> Μπορείτε να λαμβάνετε ειδήσεις από το Κέντρο πληροφοριών <L_NS/> χωρίς να συνδέσετε λογαριασμό. Αρκεί να είστε συνδεδεμένοι στο διαδίκτυο.<NL/><NL/><L_ROMB/> Αυτή η λειτουργία περιλαμβάνεται στην \"Έκδοση συστήματος 3.0.0\". Μπορείτε να ελέγξετε την έκδοση από Ρυθμίσεις ⇒ Σύστημα.<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N.<NL/><NL/>Υ.Γ. Ξέχασα να πω ότι μπορείτε να μετακινείστε μεταξύ ειδήσεων πατώντας  <0xE0A4/> ή <0xE0A5/>!"
- source: "<L_ROMB/> When you're using the <L_NS/> dock, be sure to keep the AC adapter connected and plugged in, otherwise it won't display an image on the TV.<NL/><L_ROMB/> If you want to fully charge the <L_JC/> controllers, just attach them to the console while it's either docked or plugged in. But if they're attached when the console ISN'T charging, they might stop charging themselves to conserve the console's battery.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> Όταν χρησιμοποιείτε τη βάση του <L_NS/>, κρατήστε το τροφοδοτικό συνδεδεμένο στη βάση και στην πρίζα, αλλιώς δεν θα εμφανίζεται εικόνα στην τηλεόραση.<NL/><L_ROMB/> Για να φορτίσετε πλήρως τα χειριστήρια <L_JC/>, προσαρτήστε τα στην κονσόλα ενώ αυτή είναι στη βάση ή στην πρίζα. Αν όμως η κονσόλα ΔΕΝ φορτίζεται, τα χειριστήρια μπορεί να σταματήσουν να φορτίζονται για να εξοικονομήσουν την μπαταρία της κονσόλας.<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N."
- source: "<L_SNC/>/animalcrossing"
  target: "<L_SNC/>/animalcrossing"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be uploaded to the server.<TAG7/><NL/><L_DOT1/> <TAG8/>After uploading the data to the server, this system will be initialized, restoring it to factory defaults and erasing all data in system memory.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target system downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG11/><TAG12/><NL/>When a system transfer is started, people with <L_N10/> Accounts on the system, along with any supervising parent/guardian users, will get updates about the transfer in the following places:<TAG13/><NL/><L_DOT1/> <TAG14/>The e-mail linked to their <L_N10/> Account<TAG15/><NL/><L_DOT1/> <TAG16/>Their account settings on the <L_N10/> Account website (<TAG17/>)<TAG18/><TAG19/><NL/>Updates will note that you started a transfer and will include your nickname and icon.<TAG20/>"
  target: "<L_SQR/> <TAG1/>Σχετικά με τα δεδομένα άλλων χρηστών<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Τα δεδομένα άλλων χρηστών θα μεταφερθούν μαζί με τα δεδομένα του συστήματος.<NL/>Πριν ξεκινήσετε, ενημερώστε όλους όσους χρησιμοποιούν αυτό το σύστημα.<TAG5/><NL/><L_DOT1/> <TAG6/>Όλα τα δεδομένα χρηστών αυτού του συστήματος θα σταλούν στον διακομιστή.<TAG7/><NL/><L_DOT1/> <TAG8/>Μετά την αποστολή, το σύστημα θα αρχικοποιηθεί, επαναφέροντας τις εργοστασιακές ρυθμίσεις και διαγράφοντας όλα τα δεδομένα στη μνήμη του συστήματος.<TAG9/><NL/><L_DOT1/> <TAG10/>Όταν το σύστημα προορισμού κατεβάσει τα δεδομένα, θα συνδεθεί αυτόματα στους λογαριασμούς <L_N10/> που ήταν συνδεδεμένοι με το σύστημα προέλευσης.<TAG11/><TAG12/><NL/>Όταν ξεκινήσει μια μεταφορά συστήματος, όσοι έχουν λογαριασμούς <L_N10/> στο σύστημα, καθώς και οι γονείς/κηδεμόνες που τους επιβλέπουν, θα λαμβάνουν ενημερώσεις για τη μεταφορά στα εξής μέρη:<TAG13/><NL/><L_DOT1/> <TAG14/>Στο e-mail που είναι συνδεδεμένο με τον λογαριασμό <L_N10/> τους<TAG15/><NL/><L_DOT1/> <TAG16/>Στις ρυθμίσεις του λογαριασμού τους στον ιστότοπο λογαριασμών <L_N10/> (<TAG17/>)<TAG18/><TAG19/><NL/>Οι ενημερώσεις θα αναφέρουν ότι ξεκινήσατε μια μεταφορά και θα περιλαμβάνουν το ψευδώνυμο και το εικονίδιό σας.<TAG20/>"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with<L_XA0/>everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be transferred to the target <L_N10/> <TAG7/><L_SWT2/><TAG8/> system.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target <L_N10/> <TAG11/><L_SWT2/><TAG12/> downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG13/><TAG14/><NL/>When starting a system transfer, people with <L_N10/> Accounts on this system, along with any supervising parent/guardian users, will get updates in the following places:<TAG15/><NL/><L_DOT1/> <TAG16/>The e-mail linked to their <L_N10/> Account<TAG17/><NL/><L_DOT1/> <TAG18/>Their account settings on the <L_N10/> Account website (<TAG19/>)<TAG20/><TAG21/><NL/>Updates will note a transfer was started and will include the nickname and icon of the user who started the transfer.<TAG22/>"
  target: "<L_SQR/> <TAG1/>Σχετικά με τα δεδομένα άλλων χρηστών<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Τα δεδομένα άλλων χρηστών θα μεταφερθούν μαζί με τα δεδομένα του συστήματος.<NL/>Πριν ξεκινήσετε, ενημερώστε<L_XA0/>όλους όσους χρησιμοποιούν αυτό το σύστημα.<TAG5/><NL/><L_DOT1/> <TAG6/>Όλα τα δεδομένα χρηστών αυτού του συστήματος θα μεταφερθούν στο σύστημα <L_N10/> <TAG7/><L_SWT2/><TAG8/> προορισμού.<TAG9/><NL/><L_DOT1/> <TAG10/>Όταν το <L_N10/> <TAG11/><L_SWT2/><TAG12/> προορισμού κατεβάσει τα δεδομένα, θα συνδεθεί αυτόματα στους λογαριασμούς <L_N10/> που ήταν συνδεδεμένοι με το σύστημα προέλευσης.<TAG13/><TAG14/><NL/>Όταν ξεκινήσει μια μεταφορά συστήματος, όσοι έχουν λογαριασμούς <L_N10/> σε αυτό το σύστημα, καθώς και οι γονείς/κηδεμόνες που τους επιβλέπουν, θα λαμβάνουν ενημερώσεις στα εξής μέρη:<TAG15/><NL/><L_DOT1/> <TAG16/>Στο e-mail που είναι συνδεδεμένο με τον λογαριασμό <L_N10/> τους<TAG17/><NL/><L_DOT1/> <TAG18/>Στις ρυθμίσεις του λογαριασμού τους στον ιστότοπο λογαριασμών <L_N10/> (<TAG19/>)<TAG20/><TAG21/><NL/>Οι ενημερώσεις θα αναφέρουν ότι ξεκίνησε μια μεταφορά και θα περιλαμβάνουν το ψευδώνυμο και το εικονίδιο του χρήστη που την ξεκίνησε.<TAG22/>"
- source: "<L_SQR/> <TAG1/>To <L_N10/> Account holders using this console:<TAG2/><TAG3/><NL/>If you initialize this console using this method, unlike the standard initialization, you will be unable to eject any loaded virtual game cards.<NL/>Additionally, this console will remain linked to your account and will be able to use any passes available for associated software.<TAG4/><NL/>If you want to continue using your <L_N10/> Account with this <L_NS/> console, relink your <L_N10/> Account to this console after it has been initialized.<TAG5/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG6/>"
  target: "<L_SQR/> <TAG1/>Προς κατόχους λογαριασμών <L_N10/> που χρησιμοποιούν αυτή την κονσόλα:<TAG2/><TAG3/><NL/>Αν αρχικοποιήσετε την κονσόλα με αυτόν τον τρόπο, σε αντίθεση με την τυπική αρχικοποίηση, δεν θα μπορείτε να εξαγάγετε φορτωμένες εικονικές κάρτες παιχνιδιού.<NL/>Επιπλέον, η κονσόλα θα παραμείνει συνδεδεμένη με τον λογαριασμό σας και θα μπορεί να χρησιμοποιεί διαθέσιμα πάσα για το σχετικό λογισμικό.<TAG4/><NL/>Αν θέλετε να συνεχίσετε να χρησιμοποιείτε τον λογαριασμό <L_N10/> σας με αυτή την κονσόλα <L_NS/>, συνδέστε ξανά τον λογαριασμό <L_N10/> σας με την κονσόλα μετά την αρχικοποίηση.<TAG5/><NL/>Για περισσότερες πληροφορίες, επισκεφθείτε τον ιστότοπο υποστήριξης της <L_N10/>.<NL/><TAG6/>"
- source: "<L_SQR/> Help<TAG1/><NL/>Go to the HOME Menu, open your user page in the top-left corner, and select User Settings ⇒ User‑Verification Settings ⇒ <TAG2/> Help. From there, you can sign in to your <L_N10/> Account and reset your PIN with the I<L_XA0/>Can't Remember My PIN option."
  target: "<L_SQR/> Βοήθεια<TAG1/><NL/>Στο μενού HOME, ανοίξτε τη σελίδα χρήστη πάνω αριστερά και επιλέξτε Ρυθμίσεις χρήστη ⇒ Ρυθμίσεις επαλήθευσης χρήστη ⇒ <TAG2/> Βοήθεια. Εκεί, συνδεθείτε στον λογαριασμό <L_N10/> σας και επαναφέρετε το PIN με την επιλογή Δεν<L_XA0/>θυμάμαι το PIN μου."
- source: "<L_SQR/> Important Information<TAG1/><NL/>Data sent to the server, such as save data, screenshots, and<NL/>videos, will be returned to this system. However, some data<NL/>may not appear exactly as it did previously. For example:<TAG2/><NL/><L_DOT1/> <TAG3/>Software icons on the HOME Menu will not be restored.<NL/>Group settings for All Software will also be erased.<NL/><TAG4/><TAG5/>Purchased downloadable software and <L_DLC/> will not be lost.<NL/>To redownload purchased software, load its virtual game card.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Any link to the <L_NS/> Parental Controls app<NL/>will be removed. You can relink the app at a later time.<TAG11/>"
  target: "<L_SQR/> Σημαντικές πληροφορίες<TAG1/><NL/>Τα δεδομένα που στάλθηκαν στον διακομιστή, όπως δεδομένα αποθήκευσης, στιγμιότυπα οθόνης και<NL/>βίντεο, θα επιστραφούν σε αυτό το σύστημα. Όμως, ορισμένα δεδομένα<NL/>ίσως να μην εμφανίζονται ακριβώς όπως πριν. Για παράδειγμα:<TAG2/><NL/><L_DOT1/> <TAG3/>Τα εικονίδια λογισμικού στο μενού HOME δεν θα αποκατασταθούν.<NL/>Θα διαγραφούν και οι ρυθμίσεις ομάδων για το Όλο το λογισμικό.<NL/><TAG4/><TAG5/>Το ψηφιακό λογισμικό και το <L_DLC/> που αγοράσατε δεν θα χαθούν.<NL/>Για να κατεβάσετε ξανά αγορασμένο λογισμικό, φορτώστε την εικονική κάρτα παιχνιδιού του.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Η σύνδεση με την εφαρμογή <L_NS/> Parental Controls<NL/>θα καταργηθεί. Μπορείτε να τη συνδέσετε ξανά αργότερα.<TAG11/>"
- source: "<L_SQR/> Lending and Borrowing<TAG1/><NL/><L_DOT1/> <TAG2/>Borrowed games will be returned after 14 days.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>You can borrow only one virtual game card at a time.<TAG6/>"
  target: "<L_SQR/> Δανείζω και δανείζομαι<TAG1/><NL/><L_DOT1/> <TAG2/>Τα παιχνίδια που δανείζεστε επιστρέφονται μετά από 14 ημέρες.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Μπορείτε να δανειστείτε μόνο μία εικονική κάρτα παιχνιδιού κάθε φορά.<TAG6/>"
