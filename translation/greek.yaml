- source: "Archive the following software to free up space?<NL/><TAG1/><TAG2/>Only save data and the HOME Menu icon will remain for archived software. You will need to redownload the software to use it again.<TAG3/><TAG4/>"
  target: "Να αρχειοθετηθεί το παρακάτω λογισμικό για να ελευθερωθεί χώρος;<NL/><TAG1/><TAG2/>Θα παραμείνουν μόνο τα δεδομένα αποθήκευσης και το εικονίδιο στο μενού HOME. Θα χρειαστεί νέα λήψη του λογισμικού για να το χρησιμοποιήσετε ξανά.<TAG3/><TAG4/>"
- source: "Archive the following software to free up space?<NL/><TAG1/><TAG2/>Only the save data and HOME Menu icon will remain for archived software.<NL/>You will need to redownload the software to use it again.<NL/>Alternatively, you can move data by selecting <TAG3/><0xE130/> (System Settings)<TAG4/> ⇒ <TAG5/>Data Management<TAG6/> via the <TAG7/>HOME Menu<TAG8/>.<TAG9/><TAG10/>"
  target: "Να αρχειοθετηθεί το παρακάτω λογισμικό για να ελευθερωθεί χώρος;<NL/><TAG1/><TAG2/>Για το αρχειοθετημένο λογισμικό θα παραμείνουν μόνο τα δεδομένα αποθήκευσης και το εικονίδιο στο μενού HOME.<NL/>Θα πρέπει να κατεβάσετε ξανά το λογισμικό για να το χρησιμοποιήσετε.<NL/>Εναλλακτικά, μπορείτε να μετακινήσετε δεδομένα επιλέγοντας <TAG3/><0xE130/> (Ρυθμίσεις συστήματος)<TAG4/> ⇒ <TAG5/>Διαχείριση δεδομένων<TAG6/> από το <TAG7/>μενού HOME<TAG8/>.<TAG9/><TAG10/>"
