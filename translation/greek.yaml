- source: "<TAG1/><TAG2/>Error Code: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>This software needed to close due to an error.<TAG7/><NL/>Do you allow <L_N10/> to share error information from this console with third-party developers whose software has crashed for analysis and improvement purposes?<TAG8/><NL/>Information regarding international data-sharing destinations and personal-data protection is published on the website below (only available in Japanese). Please review the information in advance.<NL/><L_NCJP/><TAG9/><NL/><TAG10/>You can change this setting at any time from <0xE130/> (System Settings) ⇒ System on the HOME Menu.<TAG11/>"
  target: "<TAG1/><TAG2/>Κωδικός σφάλματος: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Το λογισμικό χρειάστηκε να κλείσει λόγω σφάλματος.<TAG7/><NL/>Επιτρέπετε στη <L_N10/> να κοινοποιεί πληροφορίες σφαλμάτων αυτής της κονσόλας σε τρίτους προγραμματιστές των οποίων το λογισμικό κατέρρευσε, για ανάλυση και βελτίωση;<TAG8/><NL/>Πληροφορίες για τους διεθνείς προορισμούς κοινοποίησης δεδομένων και την προστασία προσωπικών δεδομένων δημοσιεύονται στον παρακάτω ιστότοπο, μόνο στα ιαπωνικά. Διαβάστε τις προτού αποφασίσετε.<NL/><L_NCJP/><TAG9/><NL/><TAG10/>Μπορείτε να αλλάξετε τη ρύθμιση οποτεδήποτε από <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Σύστημα στο μενού HOME.<TAG11/>"
- source: "<TAG1/><TAG2/>Error Code: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>To continue on this system, close any software being used on another system by a user linked to this <L_N10/> Account.<NL/><NL/>Alternatively, you can play the software on this system without closing it elsewhere by following the steps below:<NL/><TAG7/><L_ROMB/> Some <L_DLC/> will be unavailable if you start the software this way.<TAG8/><TAG9/><NL/>1. <TAG10/>Go to the HOME Menu, highlight the software, and press <TAG11/> to<L_XA0/>close the software.<TAG12/><NL/>2. <TAG13/>Press and hold <TAG14/>, and then press <TAG15/> to restart the software.<TAG16/>"
  target: "<TAG1/><TAG2/>Κωδικός σφάλματος: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Για να συνεχίσετε εδώ, κλείστε κάθε λογισμικό που χρησιμοποιείται σε άλλο σύστημα από χρήστη συνδεδεμένο με αυτόν τον λογαριασμό <L_N10/>.<NL/><NL/>Εναλλακτικά, μπορείτε να παίξετε εδώ χωρίς να το κλείσετε αλλού, ακολουθώντας τα παρακάτω βήματα:<NL/><TAG7/><L_ROMB/> Μέρος του <L_DLC/> δεν θα είναι διαθέσιμο αν ξεκινήσετε έτσι.<TAG8/><TAG9/><NL/>1. <TAG10/>Στο μενού HOME, επισημάνετε το λογισμικό και πατήστε <TAG11/> για να<L_XA0/>το κλείσετε.<TAG12/><NL/>2. <TAG13/>Κρατήστε πατημένο το <TAG14/> και πατήστε <TAG15/> για επανεκκίνηση του λογισμικού.<TAG16/>"
