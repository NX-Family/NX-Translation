  target: "Να σταλούν αρχεία σφαλμάτων και στοιχεία ρυθμίσεων συστήματος στη <L_N10/>;<TAG1/><NL/><TAG2/><TAG3/>Αυτά μπορεί να κοινοποιηθούν σε τρίτους δημιουργούς των οποίων το λογισμικό κατέρρευσε, για ανάλυση και βελτίωση. Πληροφορίες για διεθνείς προορισμούς κοινοποίησης δεδομένων και προστασία προσωπικών δεδομένων υπάρχουν στον παρακάτω ιστότοπο, μόνο στα ιαπωνικά. Δείτε τις εκ των προτέρων.<NL/>https://www.<L_UCOM/>/jp/privacy/crossborder/<TAG4/><TAG5/>"
