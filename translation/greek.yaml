- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Α, δεν μπορείτε να αλλάξετε τη φωτεινότητα της οθόνης όταν είστε συνδεδεμένοι σε τηλεόραση.<NL/>Για ασύρματες ρυθμίσεις, ανοίξτε το μενού HOME και επιλέξτε <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Λειτουργία πτήσης.<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N."
