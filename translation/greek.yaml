- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Οι ρυθμίσεις αυτόματης λήψης είναι ξεχωριστές για κάθε κονσόλα.<NL/><TAG1/><TAG2/>Για αυτόματη λήψη δεδομένων αποθήκευσης σε άλλη κονσόλα, πρέπει να αλλάξετε τις ρυθμίσεις σε εκείνη την κονσόλα. Για<TAG3/><TAG4/> αλλαγή, επιλέξτε <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Διαχείριση δεδομένων ⇒ Αποθήκευση στο cloud από το μενού HOME.<TAG5/><TAG6/>"
- source: "Automatic save-data backups are currently paused.<NL/>Select an option below to resume automatic backups."
  target: "Η αυτόματη δημιουργία αντιγράφων αποθηκεύσεων έχει παύσει.<NL/>Επιλέξτε παρακάτω για να συνεχιστεί αυτόματα."
- source: "Automatic save-data download has been enabled on this console.<TAG1/><NL/>This does not change the settings on other consoles.<NL/>To change settings on other consoles, you will need<NL/>to do so separately on each individual console."
  target: "Η αυτόματη λήψη αποθηκευμένων δεδομένων έχει ενεργοποιηθεί σε αυτήν την κονσόλα.<TAG1/><NL/>Αυτό δεν αλλάζει τις ρυθμίσεις σε άλλες κονσόλες.<NL/>Για να αλλάξετε τις ρυθμίσεις σε άλλες κονσόλες, θα πρέπει<NL/>να το κάνετε ξεχωριστά σε κάθε μια από αυτές."
- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Ενεργοποιήθηκε η αυτόματη λήψη δεδομένων αποθήκευσης.<TAG1/><NL/><L_DOT1/><TAG2/>Η πρώτη λήψη πρέπει να γίνει χειροκίνητα.<TAG3/><NL/><L_DOT1/><TAG4/>Για να ενεργοποιήσετε τη λειτουργία σε άλλες κονσόλες, αλλάξτε τις ρυθμίσεις σε καθεμία.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>Μπορείτε να αλλάξετε τις ρυθμίσεις από <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Διαχείριση δεδομένων ⇒ Αποθήκευση στο cloud στο μενού HOME.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Η αυτόματη λήψη δεδομένων αποθήκευσης δεν γίνεται πάντα αμέσως.<NL/><TAG1/><TAG2/>Για να παίξετε αμέσως σε άλλη κονσόλα με τα ίδια δεδομένα αποθήκευσης, δημιουργήστε χειροκίνητα αντίγραφο ασφαλείας και κατεβάστε το χειροκίνητα όπου θέλετε.<TAG3/><TAG4/>"
- source: "Automatic save-data downloads are currently paused.<NL/>Select an option below to resume automatic downloads."
  target: "Οι αυτόματες λήψεις αποθηκεύσεων έχουν παύσει.<NL/>Επιλέξτε παρακάτω για να συνεχιστούν."
