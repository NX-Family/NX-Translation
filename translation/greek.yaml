- source: "Data on this <L_MSD/> card is corrupted and cannot be used.<TAG1/><NL/>The corrupted data will be deleted.<TAG2/><NL/><TAG3/>The console will restart after deleting the data.<NL/>(This will close suspended software.)<NL/>Save data, screenshots, videos and other non-<L_NS/> data won't be deleted. You can remove the <L_MSD/> card if you don't want to use it on this console.<TAG4/>"
  target: "Τα δεδομένα σε αυτή την κάρτα <L_MSD/> είναι κατεστραμμένα και δεν μπορούν να χρησιμοποιηθούν.<TAG1/><NL/>Τα κατεστραμμένα δεδομένα θα διαγραφούν.<TAG2/><NL/><TAG3/>Η κονσόλα θα επανεκκινηθεί μετά τη διαγραφή.<NL/>(Το λογισμικό σε αναστολή θα κλείσει.)<NL/>Τα δεδομένα αποθήκευσης, τα στιγμιότυπα οθόνης, τα βίντεο και άλλα δεδομένα που δεν ανήκουν στο <L_NS/> δεν θα διαγραφούν. Μπορείτε να αφαιρέσετε την κάρτα <L_MSD/> αν δεν θέλετε να τη χρησιμοποιήσετε σε αυτή την κονσόλα.<TAG4/>"
