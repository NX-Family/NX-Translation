- source: "\"Download Complete\" Notifications"
  target: "Ειδοποιήσεις \"Η λήψη ολοκληρώθηκε\""
- source: "\"Man, if only there was one place to go and find answers to all my questions about <L_NS/>!\"<NL/><NL/>That's what I was saying yesterday. Luckily, I guess a passing genie heard me and granted my wish, because I found the <L_N10/> Support Website!<NL/>It's got all kinds of super-detailed info on how to use the console, plus the latest on getting system updates and new features! Just enter the URL in your PC or smart device if you've got questions. Go check it out! <NL/>"
  target: "\"Μακάρι να υπήρχε ένα μέρος με απαντήσεις σε όλες τις απορίες μου για το <L_NS/>!\"<NL/><NL/>Αυτό έλεγα χθες. Ευτυχώς, μάλλον με άκουσε ένα περαστικό τζίνι και έκανε την ευχή μου πραγματικότητα, γιατί βρήκα τον ιστότοπο υποστήριξης της <L_N10/>!<NL/>Έχει αναλυτικές πληροφορίες για τη χρήση της κονσόλας, αλλά και τα τελευταία νέα για ενημερώσεις συστήματος και νέες λειτουργίες! Αν έχετε απορίες, πληκτρολογήστε το URL στον υπολογιστή ή την έξυπνη συσκευή σας. Ρίξτε μια ματιά! <NL/>"
- source: "(Gameplay restrictions only)"
  target: "(Μόνο περιορισμοί παιχνιδιού)"
- source: "(Hold)"
  target: "(Κρατήστε)"
- source: "(Oh, and when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. The game card slot is kind of hidden too. Check the top right of the screen!<NL/>"
  target: "(Α, και για να βγάλετε την κάρτα <L_MSD/>, πιέστε την μέχρι να ακούσετε το κλικ και μετά τραβήξτε την έξω. Το ίδιο όταν την τοποθετείτε ξανά, πιέστε μέχρι να ακουστεί το κλικ.)<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N.<NL/><NL/>Υ.Γ. Και η υποδοχή κάρτας παιχνιδιού είναι κάπως κρυμμένη. Κοιτάξτε πάνω δεξιά στην οθόνη!<NL/>"
- source: "(Oh, but be sure to turn the console off when you remove or insert a <L_MSD/> card.)<NL/><NL/>(Oh, oh! And when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming!<NL/>Amelia N.<NL/><NL/>P.S. If you're not sure what kind of SD card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" They should be able to take care of you."
  target: "(Α, αλλά φροντίστε να σβήνετε την κονσόλα όταν αφαιρείτε ή τοποθετείτε μια κάρτα <L_MSD/>.)<NL/><NL/>(Α, και κάτι ακόμα! Για να βγάλετε την κάρτα <L_MSD/>, πιέστε την μέχρι να ακουστεί το κλικ και μετά τραβήξτε την έξω. Το ίδιο όταν την τοποθετείτε ξανά, πιέστε μέχρι να ακουστεί το κλικ.)<NL/><NL/>Καλό παιχνίδι!<NL/>Amelia N.<NL/><NL/>Υ.Γ. Αν δεν ξέρετε τι κάρτα SD να αγοράσετε, ζητήστε \"<L_UHSI/> ή ανώτερη προδιαγραφή για κάρτα <L_MSD/>\". Θα μπορέσουν να σας βοηθήσουν."
- source: "*This feature is available with compatible software.<NL/><NL/>P.S. If you're not sure what kind of <L_MSD/> card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" The folks at the store should know what you mean.<NL/><NL/>"
  target: "*Αυτή η λειτουργία διατίθεται σε συμβατό λογισμικό.<NL/><NL/>Υ.Γ. Αν δεν ξέρετε τι κάρτα <L_MSD/> να αγοράσετε, ζητήστε \"<L_UHSI/> ή ανώτερη προδιαγραφή για κάρτα <L_MSD/>\". Στο κατάστημα θα καταλάβουν τι εννοείτε.<NL/><NL/>"
