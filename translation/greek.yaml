- source: "Animal Crossing: New Horizons save data cannot be transferred using the save-data transfer feature.<NL/><TAG1/><TAG2/>The save data for other software can still be sent.<TAG3/><TAG4/><TAG5/><NL/>Visit the <L_N10/> Support website for information on how to transfer Animal Crossing: New Horizons save data.<NL/><TAG6/>"
  target: "Οι αποθηκεύσεις Animal Crossing: New Horizons δεν μεταφέρονται με τη λειτουργία μεταφοράς αποθηκεύσεων.<NL/><TAG1/><TAG2/>Αποθηκεύσεις άλλου λογισμικού μεταφέρονται.<TAG3/><TAG4/><TAG5/><NL/>Δείτε τον ιστότοπο υποστήριξης <L_N10/> για τη μεταφορά αποθηκεύσεων Animal Crossing: New Horizons.<NL/><TAG6/>"
- source: "Another device on this network has the same IP address as this console.<TAG1/><NL/>Please try again later.<TAG2/><NL/>If the problem persists, please try the following:<NL/><L_DOT1/><TAG3/>Make sure the IP address is correct.<TAG4/><NL/><L_DOT1/><TAG5/>If you manually set the IP address, make sure the address you were given by your network operator is correct.<TAG6/><NL/><L_DOT1/><TAG7/>Make sure other devices on the network do not use this console's IP address.<TAG8/>"
  target: "Μια άλλη συσκευή σε αυτό το δίκτυο έχει την ίδια διεύθυνση IP με αυτήν την κονσόλα.<TAG1/><NL/>Παρακαλώ δοκιμάστε ξανά αργότερα.<TAG2/><NL/>Εάν το πρόβλημα παραμένει, δοκιμάστε τα εξής:<NL/><L_DOT1/><TAG3/>Βεβαιωθείτε ότι η διεύθυνση IP είναι σωστή.<TAG4/><NL/><L_DOT1/><TAG5/>Εάν ορίσετε μη αυτόματα τη διεύθυνση IP, βεβαιωθείτε ότι η διεύθυνση που σας δόθηκε από το χειριστή του δικτύου σας είναι σωστή.<TAG6/><NL/><L_DOT1/><TAG7/>Βεβαιωθείτε ότι άλλες συσκευές στο δίκτυο δεν χρησιμοποιούν τη διεύθυνση IP αυτής της κονσόλας.<TAG8/>"
- source: "Another device on this network has the same<NL/>IP address as this console.<TAG1/><NL/>Please try again later."
  target: "Μια άλλη συσκευή σε αυτό το δίκτυο έχει την ίδια<NL/>διεύθυνση IP με αυτή την κονσόλα.<TAG1/><NL/>Δοκιμάστε ξανά αργότερα."
