  target: "Η σύνδεση με το χειριστήριο χάθηκε."
- source: "The connection with the controller has been lost.<NL/><TAG1/><TAG2/>Press a button on the controller you want to use.<TAG3/><TAG4/>"
  target: "Η σύνδεση με το χειριστήριο χάθηκε.<NL/><TAG1/><TAG2/>Πατήστε ένα κουμπί στο χειριστήριο που θέλετε να χρησιμοποιήσετε.<TAG3/><TAG4/>"
