- source: "This will restrict gameplay in VR mode.<TAG1/><NL/>Set this option to Restricted if a child of 6 years or younger uses this console.<TAG2/><NL/>Visit the <L_N10/> Support website for more information about VR mode.<NL/><TAG3/>"
  target: "Θα περιοριστεί το παιχνίδι σε λειτουργία VR.<TAG1/><NL/>Επιλέξτε Περιορισμένο αν παιδί έως 6 ετών χρησιμοποιεί την κονσόλα.<TAG2/><NL/>Δείτε τον ιστότοπο υποστήριξης της <L_N10/> για πληροφορίες για τη λειτουργία VR.<NL/><TAG3/>"
