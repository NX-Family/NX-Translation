- source: "If the player LEDs don't light up when you press a button, the controller is out of battery power. Charge the battery to use it."
  target: "Αν οι ενδείξεις LED παικτών δεν ανάβουν όταν πατάτε κουμπί, η μπαταρία του χειριστηρίου έχει αδειάσει. Φορτίστε την για να το χρησιμοποιήσετε."
- source: "If the problem is still not solved, please check the contact information on the <L_N10/> Support website."
  target: "Αν το πρόβλημα παραμένει, δείτε τα στοιχεία επικοινωνίας στον ιστότοπο υποστήριξης της <L_N10/>."
- source: "If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Αν το πρόβλημα επιμένει, ανατρέξτε στον ιστότοπο υποστήριξης της <L_N10/>.<NL/><L_SNCE/>"
- source: "If the problem still occurs, try redownloading the software."
  target: "Εάν το πρόβλημα εξακολουθεί να υπάρχει, δοκιμάστε να ξανακατεβάσετε το λογισμικό."
- source: "If the selected button is mapped to one of the options below,<NL/>it is recommended that you use dual-controller grip."
  target: "Αν το επιλεγμένο κουμπί αντιστοιχεί σε μία από τις παρακάτω επιλογές,<NL/>συνιστάται λαβή με δύο χειριστήρια."
- source: "If this option is enabled, downloads initiated from your PC or smartphone will start right away, even when the console is in sleep mode. Disabling this option will reduce the console's energy consumption during sleep mode while connected to the Internet.<TAG1/><NL/><L_ROMB/> <TAG2/>This will have an effect only when connected to the Internet via wired connection.<TAG3/>"
  target: "Εάν αυτή η επιλογή είναι ενεργοποιημένη, οι λήψεις που ξεκινούν από τον υπολογιστή ή το smartphone σας θα ξεκινούν αμέσως, ακόμα και όταν η κονσόλα είναι σε κατάσταση αναμονής. Η απενεργοποίηση αυτής της επιλογής θα μειώσει την κατανάλωση ενέργειας της κονσόλας κατά τη διάρκεια της κατάστασης αναμονής όταν είναι συνδεδεμένη στο διαδίκτυο.<TAG1/><NL/><L_ROMB/> <TAG2/>Αυτό θα έχει επίδραση μόνο όταν είναι συνδεδεμένη στο διαδίκτυο μέσω ενσύρματης σύνδεσης.<TAG3/>"
- source: "If this option is enabled, the <L_NS/> <L_PRO/> will communicate with the console via wired communication when connected to it using the USB charging cable. The <L_NFC/> touchpoint on the <L_PRO/> will be disabled while the controller is using wired communication."
  target: "Εάν αυτή η επιλογή είναι ενεργοποιημένη, το <L_NS/> <L_PRO/> θα επικοινωνεί με την κονσόλα μέσω ενσύρματης επικοινωνίας όταν είναι συνδεδεμένο με το καλώδιο φόρτισης USB. Το σημείο αφής <L_NFC/> στο <L_PRO/> θα είναι απενεργοποιημένο ενώ το χειριστήριο χρησιμοποιεί ενσύρματη επικοινωνία."
- source: "If this option is enabled, the console will wake from sleep mode when it is removed from the dock."
  target: "Εάν αυτή η επιλογή είναι ενεργοποιημένη, η κονσόλα θα ξυπνά από την κατάσταση αναμονής όταν αφαιρεθεί από τη βάση."
- source: "If this user is not selected in-game, he or she will be displayed as offline even if you are connected to the Internet."
  target: "Εάν αυτός ο χρήστης δεν είναι επιλεγμένος στο παιχνίδι, θα εμφανίζεται ως εκτός σύνδεσης ακόμα κι αν είστε συνδεδεμένοι στο διαδίκτυο."
- source: "If you are using the <L_NS/> Parental Controls app, you can exclude this software title from certain restrictions by adding it to a whitelist for the <L_NS/> console.<NL/><TAG1/><TAG2/>Whitelist settings can be changed in the <L_NS/> Parental Controls app by selecting Parental Controls ⇒ Restricted Features ⇒ Allow List.<TAG3/><TAG4/>"
  target: "Αν χρησιμοποιείτε την εφαρμογή <L_NS/> Parental Controls, μπορείτε να εξαιρέσετε αυτό το λογισμικό από ορισμένους περιορισμούς προσθέτοντάς το στη λίστα επιτρεπόμενων της κονσόλας <L_NS/>.<NL/><TAG1/><TAG2/>Αλλάξτε τη λίστα στην εφαρμογή <L_NS/> Parental Controls από Γονικός έλεγχος ⇒ Περιορισμένες λειτουργίες ⇒ Λίστα επιτρεπόμενων.<TAG3/><TAG4/>"
- source: "If you are using the <L_NS/> Parental Controls app, you can exclude this software title from certain restrictions by adding it to the allow list for the <L_NS/> console.<NL/><TAG1/><TAG2/>Allow-list settings can be changed in the <L_NS/> Parental Controls app by selecting Parental Controls ⇒ Restricted Features ⇒ Allow List.<TAG3/><TAG4/>"
  target: "Αν χρησιμοποιείτε την εφαρμογή <L_NS/> Parental Controls, μπορείτε να εξαιρέσετε αυτό το λογισμικό από ορισμένους περιορισμούς προσθέτοντάς το στη λίστα επιτρεπόμενων της κονσόλας <L_NS/>.<NL/><TAG1/><TAG2/>Αλλάξτε τη λίστα στην εφαρμογή <L_NS/> Parental Controls από Γονικός έλεγχος ⇒ Περιορισμένες λειτουργίες ⇒ Λίστα επιτρεπόμενων.<TAG3/><TAG4/>"
- source: "If you cannot connect to your network, please visit the <L_N10/> Support website.<NL/><L_SNC/>"
  target: "Αν δεν συνδέεστε στο δίκτυό σας, δείτε τον ιστότοπο υποστήριξης της <L_N10/>.<NL/><L_SNC/>"
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen."
  target: "Αν εισάγετε το PIN με το αριθμητικό πληκτρολόγιο, βεβαιωθείτε ότι οι γύρω σας δεν μπορούν να δουν την οθόνη."
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen.<NL/><TAG1/><TAG2/>If you are using the console in TV mode, removing the console from the dock will allow you to enter your PIN without it being displayed on the TV.<TAG3/><TAG4/>"
  target: "Αν εισάγετε το PIN με το αριθμητικό πληκτρολόγιο, βεβαιωθείτε ότι οι γύρω σας δεν μπορούν να δουν την οθόνη.<NL/><TAG1/><TAG2/>Αν η κονσόλα είναι σε λειτουργία τηλεόρασης, αφαιρέστε την από τη βάση για να εισαγάγετε το PIN χωρίς να εμφανίζεται στην τηλεόραση.<TAG3/><TAG4/>"
- source: "If you don't use the button above, just select <0xE133/> from the HOME Menu to visit <L_NEP/> any old time.<NL/><NL/>Oh! And you can also search in <L_NEP/> with different filters to find exactly what you're looking for.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Εάν δεν χρησιμοποιείτε το παραπάνω κουμπί, απλά επιλέξτε <0xE133/> από το μενού HOME για να επισκεφθείτε <L_NEP/> οποιαδήποτε στιγμή.<NL/><NL/>Ω! Και μπορείτε επίσης να αναζητήσετε στο <L_NEP/> με διάφορα φίλτρα για να βρείτε ακριβώς αυτό που ψάχνετε.<NL/><NL/>Καλό παιχνίδι,<NL/>Amelia N."
- source: "If you enable automatic backup, save data will be automatically backed up, even while the console is in sleep mode or after the software has been closed.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Αν ενεργοποιήσετε τα αυτόματα αντίγραφα ασφαλείας, θα δημιουργούνται αυτόματα αντίγραφα των δεδομένων αποθήκευσης, ακόμα και σε αναμονή ή αφού κλείσει το λογισμικό.<NL/><TAG1/><TAG2/>Ορισμένο λογισμικό δεν υποστηρίζει αυτή τη λειτουργία.<TAG3/><TAG4/>"
- source: "If you enable automatic download, save data will automatically download to this console whenever the save data stored via the Save Data Cloud service is updated from another console. The save data on this console will be overwritten with the data from the server.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Αν ενεργοποιήσετε την αυτόματη λήψη, τα δεδομένα αποθήκευσης θα λαμβάνονται αυτόματα εδώ όταν ενημερώνονται από άλλη κονσόλα στην υπηρεσία Αποθήκευση στο cloud. Τα δεδομένα αποθήκευσης αυτής της κονσόλας θα αντικαθίστανται από τα δεδομένα του διακομιστή.<TAG1/><NL/><TAG2/>Η πρώτη λήψη πρέπει να γίνει χειροκίνητα.<TAG3/>"
- source: "If you enable automatic download, you can easily pick up playing where you left off on another console.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Εάν ενεργοποιήσετε την αυτόματη λήψη, μπορείτε εύκολα να συνεχίσετε το παιχνίδι από το σημείο που το αφήσατε σε μια άλλη κονσόλα.<TAG1/><NL/><TAG2/>Η αρχική λήψη πρέπει να γίνει χειροκίνητα.<TAG3/>"
- source: "If you enter the incorrect PIN <TAG1/><LIST1/>, you<NL/>will have to wait a while before attempting to enter it again."
  target: "Αν εισαγάγετε λάθος PIN <TAG1/><LIST1/>, θα<NL/>πρέπει να περιμένετε λίγο πριν το εισαγάγετε ξανά."
- source: "If you forget your PIN, you can reset it by signing in to your <L_N10/> Account."
  target: "Αν ξεχάσετε το PIN, μπορείτε να το επαναφέρετε κάνοντας είσοδο στον λογαριασμό <L_N10/> σας."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/> system, you can use it to download your data from the server."
  target: "Αν αποκτήσετε σύστημα <L_N10/> <TAG1/><L_SWT2/><TAG2/>, μπορείτε να κατεβάσετε σε αυτό τα δεδομένα σας από τον διακομιστή."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
  target: "Αν αποκτήσετε <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
- source: "If you have existing user data on another system, you can copy or transfer it to this system. Otherwise, create a new user."
  target: "Εάν έχετε υπάρχοντα δεδομένα χρήστη σε άλλο σύστημα, μπορείτε να τα αντιγράψετε ή να τα μεταφέρετε σε αυτό το σύστημα. Διαφορετικά, δημιουργήστε ένα νέο χρήστη."
- source: "If you have two systems, you can choose which system to play on by moving virtual game cards between them."
  target: "Αν έχετε δύο συστήματα, μπορείτε να επιλέγετε πού θα παίζετε μετακινώντας τις εικονικές κάρτες παιχνιδιού μεταξύ τους."
- source: "If you link to a <L_N10/> Account, you can use various online features."
  target: "Αν συνδέσετε λογαριασμό <L_N10/>, μπορείτε να χρησιμοποιείτε διάφορες διαδικτυακές λειτουργίες."
- source: "If you link to a <L_N10/> Account, you will see users who may want to become friends with you."
  target: "Αν συνδέσετε λογαριασμό <L_N10/>, θα δείτε χρήστες που ίσως θέλουν να γίνουν φίλοι σας."
- source: "If you plan to keep using this system, stop here.<NL/>Once data is uploaded to the server, this system will be initialized."
  target: "Αν σκοπεύετε να συνεχίσετε να χρησιμοποιείτε αυτό το σύστημα, σταματήστε εδώ.<NL/>Μόλις σταλούν τα δεδομένα στον διακομιστή, το σύστημα θα αρχικοποιηθεί."
- source: "If you plugged the AC<NL/>adapter into the console<NL/>earlier, disconnect it."
  target: "Αν συνδέσατε νωρίτερα<NL/>το τροφοδοτικό στην κονσόλα,<NL/>αποσυνδέστε το."
- source: "If you turn Airplane Mode on, you will no<NL/>longer be able to use wireless controllers."
  target: "Αν ενεργοποιήσετε τη Λειτουργία πτήσης, δεν θα μπορείτε<NL/>να χρησιμοποιείτε ασύρματα χειριστήρια."
- source: "If you update and are still unable to use downloadable content or an upgrade pack, load the virtual game card from <0xE13D/> (Virtual Game Cards) on the HOME Menu."
  target: "Αν μετά την ενημέρωση δεν μπορείτε να χρησιμοποιήσετε πρόσθετο περιεχόμενο ή πακέτο αναβάθμισης, φορτώστε την εικονική κάρτα παιχνιδιού από <0xE13D/> (Εικονικές κάρτες παιχνιδιού) στο μενού HOME."
- source: "If you'd rather download data for a specific user at a later time, uncheck that user. To download the data, go to the <TAG1/>HOME Menu<TAG2/> and open the Options menu for the software, then select <TAG3/>Save Data Cloud<TAG4/>."
  target: "Για να κατεβάσετε αργότερα τα δεδομένα ενός χρήστη, αποεπιλέξτε τον. Για λήψη, μεταβείτε στο <TAG1/>μενού HOME<TAG2/>, ανοίξτε τις Επιλογές του λογισμικού και επιλέξτε <TAG3/>Αποθήκευση στο cloud<TAG4/>."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Αν δεν έχετε βάλει ποτέ κάρτα <L_MSD/> στην κονσόλα, κοιτάξτε γύρω της και προσπαθήστε να βρείτε την υποδοχή. Είναι λίγο κρυμμένη. <NL/><NL/>Τα παρατάτε; Μια βοήθεια: έχετε χρησιμοποιήσει το στήριγμα πίσω από την κονσόλα; <NL/><NL/>Ανοίξτε το και θα ξετρυπώσετε την κρυψώνα της! Μπορείτε να αγοράσετε κάρτα <L_MSD/> αν φοβάστε μήπως μείνετε από χώρο για λογισμικό, <L_DLC/> και άλλα."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand, and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Αν δεν έχετε βάλει ποτέ κάρτα <L_MSD/> στην κονσόλα, κοιτάξτε γύρω της και προσπαθήστε να βρείτε την υποδοχή. Είναι λίγο κρυμμένη. <NL/><NL/>Τα παρατάτε; Μια βοήθεια: έχετε χρησιμοποιήσει το στήριγμα πίσω από την κονσόλα; <NL/><NL/>Ανοίξτε το και θα ξετρυπώσετε την κρυψώνα της! Μπορείτε να αγοράσετε κάρτα <L_MSD/> αν φοβάστε μήπως μείνετε από χώρο για λογισμικό, <L_DLC/> και άλλα."
- source: "If your save data is backed up, the save data for supported software on your console has been stored via the Save Data Cloud service.<TAG1/><NL/>If your data is waiting to back up, the save data on your console will be automatically stored via the Save Data Cloud service once the console enters sleep mode, provided it is connected to the Internet.<TAG2/><NL/>Select a user to view more details or manually back up or download data."
  target: "Αν έχει δημιουργηθεί αντίγραφο ασφαλείας, τα δεδομένα αποθήκευσης του συμβατού λογισμικού στην κονσόλα σας έχουν αποθηκευτεί στην υπηρεσία Αποθήκευση στο cloud.<TAG1/><NL/>Αν εκκρεμεί το αντίγραφο, τα δεδομένα αποθήκευσης θα αποθηκευτούν αυτόματα στην υπηρεσία Αποθήκευση στο cloud μόλις η κονσόλα μπει σε αναμονή, εφόσον είναι συνδεδεμένη στο διαδίκτυο.<TAG2/><NL/>Επιλέξτε χρήστη για λεπτομέρειες ή για χειροκίνητη δημιουργία αντιγράφου ασφαλείας ή λήψη δεδομένων."
- source: "If your virtual game cards are not appearing, open the HOME Menu and select <0xE13D/> (Virtual Game Cards)."
  target: "Εάν οι εικονικές κάρτες παιχνιδιού σας δεν εμφανίζονται, ανοίξτε το μενού HOME και επιλέξτε <0xE13D/> (Εικονικές κάρτες παιχνιδιού)."
