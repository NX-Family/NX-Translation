  target: "Δείτε τον ιστότοπο υποστήριξης της <L_N10/> για λεπτομέρειες.<NL/><TAG1/><TAG2/>Υπάρχουν επίσης πληροφορίες για:<NL/><L_DOT1/><TAG3/>Χρήση λογισμικού χωρίς φόρτωση εικονικής κάρτας παιχνιδιού.<TAG4/><NL/><L_DOT1/><TAG5/>Αποσύνδεση συστήματος.<TAG6/><TAG7/><TAG8/>"
