  target: "Αμερική"
- source: "The Game Trials period for this software has ended."
  target: "Η περίοδος δοκιμής αυτού του λογισμικού έληξε."
- source: "The Game Trials period for this software has ended.<NL/>To continue playing, you can purchase the software and pick up where you left off."
  target: "Η περίοδος δοκιμής του παιχνιδιού για αυτό το λογισμικό έχει λήξει.<NL/>Για να συνεχίσετε το παιχνίδι, μπορείτε να αγοράσετε το λογισμικό και να συνεχίσετε από εκεί που σταματήσατε."
- source: "The Game Trials period for this software will begin <TAG1/><TAG2/><NL/>Do you want to visit <L_NEP/> to learn more?"
  target: "Η περίοδος δοκιμής του παιχνιδιού για αυτό το λογισμικό θα ξεκινήσει <TAG1/><TAG2/><NL/>Θέλετε να επισκεφθείτε το <L_NEP/> για να μάθετε περισσότερα;"
- source: "The Internet connection was lost.<TAG1/><NL/>Please check that the LAN cable and LAN adapter are connected properly."
  target: "Η σύνδεση στο Διαδίκτυο χάθηκε.<TAG1/><NL/>Ελέγξτε ότι το καλώδιο LAN και ο προσαρμογέας LAN είναι συνδεδεμένα σωστά."
- source: "The Internet connection was lost.<TAG1/><NL/>Please try again near to the network device.<TAG2/><NL/>If the console is close to the network device, then the wireless signal strength may be poor. Please try the following:<NL/><L_DOT1/><TAG3/>Move the console closer to the network device.<TAG4/><NL/><L_DOT1/><TAG5/>Remove any obstacles between the network device and the console.<TAG6/>"
  target: "Η σύνδεση στο Διαδίκτυο χάθηκε.<TAG1/><NL/>Δοκιμάστε ξανά κοντά στη συσκευή δικτύου.<TAG2/><NL/>Εάν η κονσόλα βρίσκεται κοντά στη συσκευή δικτύου, τότε η ισχύς του ασύρματου σήματος μπορεί να είναι κακή. Δοκιμάστε τα εξής:<NL/><L_DOT1/><TAG3/>Μετακινήστε την κονσόλα πιο κοντά στη συσκευή δικτύου.<TAG4/><NL/><L_DOT1/><TAG5/>Αφαιρέστε τυχόν εμπόδια μεταξύ της συσκευής δικτύου και της κονσόλας.<TAG6/>"
- source: "The Internet connection was lost.<TAG1/><NL/>The IP address could not be updated.<TAG2/><NL/>Please try again later.<TAG3/><NL/>If the problem persists, check if there is any problem with the network you are connecting to."
  target: "Η σύνδεση στο Διαδίκτυο χάθηκε.<TAG1/><NL/>Δεν ήταν δυνατή η ενημέρωση της διεύθυνσης IP.<TAG2/><NL/>Παρακαλώ δοκιμάστε ξανά αργότερα.<TAG3/><NL/>Εάν το πρόβλημα παραμένει, ελέγξτε εάν υπάρχει κάποιο πρόβλημα με το δίκτυο στο οποίο συνδέεστε."
- source: "The Latest News, Direct to Your <L_NS/>!"
  target: "Τα τελευταία νέα απευθείας στο <L_NS/> σας!"
- source: "The PIN has been changed."
  target: "Το PIN άλλαξε."
- source: "The Parental Controls PIN is required."
  target: "Απαιτείται το PIN γονικού ελέγχου."
- source: "The Software Rating Organization setting establishes the body whose rating standards apply to your software. Please select the appropriate rating organization for your region."
  target: "Η ρύθμιση του Οργανισμού Αξιολόγησης Λογισμικού καθορίζει τον φορέα των προτύπων αξιολόγησης που ισχύουν για το λογισμικό σας. Επιλέξτε τον κατάλληλο οργανισμό αξιολόγησης για την περιοχή σας."
- source: "The action has been canceled."
  target: "Η ενέργεια ακυρώθηκε."
- source: "The backup save data has been deleted."
  target: "Το αντίγραφο δεδομένων αποθήκευσης διαγράφηκε."
- source: "The backup save data stored via the Save Data Cloud service will be overwritten.<TAG1/><NL/>Overwritten save data cannot be recovered. Are you sure you want to overwrite your stored data?<TAG2/><NL/><TAG3/><TAG4/>In-game progress, including purchased items, could be lost.<TAG5/><TAG6/>"
  target: "Το αντίγραφο δεδομένων αποθήκευσης στην υπηρεσία Αποθήκευση στο cloud θα αντικατασταθεί.<TAG1/><NL/>Τα δεδομένα που αντικαθίστανται δεν ανακτώνται. Θέλετε σίγουρα να τα αντικαταστήσετε;<TAG2/><NL/><TAG3/><TAG4/>Μπορεί να χαθεί πρόοδος παιχνιδιού, μαζί με αγορασμένα αντικείμενα.<TAG5/><TAG6/>"
- source: "The certificate cannot be trusted."
  target: "Το πιστοποιητικό δεν είναι αξιόπιστο."
- source: "The certificate chain is too long."
  target: "Η αλυσίδα πιστοποιητικών είναι πολύ μεγάλη."
- source: "The certificate either has expired or is not yet valid.<NL/>Please make sure this system's date and time settings are correct."
  target: "Το πιστοποιητικό έληξε ή δεν ισχύει ακόμη.<NL/>Ελέγξτε ότι η ημερομηνία και ώρα της κονσόλας είναι σωστές."
- source: "The certificate has expired."
  target: "Το πιστοποιητικό έχει λήξει."
- source: "The certificate is too low in the certification hierarchy."
  target: "Το πιστοποιητικό είναι πολύ χαμηλό στην ιεραρχία πιστοποίησης."
- source: "The computer can display 11,000 screenshots or 1,100 videos at maximum."
  target: "Ο υπολογιστής εμφανίζει έως 11.000 στιγμιότυπα οθόνης ή 1.100 βίντεο."
- source: "The connected controller's button mapping changed.<NL/><TAG1/><TAG2/>You can use the Reset Button Mapping function to restore the default mapping. If you are unable to use the controller, try using the touch screen instead.<TAG3/><TAG4/>"
  target: "Άλλαξε η αντιστοίχιση κουμπιών του συνδεδεμένου χειριστηρίου.<NL/><TAG1/><TAG2/>Επιλέξτε Επαναφορά αντιστοίχισης κουμπιών για επαναφορά της προεπιλεγμένης αντιστοίχισης. Αν δεν μπορείτε να χρησιμοποιήσετε το χειριστήριο, δοκιμάστε την οθόνη αφής.<TAG3/><TAG4/>"
- source: "The connection to the other console was lost."
  target: "Η σύνδεση με την άλλη κονσόλα χάθηκε."
- source: "The connection to the other console was lost.<TAG1/><NL/>The problem may be solved by improving the signal strength in the following ways:<NL/><L_DOT1/><TAG2/>Move the consoles closer together.<TAG3/><NL/><L_DOT1/><TAG4/>Remove any obstacles between the consoles.<TAG5/>"
  target: "Η σύνδεση με την άλλη κονσόλα χάθηκε.<TAG1/><NL/>Το πρόβλημα μπορεί να λυθεί βελτιώνοντας την ισχύ του σήματος με τους ακόλουθους τρόπους:<NL/><L_DOT1/><TAG2/>Μετακινήστε τις κονσόλες πιο κοντά μεταξύ τους.<TAG3/><NL/><L_DOT1/><TAG4/>Αφαιρέστε τυχόν εμπόδια ανάμεσα στις κονσόλες.<TAG5/>"
- source: "The connection to the server has timed out due to user inactivity.<TAG1/><NL/>Please try again."
  target: "Η σύνδεση με τον διακομιστή έληξε λόγω αδράνειας χρήστη.<TAG1/><NL/>Δοκιμάστε ξανά."
- source: "The connection to the server was lost.<TAG1/><NL/>Please try again later."
  target: "Η σύνδεση με τον διακομιστή χάθηκε.<TAG1/><NL/>Παρακαλώ δοκιμάστε ξανά αργότερα."
- source: "The connection to the server was lost.<TAG1/><NL/>Please try posting again.<TAG2/><NL/><L_ROMB/> <TAG3/>The server connection may be lost if too much time passes without posting.<TAG4/>"
  target: "Η σύνδεση με τον διακομιστή χάθηκε.<TAG1/><NL/>Δοκιμάστε να δημοσιεύσετε ξανά.<TAG2/><NL/><L_ROMB/> <TAG3/>Η σύνδεση διακομιστή μπορεί να χαθεί εάν περάσει πολύς χρόνος χωρίς να γίνει ανάρτηση.<TAG4/>"
- source: "The connection to the server was lost.<TAG1/><NL/>The network may be busy or the wireless signal strength may be poor.<NL/>Please try again later.<TAG2/><NL/>If the problem persists, you may be able to improve the signal strength in the following ways:<NL/><L_DOT1/><TAG3/>Move the console closer to the network device.<TAG4/><NL/><L_DOT1/><TAG5/>Remove any obstacles between the network device and the console.<TAG6/><NL/>If you are still unable to connect, check whether you can access the Internet from your PC or other devices."
  target: "Η σύνδεση με τον διακομιστή χάθηκε.<TAG1/><NL/>Το δίκτυο μπορεί να είναι απασχολημένο ή η ισχύς του ασύρματου σήματος μπορεί να είναι κακή.<NL/>Παρακαλώ δοκιμάστε ξανά αργότερα.<TAG2/><NL/>Εάν το πρόβλημα παραμένει, ίσως μπορείτε να βελτιώσετε την ισχύ του σήματος με τους ακόλουθους τρόπους:<NL/><L_DOT1/><TAG3/>Μετακινήστε την κονσόλα πιο κοντά στη συσκευή δικτύου.<TAG4/><NL/><L_DOT1/><TAG5/>Αφαιρέστε τυχόν εμπόδια μεταξύ της συσκευής δικτύου και της κονσόλας.<TAG6/><NL/>Εάν εξακολουθείτε να μην μπορείτε να συνδεθείτε, ελέγξτε εάν μπορείτε να έχετε πρόσβαση στο Διαδίκτυο από τον υπολογιστή σας ή άλλες συσκευές."
- source: "The connection to the server was lost.<TAG1/><NL/>This service can only be used by one console per <L_N10/> Account at any given time, even if multiple consoles are linked to that account."
  target: "Η σύνδεση με τον διακομιστή χάθηκε.<TAG1/><NL/>Η υπηρεσία χρησιμοποιείται μόνο από μία κονσόλα ανά λογαριασμό <L_N10/> κάθε φορά, ακόμη και αν συνδέονται πολλές κονσόλες με αυτόν."
- source: "The connection was interrupted."
  target: "Η σύνδεση διακόπηκε."
- source: "The connection was lost because play was suspended."
  target: "Η σύνδεση χάθηκε επειδή το παιχνίδι ανεστάλη."
- source: "The connection was lost because the console entered sleep mode."
  target: "Η σύνδεση χάθηκε επειδή η κονσόλα μπήκε σε αναμονή."
