- source: "Each <L_N10/> Account allows up to two systems to use each <TAG1/>virtual game card<TAG2/>.<NL/><TAG3/><TAG4/>When using a second system for the first time, it will need to be linked with the <TAG5/>first system.<TAG6/><TAG7/><TAG8/>"
