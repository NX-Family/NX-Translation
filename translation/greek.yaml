  target: "Εξήχθησαν όλες οι εικονικές κάρτες παιχνιδιού."
- source: "All wireless communication, such as <L_WIFI/> and <L_BT/>, will be turned off.<NL/>Some types of wireless communication can still be switched on manually when the console is in Airplane Mode.<TAG1/><NL/><L_ROMB/> <TAG2/>This can also be changed from Quick Settings (hold <0xE0B9/>).<TAG3/>"
  target: "Κάθε ασύρματη επικοινωνία, όπως <L_WIFI/> και <L_BT/>, θα απενεργοποιηθεί.<NL/>Ορισμένοι τύποι ασύρματης επικοινωνίας μπορούν να ενεργοποιηθούν χειροκίνητα στη Λειτουργία πτήσης.<TAG1/><NL/><L_ROMB/> <TAG2/>Μπορείτε επίσης να το αλλάξετε από τις Γρήγορες ρυθμίσεις (κρατήστε πατημένο το <0xE0B9/>).<TAG3/>"
- source: "All wireless controllers will be temporarily disconnected.<TAG1/><NL/>Up to four controllers can be reconnected on this screen. Do you want to continue?"
  target: "Όλα τα ασύρματα χειριστήρια θα αποσυνδεθούν προσωρινά.<TAG1/><NL/>Σε αυτή την οθόνη μπορείτε να συνδέσετε ξανά έως τέσσερα χειριστήρια. Θέλετε να συνεχίσετε;"
- source: "Allow"
  target: "Να επιτραπεί"
- source: "Allows automatic downloads of the latest <TAG1/>save data<TAG2/>.<NL/><TAG3/><TAG4/>You can also change this setting later from <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud on the HOME Menu.<TAG5/><TAG6/>"
  target: "Επιτρέπει αυτόματες λήψεις των πιο πρόσφατων <TAG1/>δεδομένων αποθήκευσης<TAG2/>.<NL/><TAG3/><TAG4/>Μπορείτε να αλλάξετε τη ρύθμιση αργότερα από <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Διαχείριση δεδομένων ⇒ Αποθήκευση στο cloud στο μενού HOME.<TAG5/><TAG6/>"
- source: "Almaty"
  target: "Αλμάτη"
- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Μαζί με την κονσόλα <L_NS/> σας, η <L_N10/> έστειλε εξοπλισμό για σύνδεση στην τηλεόραση. Δείτε πώς θα απολαύσετε παιχνίδι στη μεγάλη οθόνη:<NL/><NL/>Πρώτα, βρείτε τη βάση <L_NS/>, το τροφοδοτικό και το καλώδιο <L_HDMI/>. <NL/><NL/>Ανοίξτε το πίσω κάλυμμα της βάσης και συνδέστε το τροφοδοτικό. <NL/><NL/>Έπειτα, συνδέστε τη βάση στην τηλεόραση με το καλώδιο <L_HDMI/>.<NL/><NL/><L_DOT3S/>Αυτό ήταν! Αν θέλετε να χρησιμοποιήσετε τα χειριστήρια <L_JC/> ξεχωριστά, αποσπάστε τα. Μετά, τοποθετήστε την κονσόλα <L_NS/> στη βάση και η εικόνα της θα εμφανιστεί στην τηλεόραση ως διά μαγείας."
- source: "Amman"
  target: "Αμμάν"
- source: "An error caused the download to be suspended.<TAG1/><NL/>Connect to the Internet and check the status."
  target: "Ένα σφάλμα προκάλεσε την αναστολή της λήψης.<TAG1/><NL/>Συνδεθείτε στο διαδίκτυο και ελέγξτε την κατάσταση."
- source: "An error has occurred"
  target: "Παρουσιάστηκε σφάλμα"
- source: "An error has occurred on the other system.<TAG1/><NL/>Ask the other user to go to the HOME Menu on their system, open their user page, and check the status of<L_XA0/>their <L_N10/> Account.<NL/>If a user's <L_N10/> Account can't be used, <0xE151/><L_XA0/>will appear over their user<L_XA0/>icon on the HOME Menu."
  target: "Παρουσιάστηκε σφάλμα στο άλλο σύστημα.<TAG1/><NL/>Ζητήστε από τον άλλο χρήστη να ανοίξει τη σελίδα χρήστη από το μενού HOME του συστήματός του και να ελέγξει την κατάσταση<L_XA0/>του λογαριασμού <L_N10/> του.<NL/>Αν ο λογαριασμός <L_N10/> ενός χρήστη δεν μπορεί να χρησιμοποιηθεί, το <0xE151/><L_XA0/>θα εμφανιστεί πάνω στο εικονίδιο<L_XA0/>χρήστη του στο μενού HOME."
- source: "An error has occurred on the other system.<TAG1/><NL/>The other system needs to be updated.<NL/>Have the other user update their system by going to the HOME Menu and selecting <0xE130/><L_XA0/>(System<L_XA0/>Settings) ⇒ System."
  target: "Παρουσιάστηκε σφάλμα στο άλλο σύστημα.<TAG1/><NL/>Το άλλο σύστημα χρειάζεται ενημέρωση.<NL/>Ζητήστε από τον άλλο χρήστη να το ενημερώσει από το μενού HOME, επιλέγοντας <0xE130/><L_XA0/>(Ρυθμίσεις<L_XA0/>συστήματος) ⇒ Σύστημα."
- source: "An error has occurred while trying to access the <L_AMI/>.<NL/>Please try again."
  target: "Παρουσιάστηκε σφάλμα κατά την πρόσβαση στο <L_AMI/>.<NL/>Δοκιμάστε ξανά."
- source: "An error has occurred, so the system will be restarted."
  target: "Παρουσιάστηκε σφάλμα, επομένως το σύστημα θα επανεκκινηθεί."
- source: "An error has occurred, so the system will restart.<NL/>Keep the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system nearby with the power turned on."
  target: "Παρουσιάστηκε σφάλμα και το σύστημα θα επανεκκινηθεί.<NL/>Κρατήστε κοντά το σύστημα <L_N10/> <TAG1/><L_SWT2/><TAG2/> με την τροφοδοσία ενεργοποιημένη."
- source: "An error has occurred.<NL/><NL/>Please press the POWER Button to restart the console. If you are<NL/>unable to restart the console, hold the POWER Button for 12 seconds<NL/>to turn the console off.<NL/><NL/>If the problem persists, refer to the <L_N10/> Support Website.<NL/><L_SNCE/><NL/>"
  target: "Παρουσιάστηκε σφάλμα.<NL/><NL/>Πατήστε το κουμπί POWER για επανεκκίνηση της κονσόλας. Αν<NL/>δεν επανεκκινείται, κρατήστε το κουμπί POWER πατημένο για 12 δευτερόλεπτα<NL/>για να απενεργοποιήσετε την κονσόλα.<NL/><NL/>Αν το πρόβλημα επιμένει, ανατρέξτε στον ιστότοπο υποστήριξης της <L_N10/>.<NL/><L_SNCE/><NL/>"
- source: "An error has occurred.<NL/>Ending <L_TGS/> session."
  target: "Παρουσιάστηκε σφάλμα.<NL/>Τερματισμός συνεδρίας <L_TGS/>."
- source: "An error has occurred.<TAG1/><NL/><L_NEP/> must be accessed from this console at least once.<TAG2/><NL/>Please open <L_NEP/> by selecting <0xE133/> on the HOME Menu."
  target: "Παρουσιάστηκε σφάλμα.<TAG1/><NL/>Πρέπει να ανοίξετε το <L_NEP/> από αυτή την κονσόλα τουλάχιστον μία φορά.<TAG2/><NL/>Ανοίξτε το <L_NEP/> επιλέγοντας <0xE133/> στο μενού HOME."
- source: "An error has occurred.<TAG1/><NL/>If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Παρουσιάστηκε σφάλμα.<TAG1/><NL/>Εάν το πρόβλημα παραμένει, ανατρέξτε στον ιστότοπο υποστήριξης της <L_N10/>.<NL/><L_SNCE/>"
- source: "An error has occurred.<TAG1/><NL/>If the problem persists, please refer to the<NL/><L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Παρουσιάστηκε σφάλμα.<TAG1/><NL/>Αν το πρόβλημα επιμένει, ανατρέξτε στον<NL/>ιστότοπο υποστήριξης της <L_N10/>.<NL/><L_SNCE/>"
- source: "An error has occurred.<TAG1/><NL/>In order to watch this video, please restart the console from Power Options in the Power Menu (hold the POWER Button for three seconds).<TAG2/><NL/><L_ROMB/> <TAG3/>If you restart the console, any unsaved data will be lost.<TAG4/>"
  target: "Παρουσιάστηκε σφάλμα.<TAG1/><NL/>Για να παρακολουθήσετε αυτό το βίντεο, επανεκκινήστε την κονσόλα από Επιλογές ενέργειας στο Μενού τροφοδοσίας (κρατήστε πατημένο το κουμπί POWER για τρία δευτερόλεπτα).<TAG2/><NL/><L_ROMB/> <TAG3/>Εάν κάνετε επανεκκίνηση της κονσόλας, τυχόν μη αποθηκευμένα δεδομένα θα χαθούν.<TAG4/>"
