- source: "In addition to this system, another <L_NS/> has been registered as one of your primary systems.<TAG1/><NL/>Please update that system first.<NL/><TAG2/><TAG3/>To update, open the HOME Menu, and then select <TAG4/><0xE130/> (System Settings)<TAG5/> ⇒ System ⇒ Update System.<TAG6/><TAG7/>"
  target: "Εκτός από αυτό το σύστημα, ένα άλλο <L_NS/> έχει καταχωριστεί ως κύριο σύστημά σας.<TAG1/><NL/>Ενημερώστε πρώτα εκείνο το σύστημα.<NL/><TAG2/><TAG3/>Για ενημέρωση, ανοίξτε το μενού HOME και επιλέξτε <TAG4/><0xE130/> (Ρυθμίσεις συστήματος)<TAG5/> ⇒ Σύστημα ⇒ Ενημέρωση συστήματος.<TAG6/><TAG7/>"
- source: "In order to analyze and recover the save data, the<NL/>save data for this software, your nickname, your ID,<NL/>and other information that will help identify you will<NL/>be sent to <L_N10/>. For the same reason, the<NL/>above will be sent to the developers of this software,<NL/>who may reside within or outside of your country."
  target: "Για την ανάλυση και ανάκτηση των δεδομένων αποθήκευσης,<NL/>τα δεδομένα αποθήκευσης αυτού του λογισμικού, το ψευδώνυμο, το ID σας<NL/>και άλλες πληροφορίες που βοηθούν στην ταυτοποίησή σας θα<NL/>σταλούν στη <L_N10/>. Για τον ίδιο λόγο, τα<NL/>παραπάνω θα σταλούν στους προγραμματιστές του λογισμικού,<NL/>που μπορεί να βρίσκονται εντός ή εκτός της χώρας σας."
- source: "In order to analyze and recover the save data, the<NL/>save data for this software, your nickname, your ID,<NL/>and other information that will help identify you will<NL/>be sent to <L_N10/>. For the same reason, the<NL/>above will be sent to the developers of this software,<NL/>who may reside within or outside of your country.<NL/><TAG1/><TAG2/>For matters like this, please acquire the consent of all users<NL/>who have save data with this software.<TAG3/><TAG4/>"
  target: "Για την ανάλυση και ανάκτηση των δεδομένων αποθήκευσης,<NL/>τα δεδομένα αποθήκευσης αυτού του λογισμικού, το ψευδώνυμο, το ID σας<NL/>και άλλες πληροφορίες που βοηθούν στην ταυτοποίησή σας θα<NL/>σταλούν στη <L_N10/>. Για τον ίδιο λόγο, τα<NL/>παραπάνω θα σταλούν στους προγραμματιστές του λογισμικού,<NL/>που μπορεί να βρίσκονται εντός ή εκτός της χώρας σας.<NL/><TAG1/><TAG2/>Για αυτή την ενέργεια, εξασφαλίστε τη συγκατάθεση όλων των χρηστών<NL/>που έχουν δεδομένα αποθήκευσης σε αυτό το λογισμικό.<TAG3/><TAG4/>"
- source: "In order to change the language, the console will need to restart. Any suspended software will be closed."
  target: "Για να αλλάξετε τη γλώσσα, η κονσόλα θα πρέπει να επανεκκινηθεί. Οποιοδήποτε ανασταλμένο λογισμικό θα κλείσει."
- source: "In order to change the region you will need to agree to the End-User License Agreement for the selected region and restart the console. If you do not agree, do not change your region setting in this way."
  target: "Για να αλλάξετε περιοχή, πρέπει να δεχτείτε τη Σύμβαση άδειας χρήσης τελικού χρήστη για τη νέα περιοχή και να επανεκκινήσετε την κονσόλα. Αν δεν συμφωνείτε, μην αλλάξετε την περιοχή με αυτόν τον τρόπο."
- source: "In order to change the region you will need to agree to the End-User License Agreement for the selected region and restart the console. If you do not agree, do not change your region setting in this way.<TAG1/><NL/>Additionally, the following settings will change:<TAG2/><NL/><L_DOT1/><TAG3/>The Auto-Sleep (Connected to TV) setting will be set to 1 hour.<TAG4/><NL/><L_DOT1/><TAG5/>The Maintain Internet Connection in Sleep Mode setting will be enabled.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>This can be changed later by selecting <0xE130/> (System Settings) ⇒ Sleep Mode via the HOME Menu.<TAG10/><TAG11/>"
  target: "Για να αλλάξετε περιοχή, πρέπει να δεχτείτε τη Σύμβαση άδειας χρήσης τελικού χρήστη για τη νέα περιοχή και να επανεκκινήσετε την κονσόλα. Αν δεν συμφωνείτε, μην αλλάξετε την περιοχή με αυτόν τον τρόπο.<TAG1/><NL/>Θα αλλάξουν επίσης οι εξής ρυθμίσεις:<TAG2/><NL/><L_DOT1/><TAG3/>Η Αυτόματη αναμονή (σύνδεση σε TV) θα οριστεί σε 1 ώρα.<TAG4/><NL/><L_DOT1/><TAG5/>Θα ενεργοποιηθεί η Διατήρηση σύνδεσης στο διαδίκτυο σε αναμονή.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>Μπορείτε να τις αλλάξετε αργότερα από <0xE130/> (Ρυθμίσεις συστήματος) ⇒ Αναμονή στο μενού HOME.<TAG10/><TAG11/>"
- source: "In order to change users, this software must close.<NL/><TAG1/><TAG2/>Any unsaved data will be lost.<TAG3/><TAG4/>"
  target: "Για να αλλάξετε χρήστες, αυτό το λογισμικό πρέπει να κλείσει.<NL/><TAG1/><TAG2/>Οποιαδήποτε μη αποθηκευμένα δεδομένα θα χαθούν.<TAG3/><TAG4/>"
- source: "In order to change users,<NL/>this software must be closed."
  target: "Για να αλλάξετε χρήστες,<NL/>πρέπει να κλείσετε αυτό το λογισμικό."
- source: "In order to play this software, you must first register it in <TAG1/><L_NEP/><TAG2/>.<TAG3/><NL/>Only <TAG4/>one<TAG5/> user can be registered."
  target: "Για να παίξετε αυτό το λογισμικό, πρέπει πρώτα να το εγγράψετε στο <TAG1/><L_NEP/><TAG2/>.<TAG3/><NL/>Μόνο <TAG4/>ένας<TAG5/> χρήστης μπορεί να εγγραφεί."
