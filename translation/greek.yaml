- source: "All data in the system memory, including software data, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> <TAG2/>Please note:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>The system version will not be changed.<TAG9/>"
  target: "Όλα τα δεδομένα στη μνήμη του συστήματος, όπως δεδομένα λογισμικού, δεδομένα αποθήκευσης, στιγμιότυπα οθόνης, βίντεο και στοιχεία χρηστών, θα διαγραφούν και η κονσόλα θα επανέλθει στις εργοστασιακές ρυθμίσεις.<TAG1/><NL/><L_SQR/> <TAG2/>Σημείωση:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Όλα τα δεδομένα λογισμικού στην κάρτα <L_MSD/>, εκτός από στιγμιότυπα οθόνης και βίντεο, θα πάψουν να μπορούν να χρησιμοποιηθούν. (Τα δεδομένα στην κάρτα <L_MSD/> δεν θα διαγραφούν.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Η έκδοση συστήματος δεν θα αλλάξει.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "Όλα τα δεδομένα στη μνήμη του συστήματος, όπως λογισμικό, δεδομένα αποθήκευσης, στιγμιότυπα οθόνης, βίντεο και στοιχεία χρηστών, θα διαγραφούν και η κονσόλα θα επανέλθει στις εργοστασιακές ρυθμίσεις.<TAG1/><NL/><L_SQR/> Σημείωση:<TAG2/><NL/><L_DOT1/><TAG3/>Όλο το λογισμικό στην κάρτα <L_MSD/>, εκτός από στιγμιότυπα οθόνης και βίντεο, θα πάψει να μπορεί να χρησιμοποιηθεί. (Τα δεδομένα στην κάρτα <L_MSD/> δεν θα διαγραφούν.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Η έκδοση συστήματος δεν θα αλλάξει.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Οι λογαριασμοί <L_N10/> που είναι συνδεδεμένοι με την κονσόλα δεν θα διαγραφούν, αλλά θα αποσυνδεθούν.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Ο λογαριασμός <L_N10/> σας περιέχει το ιστορικό αγορών και το τρέχον υπόλοιπό σας στο <L_NEP/>. Συνδέοντας ξανά τον λογαριασμό <L_N10/> μετά την αρχικοποίηση, θα μπορείτε να κατεβάσετε ξανά λογισμικό ή <L_DLC/> που αγοράσατε με αυτόν. (Σε ορισμένες περιπτώσεις, λογισμικό που έχει αποσυρθεί μπορεί να μην είναι διαθέσιμο για νέα λήψη.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Αν επιλέξατε αυτή τη λειτουργία λόγω προβλήματος στην κονσόλα:<TAG19/><NL/>Στη Λειτουργία συντήρησης μπορείτε να αρχικοποιήσετε την κονσόλα χωρίς διαγραφή δεδομένων αποθήκευσης ή στοιχείων χρηστών. Αν θέλετε να το δοκιμάσετε, ακυρώστε την αρχικοποίηση και κάντε τα εξής:<TAG20/><NL/><L_D1/> <TAG21/>Απενεργοποιήστε την κονσόλα.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>Ανοίξτε το Μενού τροφοδοσίας (κρατήστε πατημένο το κουμπί POWER για τρία δευτερόλεπτα) και επιλέξτε Επιλογές ενέργειας → Απενεργοποίηση.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Κρατήστε πατημένα τα κουμπιά αύξησης (+) και μείωσης (-) έντασης μαζί με το κουμπί POWER για να ενεργοποιήσετε την κονσόλα.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>Η κονσόλα θα ξεκινήσει στη Λειτουργία συντήρησης.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Επιλέξτε Αρχικοποίηση κονσόλας χωρίς διαγραφή αποθηκεύσεων και ακολουθήστε τις οδηγίες.<TAG38/>"
- source: "All data on the <L_MSD/> card will be deleted, and it will be formatted so that it can be used with this console."
  target: "Όλα τα δεδομένα στην κάρτα <L_MSD/> θα διαγραφούν και θα μορφοποιηθεί έτσι ώστε να μπορεί να χρησιμοποιηθεί με αυτήν την κονσόλα."
- source: "All data on the <L_MSD/> card will be deleted.<NL/>Data cannot be restored once it is deleted.<NL/>Continue?"
  target: "Όλα τα δεδομένα στην κάρτα <L_MSD/> θα διαγραφούν.<NL/>Μετά τη διαγραφή δεν μπορούν να ανακτηθούν.<NL/>Συνέχεια;"
- source: "All of <TAG1/>'s saved IDs and passwords, cookies, history, and other cached website data will be deleted.<NL/><NL/>Once deleted, the data cannot be recovered.<NL/>Continue?"
  target: "Θα διαγραφούν όλα τα αποθηκευμένα αναγνωριστικά και οι κωδικοί πρόσβασης του <TAG1/>, τα cookies, το ιστορικό και άλλα δεδομένα ιστοτόπων στην προσωρινή μνήμη.<NL/><NL/>Μετά τη διαγραφή δεν μπορούν να ανακτηθούν.<NL/>Συνέχεια;"
- source: "All of the following data will be copied to a <L_N10/> <TAG1/><L_SWT2/><TAG2/>:"
  target: "Όλα τα παρακάτω δεδομένα θα αντιγραφούν σε ένα <L_N10/> <TAG1/><L_SWT2/><TAG2/>:"
- source: "All of your virtual game cards that are currently loaded on this system will be ejected.<NL/><TAG1/><TAG2/>Your save data will be kept. Load the game again to keep playing.<TAG3/><TAG4/>"
  target: "Όλες οι εικονικές κάρτες παιχνιδιού σας που είναι φορτωμένες αυτήν τη στιγμή σε αυτό το σύστημα θα εξαχθούν.<NL/><TAG1/><TAG2/> Τα δεδομένα αποθήκευσής σας θα διατηρηθούν. Φορτώστε ξανά το παιχνίδι για να συνεχίσετε να παίζετε.<TAG3/><TAG4/>"
- source: "All save data"
  target: "Όλα τα δεδομένα αποθήκευσης"
