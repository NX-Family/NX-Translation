  target: "Θα περιοριστεί η ανοιχτή επικοινωνία μεταξύ χρηστών, μαζί με την αποστολή και λήψη μηνυμάτων και εικόνων.<TAG1/><NL/>Ανάλογα με το λογισμικό, θα περιοριστούν τα εξής:<TAG2/><NL/><L_DOT1/><TAG3/>Αποστολή και λήψη μηνυμάτων και χρήση συνομιλίας.<TAG4/><NL/><L_DOT1/><TAG5/>Ανάγνωση και κοινοποίηση πληροφοριών προφίλ με κείμενο που εισάγουν οι χρήστες.<TAG6/><NL/><L_DOT1/><TAG7/>Προβολή και κοινοποίηση εικόνων χρηστών, πιθανώς με κείμενο.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Δεν περιορίζονται εφαρμογές που λειτουργούν εκτός του <L_NS/>, όπως το <L_NS/> App. Για περιορισμούς στην εφαρμογή, χρησιμοποιήστε την έξυπνη συσκευή σας.<TAG12/><TAG13/>"
