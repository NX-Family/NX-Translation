- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Δείξτε αυτόν τον κωδικό QR για να καταχωρίσετε την επίσκεψή σας σε επιλεγμένες εκδηλώσεις και χώρους της <L_N10/> και να αποκτήσετε αποκλειστικά προνόμια μελών του <L_MNT/>, όπως πόντους <L_MNT/> και συμμετοχή σε προωθητικές κληρώσεις. Τα προνόμια διαφέρουν κάθε φορά, γι' αυτό δείτε τις σχετικές λεπτομέρειες κατά την καταχώριση.<TAG1/><NL/><L_DOT1/><TAG2/>Αυτός ο κωδικός QR επιτρέπει στη <L_N10/> να αναγνωρίσει τον λογαριασμό σας <L_N10/>.<TAG3/><NL/><L_DOT1/><TAG4/>Με την καταχώριση της επίσκεψης μπορείτε να συμμετέχετε σε συγκεκριμένες προωθητικές ενέργειες και ενδέχεται να λάβετε e-mail για αυτές ή άλλες προωθητικές ενέργειες. Περισσότερες πληροφορίες θα υπάρχουν στους σχετικούς ιστότοπους.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> - Ισχύουν η Σύμβαση χρήστη λογαριασμού και η Πολιτική απορρήτου.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>Δημιουργία κωδικού QR: <TAG11/><TAG12/><TAG13/>"
