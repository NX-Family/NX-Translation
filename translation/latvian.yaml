- source: "Could not connect to the internet.<TAG1/><NL/>Could not perform DNS name resolution.<TAG2/><NL/>The network may be busy. Please try again later.<TAG3/><NL/>If you still cannot connect, please try the following:<NL/><L_DOT1/><TAG4/>Check if other devices such as a PC can connect to the internet.<TAG5/><NL/><L_DOT1/><TAG6/>Make sure you have the correct DNS settings.<TAG7/><TAG8/><NL/>If the problem persists, please restart the console from Power Options in the Power Menu (hold the POWER Button for three seconds)."
  target: "Neizdevās izveidot savienojumu ar internetu.<TAG1/><NL/>Neizdevās veikt DNS vārda atrisināšanu.<TAG2/><NL/>Tīkls var būt noslogots. Lūdzu, mēģiniet vēlāk.<TAG3/><NL/>Ja joprojām nevarat izveidot savienojumu, izmēģiniet tālāk norādīto:<NL/><L_DOT1/><TAG4/>Pārbaudiet, vai citas ierīces, piemēram, dators, var izveidot savienojumu ar internetu.<TAG5/><NL/><L_DOT1/><TAG6/>Pārliecinieties, ka DNS iestatījumi ir pareizi.<TAG7/><TAG8/><NL/>Ja problēma nepazūd, restartējiet konsoli sadaļā Barošanas opcijas Barošanas izvēlnē (turiet POWER pogu nospiestu trīs sekundes)."
