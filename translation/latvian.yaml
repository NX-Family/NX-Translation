  target: "Lai turpinātu šajā sistēmā, aizveriet programmatūru jebkurā citā sistēmā, kur to spēlē lietotājs, kas saistīts ar šo <L_N10/> kontu.<TAG1/><NL/>Vai arī varat spēlēt programmatūru šajā sistēmā, neaizverot to citur, izpildot tālāk norādītās darbības:<NL/><L_ROMB/><TAG2/>Dažas <L_DLC/> nebūs pieejamas, ja programmatūru palaidīsiet šādi.<TAG3/><TAG4/><NL/>1. <TAG5/>Atveriet HOME izvēlni, iezīmējiet programmatūru un nospiediet <0xE0E2/>, lai<L_XA0/>aizvērtu programmatūru.<TAG6/><NL/>2. <TAG7/>Nospiediet un turiet <0xE0E3/> un pēc tam nospiediet <0xE0E0/>, lai restartētu programmatūru.<TAG8/>"
- source: "To continue without linking, create a new user.<NL/><TAG1/><TAG2/>You can link a <L_N10/> Account later.<TAG3/><TAG4/>"
  target: "Lai turpinātu bez sasaistīšanas, izveidojiet jaunu lietotāju.<NL/><TAG1/><TAG2/>Vēlāk varēsiet sasaistīt <L_N10/> kontu.<TAG3/><TAG4/>"
- source: "To disconnect an unwanted controller, press its SYNC Button briefly."
  target: "Lai atvienotu nevēlamu vadāmierīci, īsi nospiediet tās SYNC pogu."
- source: "To display Support Information, Important Information, and Intellectual Property Notices, insert the game card or download this software."
  target: "Lai parādītu atbalsta informāciju, svarīgu informāciju un intelektuālā īpašuma paziņojumus, ievietojiet spēles karti vai lejupielādējiet šo programmatūru."
- source: "To display your <TAG1/><L_N3D/><TAG2/> friends (<0xE131/>), your <TAG3/><L_N3D/><TAG4/> needs to be linked with a <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>You can do so by going to System Settings on your <TAG8/><L_N3D/><TAG9/>."
  target: "Lai parādītu savus <TAG1/><L_N3D/><TAG2/> draugus (<0xE131/>), jūsu <TAG3/><L_N3D/><TAG4/> ir jāsasaista ar <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>To var izdarīt, atverot Sistēmas iestatījumus savā <TAG8/><L_N3D/><TAG9/>."
- source: "To download the save data, the software you're using will now close and restart."
  target: "Lai lejupielādētu saglabātos datus, pašlaik izmantotā programmatūra tiks aizvērta un restartēta."
- source: "To earn points for physical software, certain conditions must be fulfilled. For details, see the <L_MNT/> website."
  target: "Lai saņemtu punktus par fizisku programmatūru, jāizpilda noteikti nosacījumi. Plašāku informāciju skatiet <L_MNT/> vietnē."
- source: "To enjoy surround sound, you will need a device that supports linear PCM 5.1 surround sound. Without a supporting device connected, some sounds may not play correctly.<TAG1/><NL/>Do you want to enable surround sound?"
  target: "Lai baudītu telpisko skaņu, nepieciešama ierīce, kas atbalsta lineāro PCM 5.1 telpisko skaņu. Ja nav pievienota atbalstoša ierīce, dažas skaņas var netikt atskaņotas pareizi.<TAG1/><NL/>Vai vēlaties ieslēgt telpisko skaņu?"
- source: "To exit Maintenance Mode, press the POWER Button to turn off the console."
  target: "Lai izietu no apkopes režīma, nospiediet POWER pogu, lai izslēgtu konsoli."
- source: "To free up enough space, you will also need to archive software for which Prevent Auto Archiving has been enabled.<NL/>Choose software to archive?"
  target: "Lai atbrīvotu pietiekami daudz vietas, būs jāarhivē arī programmatūra, kurai ir ieslēgta automātiskās arhivēšanas novēršana.<NL/>Vai izvēlēties programmatūru arhivēšanai?"
- source: "To link the two systems, you will need to bring them close to one another.<TAG1/><NL/>If the system shown is unavailable because it has been damaged or lost, please unlink the system from a PC or smart device.<TAG2/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG3/>"
  target: "Lai sasaistītu abas sistēmas, tās jāpietuvina viena otrai.<TAG1/><NL/>Ja parādītā sistēma nav pieejama, jo ir bojāta vai pazaudēta, lūdzu, atsaistiet sistēmu no datora vai viedierīces.<TAG2/><NL/>Plašāku informāciju skatiet <L_N10/> atbalsta vietnē.<NL/><TAG3/>"
- source: "To load a virtual game card on another system, you must link this system with the other system. Systems only need to<L_XA0/>be linked<L_XA0/>once.<NL/><TAG1/><TAG2/>Each <L_N10/> Account can have a maximum of two systems linked at a time.<TAG3/><TAG4/>"
  target: "Lai ielādētu virtuālo spēles karti citā sistēmā, šī sistēma ir jāsasaista ar otru sistēmu. Sistēmas jā<L_XA0/>sasaista<L_XA0/> tikai vienreiz.<NL/><TAG1/><TAG2/>Katram <L_N10/> kontam vienlaikus var būt sasaistītas ne vairāk kā divas sistēmas.<TAG3/><TAG4/>"
- source: "To load a virtual game card on this system, you must link it with the other system <TAG1/> is using, shown below. Systems only need to<L_XA0/>be linked once."
  target: "Lai ielādētu virtuālo spēles karti šajā sistēmā, tā jāsasaista ar otru sistēmu, ko izmanto <TAG1/>, kas parādīta zemāk. Sistēmas jā<L_XA0/>sasaista tikai vienreiz."
- source: "To play the <L_DLC/>, load the virtual game card on this system."
  target: "Lai spēlētu <L_DLC/>, ielādējiet virtuālo spēles karti šajā sistēmā."
- source: "To play this game, you'll first need to load the virtual game card on this system."
  target: "Lai spēlētu šo spēli, vispirms ielādējiet virtuālo spēles karti šajā sistēmā."
- source: "To play this software, load its virtual game card on <TAG1/>this system<TAG2/>."
  target: "Lai spēlētu šo programmatūru, ielādējiet tās virtuālo spēles karti <TAG1/>šajā sistēmā<TAG2/>."
