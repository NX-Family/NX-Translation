- source: "<L_CIRC/> Online Presence and Play Activity<NL/>Other users may be able to see your online presence and play activity.<NL/>You can change these settings at any time on your user page by selecting User Settings ⇒ Friend Settings. You may also choose not to share your online presence or play activity with anyone.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>By default, your online presence is only shared with friends, while your play activity is shared with all players. The play activity of children is only shared with their friends.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> News on <TAG8/><L_NS/><TAG9/><NL/>News will be delivered to your <TAG10/><L_NS/><TAG11/> console.<NL/>You can adjust your settings by returning to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System ⇒ Receive News."
  target: "<L_CIRC/> Tiešsaistes statuss un spēlēšanas aktivitāte<NL/>Citi lietotāji var redzēt jūsu tiešsaistes statusu un spēlēšanas aktivitāti.<NL/>Šos iestatījumus jebkurā laikā varat mainīt savā lietotāja lapā, atlasot Lietotāja iestatījumi ⇒ Draugu iestatījumi. Varat arī izvēlēties nekopīgot savu tiešsaistes statusu vai spēlēšanas aktivitāti ar nevienu.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>Pēc noklusējuma jūsu tiešsaistes statuss tiek kopīgots tikai ar draugiem, bet spēlēšanas aktivitāte - ar visiem spēlētājiem. Bērnu spēlēšanas aktivitāte tiek kopīgota tikai ar viņu draugiem.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> Jaunumi par <TAG8/><L_NS/><TAG9/><NL/>Jaunumi tiks piegādāti uz jūsu <TAG10/><L_NS/><TAG11/> konsoli.<NL/>Iestatījumus varat pielāgot, atgriežoties HOME izvēlnē un atlasot <0xE130/> (Sistēmas iestatījumi) ⇒ Sistēma ⇒ Saņemt jaunumus."
- source: "<L_D1/> <TAG1/>On the other system, open the HOME Menu and then select <0xE13D/> (Virtual Game Cards) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Bring the systems close to one another.<TAG6/>"
  target: "<L_D1/> <TAG1/>Citā sistēmā atveriet HOME izvēlni un pēc tam atlasiet <0xE13D/> (Virtuālās spēļu kartes) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Pietuviniet sistēmas vienu otrai.<TAG6/>"
