- source: "Could not connect to the internet.<TAG1/><NL/>Could not perform DNS name resolution.<TAG2/><NL/>The network may be busy. Please try again later.<TAG3/><NL/>If you still cannot connect, please try the following:<NL/><L_DOT1/><TAG4/>Check if other devices such as a PC can connect to the internet.<TAG5/><NL/><L_DOT1/><TAG6/>Make sure you have the correct DNS settings.<TAG7/>"
