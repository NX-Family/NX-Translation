  target: "Ja problēma saglabājas, skatiet <L_N10/> atbalsta vietni.<NL/><L_SNCE/>"
- source: "If the problem still occurs, try redownloading the software."
  target: "Ja problēma joprojām pastāv, mēģiniet lejupielādēt programmatūru vēlreiz."
- source: "If the selected button is mapped to one of the options below,<NL/>it is recommended that you use dual-controller grip."
  target: "Ja atlasītā poga ir piešķirta kādai no tālāk norādītajām opcijām,<NL/> ieteicams izmantot divu kontrolieru turētāju."
- source: "If this option is enabled, downloads initiated from your PC or smartphone will start right away, even when the console is in sleep mode. Disabling this option will reduce the console's energy consumption during sleep mode while connected to the Internet.<TAG1/><NL/><L_ROMB/> <TAG2/>This will have an effect only when connected to the Internet via wired connection.<TAG3/>"
  target: "Ja šī opcija ir ieslēgta, lejupielādes, kas sāktas no jūsu datora vai viedtālruņa, sāksies uzreiz, pat ja konsole ir miega režīmā. Izslēdzot šo opciju, tiks samazināts konsoles enerģijas patēriņš miega režīmā, kamēr tā ir savienota ar internetu.<TAG1/><NL/><L_ROMB/> <TAG2/>Tas ietekmēs tikai tad, ja savienojums ar internetu ir ar vadu.<TAG3/>"
- source: "If this option is enabled, the <L_NS/> <L_PRO/> will communicate with the console via wired communication when connected to it using the USB charging cable. The <L_NFC/> touchpoint on the <L_PRO/> will be disabled while the controller is using wired communication."
  target: "Ja šī opcija ir ieslēgta, <L_NS/> <L_PRO/> sazināsies ar konsoli, izmantojot vadu savienojumu, kad tas būs pievienots ar USB uzlādes kabeli. <L_NFC/> skārienpunkts uz <L_PRO/> tiks atspējots, kamēr kontrolieris izmanto vadu savienojumu."
- source: "If this option is enabled, the console will wake from sleep mode when it is removed from the dock."
  target: "Ja šī opcija ir ieslēgta, konsole pamodīsies no miega režīma, kad tā tiks izņemta no dokstacijas."
- source: "If this user is not selected in-game, he or she will be displayed as offline even if you are connected to the Internet."
  target: "Ja šis lietotājs spēlē nav atlasīts, tas tiks rādīts kā bezsaistē pat tad, ja esat savienots ar internetu."
- source: "If you are using the <L_NS/> Parental Controls app, you can exclude this software title from certain restrictions by adding it to a whitelist for the <L_NS/> console.<NL/><TAG1/><TAG2/>Whitelist settings can be changed from Console Settings ⇒ Whitelist in the <L_NS/> Parental Controls app.<TAG3/><TAG4/>"
  target: "Ja izmantojat <L_NS/> vecāku kontroles lietotni, varat izslēgt šo programmatūras nosaukumu no noteiktiem ierobežojumiem, pievienojot to atļauto sarakstam <L_NS/> konsolei.<NL/><TAG1/><TAG2/>Atļauto saraksta iestatījumus var mainīt <L_NS/> vecāku kontroles lietotnē: Konsoles iestatījumi ⇒ Atļautais saraksts.<TAG3/><TAG4/>"
- source: "If you cannot connect to your network, please visit the <L_N10/> Support website.<NL/><L_SNC/>"
  target: "Ja nevarat izveidot savienojumu ar tīklu, lūdzu, apmeklējiet <L_N10/> atbalsta vietni.<NL/><L_SNC/>"
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen."
  target: "Ja izvēlaties ievadīt PIN, izmantojot cipartastatūras ievadi, pārliecinieties, ka apkārtējie neredz jūsu ekrānu."
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen.<NL/><TAG1/><TAG2/>If you are using the console in TV mode, removing the console from the dock will allow you to enter your PIN without it being displayed on the TV.<TAG3/><TAG4/>"
  target: "Ja izvēlaties ievadīt PIN, izmantojot cipartastatūras ievadi, pārliecinieties, ka apkārtējie neredz jūsu ekrānu.<NL/><TAG1/><TAG2/>Ja izmantojat konsoli TV režīmā, izņemot konsoli no dokstacijas, varēsiet ievadīt PIN, nerādot to TV ekrānā.<TAG3/><TAG4/>"
- source: "If you don't use the button above, just select <0xE133/> from the HOME Menu to visit <L_NEP/> any old time.<NL/><NL/>Oh! And you can also search in <L_NEP/> with different filters to find exactly what you're looking for.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Ja neizmantojat pogu augstāk, vienkārši atlasiet <0xE133/> HOME izvēlnē, lai jebkurā laikā apmeklētu <L_NEP/>.<NL/><NL/>Ak! Un <L_NEP/> varat arī meklēt ar dažādiem filtriem, lai atrastu tieši to, ko meklējat.<NL/><NL/>Lai labi spēlējas,<NL/>Amelia N."
- source: "If you enable automatic backup, save data will be automatically backed up, even while the console is in sleep mode or after the software has been closed.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Ja ieslēgsiet automātisko dublēšanu, saglabāšanas dati tiks automātiski dublēti pat tad, ja konsole ir miega režīmā vai pēc programmatūras aizvēršanas.<NL/><TAG1/><TAG2/>Dažas programmatūras šo funkciju neatbalsta.<TAG3/><TAG4/>"
- source: "If you enable automatic download on this console, you can easily pick up playing where you left off on another console."
  target: "Ja šajā konsolē ieslēgsiet automātisko lejupielādi, varēsiet viegli turpināt spēli citā konsolē no vietas, kur pārtraucāt."
- source: "If you enable automatic download, save data will automatically download to this console whenever the save data stored via the Save Data Cloud service is updated from another console. The save data on this console will be overwritten with the data from the server.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Ja ieslēgsiet automātisko lejupielādi, saglabāšanas dati tiks automātiski lejupielādēti šajā konsolē ikreiz, kad no citas konsoles tiek atjaunināti saglabāšanas dati, kas glabāti, izmantojot Saglabāšanas datu mākoņa pakalpojumu. Šīs konsoles saglabāšanas dati tiks pārrakstīti ar datiem no servera.<TAG1/><NL/><TAG2/>Sākotnējā lejupielāde jāveic manuāli.<TAG3/>"
- source: "If you enable automatic download, you can easily pick up playing where you left off on another console.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Ja ieslēgsiet automātisko lejupielādi, varēsiet viegli turpināt spēli citā konsolē no vietas, kur pārtraucāt.<TAG1/><NL/><TAG2/>Sākotnējā lejupielāde jāveic manuāli.<TAG3/>"
- source: "If you enter the incorrect PIN <TAG1/><LIST1/>, you<NL/>will have to wait a while before attempting to enter it again."
  target: "Ja ievadīsiet nepareizu PIN <TAG1/><LIST1/>, jūs<NL/> kādu brīdi būs jāuzgaida, pirms mēģināsiet to ievadīt vēlreiz."
- source: "If you forget your PIN, you can reset it by signing in to your <L_N10/> Account."
  target: "Ja aizmirstat savu PIN, varat to atiestatīt, pierakstoties savā <L_N10/> kontā."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/> system, you can use it to download your data from the server."
  target: "Ja iegādāsieties <L_N10/> <TAG1/><L_SWT2/><TAG2/> sistēmu, varēsiet to izmantot, lai lejupielādētu savus datus no servera."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
  target: "Ja iegādāsieties <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
- source: "If you have existing user data on another system, you can copy or transfer it to this system. Otherwise, create a new user."
  target: "Ja citā sistēmā ir esoši lietotāja dati, varat tos kopēt vai pārsūtīt uz šo sistēmu. Pretējā gadījumā izveidojiet jaunu lietotāju."
- source: "If you have two systems, you can choose which system to play on by moving virtual game cards between them."
  target: "Ja jums ir divas sistēmas, varat izvēlēties, kurā sistēmā spēlēt, pārvietojot starp tām virtuālās spēļu kartes."
- source: "If you link to a <L_N10/> Account, you can use various online features."
  target: "Ja piesaistīsiet <L_N10/> kontu, varēsiet izmantot dažādas tiešsaistes funkcijas."
- source: "If you link to a <L_N10/> Account, you will see users who may want to become friends with you."
  target: "Ja piesaistīsiet <L_N10/> kontu, redzēsiet lietotājus, kuri varētu vēlēties kļūt par jūsu draugiem."
- source: "If you plan to keep using this system, stop here.<NL/>Once data is uploaded to the server, this system will be initialized."
  target: "Ja plānojat turpināt izmantot šo sistēmu, apstājieties šeit.<NL/>Kad dati būs augšupielādēti serverī, šī sistēma tiks inicializēta."
- source: "If you plugged the AC<NL/>adapter into the console<NL/>earlier, disconnect it."
  target: "Ja iepriekš pievienojāt maiņstrāvas<NL/>adapteri konsolei<NL/>, atvienojiet to."
- source: "If you turn Airplane Mode on, you will no<NL/>longer be able to use wireless controllers."
  target: "Ieslēdzot lidmašīnas režīmu, vairs<NL/>nevarēs izmantot bezvadu kontrolierus."
- source: "If you update and are still unable to use downloadable content or an upgrade pack, load the virtual game card from <0xE13D/> (Virtual Game Cards) on the HOME Menu."
  target: "Ja pēc atjaunināšanas joprojām nevarat izmantot lejupielādējamo saturu vai jaunināšanas pakotni, ielādējiet virtuālo spēles karti no <0xE13D/> (Virtual Game Cards) HOME izvēlnē."
- source: "If you'd rather download data for a specific user at a later time, uncheck that user. To download the data, go to the <TAG1/>HOME Menu<TAG2/> and open the Options menu for the software, then select <TAG3/>Save Data Cloud<TAG4/>."
  target: "Ja vēlaties lejupielādēt datus konkrētam lietotājam vēlāk, noņemiet atzīmi šim lietotājam. Lai lejupielādētu datus, atveriet <TAG1/>HOME izvēlni<TAG2/> un programmatūras Opciju izvēlni, pēc tam atlasiet <TAG3/>Save Data Cloud<TAG4/>."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Ja vēl nekad neesat ievietojis <L_MSD/> karti savā konsolē, paskatieties apkārt un mēģiniet atrast tai paredzēto slotu. Tas ir mazliet paslēpts. <NL/><NL/>Padodaties? Lūk, mājiens: vai esat kādreiz izmantojis konsoles aizmugurē esošo statīvu? <NL/><NL/>Atveriet to, un atradīsiet šo mazo viltībnieku! Varat iegādāties <L_MSD/> karti, ja uztraucaties, ka pietrūks vietas programmatūrai, <L_DLC/> un citām lietām."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand, and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Ja vēl nekad neesat ievietojis <L_MSD/> karti savā konsolē, paskatieties apkārt un mēģiniet atrast tai paredzēto slotu. Tas ir mazliet paslēpts. <NL/><NL/>Padodaties? Lūk, mājiens: vai esat kādreiz izmantojis konsoles aizmugurē esošo statīvu? <NL/><NL/>Atveriet to, un atradīsiet šo mazo viltībnieku! Varat iegādāties <L_MSD/> karti, ja uztraucaties, ka pietrūks vietas programmatūrai, <L_DLC/> un citām lietām."
- source: "If your save data is backed up, the save data for supported software on your console has been stored via the Save Data Cloud service.<TAG1/><NL/>If your data is waiting to back up, the save data on your console will be automatically stored via the Save Data Cloud service once the console enters sleep mode, provided it is connected to the Internet.<TAG2/><NL/>Select a user to view more details or manually back up or download data."
  target: "Ja saglabāšanas dati ir dublēti, jūsu konsolē atbalstītās programmatūras saglabāšanas dati ir saglabāti, izmantojot Save Data Cloud pakalpojumu.<TAG1/><NL/>Ja jūsu dati gaida dublēšanu, konsoles saglabāšanas dati tiks automātiski saglabāti, izmantojot Save Data Cloud pakalpojumu, tiklīdz konsole pāries miega režīmā, ja tā ir savienota ar internetu.<TAG2/><NL/>Atlasiet lietotāju, lai skatītu vairāk informācijas vai manuāli dublētu vai lejupielādētu datus."
- source: "If your virtual game cards are not appearing, open the HOME Menu and select <0xE13D/> (Virtual Game Cards)."
  target: "Ja jūsu virtuālās spēļu kartes neparādās, atveriet HOME izvēlni un atlasiet <0xE13D/> (Virtual Game Cards)."
