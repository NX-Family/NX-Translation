- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Kopā ar jūsu <L_NS/> konsoli <L_N10/> nosūtīja arī aparatūru, lai konsoli pievienotu televizoram. Lūk, kā izbaudīt spēles uz lielā ekrāna:<NL/><NL/>Vispirms atrodiet <L_NS/> dokstaciju, maiņstrāvas adapteri un <L_HDMI/> kabeli. <NL/><NL/>Pēc tam atveriet dokstacijas aizmugurējo vāciņu un pievienojiet maiņstrāvas adapteri. <NL/><NL/>Tad ar <L_HDMI/> kabeli pievienojiet dokstaciju televizoram.<NL/><NL/><L_DOT3S/>Un viss! Ja plānojat izmantot <L_JC/> kontrolierus atsevišķi, atvienojiet tos, pēc tam vienkārši iebīdiet savu <L_NS/> konsoli dokstacijā, un tā parādīsies televizorā kā ar burvju mājienu."
