- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Sistēmas atmiņā esošie dati tiks dzēsti, atjaunojot konsoles rūpnīcas iestatījumus.<NL/>Saglabātie dati, ekrānuzņēmumi, video un lietotāju informācija netiks dzēsti.<TAG1/><NL/><L_SQR/> Lūdzu, ņemiet vērā:<TAG2/><NL/><L_DOT1/><TAG3/>Visi programmatūras dati, kas saglabāti <L_MSD/> kartē (izņemot ekrānuzņēmumus un video), kļūs nelietojami. (Dati <L_MSD/> kartē netiks dzēsti.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Sistēmas versija netiks mainīta vai atgriezta uz iepriekšējo.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Dzēstās spēles un <L_DLC/> varēs spēlēt atkal pēc programmatūras atkārtotas lejupielādes. (Dažos gadījumos pārtrauktu programmatūru var nebūt iespējams lejupielādēt atkārtoti.)<TAG10/>"
