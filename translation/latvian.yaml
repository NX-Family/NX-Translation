- source: "If the player LEDs don't light up when you press a button, the controller is out of battery power. Charge the battery to use it."
  target: "Ja, nospiežot pogu, spēlētāja LED neiedegas, kontrolierim ir izlādējusies baterija. Uzlādējiet bateriju, lai to izmantotu."
- source: "If the problem is still not solved, please check the contact information on the <L_N10/> Support website."
  target: "Ja problēma joprojām nav atrisināta, pārbaudiet kontaktinformāciju <L_N10/> atbalsta vietnē."
- source: "If the problem persists, please refer to the <L_N10/> Support website.<NL/>"
