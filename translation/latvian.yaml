- source: "Please close any software being played by a user linked to this <L_N10/> Account on a different console before resuming play on this console.<TAG1/><NL/>Alternatively, you can play the software on this console without closing it on another console by following these steps:<NL/><L_ROMB/><TAG2/>Some downloadable content will be unavailable.<TAG3/><TAG4/><NL/>1. <TAG5/>Press <0xE0E2/> while on the HOME Menu to close the software.<TAG6/><NL/>2. <TAG7/>While holding <0xE0E3/>, press <0xE0E0/> to start the software.<TAG8/>"
