- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Automātiska saglabāto datu lejupielāde ir iespējota.<TAG1/><NL/><L_DOT1/><TAG2/>Sākotnējā lejupielāde jāveic manuāli.<TAG3/><NL/><L_DOT1/><TAG4/>Lai iespējotu šo funkciju citās konsolēs, iestatījumi jāpārvalda katrā konsolē.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>Iestatījumus varat pielāgot HOME izvēlnē sadaļā <0xE130/> (Sistēmas iestatījumi) ⇒ Datu pārvaldība ⇒ Saglabāto datu mākonis.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Automātiska saglabāto datu lejupielāde ne vienmēr notiek uzreiz.<NL/><TAG1/><TAG2/>Ja vēlaties uzreiz spēlēt citā konsolē, izmantojot tos pašus saglabātos datus, varat manuāli dublēt saglabātos datus un pēc tam manuāli tos lejupielādēt pēc vajadzības.<TAG3/><TAG4/>"
- source: "Automatic save-data downloads are currently paused.<NL/>Select an option below to resume automatic downloads."
  target: "Automātiskā saglabāto datu lejupielāde pašlaik ir apturēta.<NL/>Lai atsāktu automātisko lejupielādi, izvēlieties tālāk kādu opciju."
