- source: "Link your <L_N10/> Account to this console to download software from <TAG1/><L_NEP/><TAG2/>, transfer data between consoles-and much more!<TAG3/><NL/>Once linked, you can also set this console as your primary console in <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>You must be connected to the Internet to play your software on a console that is not your primary console.<TAG8/><TAG9/><TAG10/><NL/>If you are unable to link your <L_N10/> Account now, check your user page on the <TAG11/>HOME Menu<TAG12/>."
  target: "Saistiet savu <L_N10/> kontu ar šo konsoli, lai lejupielādētu programmatūru no <TAG1/><L_NEP/><TAG2/>, pārsūtītu datus starp konsolēm un daudz ko citu!<TAG3/><NL/>Pēc saistīšanas varat arī iestatīt šo konsoli kā savu galveno konsoli sadaļā <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>Lai spēlētu programmatūru konsolē, kas nav jūsu galvenā konsole, jābūt savienotam ar internetu.<TAG8/><TAG9/><TAG10/><NL/>Ja pašlaik nevarat saistīt savu <L_N10/> kontu, pārbaudiet savu lietotāja lapu <TAG11/>HOME izvēlnē<TAG12/>."
