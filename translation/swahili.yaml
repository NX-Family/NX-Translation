- source: "<L_CIRC/> Online Presence and Play Activity<NL/>Other users may be able to see your online presence and play activity.<NL/>You can change these settings at any time on your user page by selecting User Settings ⇒ Friend Settings. You may also choose not to share your online presence or play activity with anyone.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>By default, your online presence is only shared with friends, while your play activity is shared with all players. The play activity of children is only shared with their friends.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> News on <TAG8/><L_NS/><TAG9/><NL/>News will be delivered to your <TAG10/><L_NS/><TAG11/> console.<NL/>You can adjust your settings by returning to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System ⇒ Receive News."
  target: "<L_CIRC/> Hali ya mtandaoni na historia ya kucheza<NL/>Watumiaji wengine wanaweza kuona hali yako ya mtandaoni na historia yako ya kucheza.<NL/>Unaweza kubadili mipangilio hii wakati wowote kwenye ukurasa wako wa mtumiaji kwa kuchagua Mipangilio ya mtumiaji ⇒ Mipangilio ya marafiki. Unaweza pia kuchagua kutoshiriki hali yako ya mtandaoni au historia ya kucheza na mtu yeyote.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>Kwa chaguomsingi, hali yako ya mtandaoni inashirikiwa na marafiki tu, lakini historia yako ya kucheza inashirikiwa na wachezaji wote. Historia ya kucheza ya watoto inashirikiwa na marafiki zao tu.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> Habari kwenye <TAG8/><L_NS/><TAG9/><NL/>Habari zitatumwa kwenye konsoli yako ya <TAG10/><L_NS/><TAG11/>.<NL/>Unaweza kubadili mipangilio kwa kurudi kwenye menyu ya HOME na kuchagua <0xE130/> (Mipangilio ya mfumo) ⇒ Mfumo ⇒ Pokea habari."
- source: "<L_D1/> <TAG1/>On the other system, open the HOME Menu and then select <0xE13D/> (Virtual Game Cards) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Bring the systems close to one another.<TAG6/>"
  target: "<L_D1/> <TAG1/>Kwenye mfumo mwingine, fungua menyu ya HOME, kisha uchague <0xE13D/> (Kadi pepe za michezo) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Leta mifumo karibu na kila mmoja.<TAG6/>"
