- source: "Unable to connect to the Internet.<TAG1/><NL/>Please check your settings.<TAG2/><NL/>If you are using a wired connection, please check the following:<NL/><L_DOT1/><TAG3/>The Ethernet cable and/or LAN adapter is properly connected.<TAG4/><NL/><L_DOT1/><TAG5/>The router or hub you are connecting to is powered on.<TAG6/><NL/>If the problem persists, restart the system: Open the Power Menu (hold the POWER Button for three seconds) and select Power Options, then Restart."
