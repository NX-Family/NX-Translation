- source: "All data in the system memory, including software data, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> <TAG2/>Please note:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>The system version will not be changed.<TAG9/>"
  target: "A rendszermemória minden adata törlődik, beleértve a szoftveradatokat, mentési adatokat, képernyőképeket, videókat és felhasználói információkat. A konzol visszaáll a gyári beállításokra.<TAG1/><NL/><L_SQR/> <TAG2/>Fontos:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>A <L_MSD/> kártyán tárolt összes szoftveradat használhatatlanná válik, a képernyőképek és videók kivételével. (A <L_MSD/> kártya adatai nem törlődnek.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>A rendszerverzió nem változik.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "A rendszermemória minden adata törlődik, beleértve a szoftvereket, mentési adatokat, képernyőképeket, videókat és felhasználói információkat. A konzol visszaáll a gyári beállításokra.<TAG1/><NL/><L_SQR/> Fontos:<TAG2/><NL/><L_DOT1/><TAG3/>A <L_MSD/> kártyán tárolt összes szoftver használhatatlanná válik, a képernyőképek és videók kivételével. (A <L_MSD/> kártya adatai nem törlődnek.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>A rendszerverzió nem változik.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>A konzolhoz kapcsolt <L_N10/>-fiókok nem törlődnek, de az összekapcsolásuk megszűnik.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>A <L_N10/>-fiókod tartalmazza a <L_NEP/> vásárlási előzményeidet és aktuális egyenlegedet. A konzol visszaállítása után a <L_N10/>-fiókod újbóli összekapcsolásával újra letöltheted a fiókkal vásárolt szoftvereket és <L_DLC/> tartalmakat. (A már nem forgalmazott szoftverek bizonyos esetekben nem tölthetők le újra.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Ha a konzol hibája miatt használod ezt a lehetőséget:<TAG19/><NL/>Karbantartási módban a konzol a mentési adatok és felhasználói információk törlése nélkül is visszaállítható. Ha inkább ezt próbálnád meg, szakítsd meg a visszaállítást, majd végezd el ezeket a lépéseket:<TAG20/><NL/><L_D1/> <TAG21/>Kapcsold ki a konzolt.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>A kikapcsoláshoz nyisd meg a Tápellátás menüt (tartsd lenyomva a POWER gombot három másodpercig), majd válaszd a Tápellátási lehetőségek → Kikapcsolás pontot.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>A konzol bekapcsolásához tartsd lenyomva a hangerőnövelő (+) és hangerőcsökkentő (-) gombot a POWER gombbal együtt.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>A konzol Karbantartási módban indul el.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Válaszd a Konzol visszaállítása mentési adatok törlése nélkül lehetőséget, és kövesd az utasításokat.<TAG38/>"
