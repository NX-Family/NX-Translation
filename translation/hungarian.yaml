  target: "<L_DOT1/> <TAG1/>A letölthető szoftverek, amelyeket <TAG2/> vásárolt, újra letölthetők és játszhatók a célrendszeren.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>A képernyőképek és videók nem kerültek át, és az eredeti rendszeren maradtak.<TAG6/><TAG7/><NL/>További információért keresd fel a <L_N10/> támogatási weboldalát:<NL/><L_SNCT/>"
- source: "<L_DOT1/> <TAG1/>Games on physical game cards will <TAG2/>not appear<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Some software, like game demos, will not appear because they are not treated like game cards. <NL/><TAG7/><TAG8/>To play these titles, download them from <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software and downloadable content purchased using other accounts will not appear.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Hidden virtual game cards will not appear.<TAG19/>"
  target: "<L_DOT1/> <TAG1/>A fizikai játékkártyákon lévő játékok <TAG2/>nem jelennek meg<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Egyes szoftverek, például a játékdemók, nem jelennek meg, mert nem számítanak játékkártyának.<NL/><TAG7/><TAG8/>Ha játszani szeretnél velük, töltsd le őket innen: <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>A más fiókokkal vásárolt szoftverek és letölthető tartalmak nem jelennek meg.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>A rejtett virtuális játékkártyák nem jelennek meg.<TAG19/>"
- source: "<L_DOT1/><TAG1/>If a controller is on top of clothing or a soft object, like a pillow, the vibration may become difficult to hear. Please be as quiet as possible during the searching process.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Controllers that do not have a vibration feature cannot be searched for by using this method.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>If a controller is not vibrating, try moving the console closer to where you think it might be or try searching for the controller using a different console. Controllers may not vibrate if:<TAG8/><NL/><L_DSH/><TAG9/>They are too far away from the console.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>They are out of battery power or have low battery power.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>They are not paired to a console or are paired to a different console.<TAG16/><TAG17/>"
  target: "<L_DOT1/><TAG1/>Ha a vezérlő ruhán vagy puha tárgyon, például párnán van, a rezgés nehezen hallható. Keresés közben legyen minél nagyobb csend.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Rezgésfunkció nélküli vezérlők ezzel a módszerrel nem kereshetők.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Ha a vezérlő nem rezeg, vidd a konzolt közelebb ahhoz a helyhez, ahol a vezérlő lehet, vagy próbáld másik konzollal keresni. A vezérlők esetleg nem rezegnek, ha:<TAG8/><NL/><L_DSH/><TAG9/>Túl messze vannak a konzoltól.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>Lemerült vagy alacsony töltöttségű az akkumulátoruk.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>Nincsenek konzolhoz párosítva, vagy másik konzolhoz vannak párosítva.<TAG16/><TAG17/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try adding this network to your smartphone's <L_WIFI/> settings:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Security: <L_WAES/><NL/>Password: <TAG6/><NL/><TAG7/><TAG8/>This password will change each time you connect.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>If the access point does not change to your <L_NS/>, try temporarily disabling mobile data on your smartphone.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Visit the <L_N10/> Support website for more.<NL/><TAG17/><TAG18/>"
  target: "<L_DOT1/><TAG1/>Ha nem tudod beolvasni a QR-kódot, próbáld hozzáadni ezt a hálózatot az okostelefonod <L_WIFI/> beállításaihoz:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Biztonság: <L_WAES/><NL/>Jelszó: <TAG6/><NL/><TAG7/><TAG8/>A jelszó minden csatlakozáskor megváltozik.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>Ha a hozzáférési pont nem vált át a <L_NS/> konzolodra, próbáld ideiglenesen kikapcsolni a mobiladat-forgalmat az okostelefonodon.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>További információért keresd fel a <L_N10/> támogatási weboldalát.<NL/><TAG17/><TAG18/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try going to this URL on your smartphone's Internet browser:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>If the access point does not change to your <L_NS/> and no screenshots or videos display, try temporarily disabling mobile data on your smartphone.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Visit the <L_N10/> Support website for more information.<NL/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>Ha nem tudod beolvasni a QR-kódot, próbáld megnyitni ezt a címet az okostelefonod böngészőjében:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Ha a hozzáférési pont nem vált át a <L_NS/> konzolodra, és nem jelennek meg képernyőképek vagy videók, próbáld ideiglenesen kikapcsolni a mobiladat-forgalmat az okostelefonodon.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>További információért keresd fel a <L_N10/> támogatási weboldalát.<NL/><TAG9/><TAG10/>"
