  target: "Legalább egy felhasználó ikonján <0xE151/> jelzés látható a HOME menü bal felső sarkában.<TAG1/><NL/>Rendszerátvitel előtt javasoljuk, hogy nyisd meg minden érintett felhasználó oldalát, és olvasd el az ott megadott információkat.<TAG2/><NL/>A rendszerátvitel továbbra is elvégezhető, de az érintett felhasználók <L_N10/>-fiókja jelenleg nem használható. Ez bizonyos folyamatokban, például szoftverek letöltésekor hibát okozhat.<NL/><TAG3/><TAG4/>Ha mégis folytatod a rendszerátvitelt, a fontos adatok, például a mentési adatok nem vesznek el.<TAG5/><TAG6/>"
