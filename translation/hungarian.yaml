  target: "<L_DOT1/> <TAG1/>A letölthető szoftverek, amelyeket <TAG2/> vásárolt, újra letölthetők és játszhatók a célrendszeren.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>A képernyőképek és videók nem kerültek át, és az eredeti rendszeren maradtak.<TAG6/><TAG7/><NL/>További információért keresd fel a <L_N10/> támogatási weboldalát:<NL/><L_SNC/>"
