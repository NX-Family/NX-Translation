- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Virtuális játékkártyákat adhatsz kölcsön a családi csoport tagjainak, miután egymás közelébe viszitek és összekapcsoljátok a két rendszert.<TAG1/><NL/><L_DOT1/><TAG2/>A kölcsönadás idején a szoftver szabadon játszható a kölcsönvevő rendszerén, a kölcsönadó pedig átmenetileg elveszíti a hozzáférést.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtuális játékkártyák legfeljebb 14 napra vehetők kölcsön. A határidő elérésekor a kártya automatikusan visszakerül a kölcsönadóhoz.<NL/><TAG6/><TAG7/>A kölcsönadó a határidő előtt is visszaveheti virtuális játékkártyáit a kölcsönvevőktől.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Kölcsönvevőnként egy virtuális játékkártyát adhatsz kölcsön, egyszerre legfeljebb három kölcsönvevőnek. Egy adott rendszeren azonban egyszerre legfeljebb egy kártya vehető kölcsön.<NL/><TAG13/><TAG14/>Visszavétel után a virtuális játékkártya újra kölcsönadható.<TAG15/><TAG16/><TAG17/>"
