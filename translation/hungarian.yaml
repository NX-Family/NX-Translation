- source: "<L_CIRC/> Online Presence and Play Activity<NL/>Other users may be able to see your online presence and play activity.<NL/>You can change these settings at any time on your user page by selecting User Settings ⇒ Friend Settings. You may also choose not to share your online presence or play activity with anyone.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>By default, your online presence is only shared with friends, while your play activity is shared with all players. The play activity of children is only shared with their friends.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> News on <TAG8/><L_NS/><TAG9/><NL/>News will be delivered to your <TAG10/><L_NS/><TAG11/> console.<NL/>You can adjust your settings by returning to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System ⇒ Receive News."
  target: "<L_CIRC/> Online jelenlét és játéktevékenység<NL/>Más felhasználók láthatják az online jelenlétedet és játéktevékenységedet.<NL/>Ezeket a beállításokat bármikor módosíthatod a felhasználói oldaladon a Felhasználói beállítások ⇒ Barátbeállítások menüben. Azt is választhatod, hogy senkivel sem osztod meg online jelenlétedet vagy játéktevékenységedet.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>Alapértelmezés szerint az online jelenlétedet csak a barátaid látják, a játéktevékenységedet viszont minden játékos. A gyermekek játéktevékenységét csak a barátaik láthatják.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> Hírek a <TAG8/><L_NS/><TAG9/> konzolon<NL/>Híreket kapsz a <TAG10/><L_NS/><TAG11/> konzolodra.<NL/>A beállítások módosításához térj vissza a HOME menübe, majd válaszd a <0xE130/> (Rendszerbeállítások) ⇒ Rendszer ⇒ Hírek fogadása lehetőséget."
- source: "<L_D1/> <TAG1/>On the other system, open the HOME Menu and then select <0xE13D/> (Virtual Game Cards) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Bring the systems close to one another.<TAG6/>"
  target: "<L_D1/> <TAG1/>A másik rendszeren nyisd meg a HOME menüt, majd válaszd a <0xE13D/> (Virtuális játékkártyák) ⇒ <TAG2/> lehetőséget.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Helyezd a rendszereket egymás közelébe.<TAG6/>"
