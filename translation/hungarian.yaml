- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>A letölthető szoftverek, amelyeket <TAG2/> vásárolt, újra letölthetők és játszhatók a célrendszeren.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>A képernyőképek és videók nem kerültek át, és az eredeti rendszeren maradtak.<TAG6/><TAG7/><NL/>További információért keresd fel a <L_N10/> támogatási weboldalát:<NL/><L_NCOJ/>"
