  target: "S'ha produït un error a l'altra consola.<TAG1/><NL/>Demana a l'altre usuari que vagi al menú HOME de la seva consola, obri la seva pàgina d'usuari i comprovi l'estat del<L_XA0/>seu compte <L_N10/>.<NL/>Si el compte <L_N10/> d'un usuari no es pot fer servir, <0xE151/><L_XA0/>apareixerà sobre la seva icona<L_XA0/>d'usuari al menú HOME."
