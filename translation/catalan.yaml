- source: "\"Download Complete\" Notifications"
  target: "Notificacions de \"Descàrrega completada\""
- source: "\"Man, if only there was one place to go and find answers to all my questions about <L_NS/>!\"<NL/><NL/>That's what I was saying yesterday. Luckily, I guess a passing genie heard me and granted my wish, because I found the <L_N10/> Support Website!<NL/>It's got all kinds of super-detailed info on how to use the console, plus the latest on getting system updates and new features! Just enter the URL in your PC or smart device if you've got questions. Go check it out! <NL/>"
  target: "\"Tant de bo hi hagués un sol lloc on trobar respostes a tots els meus dubtes sobre <L_NS/>!\"<NL/><NL/>Això deia ahir. Per sort, un geni que passava per allà em devia sentir i concedir el desig, perquè vaig trobar el web d'assistència de <L_N10/>!<NL/>Hi ha tota mena d'informació molt detallada sobre l'ús de la consola, a més de les últimes novetats sobre actualitzacions del sistema i funcions noves. Si tens dubtes, introdueix l'URL a l'ordinador o dispositiu intel·ligent. Fes-hi un cop d'ull! <NL/>"
- source: "(Gameplay restrictions only)"
  target: "(Només restriccions de joc)"
- source: "(Hold)"
  target: "(Mantén premut)"
- source: "(Oh, and when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. The game card slot is kind of hidden too. Check the top right of the screen!<NL/>"
  target: "(Ah, per treure la targeta <L_MSD/>, prem-la fins que sentis un clic abans d'estirar-la. Per tornar-la a posar, fes el mateix i prem fins que sentis el clic.)<NL/><NL/>Gaudeix del joc,<NL/>Amelia N.<NL/><NL/>P. D. La ranura de la targeta de joc també està una mica amagada. Mira a la part superior dreta de la pantalla!<NL/>"
- source: "(Oh, but be sure to turn the console off when you remove or insert a <L_MSD/> card.)<NL/><NL/>(Oh, oh! And when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming!<NL/>Amelia N.<NL/><NL/>P.S. If you're not sure what kind of SD card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" They should be able to take care of you."
  target: "(Ah, assegura't d'apagar la consola abans de treure o inserir una targeta <L_MSD/>.)<NL/><NL/>(I per treure la targeta <L_MSD/>, prem-la fins que sentis un clic abans d'estirar-la. Per tornar-la a posar, fes el mateix i prem fins que sentis el clic.)<NL/><NL/>Gaudeix del joc!<NL/>Amelia N.<NL/><NL/>P. D. Si no saps quina targeta SD comprar, demana una \"targeta de classe <L_UHSI/> o superior del tipus <L_MSD/>\". Et podran ajudar."
- source: "*This feature is available with compatible software.<NL/><NL/>P.S. If you're not sure what kind of <L_MSD/> card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" The folks at the store should know what you mean.<NL/><NL/>"
  target: "*Aquesta funció està disponible amb programari compatible.<NL/><NL/>P. D. Si no saps quina targeta <L_MSD/> comprar, demana una \"targeta de classe <L_UHSI/> o superior del tipus <L_MSD/>\". A la botiga sabran què vols dir.<NL/><NL/>"
