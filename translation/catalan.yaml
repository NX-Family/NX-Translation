- source: "If any of your <TAG1/><L_N3D/><TAG2/> friends (<0xE131/>) also use <TAG3/><L_NS/><TAG4/>, they will be suggested as friends here.<NL/><TAG5/><TAG6/>Your friends must have <TAG7/><L_N3D/><TAG8/> friend suggestions enabled on their user page as well.<TAG9/><TAG10/>"
  target: "Si algun dels teus amics de <TAG1/><L_N3D/><TAG2/> (<0xE131/>) també fa servir <TAG3/><L_NS/><TAG4/>, se't suggerirà com a amic aquí.<NL/><TAG5/><TAG6/>Els teus amics també han de tenir activats els suggeriments d'amics de <TAG7/><L_N3D/><TAG8/> a la seva pàgina d'usuari.<TAG9/><TAG10/>"
- source: "If any of your <TAG1/><L_WU/><TAG2/> friends (<0xE131/>) also use <TAG3/><L_NS/><TAG4/>, they will be suggested here.<NL/><TAG5/><TAG6/>Your friends must have <TAG7/><L_WU/><TAG8/> friend suggestions enabled on their user page as well.<TAG9/><TAG10/>"
  target: "Si algun dels teus amics de <TAG1/><L_WU/><TAG2/> (<0xE131/>) també fa servir <TAG3/><L_NS/><TAG4/>, se't suggerirà aquí.<NL/><TAG5/><TAG6/>Els teus amics també han de tenir activats els suggeriments d'amics de <TAG7/><L_WU/><TAG8/> a la seva pàgina d'usuari.<TAG9/><TAG10/>"
- source: "If any of your friends in smart-device apps such as <TAG1/><L_SMR/><TAG2/> also use <TAG3/><L_NS/><TAG4/>, they will be suggested as friends here.<NL/><TAG5/><TAG6/>Your smart-device apps must be linked to your <L_N10/> Account.<TAG7/><TAG8/>"
  target: "Si algun dels teus amics d'aplicacions per a dispositius intel·ligents, com <TAG1/><L_SMR/><TAG2/>, també fa servir <TAG3/><L_NS/><TAG4/>, se't suggerirà com a amic aquí.<NL/><TAG5/><TAG6/>Les teves aplicacions per a dispositius intel·ligents han d'estar vinculades al teu compte <L_N10/>.<TAG7/><TAG8/>"
- source: "If controllers can't be found"
  target: "Si no es troben els comandaments"
- source: "If redownloading did not<NL/>resolve the issue<L_DOT3/>"
  target: "Si tornar-lo a descarregar no<NL/>ha resolt el problema<L_DOT3/>"
- source: "If restoring the data did not<NL/>resolve the issue"
  target: "Si restaurar les dades no<NL/>ha resolt el problema"
- source: "If the <L_JC/> controllers run out of power, attach them to the console to charge them.<NL/><TAG1/><TAG2/>To fully charge the controllers, attach them to the console while it is charging. A full charge takes about three and a half hours.<TAG3/><TAG4/>"
  target: "Si els comandaments <L_JC/> es queden sense bateria, acobla'ls a la consola per carregar-los.<NL/><TAG1/><TAG2/>Per carregar-los del tot, acobla'ls a la consola mentre aquesta es carrega. Una càrrega completa triga unes tres hores i mitja.<TAG3/><TAG4/>"
- source: "If the <TAG1/><L_NS/><TAG2/> dock does not have a LAN port, you must connect a LAN adapter with USB support to use a wired connection."
  target: "Si la base de <TAG1/><L_NS/><TAG2/> no té cap port LAN, cal connectar un adaptador LAN compatible amb USB per fer servir una connexió per cable."
- source: "If the <TAG1/><L_NS/><TAG2/> dock has a LAN port, you can connect an Ethernet cable directly to the dock to use a wired connection."
  target: "Si la base de <TAG1/><L_NS/><TAG2/> té un port LAN, pots connectar-hi directament un cable Ethernet per fer servir una connexió per cable."
- source: "If the Import User Data from Another Console option is not displayed, finish setting up the console and then perform a system update by going to <0xE130/> (System Settings) ⇒ System from the HOME Menu."
  target: "Si no apareix l'opció Importa dades d'usuari d'una altra consola, acaba de configurar la consola i després actualitza el sistema des de <0xE130/> (Configuració del sistema) ⇒ Sistema, al menú HOME."
- source: "If the Match Version with Local Users option is not displayed on their console, they cannot use this feature right now because their system version is out of date.<TAG1/><NL/>Have them perform a system update by going to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System.<NL/><TAG2/><TAG3/><L_ROMB/> An Internet connection is required to perform a system update.<TAG4/><TAG5/>"
  target: "Si l'opció Iguala la versió amb usuaris locals no apareix a la seva consola, no poden fer servir aquesta funció ara perquè la seva versió del sistema està desactualitzada.<TAG1/><NL/>Demana'ls que actualitzin el sistema anant al menú HOME i triant <0xE130/> (Configuració del sistema) ⇒ Sistema.<NL/><TAG2/><TAG3/><L_ROMB/> Cal una connexió a Internet per actualitzar el sistema.<TAG4/><TAG5/>"
- source: "If the Match Version with Local Users option is not<NL/>displayed on their console"
  target: "Si l'opció Iguala la versió amb usuaris locals no<NL/>apareix a la seva consola"
- source: "If the Other System Isn't Available"
  target: "Si l'altra consola no està disponible"
- source: "If the Transfer Your User Data option is not displayed, please perform a system update from <0xE130/> (System Settings) ⇒ System."
  target: "Si no apareix l'opció Transfereix les dades d'usuari, actualitza el sistema des de <0xE130/> (Configuració del sistema) ⇒ Sistema."
- source: "If the network you have searched for cannot be found, please visit the <L_N10/> Support website.<NL/><L_NCOJ/>"
  target: "Si no es troba la xarxa que has cercat, visita el web d'assistència de <L_N10/>.<NL/><L_NCOJ/>"
- source: "If the network you have searched for cannot be found, please visit the <L_N10/> Support website.<NL/><L_SNC/>"
  target: "Si no es troba la xarxa que has cercat, visita el web d'assistència de <L_N10/>.<NL/><L_SNC/>"
- source: "If the network you have searched for cannot be found, please visit the website below from your smart device or PC.<NL/><L_SNSN/>"
  target: "Si no es troba la xarxa que has cercat, visita el web següent des d'un dispositiu intel·ligent o un ordinador.<NL/><L_SNSN/>"
- source: "If the network you have searched for cannot be found, please visit the website below using your smart device or PC.<NL/><L_SNC/>"
  target: "Si no es troba la xarxa que has cercat, visita el web següent des d'un dispositiu intel·ligent o un ordinador.<NL/><L_SNC/>"
- source: "If the player LEDs don't light up when you press a button, the controller is out of battery power. Charge the battery to use it."
  target: "Si els indicadors LED de jugador no s'encenen en prémer un botó, el comandament s'ha quedat sense bateria. Carrega-la per fer-lo servir."
- source: "If the problem is still not solved, please check the contact information on the <L_N10/> Support website."
  target: "Si el problema encara no s'ha resolt, consulta la informació de contacte al web d'assistència de <L_N10/>."
- source: "If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Si el problema persisteix, consulta el web d'assistència de <L_N10/>.<NL/><L_SNCE/>"
- source: "If the problem still occurs, try redownloading the software."
  target: "Si el problema es continua produint, prova de tornar a descarregar el programari."
- source: "If the selected button is mapped to one of the options below,<NL/>it is recommended that you use dual-controller grip."
  target: "Si el botó seleccionat està assignat a una de les opcions següents,<NL/>es recomana la subjecció amb dos comandaments."
- source: "If this option is enabled, downloads initiated from your PC or smartphone will start right away, even when the console is in sleep mode. Disabling this option will reduce the console's energy consumption during sleep mode while connected to the Internet.<TAG1/><NL/><L_ROMB/> <TAG2/>This will have an effect only when connected to the Internet via wired connection.<TAG3/>"
  target: "Si actives aquesta opció, les descàrregues iniciades des del teu ordinador o telèfon intel·ligent començaran de seguida, fins i tot amb la consola en repòs. Si la desactives, es reduirà el consum d'energia de la consola en repòs mentre estigui connectada a Internet.<TAG1/><NL/><L_ROMB/> <TAG2/>Això només té efecte amb una connexió a Internet per cable.<TAG3/>"
- source: "If this option is enabled, the <L_NS/> <L_PRO/> will communicate with the console via wired communication when connected to it using the USB charging cable. The <L_NFC/> touchpoint on the <L_PRO/> will be disabled while the controller is using wired communication."
  target: "Si actives aquesta opció, el <L_NS/> <L_PRO/> es comunicarà amb la consola per cable quan hi estigui connectat amb el cable de càrrega USB. El punt de contacte <L_NFC/> del <L_PRO/> es desactivarà mentre el comandament faci servir la comunicació per cable."
- source: "If this option is enabled, the console will wake from sleep mode when it is removed from the dock."
  target: "Si actives l'opció, la consola sortirà del repòs en treure-la de la base."
- source: "If this user is not selected in-game, he or she will be displayed as offline even if you are connected to the Internet."
  target: "Si no tries aquest usuari dins del joc, sortirà com a desconnectat encara que tinguis Internet."
- source: "If you are using the <L_NS/> Parental Controls app, you can exclude this software title from certain restrictions by adding it to a whitelist for the <L_NS/> console.<NL/><TAG1/><TAG2/>Whitelist settings can be changed in the <L_NS/> Parental Controls app by selecting Parental Controls ⇒ Restricted Features ⇒ Allow List.<TAG3/><TAG4/>"
  target: "Si fas servir l'aplicació <L_NS/> Parental Controls, pots excloure aquest títol de programari d'algunes restriccions afegint-lo a la llista de permesos de la consola <L_NS/>.<NL/><TAG1/><TAG2/>Pots canviar la configuració de la llista a l'aplicació <L_NS/> Parental Controls triant Control parental ⇒ Funcions restringides ⇒ Llista de permesos.<TAG3/><TAG4/>"
- source: "If you are using the <L_NS/> Parental Controls app, you can exclude this software title from certain restrictions by adding it to the allow list for the <L_NS/> console.<NL/><TAG1/><TAG2/>Allow-list settings can be changed in the <L_NS/> Parental Controls app by selecting Parental Controls ⇒ Restricted Features ⇒ Allow List.<TAG3/><TAG4/>"
  target: "Si fas servir l'aplicació <L_NS/> Parental Controls, pots excloure aquest títol de programari d'algunes restriccions afegint-lo a la llista de permesos de la consola <L_NS/>.<NL/><TAG1/><TAG2/>Pots canviar la configuració de la llista a l'aplicació <L_NS/> Parental Controls triant Control parental ⇒ Funcions restringides ⇒ Llista de permesos.<TAG3/><TAG4/>"
- source: "If you cannot connect to your network, please visit the <L_N10/> Support website.<NL/><L_SNC/>"
  target: "Si no et pots connectar a la xarxa, visita el web d'assistència de <L_N10/>.<NL/><L_SNC/>"
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen."
  target: "Si introdueixes el PIN amb el teclat numèric, assegura't que les persones del voltant no puguin veure la pantalla."
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen.<NL/><TAG1/><TAG2/>If you are using the console in TV mode, removing the console from the dock will allow you to enter your PIN without it being displayed on the TV.<TAG3/><TAG4/>"
  target: "Si introdueixes el PIN amb el teclat numèric, assegura't que les persones del voltant no puguin veure la pantalla.<NL/><TAG1/><TAG2/>Si fas servir la consola en mode TV, treure-la de la base et permetrà introduir el PIN sense que es mostri al televisor.<TAG3/><TAG4/>"
- source: "If you don't use the button above, just select <0xE133/> from the HOME Menu to visit <L_NEP/> any old time.<NL/><NL/>Oh! And you can also search in <L_NEP/> with different filters to find exactly what you're looking for.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Si no fas servir el botó de sobre, només cal triar <0xE133/> al menú HOME per visitar <L_NEP/> quan vulguis.<NL/><NL/>Ah! També pots cercar a <L_NEP/> amb diferents filtres per trobar exactament el que busques.<NL/><NL/>Gaudeix del joc,<NL/>Amelia N."
- source: "If you enable automatic backup, save data will be automatically backed up, even while the console is in sleep mode or after the software has been closed.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Si actives la còpia de seguretat automàtica, es faran còpies de seguretat de les dades desades automàticament, fins i tot amb la consola en repòs o després de tancar el programari.<NL/><TAG1/><TAG2/>Alguns programes no admeten aquesta funció.<TAG3/><TAG4/>"
- source: "If you enable automatic download, save data will automatically download to this console whenever the save data stored via the Save Data Cloud service is updated from another console. The save data on this console will be overwritten with the data from the server.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Si actives la descàrrega automàtica, les dades desades es descarregaran a aquesta consola cada vegada que les dades emmagatzemades al servei Dades desades al núvol s'actualitzin des d'una altra consola. Les dades desades d'aquesta consola se sobreescriuran amb les del servidor.<TAG1/><NL/><TAG2/>La primera descàrrega s'ha de fer manualment.<TAG3/>"
- source: "If you enable automatic download, you can easily pick up playing where you left off on another console.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Si actives la descàrrega automàtica, podràs continuar jugant fàcilment des d'on ho vas deixar en una altra consola.<TAG1/><NL/><TAG2/>La primera descàrrega s'ha de fer manualment.<TAG3/>"
- source: "If you enter the incorrect PIN <TAG1/><LIST1/>, you<NL/>will have to wait a while before attempting to enter it again."
  target: "Si introdueixes un PIN incorrecte <TAG1/><LIST1/>,<NL/>hauràs d'esperar una estona abans de tornar-lo a introduir."
- source: "If you forget your PIN, you can reset it by signing in to your <L_N10/> Account."
  target: "Si oblides el PIN, el pots restablir iniciant sessió al teu compte <L_N10/>."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/> system, you can use it to download your data from the server."
  target: "Si obtens una consola <L_N10/> <TAG1/><L_SWT2/><TAG2/>, la podràs fer servir per descarregar les teves dades del servidor."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
  target: "Si obtens una <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
- source: "If you have existing user data on another system, you can copy or transfer it to this system. Otherwise, create a new user."
  target: "Si ja tens dades d'usuari en una altra consola, les pots copiar o transferir a aquesta consola. Si no, crea un usuari nou."
- source: "If you have two systems, you can choose which system to play on by moving virtual game cards between them."
  target: "Si tens dues consoles, pots triar en quina vols jugar movent les targetes de joc virtuals entre totes dues."
- source: "If you link to a <L_N10/> Account, you can use various online features."
  target: "Si vincules un compte <L_N10/>, podràs usar diverses funcions en línia."
- source: "If you link to a <L_N10/> Account, you will see users who may want to become friends with you."
  target: "Si vincules un compte <L_N10/>, veuràs usuaris que potser es volen fer amics teus."
- source: "If you plan to keep using this system, stop here.<NL/>Once data is uploaded to the server, this system will be initialized."
  target: "Si vols continuar fent servir aquesta consola, atura't aquí.<NL/>Un cop les dades s'hagin pujat al servidor, la consola s'inicialitzarà."
- source: "If you plugged the AC<NL/>adapter into the console<NL/>earlier, disconnect it."
  target: "Si abans has connectat l'adaptador de CA<NL/>a la consola,<NL/>desconnecta'l."
- source: "If you turn Airplane Mode on, you will no<NL/>longer be able to use wireless controllers."
  target: "Si actives el Mode d'avió, ja no<NL/>podràs fer servir comandaments sense fil."
- source: "If you update and are still unable to use downloadable content or an upgrade pack, load the virtual game card from <0xE13D/> (Virtual Game Cards) on the HOME Menu."
  target: "Si després d'actualitzar encara no pots fer servir contingut descarregable o un paquet de millora, carrega la targeta de joc virtual des de <0xE13D/> (Targetes de joc virtuals) al menú HOME."
- source: "If you'd rather download data for a specific user at a later time, uncheck that user. To download the data, go to the <TAG1/>HOME Menu<TAG2/> and open the Options menu for the software, then select <TAG3/>Save Data Cloud<TAG4/>."
  target: "Si prefereixes descarregar les dades d'un usuari concret més endavant, desmarca'l. Per descarregar-les, ves al <TAG1/>menú HOME<TAG2/>, obre el menú Opcions del programari i tria <TAG3/>Dades desades al núvol<TAG4/>."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Si mai no has posat una targeta <L_MSD/> a la consola, mira al voltant i prova de trobar-ne la ranura. Està una mica amagada. <NL/><NL/>Et rendeixes? Una pista. Has fet servir mai el suport del darrere de la consola? <NL/><NL/>Obre'l i trobaràs on s'amaga! Pots comprar una targeta <L_MSD/> si et preocupa quedar-te sense espai per al programari, el <L_DLC/> i altres dades."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand, and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Si mai no has posat una targeta <L_MSD/> a la consola, mira al voltant i prova de trobar-ne la ranura. Està una mica amagada. <NL/><NL/>Et rendeixes? Una pista. Has fet servir mai el suport del darrere de la consola? <NL/><NL/>Obre'l i trobaràs on s'amaga! Pots comprar una targeta <L_MSD/> si et preocupa quedar-te sense espai per al programari, el <L_DLC/> i altres dades."
- source: "If your save data is backed up, the save data for supported software on your console has been stored via the Save Data Cloud service.<TAG1/><NL/>If your data is waiting to back up, the save data on your console will be automatically stored via the Save Data Cloud service once the console enters sleep mode, provided it is connected to the Internet.<TAG2/><NL/>Select a user to view more details or manually back up or download data."
  target: "Si les teves dades desades tenen una còpia de seguretat, les dades del programari compatible de la consola s'han emmagatzemat al servei Dades desades al núvol.<TAG1/><NL/>Si les dades estan pendents de còpia de seguretat, s'emmagatzemaran automàticament al servei Dades desades al núvol quan la consola entri en repòs, sempre que estigui connectada a Internet.<TAG2/><NL/>Tria un usuari per veure'n més detalls o per fer una còpia de seguretat o descarregar dades manualment."
- source: "If your virtual game cards are not appearing, open the HOME Menu and select <0xE13D/> (Virtual Game Cards)."
  target: "Si no apareixen les teves targetes de joc virtuals, obre el menú HOME i tria <0xE13D/> (Targetes de joc virtuals)."
- source: "Ignore and Continue"
  target: "Ignora i continua"
- source: "Image Output Source"
  target: "Font de sortida d'imatge"
- source: "Import User Data from Another Console"
  target: "Importa dades d'usuari d'una altra consola"
