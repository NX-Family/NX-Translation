- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Ah, no pots ajustar la brillantor de la pantalla quan la consola està connectada a un televisor.<NL/>I si vols canviar la configuració sense fil, ves al menú HOME i tria <0xE130/> (Configuració del sistema) ⇒ Mode d'avió.<NL/><NL/>Gaudeix del joc,<NL/>Amelia N."
