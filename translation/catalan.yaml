- source: "Entering your Parental Controls PIN will temporarily disable all restrictions until <NL/>the console is put into sleep mode or until Parental Controls are enabled again.<TAG1/><NL/>All features that may have been restricted by Parental Controls will be available:<NL/><L_DOT1/><TAG2/>Enables all software.<TAG3/><NL/><L_DOT1/><TAG4/>Enables posting of screenshots and videos to social media.<TAG5/><NL/><L_DOT1/><TAG6/>Enables communication with others.<TAG7/><NL/><L_DOT1/><TAG8/>Enables VR mode.<TAG9/><NL/><L_DOT1/><TAG10/>Disables any play timer set using the <TAG11/><L_NS/><TAG12/> Parental Controls app.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>As all Parental Controls restrictions will be lifted, please be mindful when your child is playing<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
  target: "En introduir el PIN de control parental, totes les restriccions es desactivaran temporalment fins que <NL/>la consola entri en repòs o es torni a activar el control parental.<TAG1/><NL/>Totes les funcions que el control parental podia haver restringit estaran disponibles:<NL/><L_DOT1/><TAG2/>S'habilita tot el programari.<TAG3/><NL/><L_DOT1/><TAG4/>Es permet publicar captures de pantalla i vídeos a les xarxes socials.<TAG5/><NL/><L_DOT1/><TAG6/>Es permet comunicar-se amb altres persones.<TAG7/><NL/><L_DOT1/><TAG8/>S'habilita el mode VR.<TAG9/><NL/><L_DOT1/><TAG10/>Es desactiva qualsevol temporitzador de joc establert amb l'aplicació <TAG11/><L_NS/><TAG12/> Parental Controls.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>Com que s'eliminaran totes les restriccions de control parental, estigues atent mentre l'infant jugui amb<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
