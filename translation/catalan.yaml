  target: "Això restringirà el joc en mode VR.<TAG1/><NL/>Tria Restringit si un infant de 6 anys o menys fa servir aquesta consola.<TAG2/><NL/>Per a més informació sobre el mode VR, visita el web d'assistència de <L_N10/>.<NL/><TAG3/>"
- source: "This will restrict open communication between users, including sending and receiving messages and images.<TAG1/><NL/>Depending on the software, the following activities will be restricted:<TAG2/><NL/><L_DOT1/><TAG3/>Sending and receiving messages and using chat features.<TAG4/><NL/><L_DOT1/><TAG5/>Reading and sharing profile information that allows users to enter their own text.<TAG6/><NL/><L_DOT1/><TAG7/>Viewing and sharing images that users have created, possibly including text.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Use of applications operating outside of <L_NS/>, such as <L_NS/> App, will not be restricted. If you would like to set restrictions on the app, please do so using your smart device.<TAG12/><TAG13/>"
  target: "Això limitarà la comunicació oberta entre usuaris, incloent-hi l'enviament i la recepció de missatges i imatges.<TAG1/><NL/>Segons el programa, es limitaran aquestes activitats:<TAG2/><NL/><L_DOT1/> <TAG3/>Enviar i rebre missatges i usar el xat.<TAG4/><NL/><L_DOT1/> <TAG5/>Llegir i compartir dades de perfil amb text escrit pels usuaris.<TAG6/><NL/><L_DOT1/> <TAG7/>Veure i compartir imatges creades pels usuaris, potser amb text.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>No es limitaran les aplicacions externes a <L_NS/>, com l'aplicació <L_NS/>. Per limitar l'aplicació, usa el dispositiu intel·ligent.<TAG12/><TAG13/>"
