  target: "També es pot autenticar el programari en línia, sense una targeta de joc virtual.<NL/>Per fer-ho, ves al <TAG1/>menú HOME<TAG2/>, obre la teva pàgina d'usuari i tria Configuració d'usuari ⇒ <TAG3/>Configuració de llicències en línia.<TAG4/>"
- source: "Software cannot be moved while it is in use."
  target: "No es pot moure el programa mentre s'usa."
