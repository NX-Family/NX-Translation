  target: "<L_DASH/> minuts restants"
- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>Els jocs rebuts en préstec es retornaran al cap de 14 dies.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Apropa les consoles per compartir-los.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>És possible que alguns programes no admetin préstecs.<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>El programari descarregable comprat per <TAG2/> es pot tornar a descarregar i jugar a la consola de destinació.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Les captures de pantalla i els vídeos no s'han transferit i continuen a la consola original.<TAG6/><TAG7/><NL/>Per a més informació, visita el web d'assistència de <L_N10/>:<NL/><L_NCOJ/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_SNC/>"
  target: "<L_DOT1/> <TAG1/>El programari descarregable comprat per <TAG2/> es pot tornar a descarregar i jugar a la consola de destinació.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Les captures de pantalla i els vídeos no s'han transferit i continuen a la consola original.<TAG6/><TAG7/><NL/>Per a més informació, visita el web d'assistència de <L_N10/>:<NL/><L_SNC/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_SNCT/>"
  target: "<L_DOT1/> <TAG1/>El programari descarregable comprat per <TAG2/> es pot tornar a descarregar i jugar a la consola de destinació.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Les captures de pantalla i els vídeos no s'han transferit i continuen a la consola original.<TAG6/><TAG7/><NL/>Per a més informació, visita el web d'assistència de <L_N10/>:<NL/><L_SNCT/>"
- source: "<L_DOT1/> <TAG1/>Games on physical game cards will <TAG2/>not appear<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Some software, like game demos, will not appear because they are not treated like game cards. <NL/><TAG7/><TAG8/>To play these titles, download them from <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software and downloadable content purchased using other accounts will not appear.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Hidden virtual game cards will not appear.<TAG19/>"
  target: "<L_DOT1/> <TAG1/>Els jocs en targetes de joc físiques <TAG2/>no apareixeran<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Alguns programes, com les demostracions de jocs, no apareixeran perquè no es tracten com a targetes de joc. <NL/><TAG7/><TAG8/>Per jugar-hi, descarrega'ls de <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>El programari i el contingut descarregable comprats amb altres comptes no apareixeran.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Les targetes de joc virtuals ocultes no apareixeran.<TAG19/>"
- source: "<L_DOT1/><TAG1/>If a controller is on top of clothing or a soft object, like a pillow, the vibration may become difficult to hear. Please be as quiet as possible during the searching process.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Controllers that do not have a vibration feature cannot be searched for by using this method.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>If a controller is not vibrating, try moving the console closer to where you think it might be or try searching for the controller using a different console. Controllers may not vibrate if:<TAG8/><NL/><L_DSH/><TAG9/>They are too far away from the console.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>They are out of battery power or have low battery power.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>They are not paired to a console or are paired to a different console.<TAG16/><TAG17/>"
  target: "<L_DOT1/><TAG1/>Si un comandament és sobre roba o un objecte tou, com un coixí, pot costar sentir-ne la vibració. Fes el mínim soroll possible durant la cerca.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Aquest mètode no permet cercar comandaments sense funció de vibració.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Si un comandament no vibra, apropa la consola al lloc on creus que és o prova de cercar-lo amb una altra consola. Els comandaments poden no vibrar si:<TAG8/><NL/><L_DSH/><TAG9/>Són massa lluny de la consola.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>Tenen poca bateria o estan descarregats.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>No estan aparellats amb cap consola o ho estan amb una altra.<TAG16/><TAG17/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try adding this network to your smartphone's <L_WIFI/> settings:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Security: <L_WAES/><NL/>Password: <TAG6/><NL/><TAG7/><TAG8/>This password will change each time you connect.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>If the access point does not change to your <L_NS/>, try temporarily disabling mobile data on your smartphone.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Visit the <L_N10/> Support website for more.<NL/><TAG17/><TAG18/>"
  target: "<L_DOT1/><TAG1/>Si no pots escanejar el codi QR, prova d'afegir aquesta xarxa a la configuració de <L_WIFI/> del telèfon intel·ligent:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Seguretat: <L_WAES/><NL/>Contrasenya: <TAG6/><NL/><TAG7/><TAG8/>La contrasenya canviarà a cada connexió.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>Si el punt d'accés no canvia a la teva <L_NS/>, prova de desactivar temporalment les dades mòbils del telèfon intel·ligent.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Per a més informació, visita el web d'assistència de <L_N10/>.<NL/><TAG17/><TAG18/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try going to this URL on your smartphone's Internet browser:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>If the access point does not change to your <L_NS/> and no screenshots or videos display, try temporarily disabling mobile data on your smartphone.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Visit the <L_N10/> Support website for more information.<NL/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>Si no pots escanejar el codi QR, prova d'obrir aquest URL al navegador d'Internet del telèfon intel·ligent:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Si el punt d'accés no canvia a la teva <L_NS/> i no es mostren captures de pantalla ni vídeos, prova de desactivar temporalment les dades mòbils del telèfon intel·ligent.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Per a més informació, visita el web d'assistència de <L_N10/>.<NL/><TAG9/><TAG10/>"
- source: "<L_DOT1/><TAG1/>Only invites from the last 10 days will be displayed.<TAG2/><NL/><L_DOT1/><TAG3/>You may be unable to join in certain cases, like if the inviter exits online play before you can join.<TAG4/><NL/><L_DOT1/><TAG5/>Invites can be sent only from supporting software.<TAG6/>"
  target: "<L_DOT1/><TAG1/>Només es mostraran les invitacions dels últims 10 dies.<TAG2/><NL/><L_DOT1/><TAG3/>Potser no t'hi podràs unir en alguns casos, com ara si qui t'ha convidat surt del joc en línia abans que t'hi uneixis.<TAG4/><NL/><L_DOT1/><TAG5/>Només es poden enviar invitacions des de programari compatible.<TAG6/>"
- source: "<L_DOT1/><TAG1/>You will need to use a USB cable that supports data transfer (sold separately).<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Connect your <L_NS/> directly to the computer via USB cable. (The USB ports on the dock do not support this feature.)<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Visit the <L_N10/> Support website for more information.<NL/><TAG8/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>Cal un cable USB que admeti la transferència de dades (venut per separat).<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Connecta la teva <L_NS/> directament a l'ordinador amb el cable USB. (Els ports USB de la base no admeten aquesta funció.)<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Per a més informació, visita el web d'assistència de <L_N10/>.<NL/><TAG8/><TAG9/><TAG10/>"
