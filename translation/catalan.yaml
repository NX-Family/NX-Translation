- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be uploaded to the server.<TAG7/><NL/><L_DOT1/> <TAG8/>After uploading the data to the server, this system will be initialized, restoring it to factory defaults and erasing all data in system memory.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target system downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG11/><TAG12/><NL/>When a system transfer is started, people with <L_N10/> Accounts on the system, along with any supervising parent/guardian users, will get updates about the transfer in the following places:<TAG13/><NL/><L_DOT1/> <TAG14/>The e-mail linked to their <L_N10/> Account<TAG15/><NL/><L_DOT1/> <TAG16/>Their account settings on the <L_N10/> Account website (<TAG17/>)<TAG18/><TAG19/><NL/>Updates will note that you started a transfer and will include your nickname and icon.<TAG20/>"
  target: "<L_SQR/> <TAG1/>Sobre les dades d'altres usuaris<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Les dades dels altres usuaris es transferiran amb les dades del sistema.<NL/>Abans d'iniciar la transferència, comparteix aquesta informació amb tothom que faci servir aquesta mateixa consola.<TAG5/><NL/><L_DOT1/> <TAG6/>Totes les dades d'usuari d'aquesta consola es pujaran al servidor.<TAG7/><NL/><L_DOT1/> <TAG8/>Després de pujar les dades al servidor, la consola s'inicialitzarà. Es restabliran els valors de fàbrica i s'esborraran totes les dades de la memòria del sistema.<TAG9/><NL/><L_DOT1/> <TAG10/>Quan la consola de destinació descarregui les dades de la transferència, iniciarà sessió automàticament als comptes <L_N10/> vinculats a la consola d'origen.<TAG11/><TAG12/><NL/>En iniciar una transferència del sistema, els titulars de comptes <L_N10/> d'aquesta consola i els pares o tutors supervisors rebran novetats sobre la transferència als llocs següents:<TAG13/><NL/><L_DOT1/> <TAG14/>El correu electrònic vinculat al seu compte <L_N10/><TAG15/><NL/><L_DOT1/> <TAG16/>La configuració del seu compte al web del compte <L_N10/> (<TAG17/>)<TAG18/><TAG19/><NL/>Les novetats indicaran que has iniciat una transferència i inclouran el teu àlies i la teva icona.<TAG20/>"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with<L_XA0/>everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be transferred to the target <L_N10/> <TAG7/><L_SWT2/><TAG8/> system.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target <L_N10/> <TAG11/><L_SWT2/><TAG12/> downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG13/><TAG14/><NL/>When starting a system transfer, people with <L_N10/> Accounts on this system, along with any supervising parent/guardian users, will get updates in the following places:<TAG15/><NL/><L_DOT1/> <TAG16/>The e-mail linked to their <L_N10/> Account<TAG17/><NL/><L_DOT1/> <TAG18/>Their account settings on the <L_N10/> Account website (<TAG19/>)<TAG20/><TAG21/><NL/>Updates will note a transfer was started and will include the nickname and icon of the user who started the transfer.<TAG22/>"
  target: "<L_SQR/> <TAG1/>Sobre les dades d'altres usuaris<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Les dades dels altres usuaris es transferiran amb les dades del sistema.<NL/>Abans d'iniciar la transferència, comparteix aquesta informació amb<L_XA0/>tothom que faci servir aquesta mateixa consola.<TAG5/><NL/><L_DOT1/> <TAG6/>Totes les dades d'usuari d'aquesta consola es transferiran a la consola <L_N10/> <TAG7/><L_SWT2/><TAG8/> de destinació.<TAG9/><NL/><L_DOT1/> <TAG10/>Quan la <L_N10/> <TAG11/><L_SWT2/><TAG12/> de destinació descarregui les dades de la transferència, iniciarà sessió automàticament als comptes <L_N10/> vinculats a la consola d'origen.<TAG13/><TAG14/><NL/>En iniciar una transferència del sistema, els titulars de comptes <L_N10/> d'aquesta consola i els pares o tutors supervisors rebran novetats als llocs següents:<TAG15/><NL/><L_DOT1/> <TAG16/>El correu electrònic vinculat al seu compte <L_N10/><TAG17/><NL/><L_DOT1/> <TAG18/>La configuració del seu compte al web del compte <L_N10/> (<TAG19/>)<TAG20/><TAG21/><NL/>Les novetats indicaran que s'ha iniciat una transferència i inclouran l'àlies i la icona de l'usuari que l'ha iniciat.<TAG22/>"
- source: "<L_SQR/> <TAG1/>To <L_N10/> Account holders using this console:<TAG2/><TAG3/><NL/>If you initialize this console using this method, unlike the standard initialization, you will be unable to eject any loaded virtual game cards.<NL/>Additionally, this console will remain linked to your account and will be able to use any passes available for associated software.<TAG4/><NL/>If you want to continue using your <L_N10/> Account with this <L_NS/> console, relink your <L_N10/> Account to this console after it has been initialized.<TAG5/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG6/>"
  target: "<L_SQR/> <TAG1/>Per als titulars de comptes <L_N10/> que fan servir aquesta consola:<TAG2/><TAG3/><NL/>Si inicialitzes la consola amb aquest mètode, a diferència de la inicialització normal, no podràs expulsar cap targeta de joc virtual carregada.<NL/>A més, la consola continuarà vinculada al teu compte i podrà fer servir els passis disponibles per al programari associat.<TAG4/><NL/>Per continuar fent servir el compte <L_N10/> amb aquesta consola <L_NS/>, torna a vincular el compte <L_N10/> a la consola després d'inicialitzar-la.<TAG5/><NL/>Per a més informació, visita el web d'assistència de <L_N10/>.<NL/><TAG6/>"
- source: "<L_SQR/> Help<TAG1/><NL/>Go to the HOME Menu, open your user page in the top-left corner, and select User Settings ⇒ User‑Verification Settings ⇒ <TAG2/> Help. From there, you can sign in to your <L_N10/> Account and reset your PIN with the I<L_XA0/>Can't Remember My PIN option."
  target: "<L_SQR/> Ajuda<TAG1/><NL/>Ves al menú HOME, obre la teva pàgina d'usuari a l'extrem superior esquerre i tria Configuració d'usuari ⇒ Configuració de verificació de l'usuari ⇒ <TAG2/> Ajuda. Des d'allà, pots iniciar sessió al compte <L_N10/> i restablir el PIN amb l'opció No<L_XA0/>recordo el PIN."
- source: "<L_SQR/> Important Information<TAG1/><NL/>Data sent to the server, such as save data, screenshots, and<NL/>videos, will be returned to this system. However, some data<NL/>may not appear exactly as it did previously. For example:<TAG2/><NL/><L_DOT1/> <TAG3/>Software icons on the HOME Menu will not be restored.<NL/>Group settings for All Software will also be erased.<NL/><TAG4/><TAG5/>Purchased downloadable software and <L_DLC/> will not be lost.<NL/>To redownload purchased software, load its virtual game card.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Any link to the <L_NS/> Parental Controls app<NL/>will be removed. You can relink the app at a later time.<TAG11/>"
  target: "<L_SQR/> Informació important<TAG1/><NL/>Les dades enviades al servidor, com dades desades, captures de pantalla i<NL/>vídeos, tornaran a aquesta consola. Ara bé, algunes dades<NL/>potser no apareixeran exactament com abans. Per exemple:<TAG2/><NL/><L_DOT1/> <TAG3/>No es restauraran les icones del programari al menú HOME.<NL/>També s'esborrarà la configuració dels grups de Tot el programari.<NL/><TAG4/><TAG5/>El programari descarregable i el <L_DLC/> comprats no es perdran.<NL/>Per tornar a descarregar programari comprat, carrega'n la targeta de joc virtual.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>S'eliminarà qualsevol vincle amb l'aplicació <L_NS/> Parental Controls.<NL/>La podràs tornar a vincular més endavant.<TAG11/>"
- source: "<L_SQR/> Lending and Borrowing<TAG1/><NL/><L_DOT1/> <TAG2/>Borrowed games will be returned after 14 days.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>You can borrow only one virtual game card at a time.<TAG6/>"
  target: "<L_SQR/> Deixar i rebre en préstec<TAG1/><NL/><L_DOT1/> <TAG2/>Els jocs rebuts en préstec es retornaran al cap de 14 dies.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Només pots rebre una targeta de joc virtual en préstec alhora.<TAG6/>"
