  target: "Permet descarregar automàticament les <TAG1/>dades desades<TAG2/> més recents.<NL/><TAG3/><TAG4/>També pots canviar aquest ajust més endavant a <0xE130/> (Configuració del sistema) ⇒ Gestió de dades ⇒ Dades desades al núvol, al menú HOME.<TAG5/><TAG6/>"
