- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Juntament amb la consola <L_NS/>, <L_N10/> va incloure components per connectar-la al televisor. Així pots gaudir dels jocs a la pantalla gran:<NL/><NL/>Primer, busca la base de <L_NS/>, l'adaptador de CA i el cable <L_HDMI/>. <NL/><NL/>Després, obre la tapa posterior de la base i connecta l'adaptador de CA. <NL/><NL/>A continuació, connecta la base al televisor amb el cable <L_HDMI/>.<NL/><NL/><L_DOT3S/>Ja està! Si vols fer servir els comandaments <L_JC/> per separat, desacobla'ls. Després, introdueix la consola <L_NS/> a la base i la imatge hauria d'aparèixer al televisor com per art de màgia."
