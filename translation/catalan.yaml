- source: "All data in the system memory, including software data, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> <TAG2/>Please note:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>The system version will not be changed.<TAG9/>"
  target: "S'eliminaran totes les dades de la memòria del sistema, incloses les dades de programari, les dades desades, les captures de pantalla, els vídeos i la informació dels usuaris. La consola tornarà als valors de fàbrica.<TAG1/><NL/><L_SQR/> <TAG2/>Tingues en compte el següent:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Totes les dades de programari desades a la targeta <L_MSD/>, excepte les captures de pantalla i els vídeos, quedaran inutilitzables. (Les dades de la targeta <L_MSD/> no s'eliminaran.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>La versió del sistema no canviarà.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "S'eliminaran totes les dades de la memòria del sistema, inclosos el programari, les dades desades, les captures de pantalla, els vídeos i la informació dels usuaris. La consola tornarà als valors de fàbrica.<TAG1/><NL/><L_SQR/> Tingues en compte el següent:<TAG2/><NL/><L_DOT1/><TAG3/>Tot el programari desat a la targeta <L_MSD/>, excepte les captures de pantalla i els vídeos, quedarà inutilitzable. (Les dades de la targeta <L_MSD/> no s'eliminaran.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>La versió del sistema no canviarà.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Els comptes <L_N10/> vinculats a aquesta consola no s'eliminaran, però es desvincularan.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>El teu compte <L_N10/> conté l'historial de compres i el saldo actual de <L_NEP/>. Si tornes a vincular el compte <L_N10/> després d'inicialitzar la consola, podràs tornar a descarregar el programari i el <L_DLC/> comprats amb aquest compte. (És possible que el programari retirat no es pugui tornar a descarregar en alguns casos.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Si fas servir aquesta opció per un problema amb la consola:<TAG19/><NL/>El Mode de manteniment permet inicialitzar la consola sense eliminar dades desades ni informació dels usuaris. Si vols provar aquesta alternativa, cancel·la la inicialització i fes el següent:<TAG20/><NL/><L_D1/> <TAG21/>Apaga la consola.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>Per apagar la consola, obre el menú d'energia (mantén premut el botó POWER durant tres segons) i tria Opcions d'energia → Apaga.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Mantén premuts els botons d'apujar (+) i abaixar (-) el volum juntament amb el botó POWER per encendre la consola.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>La consola s'iniciarà en Mode de manteniment.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Tria Inicialitza la consola sense esborrar dades desades i segueix les instruccions.<TAG38/>"
- source: "All data on the <L_MSD/> card will be deleted, and it will be formatted so that it can be used with this console."
