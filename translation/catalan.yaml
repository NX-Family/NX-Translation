- source: "At least one user has an <0xE151/> mark on their user icon in the top left of the HOME Menu.<TAG1/><NL/>Before starting a system transfer, we recommend that you open the user page for each affected user and review the information provided.<TAG2/><NL/>While it's still possible to perform a system transfer, the <L_N10/> Accounts for the affected user or users are currently unusable, which may cause errors in some processes, including downloading software.<NL/><TAG3/><TAG4/>If you choose to proceed with the system transfer anyway, important data like save data will not be lost.<TAG5/><TAG6/>"
  target: "Almenys un usuari té una marca <0xE151/> sobre la seva icona d'usuari, a la part superior esquerra del menú HOME.<TAG1/><NL/>Abans d'iniciar una transferència del sistema, et recomanem que obris la pàgina de cada usuari afectat i revisis la informació que s'hi mostra.<TAG2/><NL/>Encara es pot fer la transferència del sistema, però ara no es poden fer servir els comptes <L_N10/> dels usuaris afectats. Això pot causar errors en alguns processos, com la descàrrega de programari.<NL/><TAG3/><TAG4/>Si decideixes continuar igualment amb la transferència del sistema, no perdràs dades importants com les dades desades.<TAG5/><TAG6/>"
