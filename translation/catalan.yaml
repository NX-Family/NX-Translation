- source: "Have you been by <L_NEP/> yet? It's great!<NL/>You can browse, buy, and download games right from your console. And it's easy to get started: just link or create a <L_N10/> Account, and be sure your console is connected to the Internet. Then head to <L_NEP/> and have fun.<NL/><NL/>It's always chock full of games for every kind of taste and any budget, plus a bunch of free content like game trailers and demos. See which games are most popular with other fans or check out the newest releases. It's all waiting on <L_NEP/>!"
  target: "Ja has visitat <L_NEP/>? És genial!<NL/>Pots explorar, comprar i descarregar jocs directament des de la consola. Començar és fàcil. Només cal vincular o crear un compte <L_N10/> i assegurar-te que la consola estigui connectada a Internet. Després, entra a <L_NEP/> i diverteix-te.<NL/><NL/>Sempre hi ha un munt de jocs per a tots els gustos i pressupostos, a més de molt contingut gratuït, com tràilers i demostracions de jocs. Mira quins jocs són més populars entre altres aficionats o descobreix els últims llançaments. Tot t'espera a <L_NEP/>!"
- source: "Have you ever found yourself thinking \"Hmm<L_DOT3/> The screen's a little dark\" or \"Why can't I just put the console to sleep right from the game?\"<NL/>If so, say hello to Quick Settings!<NL/><NL/>I hear you asking, \"Quick Settings? What are those?\" Allow me to demonstrate!<NL/><NL/>Just hold <0xE0B9/> and a screen will pop up that lets you easily get at some frequently used features.<NL/><NL/>\"What features?\" It's like I'm in your head with you, isn't it? Check these out:<NL/><L_DOT1/>Put the console to sleep<NL/><L_DOT1/>Adjust screen brightness<NL/><L_DOT1/>Turn Airplane Mode ON and OFF<NL/><NL/>Give it a try sometime! It's super-handy."
  target: "Has pensat mai \"Hmm<L_DOT3/> La pantalla és una mica fosca\" o \"Per què no puc posar la consola en repòs directament des del joc?\"<NL/>Doncs et presento la Configuració ràpida!<NL/><NL/>Ja et sento preguntar: \"Configuració ràpida? Què és això?\" Deixa que t'ho ensenyi!<NL/><NL/>Només cal mantenir premut <0xE0B9/> i apareixerà una pantalla que et permet accedir fàcilment a algunes funcions habituals.<NL/><NL/>\"Quines funcions?\" Sembla que et llegeixi el pensament, oi? Mira aquestes:<NL/><L_DOT1/>Posar la consola en repòs<NL/><L_DOT1/>Ajustar la brillantor de la pantalla<NL/><L_DOT1/>Activar i desactivar el Mode d'avió<NL/><NL/>Prova-ho! És molt pràctic."
- source: "Have you ever found yourself thinking, \"Hmm<L_DOT3/> The screen's a little dark\" or \"Why can't I just put the console to sleep right from the game?\"<NL/>If so, say hello to Quick Settings!<NL/><NL/>I hear you asking, \"Quick Settings? What are those?\" Allow me to demonstrate!<NL/><NL/>Just hold <0xE0B9/>, and a screen will pop up that lets you easily get at some frequently used features.<NL/><NL/>\"What features?\" It's like I'm in your head with you, isn't it? Check these out:<NL/><L_DOT1/>Put the console to sleep<NL/><L_DOT1/>Adjust screen brightness<NL/><L_DOT1/>Turn Airplane Mode ON and OFF<NL/><NL/>Give it a try sometime! It's super handy."
  target: "Has pensat mai \"Hmm<L_DOT3/> La pantalla és una mica fosca\" o \"Per què no puc posar la consola en repòs directament des del joc?\"<NL/>Doncs et presento la Configuració ràpida!<NL/><NL/>Ja et sento preguntar: \"Configuració ràpida? Què és això?\" Deixa que t'ho ensenyi!<NL/><NL/>Només cal mantenir premut <0xE0B9/> i apareixerà una pantalla que et permet accedir fàcilment a algunes funcions habituals.<NL/><NL/>\"Quines funcions?\" Sembla que et llegeixi el pensament, oi? Mira aquestes:<NL/><L_DOT1/>Posar la consola en repòs<NL/><L_DOT1/>Ajustar la brillantor de la pantalla<NL/><L_DOT1/>Activar i desactivar el Mode d'avió<NL/><NL/>Prova-ho! És molt pràctic."
- source: "Have you heard of tabletop mode? It's great for when you want to take the <L_JC/> controllers off the console, or if you want to prop up the screen so that everyone can see it.<NL/><NL/>And switching to tabletop mode is the easiest thing in the world! Flip open the stand on the back of the console (but you'll have to supply your own table).<NL/><NL/>But don't forget to put the stand back in before you dock the console! If you accidentally knock the stand off, you can probably pop it back into place-but don't do that too often or it will weaken the stand."
  target: "Coneixes el mode sobretaula? És ideal si vols desacoblar els comandaments <L_JC/> de la consola o mantenir la pantalla dreta perquè tothom la pugui veure.<NL/><NL/>Passar al mode sobretaula és la cosa més fàcil del món! Obre el suport del darrere de la consola (però la taula l'hauràs de posar tu).<NL/><NL/>No oblidis tancar el suport abans de posar la consola a la base! Si el suport es desprèn per un cop accidental, segurament el podràs tornar a encaixar. Però no ho facis gaire sovint, perquè es debilitarà."
- source: "Have you noticed that little slot on the back of your console? If not, take a look-it's no secret! Plus, it's pretty handy<L_DOT3/> It's a slot for <L_MSD/> cards!<NL/><NL/>Insert a <L_MSD/> card (sold separately) in there, and voilà! You'll be able to use it as extra storage space for software downloads and <L_DLC/> and such.<NL/><NL/>So, if you've been worried about running out of space, that should put your mind at ease."
  target: "T'has fixat en la petita ranura del darrere de la consola? Si no, fes-hi un cop d'ull, que no és cap secret! A més, és molt útil<L_DOT3/> És una ranura per a targetes <L_MSD/>!<NL/><NL/>Insereix-hi una targeta <L_MSD/> (venuda per separat) i ja està! La podràs fer servir com a espai d'emmagatzematge addicional per a descàrregues de programari, <L_DLC/> i altres dades.<NL/><NL/>Si et preocupava quedar-te sense espai, això t'hauria de tranquil·litzar."
- source: "Have you noticed that there's a built-in stand on the back of the <L_NS/> console? Well, not only is it handy, it's hiding a secret!<NL/><NL/>Open that stand, and voilà! There's the slot for <L_MSD/> cards.<NL/><NL/>Insert a <L_MSD/> card (sold separately) in there and you'll be able to use it as extra space for software downloads and <L_DLC/> and such.<NL/><NL/>So if you've been worried about running out of space, that should put your mind at ease."
  target: "T'has fixat en el suport integrat al darrere de la consola <L_NS/>? Doncs, a més de ser pràctic, amaga un secret!<NL/><NL/>Obre el suport i ja ho veuràs! Hi ha la ranura per a targetes <L_MSD/>.<NL/><NL/>Insereix-hi una targeta <L_MSD/> (venuda per separat) i la podràs fer servir com a espai addicional per a descàrregues de programari, <L_DLC/> i altres dades.<NL/><NL/>Si et preocupava quedar-te sense espai, això t'hauria de tranquil·litzar."
- source: "Have you noticed that there's a built-in stand on the back of the <L_NS/> console? Well, not only is it handy, it's hiding a secret!<NL/><NL/>Open that stand, and voilà! There's the slot for <L_MSD/> cards.<NL/><NL/>Insert a <L_MSD/> card (sold separately) in there, and you'll be able to use it as extra space for software downloads and <L_DLC/> and such.<NL/><NL/>So if you've been worried about running out of space, that should put your mind at ease."
  target: "T'has fixat en el suport integrat al darrere de la consola <L_NS/>? Doncs, a més de ser pràctic, amaga un secret!<NL/><NL/>Obre el suport i ja ho veuràs! Hi ha la ranura per a targetes <L_MSD/>.<NL/><NL/>Insereix-hi una targeta <L_MSD/> (venuda per separat) i la podràs fer servir com a espai addicional per a descàrregues de programari, <L_DLC/> i altres dades.<NL/><NL/>Si et preocupava quedar-te sense espai, això t'hauria de tranquil·litzar."
