  target: "Zure joko-txartel birtualak pantaila honetan ikus ditzakezu.<NL/>Erosi dituzun deskargatzeko jokoak hemen agertuko dira."
- source: "You can collect<NL/>Platinum Points."
  target: "Platino-puntuak<NL/>bil ditzakezu."
- source: "You can communicate with local users to unify your software version."
  target: "Tokiko erabiltzaileekin komunika zaitezke softwarearen bertsioa bateratzeko."
- source: "You can configure sound in the TV Settings menu when the console is connected to a TV."
  target: "Kontsola telebistara konektatuta dagoenean, soinua Telebistaren ezarpenak menuan konfigura dezakezu."
- source: "You can connect to the Internet to view all kinds of news articles.<NL/>You may be able to find news you can't find anywhere else too!<NL/><TAG1/><TAG2/>You will not be able to view news articles that are no longer being distributed.<TAG3/><TAG4/>"
  target: "Internetera konektatuta, era guztietako albisteak ikus ditzakezu.<NL/>Beste inon ez dauden albisteak ere aurki ditzakezu!<NL/><TAG1/><TAG2/>Jada banatzen ez diren albisteak ezin dira ikusi.<TAG3/><TAG4/>"
- source: "You can continue setup without using a smart device,<NL/>but you will not be able to use these features:<TAG1/><NL/><L_DOT1/><TAG2/>Set up a Play-Time Limit<TAG3/><NL/><L_DOT1/><TAG4/>Set up a Bedtime<TAG5/><NL/><L_DOT1/><TAG6/>Check play activity, such as played software titles and time spent playing<TAG7/><TAG8/><NL/><TAG9/><TAG10/>The <L_NS/> Parental Controls app is required to make use of these features.<TAG11/><TAG12/>"
  target: "Gailu adimendunik gabe jarrai dezakezu konfigurazioa egiten,<NL/>baina ezin izango dituzu eginbide hauek erabili:<TAG1/><NL/><L_DOT1/><TAG2/>Jolas-denboraren muga ezartzea<TAG3/><NL/><L_DOT1/><TAG4/>Lo-ordua ezartzea<TAG5/><NL/><L_DOT1/><TAG6/>Jolas-jarduera ikustea, hala nola erabilitako software-tituluak eta jokatzen emandako denbora<TAG7/><TAG8/><NL/><TAG9/><TAG10/>Eginbide hauek erabiltzeko, <L_NS/> Parental Controls aplikazioa behar da.<TAG11/><TAG12/>"
- source: "You can create your own custom <L_MI/> characters. <L_MI/> characters can be used in compatible software."
  target: "<L_MI/> pertsonalizatuak sor ditzakezu. <L_MI/> pertsonaiak software bateragarrian erabil daitezke."
- source: "You can customize button mapping for each controller. Customized mapping configurations can be saved as presets for easy access in the future."
  target: "Aginte bakoitzaren botoien esleipena pertsonaliza dezakezu. Esleipen pertsonalizatuak aurrezarpen gisa gorde daitezke, gero erraz erabiltzeko."
- source: "You can earn <L_MNT/> Gold Points when you purchase certain physical software."
  target: "Software fisiko jakin batzuk erosteagatik <L_MNT/> Urrezko puntuak lor ditzakezu."
- source: "You can edit and delete data saved to <L_AMI/>."
  target: "<L_AMI/>-n gordetako datuak editatu eta ezaba ditzakezu."
- source: "You can enter up to 10 characters."
  target: "Gehienez 10 karaktere sar ditzakezu."
- source: "You can follow channels you like to ensure you get all the latest news."
  target: "Gogoko kanalak jarrai ditzakezu azken albiste guztiak jasotzeko."
- source: "You can have even more fun playing online with your friends!<NL/>Make lots of friends, and play lots of games!"
  target: "Lagunekin linean jokatzea are dibertigarriagoa da!<NL/>Egin lagun asko eta jokatu joko askotan!"
- source: "You can keep playing compatible <L_NS/> software on the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system."
  target: "<L_NS/> software bateragarrian jokatzen jarrai dezakezu <L_N10/> <TAG1/><L_SWT2/><TAG2/> kontsolan."
- source: "You can leave personal notes about your friends. Use these to help you remember who they are.<NL/><TAG1/><TAG2/>Friends won't be able to see notes you write about them, but your notes may be visible to other users on your device.<TAG3/><TAG4/>"
  target: "Lagunei buruzko ohar pertsonalak idatz ditzakezu, nor diren gogoratzeko.<NL/><TAG1/><TAG2/>Lagunek ez dituzte haiei buruz idazten dituzun oharrak ikusiko, baina zure gailuko beste erabiltzaileek ikus ditzakete.<TAG3/><TAG4/>"
- source: "You can lend up to three virtual game cards out at a time. Once you collect a return, the virtual game card can then be lent out again."
  target: "Gehienez hiru joko-txartel birtual eman ditzakezu maileguan aldi berean. Itzulitako joko-txartel birtual bat berreskuratu ondoren, berriro eman daiteke maileguan."
- source: "You can lend virtual game cards out to members of the family group your <TAG1/><L_N10/> Account<TAG2/> is in for up to 14 days at a time."
  target: "Zure <TAG1/><L_N10/> kontuaren<TAG2/> familia-taldeko kideei joko-txartel birtualak maileguan eman diezazkiekezu, gehienez 14 egunez aldi bakoitzean."
- source: "You can link a <L_N10/> Account to see what your friends are playing."
  target: "<L_N10/> kontu bat lotu dezakezu lagunak zertan jokatzen ari diren ikusteko."
- source: "You can load a virtual game card using the system you want to load it on, or you can use a browser on<L_XA0/>a PC or smart device to access the URL above.<NL/><TAG1/><TAG2/>You can also see linked systems on the website.<TAG3/><TAG4/>"
  target: "Joko-txartel birtuala kargatu nahi duzun kontsolatik karga dezakezu, edo goiko URLa ireki<L_XA0/>PCko edo gailu adimenduneko arakatzaile batean.<NL/><TAG1/><TAG2/>Lotutako kontsolak webgunean ere ikus ditzakezu.<TAG3/><TAG4/>"
- source: "You can load up to 30 virtual game cards at once."
  target: "Gehienez 30 joko-txartel birtual karga ditzakezu aldi berean."
- source: "You can make a group with local users and match software versions."
  target: "Tokiko erabiltzaileekin talde bat sor dezakezu eta software-bertsioak parekatu."
- source: "You can make a group with local users in order to match software versions and play together."
  target: "Tokiko erabiltzaileekin talde bat sor dezakezu, software-bertsioak parekatzeko eta elkarrekin jokatzeko."
- source: "You can move all the save data linked to a user on another console to this console by using Transfer Your User Data.<NL/><TAG1/><TAG2/>To transfer user data, select Transfer Your User Data below to go to <TAG3/><0xE130/> (System Settings)<TAG4/> ⇒ Users, where the transfer can be performed.<TAG5/><TAG6/>"
  target: "Beste kontsola bateko erabiltzaile bati lotutako gordetze-datu guztiak kontsola honetara ekar ditzakezu Transferitu zure erabiltzaile-datuak erabiliz.<NL/><TAG1/><TAG2/>Erabiltzaile-datuak transferitzeko, hautatu beheko Transferitu zure erabiltzaile-datuak eta joan <TAG3/><0xE130/> (Sistemaren ezarpenak)<TAG4/> ⇒ Erabiltzaileak atalera. Bertan egin daiteke transferentzia.<TAG5/><TAG6/>"
- source: "You can move save data between systems using <TAG1/>Transfer Your Save Data<TAG2/> or <TAG3/>Save Data Cloud.<TAG4/><NL/>To do this, go to the <TAG5/>HOME Menu<TAG6/>, highlight the software, and press <0xE0B3/> to open the Options menu."
  target: "Gordetze-datuak kontsolen artean mugi ditzakezu <TAG1/>Transferitu zure gordetze-datuak<TAG2/> edo <TAG3/>Gordetze-datuen hodeia<TAG4/> erabiliz.<NL/>Horretarako, joan <TAG5/>HOME menura<TAG6/>, nabarmendu softwarea eta sakatu <0xE0B3/> Aukerak menua irekitzeko."
- source: "You can now choose to enter your Parental Controls PIN using control stick input.<TAG1/><NL/><L_DOT1/><TAG2/>Control stick input allows you to enter numbers more quickly.<TAG3/><NL/><L_DOT1/><TAG4/>When using control stick input, others will not be able to see the numbers you are selecting on screen.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>You can hold <TAG9/> to change to keypad input and enter your PIN as before.<TAG10/><TAG11/>"
  target: "Orain guraso-kontrolen PINa kontrol-makilaz sartzea aukera dezakezu.<TAG1/><NL/><L_DOT1/><TAG2/>Kontrol-makilaz zenbakiak azkarrago sar daitezke.<TAG3/><NL/><L_DOT1/><TAG4/>Kontrol-makila erabiltzean, besteek ez dituzte pantailan hautatzen dituzun zenbakiak ikusiko.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>Eduki <TAG9/> sakatuta zenbaki-teklatura aldatu eta PINa lehen bezala sartzeko.<TAG10/><TAG11/>"
- source: "You can now link a <L_N10/> Account.<NL/><TAG1/><TAG2/>With a linked account, you can access online play, friend features, <L_NEP/>, and more.<TAG3/><TAG4/>"
  target: "Orain <L_N10/> kontu bat lotu dezakezu.<NL/><TAG1/><TAG2/>Lotutako kontu batekin, lineako jolasa, lagun-eginbideak, <L_NEP/> eta gehiago erabil ditzakezu.<TAG3/><TAG4/>"
- source: "You can pair a controller with the console by holding down the controller's SYNC Button when prompted to connect a controller.<NL/><TAG1/><TAG2/>This method cannot be used while local communication is active.<TAG3/><TAG4/>"
  target: "Agintea konektatzeko eskatzean, eduki SYNC botoia sakatuta agintea kontsolarekin parekatzeko.<NL/><TAG1/><TAG2/>Metodoa ezin da erabili tokiko komunikazioa aktibo dagoenean.<TAG3/><TAG4/>"
- source: "You can pair a controller with the console by holding down the controller's SYNC Button when prompted to connect a controller.<TAG1/><NL/><0xE153/> <TAG2/>This method cannot be used right now because local communication is currently active.<TAG3/>"
  target: "Agintea konektatzeko eskatzean, eduki SYNC botoia sakatuta agintea kontsolarekin parekatzeko.<TAG1/><NL/><0xE153/> <TAG2/>Metodoa ezin da orain erabili, tokiko komunikazioa aktibo dagoelako.<TAG3/>"
- source: "You can pair controllers at any time by attaching them to the console."
  target: "Aginteak edonoiz pareka ditzakezu kontsolari lotuta."
- source: "You can return to the HOME Menu with <0xE0B9/>."
  target: "<0xE0B9/> erabiliz HOME menura itzul zaitezke."
- source: "You can return to the HOME Menu with <0xE0B9/>.<TAG1/><NL/><L_ROMB/><TAG2/>The download will continue. You will need to update the console once the download is complete.<TAG3/>"
  target: "<0xE0B9/> erabiliz HOME menura itzul zaitezke.<TAG1/><NL/><L_ROMB/><TAG2/>Deskargak jarraituko du. Deskarga amaitzean, kontsola eguneratu beharko duzu.<TAG3/>"
- source: "You can see your virtual game cards on this screen.<NL/>Purchased downloadable games will appear here."
