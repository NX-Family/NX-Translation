- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Familia-taldeko kideei joko-txartel birtualak maileguan eman diezazkiekezu bi kontsolak hurbildu eta lotu ondoren.<TAG1/><NL/><L_DOT1/><TAG2/>Maileguak dirauen bitartean, softwarean libre joka daiteke mailegu-hartzailearen kontsolan, eta mailegu-emaileak aldi baterako softwarearen sarbidea galtzen du.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Joko-txartel birtualak gehienez 14 egunez har daitezke maileguan. Epea amaitzean, joko-txartel birtuala automatikoki itzuliko da.<NL/><TAG6/><TAG7/>Mailegu-emaileek beren joko-txartel birtualak mailegu-hartzaileengandik berreskura ditzakete epea amaitu aurretik ere.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Erabiltzaileek joko-txartel birtual bat eman dezakete maileguan hartzaile bakoitzeko, gehienez hiru hartzaileri aldi berean. Hala ere, kontsola bakoitzak bakarra har dezake maileguan.<NL/><TAG13/><TAG14/>Berreskuratutako joko-txartel birtuala berriro eman daiteke maileguan.<TAG15/><TAG16/><TAG17/>"
