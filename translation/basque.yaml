  target: "<L_AMI/> honen datuak ondo daude. Ez dira leheneratu behar."
- source: "Data on this <L_MSD/> card is corrupted and cannot be used.<TAG1/><NL/>The corrupted data will be deleted.<TAG2/><NL/><TAG3/>The console will restart after deleting the data.<NL/>(This will close suspended software.)<NL/>Save data, screenshots, videos and other non-<L_NS/> data won't be deleted. You can remove the <L_MSD/> card if you don't want to use it on this console.<TAG4/>"
  target: "<L_MSD/> txarteleko datuak hondatuta daude eta ezin dira erabili.<TAG1/><NL/>Datu hondatuak ezabatuko dira.<TAG2/><NL/><TAG3/>Datuak ezabatu ondoren, kontsola berrabiaraziko da.<NL/>(Etendako softwarea itxiko da.)<NL/>Gordetze-datuak, pantaila-argazkiak, bideoak eta <L_NS/>-renak ez diren beste datuak ez dira ezabatuko. <L_MSD/> txartela kendu dezakezu kontsola honetan erabili nahi ez baduzu.<TAG4/>"
