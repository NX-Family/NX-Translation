- source: "With these settings turned off, you won't be asked for verification to use the feature, and other users on the system will also be able to freely access the associated feature.<TAG1/><NL/><L_DOT1/><TAG2/>When using <L_NEP/>, other users on this system can use funds and view account information, including payment method, etc.<TAG3/><NL/><L_DOT1/><TAG4/>On the virtual game card menu, other users on this system can view, load, and lend out purchased digital software.<TAG5/>"
  target: "Ezarpen hauek desaktibatuta, ez zaizu egiaztapenik eskatuko eginbidea erabiltzeko, eta kontsolako beste erabiltzaileek ere lotutako eginbidea libre erabili ahal izango dute.<TAG1/><NL/><L_DOT1/><TAG2/><L_NEP/> erabiltzean, kontsola honetako beste erabiltzaileek funtsak erabili eta kontuaren informazioa ikus dezakete, ordainketa-metodoa eta abar barne.<TAG3/><NL/><L_DOT1/><TAG4/>Joko-txartel birtualen menuan, kontsola honetako beste erabiltzaileek erositako software digitala ikusi, kargatu eta maileguan eman dezakete.<TAG5/>"
