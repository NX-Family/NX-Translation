  target: "Hauek transferi ditzakezu zure <L_MSD/> txartela <L_N10/> <TAG1/><L_SWT2/><TAG2/> kontsolara eramanda:<NL/><NL/><L_DOT1/> <TAG3/><TAG4/> bidez sortutako bideoak<TAG5/><NL/><NL/>Gorde <L_MSD/> txartela leku seguruan <L_N10/> <TAG6/><L_SWT2/><TAG7/> kontsola erabili ahal izan arte."
- source: "You can unlink your system at this website:<NL/><TAG1/><TAG2/><NL/><TAG3/><TAG4/>Once there, select the system you wish to unlink from the list.<NL/><L_ROMB/><TAG5/>Unlinking a system using the website can only be done once <TAG6/>per year<TAG7/>.<TAG8/><TAG9/><TAG10/>"
  target: "Zure kontsola webgune honetan deslotu dezakezu:<NL/><TAG1/><TAG2/><NL/><TAG3/><TAG4/>Bertan, hautatu zerrendan deslotu nahi duzun kontsola.<NL/><L_ROMB/><TAG5/>Webgunearen bidez kontsola bat <TAG6/>urtean behin<TAG7/> soilik deslotu daiteke.<TAG8/><TAG9/><TAG10/>"
- source: "You can use <L_NS/> to take in-game<NL/>screenshots and videos, add comments to them, and post them on social media.<TAG1/><NL/>Set to Restricted to disable posting screenshots and videos on social media.<NL/><TAG2/><TAG3/>Users with <L_N10/> Accounts under the age of 13 will not<NL/>be able to post on social media regardless of these settings.<TAG4/><TAG5/>"
  target: "<L_NS/> erabiliz, joko barruko<NL/>pantaila-argazkiak eta bideoak egin, iruzkinak gehitu eta sare sozialetan argitara ditzakezu.<TAG1/><NL/>Hautatu Murriztuta pantaila-argazkiak eta bideoak sare sozialetan argitaratzea desgaitzeko.<NL/><TAG2/><TAG3/>13 urtetik beherakoen <L_N10/> kontuak dituzten erabiltzaileek ezin izango dute<NL/>sare sozialetan argitaratu, ezarpen hauek edozein direla ere.<TAG4/><TAG5/>"
- source: "You can use online licenses to play downloadable software and additional content as long as your console is connected to the Internet.<TAG1/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG2/>"
  target: "Lineako lizentziekin deskargatzeko softwarean eta eduki gehigarrian joka dezakezu, kontsola Internetera konektatuta dagoen bitartean.<TAG1/><NL/>Informazio gehiago lortzeko, joan <L_N10/> laguntza-webgunera.<NL/><TAG2/>"
- source: "You can use the console with the <L_JC/> controllers attached or detached. Choose the control style you prefer, then continue."
