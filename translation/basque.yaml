- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Sistema-memoriako datuak ezabatuko dira eta kontsola fabrikako ezarpenetara itzuliko da.<NL/>Gordetze-datuak, pantaila-argazkiak, bideoak eta erabiltzaile-informazioa ez dira ezabatuko.<TAG1/><NL/><L_SQR/> Kontuan izan<TAG2/><NL/><L_DOT1/><TAG3/><L_MSD/> txartelean gordetako software-datu guztiak, pantaila-argazkiak eta bideoak izan ezik, erabilezin geratuko dira. (<L_MSD/> txarteleko datuak ez dira ezabatuko.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Sistemaren bertsioa ez da aldatuko edo aurreko bertsiora itzuliko.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Ezabatutako jokoak eta <L_DLC/> berriz erabili ahal izango dira softwarea berriro deskargatu ondoren. (Jada eskaintzen ez den softwarea agian ezin da berriro deskargatu kasu batzuetan.)<TAG10/>"
