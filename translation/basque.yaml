- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Erakutsi QR kode hau hautatutako <L_N10/> ekitaldi eta lekuetan bertaratzea erregistratzeko eta <L_MNT/> kideen abantaila esklusiboak lortzeko, hala nola <L_MNT/> puntuak eta promozioetako sari-zozketetan parte hartzea. Abantailak aldatu egingo dira aldi bakoitzean; begiratu xehetasunak bertaratzea erregistratzean.<TAG1/><NL/><L_DOT1/><TAG2/>QR kode honi esker, <L_N10/>-k zure <L_N10/> kontua identifika dezake.<TAG3/><NL/><L_DOT1/><TAG4/>Bertaratzea erregistratuta, promozio jakinetan parte har dezakezu, eta haiei edo beste promozio batzuei buruzko mezu elektronikoak jaso ditzakezu. Informazio gehiago promozioen webguneetan egongo da.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> kontuaren Erabilera-hitzarmena eta Pribatutasun-politika aplikatzen dira.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR kodea sortuta: <TAG11/><TAG12/><TAG13/>"
