- source: "Visit the <L_N10/> Support website for further details.<NL/><TAG1/><TAG2/>Other information available there includes:<NL/><L_DOT1/><TAG3/>Using software without loading a virtual game card.<TAG4/><NL/><L_DOT1/><TAG5/>Unlinking a system.<TAG6/><TAG7/><TAG8/>"
  target: "Докладніше див. на сайті підтримки <L_N10/>.<NL/><TAG1/><TAG2/>Там також є відомості про:<NL/><L_DOT1/><TAG3/>Використання програм без завантаження віртуальної ігрової картки.<TAG4/><NL/><L_DOT1/><TAG5/>Скасування зв'язку із системою.<TAG6/><TAG7/><TAG8/>"
- source: "Visit the <L_N10/> Support website for more details.<NL/><TAG1/><TAG2/>You can also find information on moving data between systems without performing a system transfer.<TAG3/><TAG4/>"
