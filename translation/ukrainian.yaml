  target: "Автоматичне резервування збережень призупинено.<NL/>Щоб відновити його, виберіть опцію нижче."
- source: "Automatic save-data download has been enabled on this console.<TAG1/><NL/>This does not change the settings on other consoles.<NL/>To change settings on other consoles, you will need<NL/>to do so separately on each individual console."
  target: "На цій консолі ввімкнено автозавантаження збережень.<TAG1/><NL/>Це не змінює налаштувань інших консолей.<NL/>На інших консолях налаштування потрібно<NL/>змінити окремо на кожній."
- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Автозавантаження збережень увімкнено.<TAG1/><NL/><L_DOT1/><TAG2/>Початкове завантаження потрібно виконати вручну.<TAG3/><NL/><L_DOT1/><TAG4/>Щоб увімкнути цю функцію на інших консолях, змініть налаштування на кожній із них.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>Це можна зробити через <0xE130/> (Налаштування системи) ⇒ Керування даними ⇒ Хмарні збереження в меню HOME.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Автозавантаження збережень не завжди відбувається одразу.<NL/><TAG1/><TAG2/>Щоб негайно продовжити гру на іншій консолі з тими самими збереженнями, створіть резервну копію вручну, а потім завантажте її вручну на потрібну консоль.<TAG3/><TAG4/>"
