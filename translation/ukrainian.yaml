  target: "Архівувати наведені програми, щоб звільнити місце?<NL/><TAG1/><TAG2/>Від них залишаться лише збереження та значки в меню HOME.<NL/>Для повторного використання програми потрібно буде завантажити знову.<NL/>Натомість можна перемістити дані через <TAG3/><0xE130/> (Налаштування системи)<TAG4/> ⇒ <TAG5/>Керування даними<TAG6/> у <TAG7/>меню HOME<TAG8/>.<TAG9/><TAG10/>"
