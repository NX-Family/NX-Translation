  target: "Архівувати наведені програми, щоб звільнити місце?<NL/><TAG1/><TAG2/>Від них залишаться лише збереження та значки в меню HOME. Для повторного використання програми потрібно буде завантажити знову.<TAG3/><TAG4/>"
