  target: "Афіни"
- source: "Attach the <L_JC/> controllers to the console.<NL/>The <L_JC/> cannot be used wirelessly<NL/>when Airplane Mode is enabled.<TAG1/><NL/><TAG2/>You can turn Airplane Mode On/Off in Quick Settings (hold <0xE0B9/>).<TAG3/>"
  target: "Приєднайте контролери <L_JC/> до консолі.<NL/>Бездротове використання <L_JC/> неможливе,<NL/>коли ввімкнено режим польоту.<TAG1/><NL/><TAG2/>Увімкнути або вимкнути режим польоту можна через Швидкі налаштування (утримуйте <0xE0B9/>).<TAG3/>"
