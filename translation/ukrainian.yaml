- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "До речі, змінити яскравість екрана під час підключення до телевізора не можна.<NL/>А щоб змінити налаштування бездротового зв'язку, відкрийте меню HOME та виберіть <0xE130/> (Налаштування системи) ⇒ Режим польоту.<NL/><NL/>Приємної гри,<NL/>Amelia N."
