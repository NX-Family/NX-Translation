- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Разом із консоллю <L_NS/> компанія <L_N10/> надіслала обладнання для її підключення до телевізора. Ось як грати на великому екрані:<NL/><NL/>Спершу знайдіть док-станцію <L_NS/>, адаптер змінного струму та кабель <L_HDMI/>. <NL/><NL/>Далі відкрийте задню кришку док-станції та підключіть адаптер змінного струму. <NL/><NL/>Потім кабелем <L_HDMI/> підключіть док-станцію до телевізора.<NL/><NL/><L_DOT3S/>Ось і все! Якщо плануєте використовувати контролери <L_JC/> окремо, від'єднайте їх. Потім просто вставте консоль <L_NS/> у док-станцію, і зображення має з'явитися на телевізорі, наче за помахом чарівної палички."
