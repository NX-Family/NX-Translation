  target: "Wszystkie dane w pamięci systemowej, w tym dane oprogramowania, dane zapisu, zrzuty ekranu, wideo i informacje o użytkownikach, zostaną usunięte, przywracając konsolę do ustawień fabrycznych.<TAG1/><NL/><L_SQR/> <TAG2/>Uwaga:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Wszystkie dane oprogramowania na karcie <L_MSD/>, z wyjątkiem zrzutów ekranu i wideo, staną się niezdatne do użytku. (Dane na karcie <L_MSD/> nie zostaną usunięte.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Wersja systemu nie ulegnie zmianie.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "Wszystkie dane w pamięci systemowej, w tym oprogramowanie, dane zapisu, zrzuty ekranu, wideo i informacje o użytkownikach, zostaną usunięte, przywracając konsolę do ustawień fabrycznych.<TAG1/><NL/><L_SQR/> Uwaga:<TAG2/><NL/><L_DOT1/><TAG3/>Oprogramowania na karcie <L_MSD/> nie będzie można używać. Nie dotyczy to zrzutów ekranu i wideo. (Dane na karcie <L_MSD/> nie zostaną usunięte.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Wersja systemu nie ulegnie zmianie.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Konta <L_N10/> połączone z tą konsolą nie zostaną usunięte, ale zostaną od niej odłączone.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Konto <L_N10/> zawiera historię zakupów w <L_NEP/> i aktualne saldo. Po przywróceniu ustawień fabrycznych konsoli i ponownym połączeniu konta <L_N10/> będzie można ponownie pobrać oprogramowanie i <L_DLC/> kupione za jego pomocą. (Wycofane oprogramowanie może w niektórych przypadkach być niedostępne do ponownego pobrania.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Jeśli używasz tej opcji z powodu problemu z konsolą:<TAG19/><NL/>W trybie konserwacji można przywrócić konsolę do ustawień fabrycznych bez usuwania danych zapisu i informacji o użytkownikach. Aby spróbować tej metody, anuluj przywracanie ustawień fabrycznych i wykonaj te czynności:<TAG20/><NL/><L_D1/> <TAG21/>Wyłącz zasilanie.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>Aby wyłączyć konsolę, otwórz menu zasilania (przytrzymaj przycisk POWER przez trzy sekundy) i wybierz Opcje zasilania → Wyłącz.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Przytrzymaj przyciski zwiększania (+) i zmniejszania (-) głośności wraz z przyciskiem POWER, aby włączyć konsolę.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>Konsola uruchomi się w trybie konserwacji.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Wybierz Przywróć ustawienia fabryczne bez usuwania danych zapisu i postępuj zgodnie z instrukcjami.<TAG38/>"
