- source: "This will erase all data in the system memory, including software data, screenshots, and videos. The system will then be initialized and restored to<L_XA0/>factory settings.<TAG1/><NL/><L_SQR/> Warnings<TAG2/><NL/><L_DOT1/> <TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>The system version will not change or roll back.<TAG7/><TAG8/>"
  target: "Wszystkie dane w pamięci systemowej, w tym dane oprogramowania, zrzuty ekranu i wideo, zostaną usunięte. System zostanie przywrócony do ustawień<L_XA0/>fabrycznych.<TAG1/><NL/><L_SQR/> Ostrzeżenia<TAG2/><NL/><L_DOT1/> <TAG3/>Wszystkie dane oprogramowania na karcie <L_MSD/>, z wyjątkiem zrzutów ekranu i wideo, staną się bezużyteczne. (Dane na karcie <L_MSD/> nie zostaną usunięte.)<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Wersja systemu nie zmieni się ani nie zostanie obniżona.<TAG7/><TAG8/>"
- source: "This will erase all data in the system memory, including software data, screenshots, and videos. The system will then be initialized and restored to<L_XA0/>factory settings.<TAG1/><NL/>Once initialization is complete, please remove the <L_MSD/> card from this<L_XA0/>system.<TAG2/><NL/><L_SQR/> Warnings<TAG3/><NL/><L_DOT1/> <TAG4/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>The system version will not change or roll back.<TAG8/><TAG9/>"
  target: "Wszystkie dane w pamięci systemowej, w tym dane oprogramowania, zrzuty ekranu i wideo, zostaną usunięte. System zostanie przywrócony do ustawień<L_XA0/>fabrycznych.<TAG1/><NL/>Po zakończeniu przywracania wyjmij kartę <L_MSD/> z tego<L_XA0/>systemu.<TAG2/><NL/><L_SQR/> Ostrzeżenia<TAG3/><NL/><L_DOT1/> <TAG4/>Wszystkie dane oprogramowania na karcie <L_MSD/>, z wyjątkiem zrzutów ekranu i wideo, staną się bezużyteczne. (Dane na karcie <L_MSD/> nie zostaną usunięte.)<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Wersja systemu nie zmieni się ani nie zostanie obniżona.<TAG8/><TAG9/>"
- source: "This will restrict gameplay in VR mode.<TAG1/><NL/>Set this option to Restricted if a child of 6 years or younger uses this console.<TAG2/><NL/>Visit the <L_N10/> Support website for more information about VR mode.<NL/><TAG3/>"
  target: "Spowoduje to ograniczenie gry w trybie VR.<TAG1/><NL/>Wybierz Ograniczone, jeśli z tej konsoli korzysta dziecko w wieku 6 lat lub młodsze.<TAG2/><NL/>Więcej informacji o trybie VR znajdziesz na stronie pomocy <L_N10/>.<NL/><TAG3/>"
- source: "This will restrict open communication between users, including sending and receiving messages and images.<TAG1/><NL/>Depending on the software, the following activities will be restricted:<TAG2/><NL/><L_DOT1/><TAG3/>Sending and receiving messages and using chat features.<TAG4/><NL/><L_DOT1/><TAG5/>Reading and sharing profile information that allows users to enter their own text.<TAG6/><NL/><L_DOT1/><TAG7/>Viewing and sharing images that users have created, possibly including text.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Use of applications operating outside of <L_NS/>, such as <L_NS/> App, will not be restricted. If you would like to set restrictions on the app, please do so using your smart device.<TAG12/><TAG13/>"
  target: "Ograniczy to swobodną komunikację między użytkownikami, w tym wysyłanie i odbieranie wiadomości i obrazów.<TAG1/><NL/>W zależności od oprogramowania ograniczone zostaną następujące czynności:<TAG2/><NL/><L_DOT1/><TAG3/>Wysyłanie i odbieranie wiadomości oraz używanie czatu.<TAG4/><NL/><L_DOT1/><TAG5/>Odczytywanie i udostępnianie informacji profilowych, w których użytkownicy mogą wpisywać własny tekst.<TAG6/><NL/><L_DOT1/><TAG7/>Oglądanie i udostępnianie obrazów stworzonych przez użytkowników, które mogą zawierać tekst.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Aplikacje działające poza <L_NS/>, takie jak <L_NS/> App, nie będą ograniczone. Aby ustawić ograniczenia w aplikacji, użyj urządzenia mobilnego.<TAG12/><TAG13/>"
