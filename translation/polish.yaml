- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Wraz z konsolą <L_NS/> firma <L_N10/> dostarczyła sprzęt do podłączenia jej do telewizora. Oto jak cieszyć się grą na dużym ekranie:<NL/><NL/>Najpierw znajdź stację dokującą <L_NS/>, zasilacz sieciowy i kabel <L_HDMI/>.<NL/><NL/>Następnie otwórz tylną pokrywę stacji dokującej i podłącz zasilacz sieciowy.<NL/><NL/>Użyj kabla <L_HDMI/>, aby połączyć stację dokującą z telewizorem.<NL/><NL/><L_DOT3S/>I gotowe! Jeśli chcesz używać kontrolerów <L_JC/> oddzielnie, odłącz je. Potem wystarczy wsunąć konsolę <L_NS/> do stacji dokującej, a obraz powinien pojawić się na telewizorze jak za dotknięciem czarodziejskiej różdżki."
