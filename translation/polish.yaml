  target: "Oprócz tego systemu inny <L_NS/> jest zarejestrowany jako jeden z twoich systemów głównych.<TAG1/><NL/>Najpierw zaktualizuj tamten system.<NL/><TAG2/><TAG3/>Aby go zaktualizować, otwórz menu HOME i wybierz <TAG4/><0xE130/> (Ustawienia systemowe)<TAG5/> ⇒ System ⇒ Zaktualizuj system.<TAG6/><TAG7/>"
- source: "In order to analyze and recover the save data, the<NL/>save data for this software, your nickname, your ID,<NL/>and other information that will help identify you will<NL/>be sent to <L_N10/>. For the same reason, the<NL/>above will be sent to the developers of this software,<NL/>who may reside within or outside of your country."
  target: "W celu analizy i odzyskania danych zapisu<NL/>dane zapisu tego oprogramowania, twój pseudonim, identyfikator<NL/>i inne informacje pomagające cię zidentyfikować<NL/>zostaną wysłane do <L_N10/>. W tym samym celu<NL/>trafią też do twórców tego oprogramowania,<NL/>którzy mogą znajdować się w twoim kraju lub za granicą."
- source: "In order to analyze and recover the save data, the<NL/>save data for this software, your nickname, your ID,<NL/>and other information that will help identify you will<NL/>be sent to <L_N10/>. For the same reason, the<NL/>above will be sent to the developers of this software,<NL/>who may reside within or outside of your country.<NL/><TAG1/><TAG2/>For matters like this, please acquire the consent of all users<NL/>who have save data with this software.<TAG3/><TAG4/>"
  target: "W celu analizy i odzyskania danych zapisu<NL/>dane zapisu tego oprogramowania, twój pseudonim, identyfikator<NL/>i inne informacje pomagające cię zidentyfikować<NL/>zostaną wysłane do <L_N10/>. W tym samym celu<NL/>trafią też do twórców tego oprogramowania,<NL/>którzy mogą znajdować się w twoim kraju lub za granicą.<NL/><TAG1/><TAG2/>W takich przypadkach uzyskaj zgodę wszystkich użytkowników,<NL/>którzy mają dane zapisu w tym oprogramowaniu.<TAG3/><TAG4/>"
- source: "In order to change the language, the console will need to restart. Any suspended software will be closed."
  target: "Zmiana języka wymaga ponownego uruchomienia konsoli. Wstrzymane oprogramowanie zostanie zamknięte."
- source: "In order to change the region you will need to agree to the End-User License Agreement for the selected region and restart the console. If you do not agree, do not change your region setting in this way."
  target: "Zmiana regionu wymaga zaakceptowania umowy licencyjnej użytkownika końcowego dla wybranego regionu i ponownego uruchomienia konsoli. Jeśli się nie zgadzasz, nie zmieniaj regionu w ten sposób."
- source: "In order to change the region you will need to agree to the End-User License Agreement for the selected region and restart the console. If you do not agree, do not change your region setting in this way.<TAG1/><NL/>Additionally, the following settings will change:<TAG2/><NL/><L_DOT1/><TAG3/>The Auto-Sleep (Connected to TV) setting will be set to 1 hour.<TAG4/><NL/><L_DOT1/><TAG5/>The Maintain Internet Connection in Sleep Mode setting will be enabled.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>This can be changed later by selecting <0xE130/> (System Settings) ⇒ Sleep Mode via the HOME Menu.<TAG10/><TAG11/>"
  target: "Zmiana regionu wymaga zaakceptowania umowy licencyjnej użytkownika końcowego dla wybranego regionu i ponownego uruchomienia konsoli. Jeśli się nie zgadzasz, nie zmieniaj regionu w ten sposób.<TAG1/><NL/>Zmieni się też kilka ustawień:<TAG2/><NL/><L_DOT1/><TAG3/>Opcja Automatyczne uśpienie (po podłączeniu do telewizora) zostanie ustawiona na 1 godzinę.<TAG4/><NL/><L_DOT1/><TAG5/>Opcja Utrzymuj połączenie z Internetem w trybie uśpienia zostanie włączona.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>Możesz to później zmienić w menu HOME, wybierając <0xE130/> (Ustawienia systemowe) ⇒ Tryb uśpienia.<TAG10/><TAG11/>"
- source: "In order to change users, this software must close.<NL/><TAG1/><TAG2/>Any unsaved data will be lost.<TAG3/><TAG4/>"
  target: "Aby zmienić użytkownika, należy zamknąć to oprogramowanie.<NL/><TAG1/><TAG2/> Wszelkie niezapisane dane zostaną utracone.<TAG3/><TAG4/>"
- source: "In order to change users,<NL/>this software must be closed."
