  target: "<TAG1/><TAG2/>Kod błędu: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Aby kontynuować w tym systemie, zamknij to oprogramowanie we wszystkich innych systemach, w których gra w nie użytkownik połączony z tym kontem <L_N10/>.<NL/><NL/>Możesz też grać tutaj bez zamykania go gdzie indziej, wykonując poniższe kroki:<NL/><TAG7/><L_ROMB/>Część <L_DLC/> będzie niedostępna przy uruchomieniu oprogramowania w ten sposób.<TAG8/><TAG9/><NL/>1. <TAG10/>W menu HOME zaznacz oprogramowanie i naciśnij <TAG11/>, aby<L_XA0/>je zamknąć.<TAG12/><NL/>2. <TAG13/>Przytrzymaj <TAG14/> i naciśnij <TAG15/>, aby ponownie uruchomić oprogramowanie.<TAG16/>"
