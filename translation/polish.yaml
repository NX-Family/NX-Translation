- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Okaż ten kod QR, aby zarejestrować obecność na wybranych wydarzeniach i w punktach <L_N10/> oraz uzyskać korzyści dostępne tylko dla członków <L_MNT/>, np. punkty <L_MNT/> i udział w promocyjnych losowaniach nagród. Korzyści są za każdym razem inne, więc przy rejestracji sprawdzaj szczegóły.<TAG1/><NL/><L_DOT1/><TAG2/>Ten kod QR pozwala <L_N10/> zidentyfikować twoje konto <L_N10/>.<TAG3/><NL/><L_DOT1/><TAG4/>Rejestrując obecność, możesz uczestniczyć w wybranych promocjach. Możesz też otrzymywać e-maile o tych lub innych promocjach. Szczegóły będą dostępne na stronach promocji.<TAG5/><NL/><L_DOT1/><TAG6/>Obowiązują Umowa użytkownika konta <L_N10/> oraz Polityka prywatności.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>Wygenerowano kod QR: <TAG11/><TAG12/><TAG13/>"
