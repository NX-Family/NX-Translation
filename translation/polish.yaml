- source: "Do you allow <L_N10/> to share error information from this console with third-party developers whose software has crashed for analysis and improvement purposes?<NL/><TAG1/><TAG2/>You can change this setting at any time.<TAG3/><TAG4/>"
  target: "Czy pozwalasz <L_N10/> udostępniać informacje o błędach z tej konsoli zewnętrznym twórcom oprogramowania, które uległo awarii, w celu analizy i ulepszeń?<NL/><TAG1/><TAG2/>Możesz zmienić to ustawienie w dowolnym momencie.<TAG3/><TAG4/>"
- source: "Do you allow <L_N10/> to share error information from this console with third-party developers whose software has crashed for analysis and improvement purposes?<TAG1/><NL/>Information regarding international data-sharing destinations and personal-data protection is published on the website below (only available in Japanese). Please review the information in advance.<NL/><L_NCJP/><NL/><TAG2/><TAG3/>You can change this setting at any time.<TAG4/><TAG5/>"
  target: "Czy pozwalasz <L_N10/> udostępniać informacje o błędach z tej konsoli zewnętrznym twórcom oprogramowania, które uległo awarii, w celu analizy i ulepszeń?<TAG1/><NL/>Informacje o zagranicznych miejscach udostępniania danych i ochronie danych osobowych są dostępne na poniższej stronie (tylko po japońsku). Zapoznaj się z nimi wcześniej.<NL/><L_NCJP/><NL/><TAG2/><TAG3/>Możesz zmienić to ustawienie w dowolnym momencie.<TAG4/><TAG5/>"
- source: "Do you have the <TAG1/><L_NST/><TAG2/> Parental Controls app?"
  target: "Czy masz aplikację <TAG1/><L_NST/><TAG2/> Parental Controls?"
- source: "Do you still have the console with the user you want to import?"
  target: "Czy nadal masz konsolę z użytkownikiem, którego chcesz zaimportować?"
- source: "Do you want to calibrate the console or the controllers?"
  target: "Czy chcesz skalibrować konsolę czy kontrolery?"
- source: "Do you want to go back without making<NL/>any changes?"
  target: "Wrócić bez wprowadzania<NL/>zmian?"
- source: "Do you want to report error logs and information about your system settings to <L_N10/>?<TAG1/><NL/><TAG2/><TAG3/>This information may be shared with third-party developers whose software has crashed for analysis and improvement purposes. Information regarding international data-sharing destinations and personal-data protection is published on the website below (only available in Japanese). Please review the information in advance.<NL/>https://www.<L_UCOM/>/jp/privacy/crossborder/<TAG4/><TAG5/>"
  target: "Czy wysyłać dzienniki błędów i dane ustawień systemu do <L_N10/>?<TAG1/><NL/><TAG2/><TAG3/>Dane te mogą być udostępniane zewnętrznym twórcom, których program uległ awarii, w celach analizy i ulepszania. Informacje o zagranicznych miejscach udostępniania danych i ochronie danych osobowych są na poniższej stronie, tylko po japońsku. Zapoznaj się z nimi wcześniej.<NL/>https://www.<L_UCOM/>/jp/privacy/crossborder/<TAG4/><TAG5/>"
- source: "Do you want to report error logs and information about your system settings to <L_N10/>?<TAG1/><NL/><TAG2/><TAG3/>This information may be shared with third-party developers whose software has crashed for analysis and improvement purposes.<TAG4/><TAG5/>"
