- source: "Oh, and if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "A jeśli chcesz zmienić ustawienia łączności bezprzewodowej, przejdź do menu HOME i wybierz <0xE130/> (Ustawienia systemowe) ⇒ Tryb samolotowy.<NL/><NL/>Miłej gry,<NL/>Amelia N."
- source: "Oh, you can't adjust the screen's brightness when you're connected to a TV.<NL/>And if you want to adjust the wireless settings, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ Airplane Mode.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Aha, nie możesz zmieniać jasności ekranu, gdy konsola jest podłączona do telewizora.<NL/>Aby zmienić ustawienia łączności bezprzewodowej, przejdź do menu HOME i wybierz <0xE130/> (Ustawienia systemowe) ⇒ Tryb samolotowy.<NL/><NL/>Miłej gry,<NL/>Amelia N."
