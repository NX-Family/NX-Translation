- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Dane w pamięci systemowej zostaną usunięte, przywracając konsolę do ustawień fabrycznych.<NL/>Dane zapisu, zrzuty ekranu, wideo i informacje o użytkownikach nie zostaną usunięte.<TAG1/><NL/><L_SQR/> Uwaga:<TAG2/><NL/><L_DOT1/><TAG3/>Wszystkie dane oprogramowania na karcie <L_MSD/>, z wyjątkiem zrzutów ekranu i wideo, staną się niezdatne do użytku. (Dane na karcie <L_MSD/> nie zostaną usunięte.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Wersja systemu nie zostanie zmieniona ani cofnięta.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>W usunięte gry i <L_DLC/> można zagrać ponownie po ponownym pobraniu oprogramowania. (Wycofane oprogramowanie może w niektórych przypadkach być niedostępne do ponownego pobrania.)<TAG10/>"
