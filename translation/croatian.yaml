  target: "Želite li slati zapisnike pogrešaka i podatke o postavkama sustava tvrtki <L_N10/>?<TAG1/><NL/><TAG2/><TAG3/>Ti se podaci radi analize i poboljšanja mogu dijeliti s vanjskim programerima čiji se softver srušio. Informacije o međunarodnim odredištima dijeljenja podataka i zaštiti osobnih podataka objavljene su na web-stranici u nastavku (samo na japanskom). Pročitajte ih unaprijed.<NL/>https://www.<L_UCOM/>/jp/privacy/crossborder/<TAG4/><TAG5/>"
