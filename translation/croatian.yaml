- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Pokažite ovaj QR kod za prijavu dolaska na odabrane <L_N10/> događaje i lokacije. Tako pristupate ekskluzivnim pogodnostima za članove <L_MNT/>, poput <L_MNT/> bodova i sudjelovanja u promotivnim nagradnim izvlačenjima. Pogodnosti se svaki put razlikuju, pa pri prijavi provjerite pojedinosti.<TAG1/><NL/><L_DOT1/><TAG2/>Ovaj QR kod omogućuje tvrtki <L_N10/> da identificira vaš <L_N10/> račun.<TAG3/><NL/><L_DOT1/><TAG4/>Prijavom možete sudjelovati u određenim promocijama i možda primati e-poruke o tim ili drugim promocijama. Dodatne informacije bit će na promotivnim stranicama.<TAG5/><NL/><L_DOT1/><TAG6/>Primjenjuju se korisnički ugovor za <L_N10/> račun i pravila o privatnosti.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR kod generiran: <TAG11/><TAG12/><TAG13/>"
