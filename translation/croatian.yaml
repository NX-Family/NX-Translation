  target: "Dopuštate li da <L_N10/> radi analize i poboljšanja dijeli podatke o pogreškama s ove konzole s vanjskim programerima čiji se softver srušio?<TAG1/><NL/>Informacije o međunarodnim odredištima dijeljenja podataka i zaštiti osobnih podataka objavljene su na web-stranici u nastavku (samo na japanskom). Pročitajte ih unaprijed.<NL/><L_NCJP/><NL/><TAG2/><TAG3/>Ovu postavku možete promijeniti u svakom trenutku.<TAG4/><TAG5/>"
