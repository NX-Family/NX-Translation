  target: "<TAG1/><TAG2/>Код памылкі: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Каб працягнуць на гэтай сістэме, закрыйце ўсе праграмы на іншай сістэме, у якія гуляюць праз гэты акаўнт <L_N10/>.<NL/><NL/>Або гуляйце тут, не закрываючы праграму на іншых сістэмах, такім чынам:<NL/><TAG7/><L_ROMB/> Некаторыя <L_DLC/> будуць недаступныя пры такім запуску.<TAG8/><TAG9/><NL/>1. <TAG10/>У меню HOME вылучыце праграму і націсніце <TAG11/>, каб<L_XA0/>закрыць яе.<TAG12/><NL/>2. <TAG13/>Трымайце <TAG14/>, затым націсніце <TAG15/> для перазапуску праграмы.<TAG16/>"
