- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Eliminaranse os datos da memoria do sistema e a consola volverá aos valores de fábrica.<NL/>Non se eliminarán os datos de gardado, as capturas de pantalla, os vídeos nin a información dos usuarios.<TAG1/><NL/><L_SQR/> Ten en conta:<TAG2/><NL/><L_DOT1/><TAG3/>Todos os datos de software da tarxeta <L_MSD/>, agás as capturas de pantalla e os vídeos, quedarán inutilizables. (Non se eliminarán os datos da tarxeta <L_MSD/>.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>A versión do sistema non cambiará nin volverá a unha anterior.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Poderás volver xogar aos xogos e ao <L_DLC/> eliminados tras descargar de novo o software. (Nalgúns casos, o software retirado pode non estar dispoñible para descargalo de novo.)<TAG10/>"
