- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be uploaded to the server.<TAG7/><NL/><L_DOT1/> <TAG8/>After uploading the data to the server, this system will be initialized, restoring it to factory defaults and erasing all data in system memory.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target system downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG11/><TAG12/><NL/>When a system transfer is started, people with <L_N10/> Accounts on the system, along with any supervising parent/guardian users, will get updates about the transfer in the following places:<TAG13/><NL/><L_DOT1/> <TAG14/>The e-mail linked to their <L_N10/> Account<TAG15/><NL/><L_DOT1/> <TAG16/>Their account settings on the <L_N10/> Account website (<TAG17/>)<TAG18/><TAG19/><NL/>Updates will note that you started a transfer and will include your nickname and icon.<TAG20/>"
  target: "<L_SQR/> <TAG1/>Sobre os datos doutros usuarios<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Os datos doutros usuarios transferiranse xunto cos datos do sistema.<NL/>Antes de iniciar a transferencia, comparte esta información con todas as persoas que usan este sistema.<TAG5/><NL/><L_DOT1/> <TAG6/>Todos os datos de usuario deste sistema subiranse ao servidor.<TAG7/><NL/><L_DOT1/> <TAG8/>Despois de subir os datos, o sistema inicializarase. Restauraranse os valores de fábrica e borraranse todos os datos da memoria do sistema.<TAG9/><NL/><L_DOT1/> <TAG10/>Cando o sistema de destino descargue os datos, iniciará sesión automaticamente nas contas <L_N10/> vinculadas ao sistema de orixe.<TAG11/><TAG12/><NL/>Ao iniciar unha transferencia do sistema, as persoas con contas <L_N10/> neste sistema, así como os pais, nais ou titores que as supervisan, recibirán avisos sobre a transferencia nestes lugares.<TAG13/><NL/><L_DOT1/> <TAG14/>O correo electrónico vinculado á súa conta <L_N10/><TAG15/><NL/><L_DOT1/> <TAG16/>A configuración da súa conta no sitio web de contas <L_N10/> (<TAG17/>)<TAG18/><TAG19/><NL/>Os avisos indicarán que iniciaches unha transferencia e incluirán o teu alcume e a túa icona.<TAG20/>"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with<L_XA0/>everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be transferred to the target <L_N10/> <TAG7/><L_SWT2/><TAG8/> system.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target <L_N10/> <TAG11/><L_SWT2/><TAG12/> downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG13/><TAG14/><NL/>When starting a system transfer, people with <L_N10/> Accounts on this system, along with any supervising parent/guardian users, will get updates in the following places:<TAG15/><NL/><L_DOT1/> <TAG16/>The e-mail linked to their <L_N10/> Account<TAG17/><NL/><L_DOT1/> <TAG18/>Their account settings on the <L_N10/> Account website (<TAG19/>)<TAG20/><TAG21/><NL/>Updates will note a transfer was started and will include the nickname and icon of the user who started the transfer.<TAG22/>"
  target: "<L_SQR/> <TAG1/>Sobre os datos doutros usuarios<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Os datos doutros usuarios transferiranse xunto cos datos do sistema.<NL/>Antes de iniciar a transferencia, comparte esta información con<L_XA0/>todas as persoas que usan este sistema.<TAG5/><NL/><L_DOT1/> <TAG6/>Todos os datos de usuario deste sistema transferiranse ao sistema <L_N10/> <TAG7/><L_SWT2/><TAG8/> de destino.<TAG9/><NL/><L_DOT1/> <TAG10/>Cando a <L_N10/> <TAG11/><L_SWT2/><TAG12/> de destino descargue os datos, iniciará sesión automaticamente nas contas <L_N10/> vinculadas ao sistema de orixe.<TAG13/><TAG14/><NL/>Ao iniciar unha transferencia do sistema, as persoas con contas <L_N10/> neste sistema, así como os pais, nais ou titores que as supervisan, recibirán avisos nestes lugares.<TAG15/><NL/><L_DOT1/> <TAG16/>O correo electrónico vinculado á súa conta <L_N10/><TAG17/><NL/><L_DOT1/> <TAG18/>A configuración da súa conta no sitio web de contas <L_N10/> (<TAG19/>)<TAG20/><TAG21/><NL/>Os avisos indicarán que se iniciou unha transferencia e incluirán o alcume e a icona de quen a iniciou.<TAG22/>"
- source: "<L_SQR/> <TAG1/>To <L_N10/> Account holders using this console:<TAG2/><TAG3/><NL/>If you initialize this console using this method, unlike the standard initialization, you will be unable to eject any loaded virtual game cards.<NL/>Additionally, this console will remain linked to your account and will be able to use any passes available for associated software.<TAG4/><NL/>If you want to continue using your <L_N10/> Account with this <L_NS/> console, relink your <L_N10/> Account to this console after it has been initialized.<TAG5/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG6/>"
  target: "<L_SQR/> <TAG1/>Para titulares de contas <L_N10/> que usan esta consola<TAG2/><TAG3/><NL/>Se inicializas a consola con este método, a diferenza da inicialización normal, non poderás expulsar as tarxetas de xogo virtuais cargadas.<NL/>Ademais, a consola seguirá vinculada á túa conta e poderá usar os pases dispoñibles para o software asociado.<TAG4/><NL/>Se queres seguir usando a túa conta <L_N10/> con esta consola <L_NS/>, volve vincular a conta <L_N10/> á consola despois de inicializala.<TAG5/><NL/>Visita o sitio web de asistencia de <L_N10/> para saber máis.<NL/><TAG6/>"
- source: "<L_SQR/> Help<TAG1/><NL/>Go to the HOME Menu, open your user page in the top-left corner, and select User Settings ⇒ User‑Verification Settings ⇒ <TAG2/> Help. From there, you can sign in to your <L_N10/> Account and reset your PIN with the I<L_XA0/>Can't Remember My PIN option."
  target: "<L_SQR/> Axuda<TAG1/><NL/>No menú HOME, abre a túa páxina de usuario na esquina superior esquerda e selecciona Configuración de usuario ⇒ Configuración de verificación de usuario ⇒ <TAG2/> Axuda. Alí podes iniciar sesión na túa conta <L_N10/> e restablecer o PIN coa opción Non<L_XA0/>lembro o meu PIN."
- source: "<L_SQR/> Important Information<TAG1/><NL/>Data sent to the server, such as save data, screenshots, and<NL/>videos, will be returned to this system. However, some data<NL/>may not appear exactly as it did previously. For example:<TAG2/><NL/><L_DOT1/> <TAG3/>Software icons on the HOME Menu will not be restored.<NL/>Group settings for All Software will also be erased.<NL/><TAG4/><TAG5/>Purchased downloadable software and <L_DLC/> will not be lost.<NL/>To redownload purchased software, load its virtual game card.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Any link to the <L_NS/> Parental Controls app<NL/>will be removed. You can relink the app at a later time.<TAG11/>"
  target: "<L_SQR/> Información importante<TAG1/><NL/>Os datos enviados ao servidor, como datos de gardado, capturas e<NL/>vídeos, volverán a este sistema. Porén, algúns datos<NL/>poden non aparecer exactamente como antes. Por exemplo<TAG2/><NL/><L_DOT1/> <TAG3/>Non se restaurarán as iconas de software do menú HOME.<NL/>Tamén se borrarán os axustes de grupos de Todo o software.<NL/><TAG4/><TAG5/>Non perderás o software descargable nin o <L_DLC/> adquiridos.<NL/>Carga a tarxeta de xogo virtual para volver descargar o software adquirido.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Eliminarase a vinculación coa aplicación <L_NS/> Parental Controls.<NL/>Podes volver vincular a aplicación máis tarde.<TAG11/>"
- source: "<L_SQR/> Lending and Borrowing<TAG1/><NL/><L_DOT1/> <TAG2/>Borrowed games will be returned after 14 days.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>You can borrow only one virtual game card at a time.<TAG6/>"
  target: "<L_SQR/> Prestar e pedir prestado<TAG1/><NL/><L_DOT1/> <TAG2/>Os xogos recibidos en préstamo devolveranse tras 14 días.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Só podes recibir en préstamo unha tarxeta de xogo virtual á vez.<TAG6/>"
