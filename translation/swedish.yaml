  target: "Läs mer på <L_N10/>s supportwebbplats.<NL/><TAG1/><TAG2/>Där finns även information om:<NL/><L_DOT1/><TAG3/>Att använda program utan isatt virtuellt spelkort.<TAG4/><NL/><L_DOT1/><TAG5/>Att bryta en systemlänk.<TAG6/><TAG7/><TAG8/>"
