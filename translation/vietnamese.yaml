  target: "Thiết bị khác trên mạng này có cùng địa chỉ IP với máy chơi game này.<TAG1/><NL/>Vui lòng thử lại sau.<TAG2/><NL/>Nếu sự cố vẫn tiếp diễn, hãy thử các cách sau:<NL/><L_DOT1/><TAG3/>Đảm bảo địa chỉ IP chính xác.<TAG4/><NL/><L_DOT1/><TAG5/>Nếu đặt địa chỉ IP thủ công, hãy đảm bảo địa chỉ do đơn vị quản lý mạng cung cấp là chính xác.<TAG6/><NL/><L_DOT1/><TAG7/>Đảm bảo các thiết bị khác trên mạng không dùng địa chỉ IP của máy chơi game này.<TAG8/>"
