  target: "<TAG1/><TAG2/>Mã lỗi: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Để tiếp tục trên hệ thống này, hãy đóng mọi phần mềm đang được người dùng liên kết với tài khoản <L_N10/> này sử dụng trên hệ thống khác.<NL/><NL/>Hoặc làm theo các bước sau để chơi trên hệ thống này mà không đóng phần mềm ở nơi khác:<NL/><TAG7/><L_ROMB/> Một số <L_DLC/> sẽ không dùng được nếu chạy phần mềm theo cách này.<TAG8/><TAG9/><NL/>1. <TAG10/>Vào menu HOME, chọn phần mềm rồi nhấn <TAG11/> để<L_XA0/>đóng phần mềm.<TAG12/><NL/>2. <TAG13/>Nhấn giữ <TAG14/>, rồi nhấn <TAG15/> để khởi động lại phần mềm.<TAG16/>"
