  target: "Lisätietoja on <L_N10/>n tukisivustolla.<NL/><TAG1/><TAG2/>Sieltä saat myös ohjeet:<NL/><L_DOT1/><TAG3/>Ohjelman käyttöön lataamatta virtuaalista pelikorttia.<TAG4/><NL/><L_DOT1/><TAG5/>Järjestelmäliitoksen purkuun.<TAG6/><TAG7/><TAG8/>"
