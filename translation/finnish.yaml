  target: "Saako <L_N10/> jakaa konsolin virhetietoja kaatuneiden ohjelmien ulkopuolisille kehittäjille analysointia ja parantamista varten?<NL/><TAG1/><TAG2/>Voit muuttaa asetusta milloin vain.<TAG3/><TAG4/>"
- source: "Do you allow <L_N10/> to share error information from this console with third-party developers whose software has crashed for analysis and improvement purposes?<TAG1/><NL/>Information regarding international data-sharing destinations and personal-data protection is published on the website below (only available in Japanese). Please review the information in advance.<NL/><L_NCJP/><NL/><TAG2/><TAG3/>You can change this setting at any time.<TAG4/><TAG5/>"
  target: "Saako <L_N10/> jakaa konsolin virhetietoja kaatuneiden ohjelmien ulkopuolisille kehittäjille analysointia ja parantamista varten?<TAG1/><NL/>Tietoja kansainvälisistä tiedonjakokohteista ja henkilötietojen suojasta on alla olevalla sivustolla (vain japaniksi). Lue tiedot etukäteen.<NL/><L_NCJP/><NL/><TAG2/><TAG3/>Voit muuttaa asetusta milloin vain.<TAG4/><TAG5/>"
