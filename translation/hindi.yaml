  target: "सिस्टम मेमोरी का सारा डेटा मिट जाएगा, जिसमें सॉफ़्टवेयर डेटा, सेव डेटा, स्क्रीनशॉट, वीडियो और उपयोगकर्ता जानकारी शामिल हैं। कंसोल की फ़ैक्टरी सेटिंग्स बहाल हो जाएँगी।<TAG1/><NL/><L_SQR/> <TAG2/>ध्यान दें:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>स्क्रीनशॉट और वीडियो को छोड़कर <L_MSD/> कार्ड पर सहेजा सारा सॉफ़्टवेयर डेटा अनुपयोगी हो जाएगा। (<L_MSD/> कार्ड का डेटा मिटेगा नहीं।)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>सिस्टम संस्करण नहीं बदलेगा।<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "सिस्टम मेमोरी का सारा डेटा मिट जाएगा, जिसमें सॉफ़्टवेयर, सेव डेटा, स्क्रीनशॉट, वीडियो और उपयोगकर्ता जानकारी शामिल हैं। कंसोल की फ़ैक्टरी सेटिंग्स बहाल हो जाएँगी।<TAG1/><NL/><L_SQR/> ध्यान दें:<TAG2/><NL/><L_DOT1/><TAG3/>स्क्रीनशॉट और वीडियो को छोड़कर <L_MSD/> कार्ड पर सहेजा सारा सॉफ़्टवेयर अनुपयोगी हो जाएगा। (<L_MSD/> कार्ड का डेटा मिटेगा नहीं।)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>सिस्टम संस्करण नहीं बदलेगा।<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>कंसोल से लिंक <L_N10/> खाते मिटेंगे नहीं, लेकिन उनका लिंक हट जाएगा।<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>आपके <L_N10/> खाते में <L_NEP/> का खरीद इतिहास और मौजूदा शेष राशि रहती है। कंसोल रीसेट करने के बाद अपना <L_N10/> खाता फिर लिंक करके उस खाते से खरीदा सॉफ़्टवेयर या <L_DLC/> फिर डाउनलोड कर सकते हैं। (बंद हो चुका सॉफ़्टवेयर कुछ मामलों में फिर डाउनलोड नहीं कर पाएँगे।)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/>अगर कंसोल में समस्या के कारण यह विकल्प इस्तेमाल कर रहे हैं:<TAG19/><NL/>रखरखाव मोड में सेव डेटा या उपयोगकर्ता जानकारी मिटाए बिना कंसोल रीसेट कर सकते हैं। इसके बजाय यह तरीका आज़माना चाहें तो रीसेट प्रक्रिया रद्द करके ये चरण अपनाएँ:<TAG20/><NL/><L_D1/> <TAG21/>कंसोल बंद करें।<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>कंसोल बंद करने के लिए पावर मेनू खोलें (POWER बटन तीन सेकंड दबाए रखें), फिर पावर विकल्प → बंद करें चुनें।<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>कंसोल चालू करने के लिए आवाज़ बढ़ाने (+) और घटाने (-) वाले बटन के साथ POWER बटन दबाए रखें।<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>कंसोल रखरखाव मोड में शुरू होगा।<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>सेव डेटा मिटाए बिना कंसोल रीसेट करें चुनें और दिए निर्देशों का पालन करें।<TAG38/>"
