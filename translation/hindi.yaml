  target: "<L_DASH/> मिनट शेष हैं"
- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>उधार लिए गेम 14 दिन बाद वापस हो जाएँगे।<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>साझा करने के लिए सिस्टम एक-दूसरे के पास लाएँ।<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>कुछ सॉफ़्टवेयर उधार देने की सुविधा का समर्थन नहीं करते।<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>उपयोगकर्ता <TAG2/> का खरीदा हुआ डाउनलोड योग्य सॉफ़्टवेयर लक्ष्य सिस्टम पर फिर से डाउनलोड करके खेल सकते हैं।<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>स्क्रीनशॉट और वीडियो ट्रांसफ़र नहीं हुए और मूल सिस्टम पर ही हैं।<TAG6/><TAG7/><NL/>अधिक जानकारी के लिए <L_N10/> की सहायता वेबसाइट देखें:<NL/><L_NCOJ/>"
