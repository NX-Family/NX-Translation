  target: "इस सॉफ़्टवेयर का पुराना डेटा मिला है।<NL/>जगह खाली करने के लिए डेटा मिटाएँ?<TAG1/><NL/><TAG2/><TAG3/>यह सॉफ़्टवेयर खेलने से पहले डेटा डाउनलोड करना होगा।<NL/>यदि इसे तुरंत खेलना चाहते हैं, तो इसके बजाय दूसरे सॉफ़्टवेयर का डेटा आर्काइव करने पर विचार करें।<TAG4/><TAG5/>"
