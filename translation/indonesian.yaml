- source: "Once displayed, the online-user notification for a particular user will not be displayed again for 30 minutes."
  target: "Setelah ditampilkan, pemberitahuan pengguna online untuk pengguna tertentu tidak akan ditampilkan lagi selama 30 menit."
- source: "Once everyone has reached this screen, one person should create a group and then have the others join it.<NL/><TAG1/><TAG2/>Everyone's software will be updated to match the most recent version in the group.<TAG3/><TAG4/>"
  target: "Setelah semua orang mencapai layar ini, satu orang harus membuat grup dan kemudian orang lain bergabung dengan grup tersebut.<NL/><TAG1/><TAG2/>Perangkat lunak semua orang akan diperbarui sesuai dengan versi terbaru dalam grup.<TAG3/><TAG4/>"
