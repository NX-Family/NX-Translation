- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Data dalam memori sistem akan dihapus untuk mengembalikan konsol ke pengaturan pabrik.<NL/>Data simpanan, tangkapan layar, video, dan informasi pengguna tidak akan dihapus.<TAG1/><NL/><L_SQR/> Perhatikan:<TAG2/><NL/><L_DOT1/><TAG3/>Semua data perangkat lunak di kartu <L_MSD/>, kecuali tangkapan layar dan video, tidak akan dapat digunakan. (Data di kartu <L_MSD/> tidak akan dihapus.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Versi sistem tidak akan diubah atau dikembalikan ke versi sebelumnya.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Gim yang dihapus dan <L_DLC/> dapat dimainkan lagi setelah perangkat lunak diunduh ulang. (Dalam beberapa kasus, perangkat lunak yang telah dihentikan mungkin tidak dapat diunduh ulang.)<TAG10/>"
