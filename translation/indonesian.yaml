- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Kartu gim virtual dapat dipinjamkan ke anggota grup keluarga setelah kedua sistem didekatkan dan ditautkan.<TAG1/><NL/><L_DOT1/><TAG2/>Selama dipinjamkan, perangkat lunak bebas dimainkan di sistem peminjam, sementara pemberi pinjaman kehilangan akses ke perangkat lunak tersebut.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Kartu gim virtual dapat dipinjam hingga 14 hari. Saat tenggat tercapai, kartu akan dikembalikan otomatis.<NL/><TAG6/><TAG7/>Pemberi pinjaman juga dapat mengambil kembali kartu gim virtual dari peminjam sebelum tenggat.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Pengguna dapat meminjamkan satu kartu gim virtual per peminjam kepada maksimal tiga peminjam sekaligus, tetapi setiap sistem hanya dapat meminjam satu kartu.<NL/><TAG13/><TAG14/>Setelah diambil kembali, kartu gim virtual dapat dipinjamkan lagi.<TAG15/><TAG16/><TAG17/>"
- source: "Virtual game cards you were unable to load (<TAG1/>)"
  target: "Kartu gim virtual yang tidak dapat Anda muat (<TAG1/>)"
- source: "Visit the <L_N10/> Support website for further details.<NL/><TAG1/><TAG2/>Other information available there includes:<NL/><L_DOT1/><TAG3/>Using software without loading a virtual game card.<TAG4/><NL/><L_DOT1/><TAG5/>Unlinking a system.<TAG6/><TAG7/><TAG8/>"
  target: "Kunjungi situs Dukungan <L_N10/> untuk rincian lebih lanjut.<NL/><TAG1/><TAG2/>Informasi lain yang tersedia di sana mencakup:<NL/><L_DOT1/><TAG3/>Menggunakan perangkat lunak tanpa memuat kartu gim virtual.<TAG4/><NL/><L_DOT1/><TAG5/>Melepas tautan sistem.<TAG6/><TAG7/><TAG8/>"
