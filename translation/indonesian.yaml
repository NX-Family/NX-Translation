- source: "\"Download Complete\" Notifications"
  target: "Notifikasi \"Unduhan Selesai\""
- source: "\"Man, if only there was one place to go and find answers to all my questions about <L_NS/>!\"<NL/><NL/>That's what I was saying yesterday. Luckily, I guess a passing genie heard me and granted my wish, because I found the <L_N10/> Support Website!<NL/>It's got all kinds of super-detailed info on how to use the console, plus the latest on getting system updates and new features! Just enter the URL in your PC or smart device if you've got questions. Go check it out! <NL/>"
  target: "\"Wah, andai ada satu tempat untuk menemukan jawaban atas semua pertanyaan saya tentang <L_NS/>!\"<NL/><NL/>Itulah yang saya katakan kemarin. Untungnya, sepertinya jin yang lewat mendengar dan mengabulkan keinginan saya, karena saya menemukan Situs Dukungan <L_N10/>!<NL/>Ada berbagai info sangat terperinci tentang penggunaan konsol, juga kabar terbaru tentang pembaruan sistem dan fitur baru! Jika ada pertanyaan, cukup masukkan URL-nya di PC atau perangkat pintar Anda. Silakan kunjungi! <NL/>"
- source: "(Gameplay restrictions only)"
  target: "(Hanya batasan permainan)"
- source: "(Hold)"
  target: "(Tahan)"
- source: "(Oh, and when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. The game card slot is kind of hidden too. Check the top right of the screen!<NL/>"
  target: "(Oh, saat ingin mengeluarkan kartu <L_MSD/>, tekan ke dalam hingga terdengar klik sebelum menariknya keluar. Saat memasangnya kembali, lakukan hal yang sama - tekan hingga terdengar klik.)<NL/><NL/>Selamat bermain,<NL/>Amelia N.<NL/><NL/>P.S. Slot kartu gim juga agak tersembunyi. Periksa bagian kanan atas layar!<NL/>"
- source: "(Oh, but be sure to turn the console off when you remove or insert a <L_MSD/> card.)<NL/><NL/>(Oh, oh! And when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming!<NL/>Amelia N.<NL/><NL/>P.S. If you're not sure what kind of SD card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" They should be able to take care of you."
  target: "(Oh, pastikan konsol dimatikan saat melepas atau memasang kartu <L_MSD/>.)<NL/><NL/>(Oh, satu lagi! Saat ingin mengeluarkan kartu <L_MSD/>, tekan ke dalam hingga terdengar klik sebelum menariknya keluar. Saat memasangnya kembali, lakukan hal yang sama - tekan hingga terdengar klik.)<NL/><NL/>Selamat bermain!<NL/>Amelia N.<NL/><NL/>P.S. Jika bingung memilih kartu SD, mintalah kartu \"<L_UHSI/> atau lebih tinggi\" berjenis <L_MSD/>. Penjual seharusnya bisa membantu Anda."
- source: "*This feature is available with compatible software.<NL/><NL/>P.S. If you're not sure what kind of <L_MSD/> card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" The folks at the store should know what you mean.<NL/><NL/>"
  target: "*Fitur ini tersedia dengan perangkat lunak yang kompatibel.<NL/><NL/>P.S. Jika bingung memilih kartu <L_MSD/>, mintalah kartu \"<L_UHSI/> atau lebih tinggi\" berjenis <L_MSD/>. Penjual seharusnya mengerti maksud Anda.<NL/><NL/>"
