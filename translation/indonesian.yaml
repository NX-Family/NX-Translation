- source: "Link your <L_N10/> Account to this console to download software from <TAG1/><L_NEP/><TAG2/>, transfer data between consoles-and much more!<TAG3/><NL/>Once linked, you can also set this console as your primary console in <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>You must be connected to the Internet to play your software on a console that is not your primary console.<TAG8/><TAG9/><TAG10/><NL/>If you are unable to link your <L_N10/> Account now, check your user page on the <TAG11/>HOME Menu<TAG12/>."
  target: "Tautkan Akun <L_N10/> Anda ke konsol ini untuk mengunduh perangkat lunak dari <TAG1/><L_NEP/><TAG2/>, mentransfer data antarkonsol, dan banyak lagi!<TAG3/><NL/>Setelah ditautkan, Anda juga dapat menetapkan konsol ini sebagai konsol utama di <TAG4/><L_NEP/><TAG5/>.<NL/><TAG6/><TAG7/>Anda harus terhubung ke Internet untuk memainkan perangkat lunak di konsol yang bukan konsol utama Anda.<TAG8/><TAG9/><TAG10/><NL/>Jika belum dapat menautkan Akun <L_N10/>, periksa halaman pengguna di <TAG11/>Menu HOME<TAG12/>."
