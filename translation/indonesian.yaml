- source: "On an adventure and see some striking scenery? <NL/>Bringing the house down with your soulful solo?<NL/><NL/>Quick, press <0xE0BA/> (that's the capture button)!<NL/>You'll take a screenshot that gets saved to your album. <NL/>Keep snapping screens and pretty soon you'll have a treasure trove of happy gaming memories!<NL/><NL/>Oh, but that's not all! You can also add text to a screenshot and post it to your favorite social media sites. Share those gaming moments with your friends!<NL/><NL/>And if you want to relive an extra, extra special moment, you can record the last 30 seconds of your gameplay as a video*. <NL/>Simply hold down <0xE0BA/> until you hear a lil' sound. You can also share videos straight from your album, so show the world your gaming feats!<NL/><NL/><L_SQR/> Attention Avid Screenshotandvideographers:<NL/>If you want to be able to save a lot of pictures or videos, you might want to buy yourself a <L_MSD/> card.<NL/><NL/>The internal storage can hold about 1,000 screenshots or 100 videos, but a big enough <L_MSD/> card, can hold up to 10,000 screenshots or 1,000 videos! That's a lot of memories!<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Sedang berpetualang dan melihat pemandangan menakjubkan? <NL/>Memukau penonton dengan solo penuh perasaan?<NL/><NL/>Cepat, tekan <0xE0BA/> (Tombol Tangkap)!<NL/>Tangkapan layar akan diambil dan disimpan di album Anda. <NL/>Terus ambil tangkapan layar, dan tak lama lagi Anda akan punya kumpulan kenangan bermain yang membahagiakan!<NL/><NL/>Bukan itu saja! Anda juga dapat menambahkan teks pada tangkapan layar dan mempostingnya ke situs media sosial favorit. Bagikan momen bermain kepada teman Anda!<NL/><NL/>Untuk mengenang momen yang sangat istimewa, Anda dapat merekam 30 detik terakhir permainan sebagai video*. <NL/>Cukup tahan <0xE0BA/> hingga terdengar bunyi singkat. Video juga dapat dibagikan langsung dari album. Tunjukkan kehebatan bermain Anda kepada dunia!<NL/><NL/><L_SQR/> Perhatian, Pencinta Tangkapan Layar dan Video:<NL/>Jika ingin menyimpan banyak gambar atau video, pertimbangkan membeli kartu <L_MSD/>.<NL/><NL/>Penyimpanan internal menampung sekitar 1.000 tangkapan layar atau 100 video. Kartu <L_MSD/> yang cukup besar dapat menampung hingga 10.000 tangkapan layar atau 1.000 video! Banyak sekali kenangan!<NL/><NL/>Selamat bermain,<NL/>Amelia N."
- source: "On the target console, go to the HOME Menu and then select <0xE130/> (System Settings) ⇒ Users ⇒ Transfer Your User Data."
  target: "Pada konsol target, pergi ke Menu HOME lalu pilih <0xE130/> (Pengaturan Sistem) ⇒ Pengguna ⇒ Transfer Data Pengguna Anda."
