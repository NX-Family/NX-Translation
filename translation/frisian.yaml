- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Ynstellingen foar automatysk downloaden binne foar elke konsole apart.<NL/><TAG1/><TAG2/>Om bewarre gegevens automatysk op in oare konsole te downloaden, moatte jo de ynstellingen op dy konsole wizigje. Om<TAG3/><TAG4/> jo ynstellingen oan te passen, gean nei <0xE130/> (Systeemynstellingen) ⇒ Gegevensbehear ⇒ Bewarre gegevens yn de wolk yn it HOME-menu.<TAG5/><TAG6/>"
- source: "Automatic save-data backups are currently paused.<NL/>Select an option below to resume automatic backups."
  target: "Automatyske reservekopyen fan bewarre gegevens binne pauzearre.<NL/>Kies hjirûnder in opsje om automatyske reservekopyen te ferfetsjen."
- source: "Automatic save-data download has been enabled on this console.<TAG1/><NL/>This does not change the settings on other consoles.<NL/>To change settings on other consoles, you will need<NL/>to do so separately on each individual console."
  target: "Automatysk downloaden fan bewarre gegevens is op dizze konsole ynskeakele.<TAG1/><NL/>Dit feroaret de ynstellingen op oare konsoles net.<NL/>Om ynstellingen op oare konsoles te wizigjen, moatte jo<NL/>dat op elke konsole apart dwaan."
- source: "Automatic save-data download has been enabled.<TAG1/><NL/><L_DOT1/><TAG2/>The initial download must be performed manually.<TAG3/><NL/><L_DOT1/><TAG4/>To enable this feature on other consoles, you will need to manage your settings on each console.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>You can adjust your settings in <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG9/><TAG10/><TAG11/>"
  target: "Automatysk downloaden fan bewarre gegevens is ynskeakele.<TAG1/><NL/><L_DOT1/><TAG2/>Jo moatte de earste download mei de hân útfiere.<TAG3/><NL/><L_DOT1/><TAG4/>Om dit op oare konsoles yn te skeakeljen, moatte jo de ynstellingen op elke konsole beheare.<TAG5/><NL/><L_WSP/><TAG6/><TAG7/><TAG8/>Jo kinne dit oanpasse fia <0xE130/> (Systeemynstellingen) ⇒ Gegevensbehear ⇒ Bewarre gegevens yn de wolk yn it HOME-menu.<TAG9/><TAG10/><TAG11/>"
- source: "Automatic save-data download may not always occur immediately.<NL/><TAG1/><TAG2/>If you want to play on another console using the same save data right away, you can manually back up the save data and then manually download it as desired.<TAG3/><TAG4/>"
  target: "Bewarre gegevens wurde net altyd daliks automatysk downloade.<NL/><TAG1/><TAG2/>Wolle jo fuortdaliks op in oare konsole mei deselde bewarre gegevens spylje, dan kinne jo sels in reservekopy meitsje en dy dêrnei mei de hân downloade.<TAG3/><TAG4/>"
- source: "Automatic save-data downloads are currently paused.<NL/>Select an option below to resume automatic downloads."
  target: "Automatyske downloads fan bewarre gegevens binne pauzearre.<NL/>Kies hjirûnder in opsje om automatysk downloaden te ferfetsjen."
