- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Firtuele spulkaarten kinne oan leden fan de famyljegroep útliend wurde nei't jo beide systemen ticht byinoar brocht en keppele hawwe.<TAG1/><NL/><L_DOT1/><TAG2/>By it útlienen kin de software frij spile wurde op it systeem fan de brûker dy't de kaart lient. De brûker dy't de kaart útlient, ferliest tydlik tagong ta de software.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Firtuele spulkaarten kinne maksimaal 14 dagen liend wurde. Dêrnei wurdt de kaart automatysk weromjûn.<NL/><TAG6/><TAG7/>De brûker dy't de kaart útliend hat, kin dy ek earder by de liener weromhelje.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Brûkers kinne ien firtuele spulkaart per liener útliene oan maksimaal trije lieners tagelyk. Op elk systeem kin mar ien kaart tagelyk liend wurde.<NL/><TAG13/><TAG14/>Nei it weromheljen kin in firtuele spulkaart opnij útliend wurde.<TAG15/><TAG16/><TAG17/>"
- source: "Virtual game cards you were unable to load (<TAG1/>)"
  target: "Firtuele spulkaarten dy't jo net lade koene (<TAG1/>)"
- source: "Visit the <L_N10/> Support website for further details.<NL/><TAG1/><TAG2/>Other information available there includes:<NL/><L_DOT1/><TAG3/>Using software without loading a virtual game card.<TAG4/><NL/><L_DOT1/><TAG5/>Unlinking a system.<TAG6/><TAG7/><TAG8/>"
  target: "Sjoch op de <L_N10/>-stipewebside foar mear ynformaasje.<NL/><TAG1/><TAG2/>Dêr stiet ek ynformaasje oer it folgjende.<NL/><L_DOT1/><TAG3/>Software brûke sûnder in firtuele spulkaart te laden.<TAG4/><NL/><L_DOT1/><TAG5/>In systeem loskeppelje.<TAG6/><TAG7/><TAG8/>"
- source: "Visit the <L_N10/> Support website for more details.<NL/><TAG1/><TAG2/>You can also find information on moving data between systems without performing a system transfer.<TAG3/><TAG4/>"
