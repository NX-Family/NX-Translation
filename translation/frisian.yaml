- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Gegevens yn it systeemûnthâld wurde wiske en de konsole wurdt nei de fabryksynstellingen weromset.<NL/>Bewarre gegevens, skermôfbyldingen, fideo's en brûkersynformaasje wurde net wiske.<TAG1/><NL/><L_SQR/> Let op:<TAG2/><NL/><L_DOT1/><TAG3/>Alle softwaregegevens op de <L_MSD/>-kaart, útsein skermôfbyldingen en fideo's, wurde ûnbrûkber. (Gegevens op de <L_MSD/>-kaart wurde net wiske.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>De systeemferzje wurdt net wizige of nei in âldere ferzje weromset.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Wiske spultsjes en <L_DLC/> kinne wer spile wurde nei't de software opnij downloade is. (Software dy't net mear oanbean wurdt, kin yn guon gefallen net opnij downloade wurde.)<TAG10/>"
