- source: "To continue on this system, close any software being used on another system by a user linked to this <L_N10/> Account.<TAG1/><NL/>Alternatively, you can play the software on this system without closing it elsewhere by following the steps below:<NL/><L_ROMB/> <TAG2/>Some <L_DLC/> will be unavailable if you start the software this way.<TAG3/><TAG4/><NL/>1. <TAG5/>Go to the HOME Menu, highlight the software, and press <0xE0E2/> to<L_XA0/>close the software.<TAG6/><NL/>2. <TAG7/>Press and hold <0xE0E3/>, and then press <0xE0E0/> to restart the software.<TAG8/>"
  target: "Om op dit systeem troch te gean, slút alle software op oare systemen dy't brûkt wurdt troch in brûker keppele oan dit <L_N10/>-akkount.<TAG1/><NL/>Jo kinne ek op dit systeem spylje sûnder de software earne oars te sluten troch dizze stappen te folgjen.<NL/><L_ROMB/> <TAG2/>As jo sa starte, is guon <L_DLC/> net beskikber.<TAG3/><TAG4/><NL/>1. <TAG5/>Selektearje de software yn it HOME-menu en druk op <0xE0E2/> om dy te<L_XA0/>sluten.<TAG6/><NL/>2. <TAG7/>Hâld <0xE0E3/> yndrukt en druk op <0xE0E0/> om de software opnij te starten.<TAG8/>"
- source: "To continue on this system, close the software on any other system where it's being played by a user linked to this <L_N10/> Account.<TAG1/><NL/>Alternatively, you can play the software on this system without closing it elsewhere by following the steps below:<NL/><L_ROMB/><TAG2/>Some <L_DLC/> will be unavailable if you start the software this way.<TAG3/><TAG4/><NL/>1. <TAG5/>Go to the HOME Menu, highlight the software, and press <0xE0E2/> to<L_XA0/>close the software.<TAG6/><NL/>2. <TAG7/>Press and hold <0xE0E3/> and then press <0xE0E0/> to restart the software.<TAG8/>"
  target: "Om op dit systeem troch te gean, slút dizze software op alle oare systemen dêr't in brûker mei dit <L_N10/>-akkount de software spilet.<TAG1/><NL/>Jo kinne ek op dit systeem spylje sûnder de software earne oars te sluten troch dizze stappen te folgjen.<NL/><L_ROMB/><TAG2/>As jo sa starte, is guon <L_DLC/> net beskikber.<TAG3/><TAG4/><NL/>1. <TAG5/>Selektearje de software yn it HOME-menu en druk op <0xE0E2/> om dy te<L_XA0/>sluten.<TAG6/><NL/>2. <TAG7/>Hâld <0xE0E3/> yndrukt en druk op <0xE0E0/> om de software opnij te starten.<TAG8/>"
- source: "To continue without linking, create a new user.<NL/><TAG1/><TAG2/>You can link a <L_N10/> Account later.<TAG3/><TAG4/>"
  target: "Meitsje in nije brûker oan om sûnder keppeljen troch te gean.<NL/><TAG1/><TAG2/>Jo kinne letter in <L_N10/>-akkount keppelje.<TAG3/><TAG4/>"
- source: "To disconnect an unwanted controller, press its SYNC Button briefly."
  target: "Druk koart op de SYNC-knop fan in ûnwinske kontroller om dy los te keppeljen."
- source: "To display Support Information, Important Information, and Intellectual Property Notices, insert the game card or download this software."
  target: "Foegje de spulkaart yn of download dizze software om Stipe-ynformaasje, Wichtige ynformaasje en Meidielingen oer yntellektueel eigendom te besjen."
- source: "To display your <TAG1/><L_N3D/><TAG2/> friends (<0xE131/>), your <TAG3/><L_N3D/><TAG4/> needs to be linked with a <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>You can do so by going to System Settings on your <TAG8/><L_N3D/><TAG9/>."
  target: "Om jo <TAG1/><L_N3D/><TAG2/>-freonen (<0xE131/>) te sjen, moat jo <TAG3/><L_N3D/><TAG4/> oan in <TAG5/><L_NNI/><TAG6/> keppele wêze.<TAG7/><NL/>Jo kinne dit dwaan fia Systeemynstellingen op jo <TAG8/><L_N3D/><TAG9/>."
- source: "To download the save data, the software you're using will now close and restart."
  target: "Om de bewarre gegevens te downloaden, wurdt de software dy't jo brûke no sluten en opnij start."
- source: "To earn points for physical software, certain conditions must be fulfilled. For details, see the <L_MNT/> website."
  target: "Foar punten foar fysike software moat oan bepaalde betingsten foldien wurde. Sjoch foar mear ynformaasje op de <L_MNT/>-webside."
- source: "To enjoy surround sound, you will need a device that supports linear PCM 5.1 surround sound. Without a supporting device connected, some sounds may not play correctly.<TAG1/><NL/>Do you want to enable surround sound?"
  target: "Foar surroundlûd hawwe jo in apparaat nedich dat lineêr PCM 5.1-surroundlûd stipet. Sûnder sa'n apparaat kinne guon lûden ferkeard ôfspile wurde.<TAG1/><NL/>Wolle jo surroundlûd ynskeakelje?"
- source: "To exit Maintenance Mode, press the POWER Button to turn off the console."
  target: "Druk op de POWER-knop om de konsole út te skeakeljen en Underhâldsmodus te ferlitten."
- source: "To free up enough space, you will also need to archive software for which Prevent Auto Archiving has been enabled.<NL/>Choose software to archive?"
  target: "Foar genôch frije romte moatte jo ek software argivearje mei Automatysk argivearjen foarkomme ynskeakele.<NL/>Software kieze om te argivearjen?"
- source: "To link the two systems, you will need to bring them close to one another.<TAG1/><NL/>If the system shown is unavailable because it has been damaged or lost, please unlink the system from a PC or smart device.<TAG2/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG3/>"
  target: "Bring de twa systemen ticht byinoar om se te keppeljen.<TAG1/><NL/>As it werjûne systeem net beskikber is troch skea of ferlies, keppelje it systeem dan los fia in PC of tûk apparaat.<TAG2/><NL/>Sjoch op de <L_N10/>-stipewebside foar mear ynformaasje.<NL/><TAG3/>"
- source: "To load a virtual game card on another system, you must link this system with the other system. Systems only need to<L_XA0/>be linked<L_XA0/>once.<NL/><TAG1/><TAG2/>Each <L_N10/> Account can have a maximum of two systems linked at a time.<TAG3/><TAG4/>"
  target: "Om in firtuele spulkaart op in oar systeem te laden, moatte jo dit systeem oan dat oare systeem keppelje. Dat hoecht mar<L_XA0/>ien kear<L_XA0/>te barren.<NL/><TAG1/><TAG2/>Elk <L_N10/>-akkount kin maksimaal twa systemen tagelyk keppele hawwe.<TAG3/><TAG4/>"
- source: "To load a virtual game card on this system, you must link it with the other system <TAG1/> is using, shown below. Systems only need to<L_XA0/>be linked once."
