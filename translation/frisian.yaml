  target: "Dit beheint iepen kommunikaasje tusken brûkers, ynklusyf it ferstjoeren en ûntfangen fan berjochten en ôfbyldingen.<TAG1/><NL/>Ofhinklik fan de software wurde de folgjende aktiviteiten beheind.<TAG2/><NL/><L_DOT1/><TAG3/>Berjochten ferstjoere en ûntfange en petearfunksjes brûke.<TAG4/><NL/><L_DOT1/><TAG5/>Profylynformaasje lêze en diele dêr't brûkers eigen tekst ynfiere kinne.<TAG6/><NL/><L_DOT1/><TAG7/>Ofbyldingen besjen en diele dy't brûkers makke hawwe, mooglik mei tekst.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Applikaasjes dy't bûten <L_NS/> wurkje, lykas <L_NS/> App, wurde net beheind. Brûk jo tûke apparaat as jo beheiningen foar de app ynstelle wolle.<TAG12/><TAG13/>"
