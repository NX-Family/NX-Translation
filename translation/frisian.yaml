- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>Liende spultsjes wurde nei 14 dagen weromjûn.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring de konsoles ticht byinoar om te dielen.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Guon software kin mooglik net útliend wurde.<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>Downloadbere software dy't <TAG2/> kocht hat, kinne jo opnij downloade en op de doelkonsole spylje.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Skermôfbyldingen en fideo's binne net oerdroegen en bliuwe op de oarspronklike konsole.<TAG6/><TAG7/><NL/>Besykje de stipewebside fan <L_N10/> foar mear ynformaasje:<NL/><L_NCOJ/>"
