- source: "Wireless connection with the controllers will be turned off. Please use the buttons on the system."
  target: "De triedleaze ferbining mei de kontrollers wurdt útskeakele. Brûk de knoppen op it systeem."
- source: "Wirelessly transfer one user and all their save data to a nearby <L_NS/> system.<NL/>The transferred user and save data will be deleted from the source system."
  target: "Draach ien brûker mei alle bewarre gegevens triedleas oer nei in <L_NS/>-systeem yn de buert.<NL/>De oerdroegen brûker en bewarre gegevens wurde fan it boarnesysteem wiske."
- source: "With the Save Data Cloud feature of <L_NSO/>, you can automatically back up your save data whenever you play.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Mei de funksje Bewarre gegevens yn de wolk fan <L_NSO/> kinne jo by it spyljen automatysk in reservekopy fan jo bewarre gegevens meitsje.<NL/><TAG1/><TAG2/>Guon software stipet dizze funksje net.<TAG3/><TAG4/>"
- source: "With these settings turned off, you won't be asked for verification to use the feature, and other users on the system will also be able to freely access the associated feature.<TAG1/><NL/><L_DOT1/><TAG2/>When using <L_NEP/>, other users on this system can use funds and view account information, including payment method, etc.<TAG3/><NL/><L_DOT1/><TAG4/>On the virtual game card menu, other users on this system can view, load, and lend out purchased digital software.<TAG5/>"
  target: "Mei dizze ynstellingen út wurdt gjin ferifikaasje frege foar de funksje. Oare brûkers op it systeem kinne de byhearrende funksje dan ek frij brûke.<TAG1/><NL/><L_DOT1/><TAG2/>Yn <L_NEP/> kinne oare brûkers op dit systeem saldo útjaan en akkountynformaasje besjen, ynklusyf de betelmetoade.<TAG3/><NL/><L_DOT1/><TAG4/>Yn it menu foar firtuele spulkaarten kinne oare brûkers op dit systeem kochte digitale software besjen, lade en útliene.<TAG5/>"
- source: "With this option enabled, it is recommended that you use dual-controller grip."
  target: "Mei dizze opsje ynskeakele wurdt in greep mei twa kontrollers oanrikkemandearre."
- source: "With this setting turned off, you will not be asked for verification, and any other users on the system will be able to freely access this feature."
  target: "As dizze ynstelling útskeakele is, wurdt jo net frege om ferifikaasje, en alle oare brûkers op it systeem sille frij tagong hawwe ta dizze funksje."
- source: "Would you like to connect to a TV and play on a larger screen?"
  target: "Wolle jo ferbine mei in TV en op in grutter skerm spylje?"
- source: "Would you like to delete the Parental Controls settings?"
  target: "Wolle jo de ynstellingen foar Âlderlik tafersjoch wiskje?"
- source: "Would you like to disconnect and end communication?"
  target: "Wolle jo de ferbining ferbrekke en de kommunikaasje beëinigje?"
- source: "Would you like to report error logs and system settings configuration information to <L_N10/>?<NL/><TAG1/><TAG2/>This information will be used for troubleshooting purposes.<TAG3/><TAG4/>"
  target: "Wolle jo flaterlogboeken en ynformaasje oer de systeemynstellingen oan <L_N10/> rapportearje?<NL/><TAG1/><TAG2/>Dizze ynformaasje wurdt brûkt om problemen op te lossen.<TAG3/><TAG4/>"
