- source: "<L_ROMB/> <TAG1/>This news feature is not currently available in English.<TAG2/>"
  target: "<L_ROMB/> <TAG1/>Dizze nijsfunksje is op dit stuit net beskikber yn it Ingelsk.<TAG2/>"
- source: "<L_ROMB/> If your <L_NS/> screen isn't displaying on the TV, here are some things to check:<NL/><L_DOT1/>Is the TV on?<NL/><L_DOT1/>Is the TV set to the right input? <NL/><L_DOT1/>Are the AC adapter and the <L_HDMI/> cable connected properly?<NL/><L_DOT1/>Is the <L_NS/> console centered nicely on the dock, and did you press down lightly to connect it?<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> As jo <L_NS/>-skerm net op de TV ferskynt, kontrolearje dan it folgjende:<NL/><L_DOT1/>Stiet de TV oan?<NL/><L_DOT1/>Stiet de TV op de goede yngong? <NL/><L_DOT1/>Binne de AC-adapter en de <L_HDMI/>-kabel goed oansletten?<NL/><L_DOT1/>Stiet de <L_NS/>-konsole goed yn it midden fan it dock, en hawwe jo dy licht nei ûnderen drukt om ferbining te meitsjen?<NL/><NL/>In protte spulwille,<NL/>Amelia N."
- source: "<L_ROMB/> This setting will not affect the colors displayed in TV mode."
  target: "<L_ROMB/> Dizze ynstelling hat gjin ynfloed op de kleuren dy't yn de TV-modus werjûn wurde."
- source: "<L_ROMB/> To receive the latest news, you'll need to have an Internet connection and link your <L_N10/> Account with your <L_NS/> console.<NL/><NL/><L_ROMB/> If news channels are available for a certain game, you'll be automatically subscribed to them when you first play that game. Channel settings can be changed in System Settings ⇒ System ⇒ News Channel Settings.<NL/><NL/><L_ROMB/> Some channels may only be available for a limited time.<NL/><NL/><L_ROMB/> You can get news from the <L_NS/> Information Center even without linking an account. You just need to be connected to the Internet.<NL/><NL/><L_ROMB/> This feature is included in \"System Version 3.0.0\". You can verify the system version in Settings ⇒ System.<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. I forgot to mention, but you can jump between news entries by pressing  <0xE0A4/> or <0xE0A5/>!"
  target: "<L_ROMB/> Om it lêste nijs te ûntfangen, hawwe jo in ynternetferbining nedich en moatte jo jo <L_N10/>-akkount oan jo <L_NS/>-konsole keppelje.<NL/><NL/><L_ROMB/>As der nijskanalen foar in spul beskikber binne, wurde jo der automatysk op abonnearre as jo dat spul foar it earst spylje. Jo kinne de kanaalynstellingen wizigje by Systeemynstellingen ⇒ Systeem ⇒ Nijskanaalynstellingen.<NL/><NL/><L_ROMB/>Guon kanalen binne mooglik mar in beheinde tiid beskikber.<NL/><NL/><L_ROMB/>Jo kinne ek nijs fan it <L_NS/>-ynformaasjesintrum krije sûnder in akkount te keppeljen. Jo hoege allinnich mar ferbûn te wêzen mei it ynternet.<NL/><NL/><L_ROMB/>Dizze funksje sit yn \"Systeemferzje 3.0.0\". Jo kinne de systeemferzje kontrolearje by Ynstellingen ⇒ Systeem.<NL/><NL/>In protte spulwille,<NL/>Amelia N.<NL/><NL/>P.S. Ik fergeat it te neamen, mar jo kinne tusken nijsartikels springe troch op  <0xE0A4/> of <0xE0A5/> te drukken!"
- source: "<L_ROMB/> When you're using the <L_NS/> dock, be sure to keep the AC adapter connected and plugged in, otherwise it won't display an image on the TV.<NL/><L_ROMB/> If you want to fully charge the <L_JC/> controllers, just attach them to the console while it's either docked or plugged in. But if they're attached when the console ISN'T charging, they might stop charging themselves to conserve the console's battery.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> As jo it <L_NS/>-dock brûke, soargje dan dat de AC-adapter oansletten bliuwt en yn it stopkontakt sit. Oars ferskynt der gjin byld op de TV.<NL/><L_ROMB/>Om de <L_JC/>-kontrollers folslein op te laden, meitsje se fêst oan de konsole wylst dy yn it dock stiet of op de stroomfoarsjenning oansletten is. As se fêstsitte wylst de konsole NET opladen wurdt, kinne se ophâlde mei opladen om de batterij fan de konsole te sparjen.<NL/><NL/>In protte spulwille,<NL/>Amelia N."
- source: "<L_SNC/>/animalcrossing"
  target: "<L_SNC/>/animalcrossing"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be uploaded to the server.<TAG7/><NL/><L_DOT1/> <TAG8/>After uploading the data to the server, this system will be initialized, restoring it to factory defaults and erasing all data in system memory.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target system downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG11/><TAG12/><NL/>When a system transfer is started, people with <L_N10/> Accounts on the system, along with any supervising parent/guardian users, will get updates about the transfer in the following places:<TAG13/><NL/><L_DOT1/> <TAG14/>The e-mail linked to their <L_N10/> Account<TAG15/><NL/><L_DOT1/> <TAG16/>Their account settings on the <L_N10/> Account website (<TAG17/>)<TAG18/><TAG19/><NL/>Updates will note that you started a transfer and will include your nickname and icon.<TAG20/>"
  target: "<L_SQR/> <TAG1/>Oer gegevens fan oare brûkers<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Gegevens fan oare brûkers wurde mei de systeemgegevens oerdroegen.<NL/>Diel dizze ynformaasje foar it begjin fan de oerdracht mei alle oaren dy't dizze konsole brûke.<TAG5/><NL/><L_DOT1/> <TAG6/>Alle brûkersgegevens op dizze konsole wurde nei de tsjinner stjoerd.<TAG7/><NL/><L_DOT1/> <TAG8/>Dêrnei wurdt dizze konsole inisjalisearre, weromset nei de fabryksynstellingen, en wurde alle gegevens yn it systeemûnthâld wiske.<TAG9/><NL/><L_DOT1/> <TAG10/>As de doelkonsole de oerdrachtgegevens downloadt, wurdt automatysk oanmeld by de <L_N10/>-akkounts dy't oan de boarnekonsole keppele wiene.<TAG11/><TAG12/><NL/>By it begjin fan in systeemoerdracht krije minsken mei <L_N10/>-akkounts op de konsole, en brûkers dy't as âlder of fâd tafersjoch hâlde, berjochten oer de oerdracht op de folgjende plakken:<TAG13/><NL/><L_DOT1/> <TAG14/>It e-mailadres dat oan harren <L_N10/>-akkount keppele is<TAG15/><NL/><L_DOT1/> <TAG16/>Harren akkountynstellingen op de webside foar <L_N10/>-akkounts (<TAG17/>)<TAG18/><TAG19/><NL/>De berjochten melde dat jo in oerdracht úteinset hawwe en befetsje jo bynamme en ikoan.<TAG20/>"
- source: "<L_SQR/> <TAG1/>About Other Users' Data<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Other users' data will be transferred along with the system data.<NL/>Before starting the transfer, please share this information with<L_XA0/>everyone else who uses this same system.<TAG5/><NL/><L_DOT1/> <TAG6/>All user data on this system will be transferred to the target <L_N10/> <TAG7/><L_SWT2/><TAG8/> system.<TAG9/><NL/><L_DOT1/> <TAG10/>When the target <L_N10/> <TAG11/><L_SWT2/><TAG12/> downloads the transfer data, it will automatically sign in to the <L_N10/> Accounts that were linked to the source system.<TAG13/><TAG14/><NL/>When starting a system transfer, people with <L_N10/> Accounts on this system, along with any supervising parent/guardian users, will get updates in the following places:<TAG15/><NL/><L_DOT1/> <TAG16/>The e-mail linked to their <L_N10/> Account<TAG17/><NL/><L_DOT1/> <TAG18/>Their account settings on the <L_N10/> Account website (<TAG19/>)<TAG20/><TAG21/><NL/>Updates will note a transfer was started and will include the nickname and icon of the user who started the transfer.<TAG22/>"
  target: "<L_SQR/> <TAG1/>Oer gegevens fan oare brûkers<TAG2/><TAG3/><NL/><L_WSP/><TAG4/>Gegevens fan oare brûkers wurde mei de systeemgegevens oerdroegen.<NL/>Diel dizze ynformaasje foar it begjin fan de oerdracht mei<L_XA0/>alle oaren dy't dizze konsole brûke.<TAG5/><NL/><L_DOT1/> <TAG6/>Alle brûkersgegevens op dizze konsole wurde nei de <L_N10/> <TAG7/><L_SWT2/><TAG8/>-doelkonsole oerdroegen.<TAG9/><NL/><L_DOT1/> <TAG10/>As de <L_N10/> <TAG11/><L_SWT2/><TAG12/>-doelkonsole de oerdrachtgegevens downloadt, wurdt automatysk oanmeld by de <L_N10/>-akkounts dy't oan de boarnekonsole keppele wiene.<TAG13/><TAG14/><NL/>By it begjin fan in systeemoerdracht krije minsken mei <L_N10/>-akkounts op dizze konsole, en brûkers dy't as âlder of fâd tafersjoch hâlde, berjochten op de folgjende plakken:<TAG15/><NL/><L_DOT1/> <TAG16/>It e-mailadres dat oan harren <L_N10/>-akkount keppele is<TAG17/><NL/><L_DOT1/> <TAG18/>Harren akkountynstellingen op de webside foar <L_N10/>-akkounts (<TAG19/>)<TAG20/><TAG21/><NL/>De berjochten melde dat in oerdracht begûn is en befetsje de bynamme en it ikoan fan de brûker dy't de oerdracht úteinset hat.<TAG22/>"
- source: "<L_SQR/> <TAG1/>To <L_N10/> Account holders using this console:<TAG2/><TAG3/><NL/>If you initialize this console using this method, unlike the standard initialization, you will be unable to eject any loaded virtual game cards.<NL/>Additionally, this console will remain linked to your account and will be able to use any passes available for associated software.<TAG4/><NL/>If you want to continue using your <L_N10/> Account with this <L_NS/> console, relink your <L_N10/> Account to this console after it has been initialized.<TAG5/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG6/>"
  target: "<L_SQR/> <TAG1/>Foar hâlders fan in <L_N10/>-akkount dy't dizze konsole brûke:<TAG2/><TAG3/><NL/>As jo dizze konsole mei dizze metoade inisjalisearje, kinne jo gjin laden firtuele spulkaarten útwerpe, oars as by de standertinisjalisaasje.<NL/>De konsole bliuwt ek oan jo akkount keppele en kin alle beskikbere passen foar byhearrende software brûke.<TAG4/><NL/>As jo jo <L_N10/>-akkount op dizze <L_NS/>-konsole brûken bliuwe wolle, keppelje jo <L_N10/>-akkount dan opnij oan dizze konsole nei de inisjalisaasje.<TAG5/><NL/>Besykje de stipewebside fan <L_N10/> foar mear ynformaasje.<NL/><TAG6/>"
- source: "<L_SQR/> Help<TAG1/><NL/>Go to the HOME Menu, open your user page in the top-left corner, and select User Settings ⇒ User‑Verification Settings ⇒ <TAG2/> Help. From there, you can sign in to your <L_N10/> Account and reset your PIN with the I<L_XA0/>Can't Remember My PIN option."
  target: "<L_SQR/> Help<TAG1/><NL/>Gean nei it HOME-menu, iepenje jo brûkersside loftsboppe en selektearje Brûkersynstellingen ⇒ Brûkersferifikaasje-ynstellingen ⇒ Help foar <TAG2/>. Dêr kinne jo jo oanmelde by jo <L_N10/>-akkount en jo PIN opnij ynstelle mei Ik<L_XA0/>wit myn PIN net mear."
- source: "<L_SQR/> Important Information<TAG1/><NL/>Data sent to the server, such as save data, screenshots, and<NL/>videos, will be returned to this system. However, some data<NL/>may not appear exactly as it did previously. For example:<TAG2/><NL/><L_DOT1/> <TAG3/>Software icons on the HOME Menu will not be restored.<NL/>Group settings for All Software will also be erased.<NL/><TAG4/><TAG5/>Purchased downloadable software and <L_DLC/> will not be lost.<NL/>To redownload purchased software, load its virtual game card.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Any link to the <L_NS/> Parental Controls app<NL/>will be removed. You can relink the app at a later time.<TAG11/>"
  target: "<L_SQR/> Wichtige ynformaasje<TAG1/><NL/>Gegevens dy't nei de tsjinner stjoerd binne, lykas bewarre gegevens, skermôfbyldingen en<NL/>fideo's, wurde nei dizze konsole werombrocht. Guon gegevens sjogge der<NL/>mooglik net presys sa út as earder. Bygelyks:<TAG2/><NL/><L_DOT1/> <TAG3/>Software-ikoanen yn it HOME-menu wurde net weromset.<NL/>Groepynstellingen foar Alle software wurde ek wiske.<NL/><TAG4/><TAG5/>Oankochte downloadbere software en <L_DLC/> geane net ferlern.<NL/>Laad de firtuele spulkaart om oankochte software opnij te downloaden.<TAG6/><TAG7/><TAG8/><TAG9/><NL/><L_DOT1/> <TAG10/>Elke keppeling mei de <L_NS/> Parental Controls-app<NL/>wurdt fuortsmiten. Jo kinne de app letter opnij keppelje.<TAG11/>"
- source: "<L_SQR/> Lending and Borrowing<TAG1/><NL/><L_DOT1/> <TAG2/>Borrowed games will be returned after 14 days.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>You can borrow only one virtual game card at a time.<TAG6/>"
  target: "<L_SQR/> Útlienen en lienen<TAG1/><NL/><L_DOT1/> <TAG2/>Liende spultsjes wurde nei 14 dagen weromjûn.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Jo kinne mar ien firtuele spulkaart tagelyk liene.<TAG6/>"
