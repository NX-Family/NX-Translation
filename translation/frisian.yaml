  target: "(Yndrukt hâlde)"
- source: "(Oh, and when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. The game card slot is kind of hidden too. Check the top right of the screen!<NL/>"
  target: "(O, as jo de <L_MSD/>-kaart derút helje wolle, druk dy dan earst yn oant jo in klik hearre en lûk dy dan derút. Doch itselde by it weromsetten: druk oant jo de klik hearre.)<NL/><NL/>In protte spulwille,<NL/>Amelia N.<NL/><NL/>P.S. It slot foar de spulkaart sit ek wat ferskûle. Sjoch rjochtsboppe oan it skerm!<NL/>"
- source: "(Oh, but be sure to turn the console off when you remove or insert a <L_MSD/> card.)<NL/><NL/>(Oh, oh! And when you want to take the <L_MSD/> card out, push it in until you hear the click before pulling it out. Same thing when you put it back in-push until you hear the click.)<NL/><NL/>Happy gaming!<NL/>Amelia N.<NL/><NL/>P.S. If you're not sure what kind of SD card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" They should be able to take care of you."
  target: "(O, skeakelje de konsole út foardat jo in <L_MSD/>-kaart derút helje of ynstekke.)<NL/><NL/>(O, o! As jo de <L_MSD/>-kaart derút helje wolle, druk dy dan earst yn oant jo in klik hearre en lûk dy dan derút. Doch itselde by it weromsetten: druk oant jo de klik hearre.)<NL/><NL/>In protte spulwille!<NL/>Amelia N.<NL/><NL/>P.S. As jo net witte hokker soarte SD-kaart jo keapje moatte, freegje dan om in \"<L_UHSI/> of hegere <L_MSD/>-kaart\". Dan kinne se jo wol helpe."
- source: "*This feature is available with compatible software.<NL/><NL/>P.S. If you're not sure what kind of <L_MSD/> card to buy, ask for a \"<L_UHSI/> or higher <L_MSD/> card.\" The folks at the store should know what you mean.<NL/><NL/>"
  target: "*Dizze funksje is beskikber mei kompatibele software.<NL/><NL/>P.S. As jo net witte hokker soarte <L_MSD/>-kaart jo keapje moatte, freegje dan om in \"<L_UHSI/> of hegere <L_MSD/>-kaart\". De minsken yn de winkel sille wol witte wat jo bedoele.<NL/><NL/>"
