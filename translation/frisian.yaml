- source: "Do you want to report error logs and information about your system settings to <L_N10/>?<TAG1/><NL/><TAG2/><TAG3/>This information may be shared with third-party developers whose software has crashed for analysis and improvement purposes. Information regarding international data-sharing destinations and personal-data protection is published on the website below (only available in Japanese). Please review the information in advance.<NL/>https://www.<L_UCOM/>/jp/privacy/crossborder/<TAG4/><TAG5/>"
