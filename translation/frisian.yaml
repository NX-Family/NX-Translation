- source: "<L_DOT1/> <TAG1/>Games on physical game cards will <TAG2/>not appear<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Some software, like game demos, will not appear because they are not treated like game cards. <NL/><TAG7/><TAG8/>To play these titles, download them from <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software and downloadable content purchased using other accounts will not appear.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Hidden virtual game cards will not appear.<TAG19/>"
  target: "<L_DOT1/> <TAG1/>Spultsjes op fysike spulkaarten wurde <TAG2/>net toand<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Guon software, lykas spuldemo's, wurdt net toand omdat dy net as spulkaarten behannele wurdt. <NL/><TAG7/><TAG8/>Download dizze titels fan <TAG9/><L_NEP/><TAG10/> om se te spyljen.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software en downloadbere ynhâld dy't mei oare akkounts kocht binne, wurde net toand.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Ferburgen firtuele spulkaarten wurde net toand.<TAG19/>"
- source: "<L_DOT1/><TAG1/>If a controller is on top of clothing or a soft object, like a pillow, the vibration may become difficult to hear. Please be as quiet as possible during the searching process.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Controllers that do not have a vibration feature cannot be searched for by using this method.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>If a controller is not vibrating, try moving the console closer to where you think it might be or try searching for the controller using a different console. Controllers may not vibrate if:<TAG8/><NL/><L_DSH/><TAG9/>They are too far away from the console.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>They are out of battery power or have low battery power.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>They are not paired to a console or are paired to a different console.<TAG16/><TAG17/>"
  target: "<L_DOT1/><TAG1/>As in kontroller op klean of in sêft foarwerp leit, lykas in kessen, kin it triljen min te hearren wêze. Wês sa stil mooglik by it sykjen.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Kontrollers sûnder trilfunksje kinne net mei dizze metoade opspoard wurde.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>As in kontroller net trillet, bring de konsole dan tichter by it plak dêr't jo tinke dat de kontroller leit, of besykje him mei in oare konsole op te spoaren. Kontrollers trilje mooglik net as:<TAG8/><NL/><L_DSH/><TAG9/>Se te fier fan de konsole ôf binne.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>De batterij leech of hast leech is.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>Se net oan in konsole keppele binne, of oan in oare konsole keppele binne.<TAG16/><TAG17/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try adding this network to your smartphone's <L_WIFI/> settings:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Security: <L_WAES/><NL/>Password: <TAG6/><NL/><TAG7/><TAG8/>This password will change each time you connect.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>If the access point does not change to your <L_NS/>, try temporarily disabling mobile data on your smartphone.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Visit the <L_N10/> Support website for more.<NL/><TAG17/><TAG18/>"
  target: "<L_DOT1/><TAG1/>As jo de QR-koade net skenne kinne, besykje dan dit netwurk ta te foegjen oan de <L_WIFI/>-ynstellingen fan jo smartphone:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Befeiliging: <L_WAES/><NL/>Wachtwurd: <TAG6/><NL/><TAG7/><TAG8/>Dit wachtwurd feroaret elke kear as jo ferbining meitsje.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>As it tagongspunt net nei jo <L_NS/> wikselet, besykje dan mobile gegevens op jo smartphone tydlik út te skeakeljen.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Besykje de stipewebside fan <L_N10/> foar mear ynformaasje.<NL/><TAG17/><TAG18/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try going to this URL on your smartphone's Internet browser:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>If the access point does not change to your <L_NS/> and no screenshots or videos display, try temporarily disabling mobile data on your smartphone.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Visit the <L_N10/> Support website for more information.<NL/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>As jo de QR-koade net skenne kinne, besykje dan dizze URL te iepenjen yn de webblêder fan jo smartphone:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>As it tagongspunt net nei jo <L_NS/> wikselet en der gjin skermôfbyldingen of fideo's toand wurde, besykje dan mobile gegevens op jo smartphone tydlik út te skeakeljen.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Besykje de stipewebside fan <L_N10/> foar mear ynformaasje.<NL/><TAG9/><TAG10/>"
- source: "<L_DOT1/><TAG1/>Only invites from the last 10 days will be displayed.<TAG2/><NL/><L_DOT1/><TAG3/>You may be unable to join in certain cases, like if the inviter exits online play before you can join.<TAG4/><NL/><L_DOT1/><TAG5/>Invites can be sent only from supporting software.<TAG6/>"
  target: "<L_DOT1/><TAG1/>Allinnich útnûgingen fan de lêste 10 dagen wurde toand.<TAG2/><NL/><L_DOT1/><TAG3/>Yn guon gefallen kinne jo net meidwaan, bygelyks as de útnûger mei online spyljen ophâldt foardat jo meidwaan kinne.<TAG4/><NL/><L_DOT1/><TAG5/>Útnûgingen kinne allinnich út software ferstjoerd wurde dy't dizze funksje stipet.<TAG6/>"
- source: "<L_DOT1/><TAG1/>You will need to use a USB cable that supports data transfer (sold separately).<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Connect your <L_NS/> directly to the computer via USB cable. (The USB ports on the dock do not support this feature.)<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Visit the <L_N10/> Support website for more information.<NL/><TAG8/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>Jo hawwe in USB-kabel nedich dy't gegevens oerdrage kin (apart ferkocht).<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Ferbyn jo <L_NS/> direkt mei de kompjûter fia in USB-kabel. (De USB-poarten op it dock stypje dizze funksje net.)<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Besykje de stipewebside fan <L_N10/> foar mear ynformaasje.<NL/><TAG8/><TAG9/><TAG10/>"
