- source: "Entering your Parental Controls PIN will temporarily disable all restrictions until <NL/>the console is put into sleep mode or until Parental Controls are enabled again.<TAG1/><NL/>All features that may have been restricted by Parental Controls will be available:<NL/><L_DOT1/><TAG2/>Enables all software.<TAG3/><NL/><L_DOT1/><TAG4/>Enables posting of screenshots and videos to social media.<TAG5/><NL/><L_DOT1/><TAG6/>Enables communication with others.<TAG7/><NL/><L_DOT1/><TAG8/>Enables VR mode.<TAG9/><NL/><L_DOT1/><TAG10/>Disables any play timer set using the <TAG11/><L_NS/><TAG12/> Parental Controls app.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>As all Parental Controls restrictions will be lifted, please be mindful when your child is playing<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
  target: "As jo de PIN foar Âlderlik tafersjoch ynfiere, wurde alle beheiningen tydlik útskeakele oant <NL/>de konsole yn de sliepstân giet of Âlderlik tafersjoch wer ynskeakele wurdt.<TAG1/><NL/>Alle mooglik beheinde funksjes wurde beskikber:<NL/><L_DOT1/><TAG2/>Alle software wurdt tastien.<TAG3/><NL/><L_DOT1/><TAG4/>Skermôfbyldingen en fideo's meie op sosjale media pleatst wurde.<TAG5/><NL/><L_DOT1/><TAG6/>Kommunikaasje mei oaren wurdt tastien.<TAG7/><NL/><L_DOT1/><TAG8/>VR-modus wurdt tastien.<TAG9/><NL/><L_DOT1/><TAG10/>Elke spyltiidtimer dy't mei de app <TAG11/><L_NS/><TAG12/> Parental Controls ynsteld is, wurdt útskeakele.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>Alle beheiningen fan Âlderlik tafersjoch wurde opheft. Let dêrom goed op as jo bern spilet op<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
