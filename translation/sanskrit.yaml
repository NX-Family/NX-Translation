  target: "अस्य तन्त्रांशस्य पुरातनदत्तांशाः प्राप्ताः।<NL/>स्थानं रिक्तं कर्तुं दत्तांशाः विलोपनीयाः?<TAG1/><NL/><TAG2/><TAG3/>इमं तन्त्रांशं क्रीडितुं पूर्वं दत्तांशाः अवतारणीयाः भविष्यन्ति।<NL/>इमं तन्त्रांशं सद्यः क्रीडितुमिच्छथ चेत् तदपेक्षया अन्यतन्त्रांशानां दत्तांशसङ्ग्रहणं विचारयत।<TAG4/><TAG5/>"
