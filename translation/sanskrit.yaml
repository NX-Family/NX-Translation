  target: "प्रणालीस्मृतेः सर्वे दत्तांशाः विलोपिताः भविष्यन्ति, तन्त्रांशदत्तांशाः, रक्षितक्रीडादत्तांशाः, पटलचित्राणि, चलचित्राणि, प्रयोक्तृसूचनाश्च। क्रीडायन्त्रस्य कारखानाविन्यासः पुनः स्थापितः भविष्यति।<TAG1/><NL/><L_SQR/> <TAG2/>अवधेयम्।<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>पटलचित्राणि चलचित्राणि च विना <L_MSD/> पत्रे रक्षिताः सर्वे तन्त्रांशदत्तांशाः अप्रयोज्याः भविष्यन्ति। (<L_MSD/> पत्रस्य दत्तांशाः न विलोप्यन्ते।)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>प्रणालीसंस्करणं न परिवर्त्यते।<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "प्रणालीस्मृतेः सर्वे दत्तांशाः विलोपिताः भविष्यन्ति, तन्त्रांशाः, रक्षितक्रीडादत्तांशाः, पटलचित्राणि, चलचित्राणि, प्रयोक्तृसूचनाश्च। क्रीडायन्त्रस्य कारखानाविन्यासः पुनः स्थापितः भविष्यति।<TAG1/><NL/><L_SQR/> अवधेयम्।<TAG2/><NL/><L_DOT1/><TAG3/>पटलचित्राणि चलचित्राणि च विना <L_MSD/> पत्रे रक्षिताः सर्वे तन्त्रांशाः अप्रयोज्याः भविष्यन्ति। (<L_MSD/> पत्रस्य दत्तांशाः न विलोप्यन्ते।)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>प्रणालीसंस्करणं न परिवर्त्यते।<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>अनेन क्रीडायन्त्रेण सम्बद्धाः <L_N10/> लेखाः न विलोप्यन्ते, किन्तु वियोज्यन्ते।<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>भवतां <L_N10/> लेखायां <L_NEP/> क्रयवृत्तान्तः वर्तमानावशिष्टराशिश्च रक्ष्येते। क्रीडायन्त्रस्य पुनःस्थापनानन्तरं <L_N10/> लेखया पुनः संयोज्य तया क्रीताः तन्त्रांशाः अथवा <L_DLC/> पुनः अवतारयितुं शक्यन्ते। (वितरणनिवृत्ताः तन्त्रांशाः केषुचित् प्रसङ्गेषु पुनरवतारणाय अनुपलब्धाः स्युः।)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/>क्रीडायन्त्रस्य समस्याकारणात् अयं विकल्पः प्रयुज्यते चेत्।<TAG19/><NL/>अनुरक्षणविधौ रक्षितक्रीडादत्तांशान् प्रयोक्तृसूचनाश्च अविलोप्य क्रीडायन्त्रं पुनः स्थापयितुं शक्यते। इदमिच्छथ चेत् पुनःस्थापनं निरस्य इमं क्रममनुसरत।<TAG20/><NL/><L_D1/> <TAG21/>क्रीडायन्त्रं निर्वापयत।<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>क्रीडायन्त्रं निर्वापयितुं विद्युत्सूचीम् उद्घाटयत (POWER कुञ्जीं सेकण्डत्रयं यावत् नुदित्वा धारयत), ततः विद्युद्विकल्पाः → निर्वापयत इति वृणुत।<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>ध्वनिस्तरवर्धनस्य (+) न्यूनीकरणस्य (-) च कुञ्जीभ्यां सह POWER कुञ्जीं नुदित्वा धारयत, येन क्रीडायन्त्रं प्रवर्तते।<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>क्रीडायन्त्रम् अनुरक्षणविधौ प्रवर्तिष्यते।<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>रक्षितक्रीडादत्तांशान् अविलोप्य क्रीडायन्त्रस्य पुनःस्थापनम् इति चित्वा दत्तान् निर्देशान् अनुसरत।<TAG38/>"
