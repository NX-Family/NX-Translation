- source: "We've all had the battery run out at just the wrong moment in a game, right? Not just me? Anyway, you might want to know some things about charging, so you don't have to suffer like I did that terrible, terrible day<L_DOT3S/><NL/><NL/>Q: How do I charge the console?<NL/>A: Two ways: connect it to the <L_NS/> dock or you can plug the AC adapter directly into the console.<NL/><NL/>Q: How do I charge the <L_JC/> controllers?<NL/>A: It couldn't be simpler! Just attach them to the console while it's charging. <NL/><NL/>Q: Where do I check how much battery the console or controllers have left?<NL/>A: The console's battery level is shown on the HOME Menu. You can look at the controllers' charge by selecting <0xE136/> (Controllers) on the HOME Menu.<NL/><NL/>Q: My console ran low on power, and the screen went blank! What happened?<NL/>A: Not to worry! It just went into sleep mode. If you're playing single-player, you can keep going right from where you left off IF you charge the <L_NS/> before its battery runs completely out."
  target: "क्रीडायाम् अनुचितक्षणे विद्युत्कोषः समाप्तः इति सर्वेषां नः अनुभूतम्, ननु? ममैव न खलु? तस्मिन् अतिभयङ्करे दिने यद् मया सोढं तत् भवद्भिः मा सोढव्यमिति विद्युत्पूरणविषये किञ्चित् जानीत<L_DOT3S/><NL/><NL/>प्रश्नः: क्रीडायन्त्रस्य विद्युत्कोषं कथं पूरयामि?<NL/>उत्तरम्: द्वौ विधी। <L_NS/> आधारपीठेन संयोजयत, अथवा AC अनुकूलकं साक्षात् क्रीडायन्त्रे संयोजयत।<NL/><NL/>प्रश्नः: <L_JC/> नियन्त्रकाणां विद्युत्कोषान् कथं पूरयामि?<NL/>उत्तरम्: अतीव सरलम्! क्रीडायन्त्रस्य विद्युत्पूरणकाले तान् तस्मिन् योजयत। <NL/><NL/>प्रश्नः: क्रीडायन्त्रे नियन्त्रकेषु वा कियती विद्युच्छक्तिः शिष्टा इति कुत्र पश्यामि?<NL/>उत्तरम्: क्रीडायन्त्रस्य विद्युत्कोषस्तरः HOME सूच्यां दृश्यते। नियन्त्रकाणां विद्युत्कोषस्तरं द्रष्टुं HOME सूच्यां <0xE136/> (नियन्त्रकाः) इति वृणुत।<NL/><NL/>प्रश्नः: मम क्रीडायन्त्रस्य विद्युच्छक्तिः न्यूना अभवत्, पटलं च शून्यं जातम्! किम् अभवत्?<NL/>उत्तरम्: मा चिन्तयत! तत् केवलं निद्राविधिं प्रविष्टम्। एकक्रीडकविधौ क्रीडथ चेत् यत्र स्थगितवन्तः तत एव क्रीडाम् अनुवर्तयितुं शक्नुथ, यदि <L_NS/> विद्युत्कोषस्य पूर्णसमाप्तेः पूर्वं तं पूरयथ।"
