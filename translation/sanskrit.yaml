  target: "<L_DASH/> मिनिटानि अवशिष्टानि"
- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>ऋणरूपेण गृहीताः क्रीडाः 14 दिनानन्तरं प्रत्यर्पयिष्यन्ते।<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>संविभागाय यन्त्रे परस्परं समीपम् आनयत।<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>केचन तन्त्रांशाः ऋणप्रदानं न समर्थयेयुः।<TAG8/>"
