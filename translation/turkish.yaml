  target: "Bölgeyi değiştirmek için seçilen bölgeye ait Son Kullanıcı Lisans Sözleşmesi'ni kabul etmeniz ve konsolu yeniden başlatmanız gerekecek. Eğer kabul etmiyorsanız, bu şekilde bölge ayarınızı değiştirmeyin."
- source: "In order to change the region you will need to agree to the End-User License Agreement for the selected region and restart the console. If you do not agree, do not change your region setting in this way.<TAG1/><NL/>Additionally, the following settings will change:<TAG2/><NL/><L_DOT1/><TAG3/>The Auto-Sleep (Connected to TV) setting will be set to 1 hour.<TAG4/><NL/><L_DOT1/><TAG5/>The Maintain Internet Connection in Sleep Mode setting will be enabled.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>This can be changed later by selecting <0xE130/> (System Settings) ⇒ Sleep Mode via the HOME Menu.<TAG10/><TAG11/>"
  target: "Bölgeyi değiştirmek için seçilen bölgeye ait Son Kullanıcı Lisans Sözleşmesi'ni kabul etmeniz ve konsolu yeniden başlatmanız gerekecek. Eğer kabul etmiyorsanız, bu şekilde bölge ayarınızı değiştirmeyin.<TAG1/><NL/>Ek olarak, aşağıdaki ayarlar değişecektir:<TAG2/><NL/><L_DOT1/><TAG3/>Otomatik Uyku (TV'ye Bağlı) ayarı 1 saat olarak ayarlanacaktır.<TAG4/><NL/><L_DOT1/><TAG5/>Uyku Modunda İnternet Bağlantısını Koru ayarı etkinleştirilecektir.<TAG6/><TAG7/><NL/><TAG8/><TAG9/>Bu, daha sonra HOME Menüsünden <0xE130/> (Sistem Ayarları) ⇒ Uyku Modu seçilerek değiştirilebilir.<TAG10/><TAG11/>"
- source: "In order to change users, this software must close.<NL/><TAG1/><TAG2/>Any unsaved data will be lost.<TAG3/><TAG4/>"
  target: "Kullanıcı değiştirmek için bu yazılımın kapatılması gerekmektedir.<NL/><TAG1/><TAG2/>Kaydedilmemiş veriler kaybolacaktır.<TAG3/><TAG4/>"
- source: "In order to change users,<NL/>this software must be closed."
