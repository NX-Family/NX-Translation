- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>Ödünç alınan oyunlar 14 gün sonra iade edilir.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Paylaşmak için sistemleri birbirine yaklaştırın.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Bazı yazılımlar ödünç vermeyi desteklemeyebilir.<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>Kullanıcı <TAG2/> tarafından satın alınan indirilebilir yazılımlar hedef sisteme yeniden indirilip oynanabilir.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Ekran görüntüleri ve videolar aktarılmadı, eski sistemde kaldı.<TAG6/><TAG7/><NL/>Ayrıntılar için <L_N10/> destek sitesini ziyaret edin:<NL/><L_NCOJ/>"
