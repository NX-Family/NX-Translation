- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Seçili <L_N10/> etkinlikleri ve mekânlarında ziyaret kaydı yapmak için bu QR kodunu gösterin. Böylece <L_MNT/> üyelerine özel, <L_MNT/> puanları ve promosyon çekilişlerine katılım gibi avantajlardan yararlanabilirsiniz. Avantajlar her seferinde değişir, ziyaret kaydı yaparken ayrıntılara göz atın.<TAG1/><NL/><L_DOT1/><TAG2/>Bu QR kodu, <L_N10/> tarafından <L_N10/> Hesabınızın tanınmasını sağlar.<TAG3/><NL/><L_DOT1/><TAG4/>Ziyaret kaydıyla belirli kampanyalara katılabilir, bu veya başka kampanyalarla ilgili e-postalar alabilirsiniz. Ek bilgiler kampanya sitelerinde sunulur.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Hesabı Kullanıcı Sözleşmesi ve Gizlilik Politikası geçerlidir.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR kodu oluşturulma zamanı: <TAG11/><TAG12/><TAG13/>"
