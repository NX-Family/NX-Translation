  target: "Mesaj ve görüntü gönderip alma dahil kullanıcılar arasındaki açık iletişim kısıtlanır.<TAG1/><NL/>Yazılıma bağlı olarak şu etkinlikler kısıtlanır:<TAG2/><NL/><L_DOT1/><TAG3/>Mesaj gönderip alma ve sohbet özelliklerini kullanma.<TAG4/><NL/><L_DOT1/><TAG5/>Kullanıcıların kendi metinlerini girebildiği profil bilgilerini okuma ve paylaşma.<TAG6/><NL/><L_DOT1/><TAG7/>Kullanıcıların oluşturduğu, metin de içerebilen görüntüleri görme ve paylaşma.<TAG8/><TAG9/><NL/><TAG10/><TAG11/><L_NS/> dışında çalışan <L_NS/> App gibi uygulamaların kullanımı kısıtlanmaz. Uygulamaya kısıtlama koymak için akıllı cihazınızı kullanın.<TAG12/><TAG13/>"
