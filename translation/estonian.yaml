  target: "Selle tarkvara vanad andmed leiti.<NL/>Kustutada need ruumi vabastamiseks?<TAG1/><NL/><TAG2/><TAG3/>Enne selle tarkvara mängimist pead andmed alla laadima.<NL/>Kui soovid kohe mängida, kaalu hoopis muu tarkvara andmete arhiveerimist.<TAG4/><TAG5/>"
