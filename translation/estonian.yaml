  target: "Näita seda QR-koodi valitud <L_N10/> üritustel ja kohtades kohaloleku registreerimiseks, et saada <L_MNT/> liikme erihüvesid, näiteks <L_MNT/> punkte ja õigust osaleda kampaanialoosimistes. Hüved on iga kord erinevad, seega vaata registreerimisel lisateavet.<TAG1/><NL/><L_DOT1/><TAG2/>Selle QR-koodiga saab <L_N10/> tuvastada sinu <L_N10/> konto.<TAG3/><NL/><L_DOT1/><TAG4/>Kohaloleku registreerimisel saad osaleda kindlates kampaaniates ning võid saada nende või muude kampaaniate kohta e-kirju. Lisateavet saab kampaaniate veebisaitidelt.<TAG5/><NL/><L_DOT1/><TAG6/>Kehtivad <L_N10/> konto kasutusleping ja privaatsuskord.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR-kood loodud: <TAG11/><TAG12/><TAG13/>"
