- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Kartu su <L_NS/> konsole <L_N10/> pridėjo įrangą konsolei prijungti prie televizoriaus. Štai kaip mėgautis žaidimais dideliame ekrane:<NL/><NL/>Pirmiausia raskite <L_NS/> prijungimo stotelę, maitinimo adapterį ir <L_HDMI/> kabelį. <NL/><NL/>Tada atverkite stotelės galinį dangtelį ir prijunkite maitinimo adapterį. <NL/><NL/>Tuomet <L_HDMI/> kabeliu prijunkite stotelę prie televizoriaus.<NL/><NL/><L_DOT3S/>Ir viskas! Jei ketinate naudoti <L_JC/> valdiklius atskirai, atjunkite juos. Tada įstumkite <L_NS/> konsolę į stotelę, ir vaizdas televizoriuje turėtų atsirasti tarsi savaime."
