  target: "<L_DOT1/><TAG1/>Reikės USB kabelio, palaikančio duomenų perdavimą (parduodamas atskirai).<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>USB kabeliu prijunkite <L_NS/> tiesiai prie kompiuterio. (Prijungimo stotelės USB lizdai šios funkcijos nepalaiko.)<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje.<NL/><TAG8/><TAG9/><TAG10/>"
