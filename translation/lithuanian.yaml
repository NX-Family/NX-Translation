- source: "<L_ROMB/> If your <L_NS/> screen isn't displaying on the TV, here are some things to check:<NL/><L_DOT1/>Is the TV on?<NL/><L_DOT1/>Is the TV set to the right input? <NL/><L_DOT1/>Are the AC adapter and the <L_HDMI/> cable connected properly?<NL/><L_DOT1/>Is the <L_NS/> console centered nicely on the dock, and did you press down lightly to connect it?<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> Jei <L_NS/> ekrano vaizdas nerodomas televizoriuje, patikrinkite:<NL/><L_DOT1/>Ar televizorius įjungtas?<NL/><L_DOT1/>Ar televizoriuje pasirinkta tinkama įvestis? <NL/><L_DOT1/>Ar maitinimo adapteris ir <L_HDMI/> kabelis tinkamai prijungti?<NL/><L_DOT1/>Ar <L_NS/> konsolė įstatyta prijungimo stotelės centre ir lengvai paspausta žemyn, kad prisijungtų?<NL/><NL/>Smagaus žaidimo,<NL/>Amelia N."
- source: "<L_ROMB/> This setting will not affect the colors displayed in TV mode."
  target: "<L_ROMB/> Šis nustatymas neturės įtakos spalvoms, rodomoms televizoriaus režimu."
- source: "<L_ROMB/> To receive the latest news, you'll need to have an Internet connection and link your <L_N10/> Account with your <L_NS/> console.<NL/><NL/><L_ROMB/> If news channels are available for a certain game, you'll be automatically subscribed to them when you first play that game. Channel settings can be changed in System Settings ⇒ System ⇒ News Channel Settings.<NL/><NL/><L_ROMB/> Some channels may only be available for a limited time.<NL/><NL/><L_ROMB/> You can get news from the <L_NS/> Information Center even without linking an account. You just need to be connected to the Internet.<NL/><NL/><L_ROMB/> This feature is included in \"System Version 3.0.0\". You can verify the system version in Settings ⇒ System.<NL/><NL/>Happy gaming,<NL/>Amelia N.<NL/><NL/>P.S. I forgot to mention, but you can jump between news entries by pressing  <0xE0A4/> or <0xE0A5/>!"
  target: "<L_ROMB/> Norėdami gauti naujausias naujienas, turite prisijungti prie interneto ir susieti <L_N10/> paskyrą su <L_NS/> konsole.<NL/><NL/><L_ROMB/> Jei žaidimas turi naujienų kanalų, pirmą kartą jį žaidžiant jie bus automatiškai užprenumeruoti. Kanalų nustatymus galite keisti skiltyje Sistemos nustatymai ⇒ Sistema ⇒ Naujienų kanalų nustatymai.<NL/><NL/><L_ROMB/> Kai kurie kanalai gali būti pasiekiami tik ribotą laiką.<NL/><NL/><L_ROMB/> Naujienas iš <L_NS/> informacijos centro galite gauti ir nesusieję paskyros. Tereikia prisijungti prie interneto.<NL/><NL/><L_ROMB/> Ši funkcija įtraukta į \"Sistemos versiją 3.0.0\". Sistemos versiją galite patikrinti skiltyje Nustatymai ⇒ Sistema.<NL/><NL/>Smagaus žaidimo,<NL/>Amelia N.<NL/><NL/>P.S. Pamiršau paminėti, kad tarp naujienų įrašų galite pereiti paspausdami  <0xE0A4/> arba <0xE0A5/>!"
- source: "<L_ROMB/> When you're using the <L_NS/> dock, be sure to keep the AC adapter connected and plugged in, otherwise it won't display an image on the TV.<NL/><L_ROMB/> If you want to fully charge the <L_JC/> controllers, just attach them to the console while it's either docked or plugged in. But if they're attached when the console ISN'T charging, they might stop charging themselves to conserve the console's battery.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "<L_ROMB/> Naudodami <L_NS/> prijungimo stotelę, laikykite maitinimo adapterį prijungtą prie jos ir įjungtą į elektros lizdą, kitaip televizoriuje nebus vaizdo.<NL/><L_ROMB/> Norėdami visiškai įkrauti <L_JC/> valdiklius, prijunkite juos prie konsolės, kai ji yra stotelėje arba prijungta prie maitinimo. Jei jie prijungti, kai konsolė NEĮKRAUNAMA, jų įkrovimas gali sustoti, kad būtų taupoma konsolės akumuliatoriaus energija.<NL/><NL/>Smagaus žaidimo,<NL/>Amelia N."
