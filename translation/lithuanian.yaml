- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen."
  target: "Jei PIN kodą įvedate skaitmenine klaviatūra, įsitikinkite, kad aplinkiniai nemato jūsų ekrano."
- source: "If you choose to enter your PIN using the keypad input, make sure those around you cannot see your screen.<NL/><TAG1/><TAG2/>If you are using the console in TV mode, removing the console from the dock will allow you to enter your PIN without it being displayed on the TV.<TAG3/><TAG4/>"
  target: "Jei PIN kodą įvedate skaitmenine klaviatūra, įsitikinkite, kad aplinkiniai nemato jūsų ekrano.<NL/><TAG1/><TAG2/>Jei konsolę naudojate TV režimu, išėmę ją iš prijungimo stotelės galėsite įvesti PIN kodą nerodydami jo televizoriuje.<TAG3/><TAG4/>"
- source: "If you don't use the button above, just select <0xE133/> from the HOME Menu to visit <L_NEP/> any old time.<NL/><NL/>Oh! And you can also search in <L_NEP/> with different filters to find exactly what you're looking for.<NL/><NL/>Happy gaming,<NL/>Amelia N."
  target: "Jei nenaudojate viršuje esančio mygtuko, HOME meniu pasirinkę <0xE133/> bet kada galėsite apsilankyti <L_NEP/>.<NL/><NL/>Be to, <L_NEP/> galite ieškoti naudodami įvairius filtrus, kad rastumėte būtent tai, ko norite.<NL/><NL/>Smagaus žaidimo,<NL/>Amelia N."
- source: "If you enable automatic backup, save data will be automatically backed up, even while the console is in sleep mode or after the software has been closed.<NL/><TAG1/><TAG2/>Some software does not support this feature.<TAG3/><TAG4/>"
  target: "Įjungus automatinį atsarginį kopijavimą, išsaugotų duomenų atsarginės kopijos bus kuriamos automatiškai, net kai konsolė veikia miego režimu arba programinė įranga jau uždaryta.<NL/><TAG1/><TAG2/>Kai kuri programinė įranga šios funkcijos nepalaiko.<TAG3/><TAG4/>"
- source: "If you enable automatic download, save data will automatically download to this console whenever the save data stored via the Save Data Cloud service is updated from another console. The save data on this console will be overwritten with the data from the server.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Įjungus automatinį atsisiuntimą, išsaugoti duomenys bus atsisiunčiami į šią konsolę kaskart, kai naudojant kitą konsolę bus atnaujinti išsaugotų duomenų debesyje saugomi duomenys. Šioje konsolėje išsaugoti duomenys bus perrašyti serverio duomenimis.<TAG1/><NL/><TAG2/>Pirmą kartą atsisiųsti reikia rankiniu būdu.<TAG3/>"
- source: "If you enable automatic download, you can easily pick up playing where you left off on another console.<TAG1/><NL/><TAG2/>The initial download must be performed manually.<TAG3/>"
  target: "Įjungę automatinį atsisiuntimą, galėsite lengvai tęsti žaidimą nuo ten, kur baigėte kitoje konsolėje.<TAG1/><NL/><TAG2/>Pirmą kartą atsisiųsti reikia rankiniu būdu.<TAG3/>"
- source: "If you enter the incorrect PIN <TAG1/><LIST1/>, you<NL/>will have to wait a while before attempting to enter it again."
  target: "Jei dar <TAG1/><LIST1/> įvesite neteisingą PIN kodą,<NL/>teks šiek tiek palaukti, kol vėl galėsite jį įvesti."
- source: "If you forget your PIN, you can reset it by signing in to your <L_N10/> Account."
  target: "Jei pamiršite PIN kodą, galėsite jį atkurti prisijungę prie savo <L_N10/> paskyros."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/> system, you can use it to download your data from the server."
  target: "Gavę <L_N10/> <TAG1/><L_SWT2/><TAG2/> sistemą, galėsite ja atsisiųsti savo duomenis iš serverio."
- source: "If you get a <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
  target: "Jei gausite <L_N10/> <TAG1/><L_SWT2/><TAG2/><L_DOT3/>"
- source: "If you have existing user data on another system, you can copy or transfer it to this system. Otherwise, create a new user."
  target: "Jei kitoje sistemoje jau turite naudotojo duomenų, galite juos nukopijuoti arba perkelti į šią sistemą. Kitu atveju sukurkite naują naudotoją."
- source: "If you have two systems, you can choose which system to play on by moving virtual game cards between them."
  target: "Jei turite dvi sistemas, galite pasirinkti, kurioje žaisti, perkeldami virtualias žaidimų korteles tarp jų."
- source: "If you link to a <L_N10/> Account, you can use various online features."
  target: "Jei susiejate su <L_N10/> paskyra, galite naudoti įvairias interneto funkcijas."
- source: "If you link to a <L_N10/> Account, you will see users who may want to become friends with you."
  target: "Jei susiejate su <L_N10/> paskyra, matysite naudotojus, kurie gali norėti tapti jūsų draugais."
- source: "If you plan to keep using this system, stop here.<NL/>Once data is uploaded to the server, this system will be initialized."
  target: "Jei ketinate ir toliau naudoti šią sistemą, čia sustokite.<NL/>Įkėlus duomenis į serverį, bus atkurti gamykliniai šios sistemos nustatymai."
- source: "If you plugged the AC<NL/>adapter into the console<NL/>earlier, disconnect it."
  target: "Jei anksčiau prijungėte<NL/>maitinimo adapterį prie<NL/>konsolės, atjunkite jį."
- source: "If you turn Airplane Mode on, you will no<NL/>longer be able to use wireless controllers."
  target: "Įjungę lėktuvo režimą, nebegalėsite<NL/>naudoti belaidžių valdiklių."
- source: "If you update and are still unable to use downloadable content or an upgrade pack, load the virtual game card from <0xE13D/> (Virtual Game Cards) on the HOME Menu."
  target: "Jei atnaujinę vis tiek negalite naudoti atsisiunčiamo turinio ar atnaujinimo paketo, įkelkite virtualią žaidimo kortelę HOME meniu pasirinkę <0xE13D/> (Virtualios žaidimų kortelės)."
- source: "If you'd rather download data for a specific user at a later time, uncheck that user. To download the data, go to the <TAG1/>HOME Menu<TAG2/> and open the Options menu for the software, then select <TAG3/>Save Data Cloud<TAG4/>."
  target: "Jei konkretaus naudotojo duomenis norite atsisiųsti vėliau, panaikinkite jo žymėjimą. Norėdami atsisiųsti duomenis, atverkite <TAG1/>HOME meniu<TAG2/> ir programinės įrangos parinkčių meniu, tada pasirinkite <TAG3/>Išsaugotų duomenų debesis<TAG4/>."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Jei dar nesate įdėję <L_MSD/> kortelės į konsolę, apžiūrėkite ją ir pabandykite rasti kortelės lizdą. Jis šiek tiek paslėptas. <NL/><NL/>Pasiduodate? Štai užuomina. Ar esate naudoję konsolės gale esančią atramą? <NL/><NL/>Atlenkite ją ir rasite slapuką! Galite nusipirkti <L_MSD/> kortelę, jei nerimaujate, kad pritrūks vietos programinei įrangai, <L_DLC/> ir kitam turiniui."
- source: "If you've never put a <L_MSD/> card in your console before, take a look around and see if you can find the slot for it now. It's kind of hidden. <NL/><NL/>Give up? Here's a hint: have you ever used the stand on the back of the console? <NL/><NL/>Open that stand, and you'll find the little sneak! You can buy a <L_MSD/> card if you're worried about running out of storage space for software and <L_DLC/> and stuff."
  target: "Jei dar nesate įdėję <L_MSD/> kortelės į konsolę, apžiūrėkite ją ir pabandykite rasti kortelės lizdą. Jis šiek tiek paslėptas. <NL/><NL/>Pasiduodate? Štai užuomina. Ar esate naudoję konsolės gale esančią atramą? <NL/><NL/>Atlenkite ją ir rasite slapuką! Galite nusipirkti <L_MSD/> kortelę, jei nerimaujate, kad pritrūks vietos programinei įrangai, <L_DLC/> ir kitam turiniui."
- source: "If your save data is backed up, the save data for supported software on your console has been stored via the Save Data Cloud service.<TAG1/><NL/>If your data is waiting to back up, the save data on your console will be automatically stored via the Save Data Cloud service once the console enters sleep mode, provided it is connected to the Internet.<TAG2/><NL/>Select a user to view more details or manually back up or download data."
  target: "Jei išsaugotų duomenų atsarginė kopija sukurta, jūsų konsolėje esantys palaikomos programinės įrangos išsaugoti duomenys jau saugomi išsaugotų duomenų debesyje.<TAG1/><NL/>Jei duomenys laukia atsarginio kopijavimo, jie bus automatiškai išsaugoti išsaugotų duomenų debesyje konsolei perėjus į miego režimą, jei ji prijungta prie interneto.<TAG2/><NL/>Pasirinkite naudotoją, kad peržiūrėtumėte išsamią informaciją, rankiniu būdu sukurtumėte atsarginę kopiją arba atsisiųstumėte duomenis."
- source: "If your virtual game cards are not appearing, open the HOME Menu and select <0xE13D/> (Virtual Game Cards)."
  target: "Jei virtualios žaidimų kortelės nerodomos, atverkite HOME meniu ir pasirinkite <0xE13D/> (Virtualios žaidimų kortelės)."
