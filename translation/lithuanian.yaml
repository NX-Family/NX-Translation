- source: "<L_CIRC/> Online Presence and Play Activity<NL/>Other users may be able to see your online presence and play activity.<NL/>You can change these settings at any time on your user page by selecting User Settings ⇒ Friend Settings. You may also choose not to share your online presence or play activity with anyone.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>By default, your online presence is only shared with friends, while your play activity is shared with all players. The play activity of children is only shared with their friends.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> News on <TAG8/><L_NS/><TAG9/><NL/>News will be delivered to your <TAG10/><L_NS/><TAG11/> console.<NL/>You can adjust your settings by returning to the HOME Menu and selecting <0xE130/> (System Settings) ⇒ System ⇒ Receive News."
  target: "<L_CIRC/> Prisijungimo būsena ir žaidimo veikla<NL/>Kiti naudotojai gali matyti jūsų prisijungimo būseną ir žaidimo veiklą.<NL/>Šiuos nustatymus galite bet kada keisti savo naudotojo puslapyje, pasirinkę Naudotojo nustatymai ⇒ Draugų nustatymai. Taip pat galite pasirinkti su niekuo nesidalyti savo prisijungimo būsena ar žaidimo veikla.<NL/><TAG1/><TAG2/><L_ROMB/> <TAG3/>Pagal numatytuosius nustatymus jūsų prisijungimo būsena rodoma tik draugams, o žaidimo veikla - visiems žaidėjams. Vaikų žaidimo veikla rodoma tik jų draugams.<TAG4/><TAG5/><TAG6/><TAG7/><NL/><L_CIRC/> Naujienos <TAG8/><L_NS/><TAG9/> konsolėje<NL/>Naujienos bus siunčiamos į jūsų <TAG10/><L_NS/><TAG11/> konsolę.<NL/>Nustatymus galite keisti grįžę į HOME meniu ir pasirinkę <0xE130/> (Sistemos nustatymai) ⇒ Sistema ⇒ Gauti naujienas."
- source: "<L_D1/> <TAG1/>On the other system, open the HOME Menu and then select <0xE13D/> (Virtual Game Cards) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Bring the systems close to one another.<TAG6/>"
  target: "<L_D1/> <TAG1/>Kitoje sistemoje atidarykite HOME meniu ir pasirinkite <0xE13D/> (Virtualios žaidimų kortelės) ⇒ <TAG2/>.<TAG3/><TAG4/><NL/><L_D2/> <TAG5/>Padėkite sistemas arti viena kitos.<TAG6/>"
