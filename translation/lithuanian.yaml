- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Pateikite šį QR kodą, kad užregistruotumėte apsilankymą tam tikruose <L_N10/> renginiuose ir vietose bei gautumėte išskirtinių <L_MNT/> narių privilegijų, pvz., <L_MNT/> taškų ir galimybę dalyvauti reklaminėse prizų loterijose. Privilegijos kaskart skirsis, todėl registruodamiesi stebėkite pateikiamą papildomą informaciją.<TAG1/><NL/><L_DOT1/><TAG2/>Šis QR kodas leidžia <L_N10/> atpažinti jūsų <L_N10/> paskyrą.<TAG3/><NL/><L_DOT1/><TAG4/>Užregistravę apsilankymą galite dalyvauti tam tikrose akcijose ir gauti el. laiškų apie šias ar kitas akcijas. Papildoma informacija pateikiama akcijų svetainėse.<TAG5/><NL/><L_DOT1/><TAG6/>Taikomos <L_N10/> paskyros naudotojo sutartis ir privatumo politika.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR kodas sugeneruotas: <TAG11/><TAG12/><TAG13/>"
