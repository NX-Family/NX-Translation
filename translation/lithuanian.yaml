  target: "Draugais tapote:"
- source: "When playing with a <L_JC/> controller, attach the strap by following<NL/>the steps provided, and hold it securely without letting go.<NL/>Allow adequate room around you during gameplay.<NL/>Be aware of your surroundings."
  target: "Žaisdami su <L_JC/> valdikliu, pritvirtinkite dirželį pagal<NL/>pateiktus nurodymus ir tvirtai laikykite valdiklį, jo nepaleiskite.<NL/>Žaisdami palikite aplink save pakankamai laisvos vietos.<NL/>Stebėkite aplinką."
- source: "When switching to TV mode with the console docked or when the console exits sleep mode, the TV will turn on. Turning off the TV will put the console in sleep mode.<TAG1/><NL/><L_ROMB/> <TAG2/><L_HDMI/> settings must also be enabled on your TV. Some TV models may be unable to use this feature.<TAG3/>"
  target: "Perjungus į TV režimą, kai konsolė įstatyta į prijungimo stotelę, arba konsolei išėjus iš miego režimo, TV įsijungs. Išjungus TV, konsolė pereis į miego režimą.<TAG1/><NL/><L_ROMB/> <TAG2/>Televizoriuje taip pat turi būti įjungti <L_HDMI/> nustatymai. Kai kurie TV modeliai gali nepalaikyti šios funkcijos.<TAG3/>"
- source: "When turned on, you can play downloaded software you've purchased while the system is connected to the Internet, even if you don't have a virtual game card loaded. However, only the owner of the purchasing account can play using the software's online license, and other users won't be able to play at the same time.<TAG1/><NL/><L_ROMB/> <TAG2/>Regardless of this setting, you can still play using your virtual game card.<TAG3/><NL/><L_ROMB/> <TAG4/>Online licenses can't be used at the same time on multiple systems.<TAG5/><NL/><L_ROMB/> <TAG6/>Online licenses can't be used at the same time as the virtual game card for the same software.<TAG7/>"
  target: "Įjungę šį nustatymą, galite žaisti įsigytą ir atsisiųstą programinę įrangą, kai sistema prijungta prie interneto, net jei virtuali žaidimo kortelė neįkelta. Tačiau naudodamas internetinę licenciją gali žaisti tik paskyros, kuria įsigyta programinė įranga, savininkas, o kiti naudotojai tuo pačiu metu žaisti negalės.<TAG1/><NL/><L_ROMB/> <TAG2/>Nepriklausomai nuo šio nustatymo, vis tiek galite žaisti naudodami virtualią žaidimo kortelę.<TAG3/><NL/><L_ROMB/> <TAG4/>Internetinių licencijų negalima naudoti vienu metu keliose sistemose.<TAG5/><NL/><L_ROMB/> <TAG6/>Internetinių licencijų negalima naudoti tuo pačiu metu kaip tos pačios programinės įrangos virtualios žaidimo kortelės.<TAG7/>"
- source: "When using headphones, please listen at a volume that is safe for your ears.<TAG1/><NL/><TAG2/><TAG3/>Set the volume so that you are still able to hear your surroundings, and take breaks when using headphones for long periods of time.<TAG4/><TAG5/>"
  target: "Naudodami ausines, pasirinkite klausai saugų garsumą.<TAG1/><NL/><TAG2/><TAG3/>Nustatykite garsumą taip, kad vis dar girdėtumėte aplinką, ir darykite pertraukas, jei ausines naudojate ilgai.<TAG4/><TAG5/>"
- source: "Whenever the save data stored via the Save Data Cloud service is newer than the save data on the console, that newer data will automatically download and the older data on your console will be overwritten. Save data will not be automatically downloaded if no save data for the software is on the console."
  target: "Kai per Išsaugotų duomenų debesies paslaugą saugomi duomenys yra naujesni už išsaugotus duomenis konsolėje, naujesni duomenys atsisiunčiami automatiškai ir perrašo senesnius konsolės duomenis. Jei konsolėje nėra šios programinės įrangos išsaugotų duomenų, jie nebus atsisiunčiami automatiškai."
