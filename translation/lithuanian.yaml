  target: "Rasta senų šios programinės įrangos duomenų.<NL/>Ištrinti juos, kad atsilaisvintų vietos?<TAG1/><NL/><TAG2/><TAG3/>Prieš naudodami šią programinę įrangą, turėsite atsisiųsti duomenis.<NL/>Jei norite ją naudoti iškart, apsvarstykite galimybę archyvuoti kitos programinės įrangos duomenis.<TAG4/><TAG5/>"
