- source: "Please connect an AC adapter to each system before starting the save-data transfer."
  target: "Prieš pradėdami išsaugotų duomenų perkėlimą, prijunkite maitinimo adapterį prie kiekvienos sistemos."
- source: "Please connect the AC adapter."
  target: "Prijunkite maitinimo adapterį."
- source: "Please connect the AC adapter.<NL/><TAG1/><TAG2/>Do not disconnect the AC adapter until the system transfer has finished.<TAG3/><TAG4/>"
  target: "Prijunkite maitinimo adapterį.<NL/><TAG1/><TAG2/>Neatjunkite maitinimo adapterio, kol sistemos perkėlimas nebus baigtas.<TAG3/><TAG4/>"
- source: "Please connect the controller you want to use for<L_XA0/><L_TGS/>."
  target: "Prijunkite valdiklį, kurį norite naudoti su<L_XA0/><L_TGS/>."
- source: "Please connect to the Internet and update your system."
  target: "Prisijunkite prie interneto ir atnaujinkite sistemą."
- source: "Please continue the preparations on the console from which <TAG1/> will be transferred."
  target: "Tęskite pasirengimą konsolėje, iš kurios perkelsite <TAG1/>."
- source: "Please continue the preparations on the target console."
  target: "Tęskite pasirengimą tikslinėje konsolėje."
- source: "Please delete data after removing the game card."
  target: "Prieš trindami duomenis, išimkite žaidimo kortelę."
- source: "Please deselect some software."
  target: "Panaikinkite dalies programų žymėjimą."
- source: "Please dock the console."
  target: "Įdėkite konsolę į prijungimo stotelę."
- source: "Please enter the Parental Controls PIN set on the system that was used to upload data to the server."
  target: "Įveskite tėvų kontrolės PIN kodą, nustatytą sistemoje, kuri buvo naudojama duomenims įkelti į serverį."
- source: "Please have <TAG1/>all players<TAG2/> display this screen."
  target: "Paprašykite, kad <TAG1/>visi žaidėjai<TAG2/> atvertų šį ekraną."
- source: "Please link your <L_N10/> Account.<NL/><TAG1/><TAG2/>With a linked account, you can access online play, friend features, <L_NEP/>, and more.<TAG3/><TAG4/>"
  target: "Susiekite savo <L_N10/> paskyrą.<NL/><TAG1/><TAG2/>Susieję paskyrą, galėsite žaisti internetu, naudotis draugų funkcijomis, <L_NEP/> ir dar daugiau.<TAG3/><TAG4/>"
- source: "Please make sure that you have entered the correct password.<NL/><NL/>If the password is correct, the network device may be using unsupported security settings."
  target: "Įsitikinkite, kad įvedėte teisingą slaptažodį.<NL/><NL/>Jei slaptažodis teisingas, tinklo įrenginys gali naudoti nepalaikomus saugos nustatymus."
- source: "Please move the consoles closer together."
  target: "Padėkite konsoles arčiau viena kitos."
- source: "Please prepare the source console, as well as the target console to which the user will be transferred. Which console are you currently using?"
  target: "Paruoškite pradinę ir tikslinę konsoles. Į tikslinę konsolę bus perkeltas naudotojas. Kurią konsolę dabar naudojate?"
- source: "Please read the Important Information document carefully<NL/>before using this console."
  target: "Prieš naudodami šią konsolę, atidžiai perskaitykite<NL/>dokumentą \"Svarbi informacija\"."
- source: "Please restart the console from Power Options in the Power Menu (hold the POWER Button for three seconds) and try again.<TAG1/><NL/>If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Atverkite Maitinimo meniu (tris sekundes laikykite nuspaudę POWER mygtuką), pasirinkite Maitinimo parinktys, paleiskite konsolę iš naujo ir bandykite dar kartą.<TAG1/><NL/>Jei problema išlieka, žr. <L_N10/> pagalbos svetainę.<NL/><L_SNCE/>"
- source: "Please scan the QR Code again.<NL/><TAG1/><TAG2/>Screenshots and videos will be sent to your smartphone or smart device.<TAG3/><TAG4/>"
  target: "Prašome nuskaityti QR kodą dar kartą.<NL/><TAG1/><TAG2/>Ekrano nuotraukos ir vaizdo įrašai bus išsiųsti į jūsų išmanųjį telefoną ar išmanųjį įrenginį.<TAG3/><TAG4/>"
- source: "Please select a group."
  target: "Pasirinkite grupę."
- source: "Please sign in to the <L_N10/> Account for the user that will be transferred.<NL/><TAG1/><TAG2/>If a <L_N10/> Account has not been linked for this user, please do so on the source console. You can link a <L_N10/> Account via the user page found in the top left of the HOME Menu.<TAG3/><TAG4/>"
  target: "Prisijunkite prie perkeliamo naudotojo <L_N10/> paskyros.<NL/><TAG1/><TAG2/>Jei šis naudotojas nesusietas su <L_N10/> paskyra, susiekite ją pradinėje konsolėje. <L_N10/> paskyrą galite susieti per naudotojo puslapį, esantį HOME meniu viršuje kairėje.<TAG3/><TAG4/>"
- source: "Please sign in to the same <L_N10/> Account as before."
  target: "Prisijunkite prie tos pačios <L_N10/> paskyros kaip anksčiau."
- source: "Please try again later."
  target: "Pabandykite dar kartą vėliau."
- source: "Please try again later.<NL/>If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Pabandykite dar kartą vėliau.<NL/>Jei problema išlieka, žr. <L_N10/> pagalbos svetainę.<NL/><L_SNCE/>"
- source: "Please try again later.<TAG1/><NL/>If the problem continues, visit the <L_N10/> Support<L_XA0/>website.<NL/><L_SNCE/>"
  target: "Bandykite dar kartą vėliau.<TAG1/><NL/>Jei problema išlieka, apsilankykite <L_N10/> pagalbos<L_XA0/>svetainėje.<NL/><L_SNCE/>"
- source: "Please try again later.<TAG1/><NL/>If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Pabandykite dar kartą vėliau.<TAG1/><NL/>Jei problema išlieka, žr. <L_N10/> pagalbos svetainę.<NL/><L_SNCE/>"
- source: "Please try again later.<TAG1/><NL/>If the problem persists, try performing a system update from <0xE130/> (System Settings) ⇒ System on the HOME Menu.<TAG2/><NL/>If a system update does not fix the problem, please visit the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Pabandykite dar kartą vėliau.<TAG1/><NL/>Jei problema išlieka, bandykite atnaujinti sistemą HOME meniu pasirinkę <0xE130/> (Sistemos nustatymai) ⇒ Sistema.<TAG2/><NL/>Jei sistemos atnaujinimas problemos neišsprendžia, apsilankykite <L_N10/> pagalbos svetainėje.<NL/><L_SNCE/>"
- source: "Please try again later.<TAG1/><NL/>If you are using a wireless connection, the wireless signal strength may be poor.<NL/>Try the following solutions:<NL/><L_DOT1/><TAG2/>Move the console closer to the network device.<TAG3/><NL/><L_DOT1/><TAG4/>Remove any obstacles between the network device and the console.<TAG5/>"
  target: "Pabandykite dar kartą vėliau.<TAG1/><NL/>Jei naudojate belaidį ryšį, signalas gali būti silpnas.<NL/>Išbandykite šiuos sprendimus:<NL/><L_DOT1/><TAG2/>Padėkite konsolę arčiau tinklo įrenginio.<TAG3/><NL/><L_DOT1/><TAG4/>Pašalinkite kliūtis tarp tinklo įrenginio ir konsolės.<TAG5/>"
- source: "Please try again."
  target: "Bandykite dar kartą."
- source: "Please turn Airplane Mode off when appropriate for your surroundings.<NL/>You can do this in Quick Settings (hold <0xE0B9/>).<TAG1/><NL/>If the problem persists even when the Airplane Mode is off, please restart the console from Power Options in the Power Menu (hold the POWER Button for three seconds)."
  target: "Išjunkite lėktuvo režimą, jei tai tinkama jūsų aplinkoje.<NL/>Tai galite padaryti atvėrę sparčiuosius nustatymus (laikykite nuspaudę <0xE0B9/>).<TAG1/><NL/>Jei problema išlieka ir išjungus lėktuvo režimą, atverkite Maitinimo meniu (tris sekundes laikykite nuspaudę POWER mygtuką), pasirinkite Maitinimo parinktys ir paleiskite konsolę iš naujo."
