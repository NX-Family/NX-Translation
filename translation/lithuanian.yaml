  target: "Norėdami atjungti nereikalingą valdiklį, trumpai paspauskite jo SYNC mygtuką."
- source: "To display Support Information, Important Information, and Intellectual Property Notices, insert the game card or download this software."
  target: "Norėdami matyti skyrius \"Pagalbos informacija\", \"Svarbi informacija\" ir \"Intelektinės nuosavybės pranešimai\", įdėkite žaidimo kortelę arba atsisiųskite šią programinę įrangą."
- source: "To display your <TAG1/><L_N3D/><TAG2/> friends (<0xE131/>), your <TAG3/><L_N3D/><TAG4/> needs to be linked with a <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>You can do so by going to System Settings on your <TAG8/><L_N3D/><TAG9/>."
  target: "Norėdami matyti savo <TAG1/><L_N3D/><TAG2/> draugus (<0xE131/>), susiekite savo <TAG3/><L_N3D/><TAG4/> su <TAG5/><L_NNI/><TAG6/>.<TAG7/><NL/>Tai galite padaryti skiltyje \"Sistemos nustatymai\" savo <TAG8/><L_N3D/><TAG9/> sistemoje."
- source: "To download the save data, the software you're using will now close and restart."
  target: "Kad būtų atsisiųsti išsaugoti duomenys, naudojama programinė įranga dabar bus uždaryta ir paleista iš naujo."
- source: "To earn points for physical software, certain conditions must be fulfilled. For details, see the <L_MNT/> website."
  target: "Norint gauti taškų už fizinę programinę įrangą, reikia įvykdyti tam tikras sąlygas. Daugiau informacijos rasite <L_MNT/> svetainėje."
- source: "To enjoy surround sound, you will need a device that supports linear PCM 5.1 surround sound. Without a supporting device connected, some sounds may not play correctly.<TAG1/><NL/>Do you want to enable surround sound?"
  target: "Norėdami mėgautis erdvinio garso efektais, jums reikės įrenginio, palaikančio tiesinį PCM 5.1 erdvinį garsą. Jei nėra prijungtas palaikantis įrenginys, kai kurie garsai gali būti grojami neteisingai.<TAG1/><NL/>Ar norite įjungti erdvinį garsą?"
- source: "To exit Maintenance Mode, press the POWER Button to turn off the console."
  target: "Norėdami išeiti iš priežiūros režimo, paspauskite POWER mygtuką, kad išjungtumėte konsolę."
- source: "To free up enough space, you will also need to archive software for which Prevent Auto Archiving has been enabled.<NL/>Choose software to archive?"
  target: "Kad atsilaisvintų pakankamai vietos, reikės archyvuoti ir programinę įrangą, kuriai įjungta parinktis \"Neleisti automatiškai archyvuoti\".<NL/>Pasirinkti programinę įrangą archyvavimui?"
- source: "To link the two systems, you will need to bring them close to one another.<TAG1/><NL/>If the system shown is unavailable because it has been damaged or lost, please unlink the system from a PC or smart device.<TAG2/><NL/>Visit the <L_N10/> Support website for more information.<NL/><TAG3/>"
  target: "Norėdami susieti dvi sistemas, laikykite jas arti viena kitos.<TAG1/><NL/>Jei rodoma sistema nepasiekiama, nes sugedo arba buvo pamesta, atsiekite ją naudodami kompiuterį arba išmanųjį įrenginį.<TAG2/><NL/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje.<NL/><TAG3/>"
- source: "To load a virtual game card on another system, you must link this system with the other system. Systems only need to<L_XA0/>be linked<L_XA0/>once.<NL/><TAG1/><TAG2/>Each <L_N10/> Account can have a maximum of two systems linked at a time.<TAG3/><TAG4/>"
  target: "Norėdami įkelti virtualią žaidimo kortelę į kitą sistemą, turite susieti šią sistemą su kita. Sistemas reikia<L_XA0/>susieti tik<L_XA0/>kartą.<NL/><TAG1/><TAG2/>Su kiekviena <L_N10/> paskyra vienu metu gali būti susietos ne daugiau kaip dvi sistemos.<TAG3/><TAG4/>"
- source: "To load a virtual game card on this system, you must link it with the other system <TAG1/> is using, shown below. Systems only need to<L_XA0/>be linked once."
  target: "Norėdami įkelti virtualią žaidimo kortelę į šią sistemą, susiekite ją su toliau parodyta kita sistema, kurią naudoja <TAG1/>. Sistemas reikia<L_XA0/>susieti tik kartą."
- source: "To play the <L_DLC/>, load the virtual game card on this system."
  target: "Norėdami žaisti <L_DLC/>, įkelkite virtualią žaidimo kortelę į šią sistemą."
- source: "To play this game, you'll first need to load the virtual game card on this system."
  target: "Norėdami žaisti šį žaidimą, pirmiausia turėsite įkelti virtualią žaidimo kortelę į šią sistemą."
- source: "To play this software, load its virtual game card on <TAG1/>this system<TAG2/>."
  target: "Norėdami žaisti šią programinę įrangą, įkelkite jos virtualią žaidimo kortelę į <TAG1/>šią sistemą<TAG2/>."
- source: "To play, insert a game card or purchase software from <0xE133/> <L_NEP/>."
  target: "Norėdami žaisti, įdėkite žaidimo kortelę arba įsigykite programinę įrangą iš <0xE133/> <L_NEP/>."
- source: "To save a screenshot, tap and hold the image and select Save from the pop-up menu.<NL/>Note: Menus may differ across devices and browsers."
  target: "Norėdami išsaugoti ekrano nuotrauką, palieskite ir palaikykite vaizdą, tada iškylančiajame meniu pasirinkite Išsaugoti.<NL/>Pastaba: Meniu gali skirtis pagal įrenginį ir naršyklę."
- source: "To save a video, tap the download link or tap and hold the video and select Save from the pop-up menu.<NL/>Note: Menus may differ across devices and browsers."
  target: "Norėdami išsaugoti vaizdo įrašą, palieskite atsisiuntimo nuorodą arba palieskite ir palaikykite vaizdo įrašą, tada iškylančiajame meniu pasirinkite Išsaugoti.<NL/>Pastaba: Meniu gali skirtis pagal įrenginį ir naršyklę."
- source: "To search for controllers, you will need to turn Airplane Mode off.<NL/><TAG1/><TAG2/>You can do this from the HOME Menu by selecting <0xE130/> (System Settings) ⇒ Airplane Mode.<TAG3/><TAG4/>"
  target: "Norėdami ieškoti valdiklių, turite išjungti lėktuvo režimą.<NL/><TAG1/><TAG2/>Tai galite padaryti ekrano HOME meniu, pasirinkdami <0xE130/> (Sistemos nustatymai) ⇒ Lėktuvo režimas.<TAG3/><TAG4/>"
- source: "To transfer save data, you must link the source user's <L_N10/> Account to a user on this console.<TAG1/><NL/>Link the <L_N10/> Account and try again.<NL/><TAG2/><TAG3/>You can link a <L_N10/> Account on your user page.<TAG4/><TAG5/>"
  target: "Norėdami perkelti išsaugotus duomenis, susiekite pradinio naudotojo <L_N10/> paskyrą su šios konsolės naudotoju.<TAG1/><NL/>Susiekite <L_N10/> paskyrą ir bandykite dar kartą.<NL/><TAG2/><TAG3/><L_N10/> paskyrą galite susieti savo naudotojo puslapyje.<TAG4/><TAG5/>"
- source: "To transfer screenshots and videos stored on the <L_MSD/> card, eject the <L_MSD/> card and insert it into the <L_N10/> <TAG1/><L_SWT2/><TAG2/> system.<TAG3/><NL/>Please keep the <L_MSD/> card in a safe place until you get your <L_N10/> <TAG4/><L_SWT2/><TAG5/>."
  target: "Norėdami perkelti <L_MSD/> kortelėje saugomas ekrano nuotraukas ir vaizdo įrašus, išimkite <L_MSD/> kortelę ir įdėkite ją į <L_N10/> <TAG1/><L_SWT2/><TAG2/> sistemą.<TAG3/><NL/>Laikykite <L_MSD/> kortelę saugioje vietoje, kol gausite savo <L_N10/> <TAG4/><L_SWT2/><TAG5/>."
- source: "To transfer systems, you will need a user on the system that has a linked <L_N10/> Account.<TAG1/><NL/>Try again after linking a <L_N10/> Account."
  target: "Norint perkelti sistemą, joje turi būti naudotojas, susietas su <L_N10/> paskyra.<TAG1/><NL/>Susiekite <L_N10/> paskyrą ir bandykite dar kartą."
- source: "To use <L_BT/> audio, you must first pair a device.<TAG1/><NL/><L_ROMB/> <TAG2/>Up to two wireless controllers can connect while using <L_BT/> audio.<TAG3/><NL/><L_ROMB/> <TAG4/><L_BT/> audio will be disconnected during local communication.<TAG5/><NL/><L_ROMB/> <TAG6/><L_BT/> microphones cannot be used.<TAG7/><NL/><L_ROMB/> <TAG8/>You may experience audio latency depending on your <L_BT/> device.<TAG9/>"
  target: "Norėdami naudoti <L_BT/> garsą, pirmiausia suporuokite įrenginį.<TAG1/><NL/><L_ROMB/> <TAG2/>Naudojant <L_BT/> garsą, galima prijungti iki dviejų belaidžių valdiklių.<TAG3/><NL/><L_ROMB/> <TAG4/><L_BT/> garso ryšys bus atjungtas naudojant vietinį ryšį.<TAG5/><NL/><L_ROMB/> <TAG6/><L_BT/> mikrofonų naudoti negalima.<TAG7/><NL/><L_ROMB/> <TAG8/>Priklausomai nuo jūsų <L_BT/> įrenginio, garsas gali vėluoti.<TAG9/>"
- source: "To use controllers wirelessly, you will need to turn Airplane Mode off.<NL/><TAG1/>You can do this in Quick Settings (hold <0xE0B9/>).<TAG2/>"
  target: "Norėdami naudoti valdiklius belaidžiu ryšiu, išjunkite lėktuvo režimą.<NL/><TAG1/>Tai galite padaryti meniu \"Spartieji nustatymai\" (laikykite nuspaudę <0xE0B9/>).<TAG2/>"
- source: "To use this feature, please disconnect any audio devices connected via USB."
  target: "Norėdami naudoti šią funkciją, atjunkite visus per USB prijungtus garso įrenginius."
- source: "To use this feature, you will need to disconnect any headphones or speakers connected to the console's audio jack."
  target: "Norėdami naudoti šią funkciją, turėsite atjungti ausines arba garsiakalbius, prijungtus prie konsolės garso lizdo."
- source: "To use this feature, you will need to turn Airplane Mode off.<NL/><TAG1/><TAG2/>You can do this in Quick Settings (hold <0xE0B9/>).<TAG3/><TAG4/>"
  target: "Norėdami naudoti šią funkciją, išjunkite lėktuvo režimą.<NL/><TAG1/><TAG2/>Tai galite padaryti meniu \"Spartieji nustatymai\" (laikykite nuspaudę <0xE0B9/>).<TAG3/><TAG4/>"
- source: "To view or add friends, open your user page in the top left of the HOME Menu."
  target: "Norėdami peržiūrėti ar pridėti draugus, atidarykite savo naudotojo puslapį HOME meniu viršuje kairėje."
