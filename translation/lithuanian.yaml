- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Automatinio atsisiuntimo nustatymai kiekvienai konsolei atskiri.<NL/><TAG1/><TAG2/>Norėdami automatiškai atsisiųsti išsaugotus duomenis kitoje konsolėje, turėsite pakeisti tos konsolės nustatymus. Norėdami<TAG3/><TAG4/> juos pakeisti, HOME meniu pasirinkite <0xE130/> (Sistemos nustatymai) ⇒ Duomenų tvarkymas ⇒ Išsaugotų duomenų debesis.<TAG5/><TAG6/>"
