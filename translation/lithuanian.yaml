  target: "<TAG1/><TAG2/>Klaidos kodas: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Norėdami tęsti šioje sistemoje, uždarykite visą programinę įrangą, kurią kitoje sistemoje naudoja su šia <L_N10/> paskyra susietas naudotojas.<NL/><NL/>Arba galite žaisti šioje sistemoje neuždarydami programinės įrangos kitur, atlikę šiuos veiksmus:<NL/><TAG7/><L_ROMB/> Taip paleidus programinę įrangą, dalis <L_DLC/> nebus pasiekiama.<TAG8/><TAG9/><NL/>1. <TAG10/>HOME meniu pažymėkite programinę įrangą ir paspauskite <TAG11/>, kad ją<L_XA0/>uždarytumėte.<TAG12/><NL/>2. <TAG13/>Paspauskite ir laikykite nuspaudę <TAG14/>, tada paspauskite <TAG15/>, kad paleistumėte programinę įrangą iš naujo.<TAG16/>"
- source: "<TAG1/><TAG2/>Error Code: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>To continue on this system, close the software on any other system where it's being played by a user linked to this <L_N10/> Account.<NL/><NL/>Alternatively, you can play the software on this system without closing it elsewhere by following the steps below:<NL/><TAG7/><L_ROMB/> Some <L_DLC/> will be unavailable if you start the software this way.<TAG8/><TAG9/><NL/>1. <TAG10/>Go to the HOME Menu, highlight the software, and press <TAG11/> to<L_XA0/>close the software.<TAG12/><NL/>2. <TAG13/>Press and hold <TAG14/>, and then press <TAG15/> to restart the software.<TAG16/>"
  target: "<TAG1/><TAG2/>Klaidos kodas: <TAG3/><TAG4/><TAG5/><TAG6/><NL/>Norėdami tęsti šioje sistemoje, uždarykite programinę įrangą visose kitose sistemose, kur ją žaidžia su šia <L_N10/> paskyra susietas naudotojas.<NL/><NL/>Arba galite žaisti šioje sistemoje neuždarydami programinės įrangos kitur, atlikę šiuos veiksmus:<NL/><TAG7/><L_ROMB/> Taip paleidus programinę įrangą, dalis <L_DLC/> nebus pasiekiama.<TAG8/><TAG9/><NL/>1. <TAG10/>HOME meniu pažymėkite programinę įrangą ir paspauskite <TAG11/>, kad ją<L_XA0/>uždarytumėte.<TAG12/><NL/>2. <TAG13/>Paspauskite ir laikykite nuspaudę <TAG14/>, tada paspauskite <TAG15/>, kad paleistumėte programinę įrangą iš naujo.<TAG16/>"
