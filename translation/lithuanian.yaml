- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Virtualias žaidimų korteles galima paskolinti šeimos grupės nariams, padėjus abi sistemas arti viena kitos ir jas susiejus.<TAG1/><NL/><L_DOT1/><TAG2/>Paskolintą programinę įrangą galima laisvai žaisti pasiskolinusio naudotojo sistemoje, o ją paskolinęs naudotojas laikinai netenka prieigos prie jos.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtualias žaidimų korteles galima pasiskolinti iki 14 dienų. Pasibaigus šiam terminui, virtuali žaidimo kortelė bus grąžinta automatiškai.<NL/><TAG6/><TAG7/>Paskolinę naudotojai taip pat gali atsiimti savo virtualias žaidimų korteles iš jas pasiskolinusių asmenų dar nepasibaigus terminui.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Naudotojai gali paskolinti po vieną virtualią žaidimo kortelę vienam asmeniui, iš viso iki trijų asmenų vienu metu, tačiau viena sistema galima pasiskolinti ne daugiau kaip vieną kortelę.<NL/><TAG13/><TAG14/>Atsiimtą virtualią žaidimo kortelę galima paskolinti dar kartą.<TAG15/><TAG16/><TAG17/>"
- source: "Virtual game cards you were unable to load (<TAG1/>)"
