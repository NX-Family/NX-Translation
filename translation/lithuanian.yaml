- source: "<L_DOT1/> <TAG1/>Borrowed games will be returned after 14 days.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Bring the systems close to one another to share.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Some software may not support lending.<TAG8/>"
  target: "<L_DOT1/> <TAG1/>Pasiskolinti žaidimai bus grąžinti po 14 dienų.<TAG2/><TAG3/><NL/><L_DOT1/> <TAG4/>Norėdami dalytis, padėkite sistemas arti viena kitos.<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Kai kuri programinė įranga gali nepalaikyti paskolinimo.<TAG8/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_NCOJ/>"
  target: "<L_DOT1/> <TAG1/>Naudotojo <TAG2/> įsigytą atsisiunčiamą programinę įrangą galima vėl atsisiųsti ir žaisti tikslinėje sistemoje.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Ekrano nuotraukos ir vaizdo įrašai nebuvo perkelti ir liko pradinėje sistemoje.<TAG6/><TAG7/><NL/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje:<NL/><L_NCOJ/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_SNC/>"
  target: "<L_DOT1/> <TAG1/>Naudotojo <TAG2/> įsigytą atsisiunčiamą programinę įrangą galima vėl atsisiųsti ir žaisti tikslinėje sistemoje.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Ekrano nuotraukos ir vaizdo įrašai nebuvo perkelti ir liko pradinėje sistemoje.<TAG6/><TAG7/><NL/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje:<NL/><L_SNC/>"
- source: "<L_DOT1/> <TAG1/>Downloadable software purchased by <TAG2/> can be redownloaded and played on the target system.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Screenshots and videos were not transferred and remain on the original system.<TAG6/><TAG7/><NL/>Visit the <L_N10/> Support website for more information:<NL/><L_SNCT/>"
  target: "<L_DOT1/> <TAG1/>Naudotojo <TAG2/> įsigytą atsisiunčiamą programinę įrangą galima vėl atsisiųsti ir žaisti tikslinėje sistemoje.<TAG3/><TAG4/><NL/><L_DOT1/> <TAG5/>Ekrano nuotraukos ir vaizdo įrašai nebuvo perkelti ir liko pradinėje sistemoje.<TAG6/><TAG7/><NL/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje:<NL/><L_SNCT/>"
- source: "<L_DOT1/> <TAG1/>Games on physical game cards will <TAG2/>not appear<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Some software, like game demos, will not appear because they are not treated like game cards. <NL/><TAG7/><TAG8/>To play these titles, download them from <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Software and downloadable content purchased using other accounts will not appear.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Hidden virtual game cards will not appear.<TAG19/>"
  target: "<L_DOT1/> <TAG1/>Žaidimai fizinėse žaidimų kortelėse <TAG2/>nebus rodomi<TAG3/>.<TAG4/><TAG5/><NL/><L_DOT1/> <TAG6/>Kai kuri programinė įranga, pvz., demonstracinės žaidimų versijos, nebus rodoma, nes ji nelaikoma žaidimų kortelėmis. <NL/><TAG7/><TAG8/>Norėdami ją žaisti, atsisiųskite iš <TAG9/><L_NEP/><TAG10/>.<TAG11/><TAG12/><TAG13/><TAG14/><NL/><L_DOT1/> <TAG15/>Programinė įranga ir atsisiunčiamas turinys, įsigyti naudojant kitas paskyras, nebus rodomi.<TAG16/><TAG17/><NL/><L_DOT1/> <TAG18/>Paslėptos virtualios žaidimų kortelės nebus rodomos.<TAG19/>"
- source: "<L_DOT1/><TAG1/>If a controller is on top of clothing or a soft object, like a pillow, the vibration may become difficult to hear. Please be as quiet as possible during the searching process.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Controllers that do not have a vibration feature cannot be searched for by using this method.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>If a controller is not vibrating, try moving the console closer to where you think it might be or try searching for the controller using a different console. Controllers may not vibrate if:<TAG8/><NL/><L_DSH/><TAG9/>They are too far away from the console.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>They are out of battery power or have low battery power.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>They are not paired to a console or are paired to a different console.<TAG16/><TAG17/>"
  target: "<L_DOT1/><TAG1/>Jei valdiklis guli ant drabužių ar minkšto daikto, pvz., pagalvės, jo vibraciją gali būti sunku išgirsti. Ieškodami stenkitės būti kuo tylesni.<TAG2/><TAG3/><NL/><L_DOT1/><TAG4/>Šiuo būdu negalima ieškoti valdiklių, kurie neturi vibracijos funkcijos.<TAG5/><TAG6/><NL/><L_DOT1/><TAG7/>Jei valdiklis nevibruoja, priartinkite konsolę prie vietos, kur jis galėtų būti, arba ieškokite naudodami kitą konsolę. Valdikliai gali nevibruoti, jei:<TAG8/><NL/><L_DSH/><TAG9/>Jie yra per toli nuo konsolės.<TAG10/><TAG11/><NL/><L_DSH/><TAG12/>Jų akumuliatoriai išsikrovę arba liko mažai įkrovos.<TAG13/><TAG14/><NL/><L_DSH/><TAG15/>Jie nesuporuoti su konsole arba suporuoti su kita konsole.<TAG16/><TAG17/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try adding this network to your smartphone's <L_WIFI/> settings:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Security: <L_WAES/><NL/>Password: <TAG6/><NL/><TAG7/><TAG8/>This password will change each time you connect.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>If the access point does not change to your <L_NS/>, try temporarily disabling mobile data on your smartphone.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Visit the <L_N10/> Support website for more.<NL/><TAG17/><TAG18/>"
  target: "<L_DOT1/><TAG1/>Jei negalite nuskaityti QR kodo, pabandykite pridėti šį tinklą išmaniojo telefono <L_WIFI/> nustatymuose:<TAG2/><TAG3/><NL/>    <TAG4/><L_SSID/>: <TAG5/><NL/>Sauga: <L_WAES/><NL/>Slaptažodis: <TAG6/><NL/><TAG7/><TAG8/>Šis slaptažodis keisis kaskart prisijungiant.<TAG9/><TAG10/><TAG11/><TAG12/><NL/><L_DOT1/><TAG13/>Jei prieigos taškas nepersijungia į jūsų <L_NS/>, pabandykite telefone laikinai išjungti mobiliuosius duomenis.<TAG14/><TAG15/><NL/><L_DOT1/><TAG16/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje.<NL/><TAG17/><TAG18/>"
- source: "<L_DOT1/><TAG1/>If you are unable to scan the QR Code, try going to this URL on your smartphone's Internet browser:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>If the access point does not change to your <L_NS/> and no screenshots or videos display, try temporarily disabling mobile data on your smartphone.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Visit the <L_N10/> Support website for more information.<NL/><TAG9/><TAG10/>"
  target: "<L_DOT1/><TAG1/>Jei negalite nuskaityti QR kodo, pabandykite atverti šį URL išmaniojo telefono naršyklėje:<NL/><TAG2/><TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Jei prieigos taškas nepersijungia į jūsų <L_NS/> ir nerodomos ekrano nuotraukos ar vaizdo įrašai, pabandykite telefone laikinai išjungti mobiliuosius duomenis.<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Daugiau informacijos rasite <L_N10/> pagalbos svetainėje.<NL/><TAG9/><TAG10/>"
- source: "<L_DOT1/><TAG1/>Only invites from the last 10 days will be displayed.<TAG2/><NL/><L_DOT1/><TAG3/>You may be unable to join in certain cases, like if the inviter exits online play before you can join.<TAG4/><NL/><L_DOT1/><TAG5/>Invites can be sent only from supporting software.<TAG6/>"
  target: "<L_DOT1/><TAG1/>Bus rodomi tik paskutinių 10 dienų kvietimai.<TAG2/><NL/><L_DOT1/><TAG3/>Kartais gali nepavykti prisijungti, pvz., jei kvietėjas baigia žaisti internetu, kol dar neprisijungėte.<TAG4/><NL/><L_DOT1/><TAG5/>Kvietimus galima siųsti tik iš programinės įrangos, kuri palaiko šią funkciją.<TAG6/>"
