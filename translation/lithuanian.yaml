- source: "Unable to access the <L_MSD/> card.<TAG1/><NL/>Please turn off the console and reinsert<NL/>the <L_MSD/> card.<TAG2/><NL/>You can turn the power off from Power Options in the Power Menu (hold the POWER Button for three seconds).<TAG3/><NL/>If the problem persists, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Nepavyko pasiekti <L_MSD/> kortelės.<TAG1/><NL/>Išjunkite konsolę ir iš naujo įdėkite<NL/><L_MSD/> kortelę.<TAG2/><NL/>Atverkite Maitinimo meniu (tris sekundes laikykite nuspaudę POWER mygtuką), pasirinkite Maitinimo parinktys ir išjunkite maitinimą.<TAG3/><NL/>Jei problema išlieka, apsilankykite <L_N10/> pagalbos svetainėje.<NL/><L_SNCE/>"
- source: "Unable to access the <L_MSD/> card.<TAG1/><NL/>Turn off the console and reinsert the <L_MSD/> card.<NL/>To turn off the console, go to Power Options in the Power Menu (hold the POWER Button for three seconds).<TAG2/><NL/>If the problem persists, go to the HOME Menu and select <0xE130/> (System Settings) ⇒ System ⇒ Formatting Options and try formatting the <L_MSD/> card.<NL/>If the issue still occurs, please refer to the <L_N10/> Support website.<NL/><L_SNCE/>"
  target: "Nepavyko pasiekti <L_MSD/> kortelės.<TAG1/><NL/>Išjunkite konsolę ir iš naujo įdėkite <L_MSD/> kortelę.<NL/>Norėdami išjungti konsolę, atverkite Maitinimo meniu (tris sekundes laikykite nuspaudę POWER mygtuką) ir pasirinkite Maitinimo parinktys.<TAG2/><NL/>Jei problema išlieka, HOME meniu pasirinkite <0xE130/> (Sistemos nustatymai) ⇒ Sistema ⇒ Formatavimo parinktys ir pabandykite suformatuoti <L_MSD/> kortelę.<NL/>Jei problema vis tiek išlieka, apsilankykite <L_N10/> pagalbos svetainėje.<NL/><L_SNCE/>"
