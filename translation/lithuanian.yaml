  target: "Visi sistemos atminties duomenys, įskaitant programinės įrangos duomenis, išsaugotus duomenis, ekrano nuotraukas, vaizdo įrašus ir naudotojo informaciją, bus ištrinti. Bus atkurti gamykliniai konsolės nustatymai.<TAG1/><NL/><L_SQR/> <TAG2/>Atkreipkite dėmesį:<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Visi <L_MSD/> kortelėje išsaugoti programinės įrangos duomenys, išskyrus ekrano nuotraukas ir vaizdo įrašus, taps nebenaudojami. (Duomenys <L_MSD/> kortelėje nebus ištrinti.)<TAG6/><TAG7/><NL/><L_DOT1/><TAG8/>Sistemos versija nepasikeis.<TAG9/>"
- source: "All data in the system memory, including software, save data, screenshots, videos, and user information, will be deleted, restoring the console to factory settings.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Any <L_N10/> Accounts linked to this console will not be deleted, but they will be unlinked.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Your <L_N10/> Account contains your <L_NEP/> purchase history and current balance. By relinking your <L_N10/> Account after initializing the console, it will be possible to redownload any software or <L_DLC/> purchased using that account. (Software that has been discontinued may not be available for redownload in some cases.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> If you are using this option due to a problem with your console:<TAG19/><NL/>In Maintenance Mode, it is possible to initialize your console without deleting save data or user information. If you would like to try this instead, cancel the initialization process and do the following:<TAG20/><NL/><L_D1/> <TAG21/>Turn the power off.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>To power off your console, open the Power Menu (hold the POWER Button for three seconds), then select Power Options → Power Off.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Hold down the volume up (+) and down (-) buttons along with the POWER Button to turn the console on.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>The console will start up in Maintenance Mode.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Select Initialize Console Without Deleting Save Data, and follow the instructions given.<TAG38/>"
  target: "Visi sistemos atminties duomenys, įskaitant programinę įrangą, išsaugotus duomenis, ekrano nuotraukas, vaizdo įrašus ir naudotojo informaciją, bus ištrinti. Bus atkurti gamykliniai konsolės nustatymai.<TAG1/><NL/><L_SQR/> Atkreipkite dėmesį:<TAG2/><NL/><L_DOT1/><TAG3/>Visa <L_MSD/> kortelėje išsaugota programinė įranga, išskyrus ekrano nuotraukas ir vaizdo įrašus, taps nebenaudojama. (Duomenys <L_MSD/> kortelėje nebus ištrinti.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Sistemos versija nepasikeis.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Su šia konsole susietos <L_N10/> paskyros nebus ištrintos, tik atsietos.<TAG10/><TAG11/><NL/><TAG12/><TAG13/><L_ROMB/> <TAG14/>Jūsų <L_N10/> paskyroje saugoma jūsų <L_NEP/> pirkimų istorija ir dabartinis likutis. Atkūrę konsolę ir vėl susieję savo <L_N10/> paskyrą, galėsite iš naujo atsisiųsti šia paskyra įsigytą programinę įrangą ar <L_DLC/>. (Kai kuriais atvejais programinės įrangos, kurios platinimas nutrauktas, iš naujo atsisiųsti negalima.)<TAG15/><TAG16/><TAG17/><TAG18/><NL/><L_SQR/> Jei šią parinktį naudojate dėl konsolės problemos:<TAG19/><NL/>Priežiūros režimu galima atkurti konsolę neištrinant išsaugotų duomenų ar naudotojo informacijos. Jei norite išbandyti šį būdą, atšaukite atkūrimą ir atlikite šiuos veiksmus:<TAG20/><NL/><L_D1/> <TAG21/>Išjunkite maitinimą.<TAG22/><NL/><L_WSP/> <TAG23/><TAG24/><TAG25/>Norėdami išjungti konsolę, atverkite Maitinimo meniu (tris sekundes laikykite nuspaudę POWER mygtuką), tada pasirinkite Maitinimo parinktys → Išjungti maitinimą.<TAG26/><TAG27/><TAG28/><TAG29/><NL/><L_D2/> <TAG30/>Laikykite nuspaudę garsumo didinimo (+) ir mažinimo (-) mygtukus kartu su POWER mygtuku, kad įjungtumėte konsolę.<TAG31/><NL/><L_WSP/> <TAG32/><TAG33/>Konsolė įsijungs priežiūros režimu.<TAG34/><TAG35/><TAG36/><NL/><L_D3/> <TAG37/>Pasirinkite Atkurti konsolę neištrinant išsaugotų duomenų ir vykdykite pateiktus nurodymus.<TAG38/>"
- source: "All data on the <L_MSD/> card will be deleted, and it will be formatted so that it can be used with this console."
