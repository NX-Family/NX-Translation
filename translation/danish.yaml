  target: "Se flere detaljer på <L_N10/>s supportside.<NL/><TAG1/><TAG2/>Der er også information om:<NL/><L_DOT1/><TAG3/>Brug af software uden isat virtuelt spilkort.<TAG4/><NL/><L_DOT1/><TAG5/>Fjernelse af systemtilknytning.<TAG6/><TAG7/><TAG8/>"
