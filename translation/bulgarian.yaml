  target: "От кога сте приятели:"
- source: "When playing with a <L_JC/> controller, attach the strap by following<NL/>the steps provided, and hold it securely without letting go.<NL/>Allow adequate room around you during gameplay.<NL/>Be aware of your surroundings."
  target: "Когато играете с контролер <L_JC/>, поставете каишката според<NL/>указаните стъпки и дръжте контролера здраво, без да го изпускате.<NL/>Осигурете достатъчно място около себе си по време на игра.<NL/>Внимавайте за заобикалящата ви среда."
- source: "When switching to TV mode with the console docked or when the console exits sleep mode, the TV will turn on. Turning off the TV will put the console in sleep mode.<TAG1/><NL/><L_ROMB/> <TAG2/><L_HDMI/> settings must also be enabled on your TV. Some TV models may be unable to use this feature.<TAG3/>"
  target: "При преминаване към режим на телевизор с конзола в докинг станцията или при излизане на конзолата от режим на сън телевизорът ще се включи. Изключването на телевизора ще приспи конзолата.<TAG1/><NL/><L_ROMB/> <TAG2/><L_HDMI/> настройките трябва да са включени и на телевизора. Някои модели телевизори може да не поддържат тази функция.<TAG3/>"
- source: "When turned on, you can play downloaded software you've purchased while the system is connected to the Internet, even if you don't have a virtual game card loaded. However, only the owner of the purchasing account can play using the software's online license, and other users won't be able to play at the same time.<TAG1/><NL/><L_ROMB/> <TAG2/>Regardless of this setting, you can still play using your virtual game card.<TAG3/><NL/><L_ROMB/> <TAG4/>Online licenses can't be used at the same time on multiple systems.<TAG5/><NL/><L_ROMB/> <TAG6/>Online licenses can't be used at the same time as the virtual game card for the same software.<TAG7/>"
  target: "Когато настройката е включена, можете да играете закупен изтеглен софтуер, докато конзолата е свързана с интернет, дори без заредена виртуална игрова карта. Само собственикът на акаунта, с който е купен софтуерът, може да играе с онлайн лиценза му, а другите потребители няма да могат да играят едновременно.<TAG1/><NL/><L_ROMB/> <TAG2/>Независимо от тази настройка все още можете да играете с виртуалната си игрова карта.<TAG3/><NL/><L_ROMB/> <TAG4/>Онлайн лицензи не могат да се използват едновременно на няколко конзоли.<TAG5/><NL/><L_ROMB/> <TAG6/>Онлайн лицензи не могат да се използват едновременно с виртуалната игрова карта за същия софтуер.<TAG7/>"
- source: "When using headphones, please listen at a volume that is safe for your ears.<TAG1/><NL/><TAG2/><TAG3/>Set the volume so that you are still able to hear your surroundings, and take breaks when using headphones for long periods of time.<TAG4/><TAG5/>"
  target: "Със слушалки ползвайте безопасна за ушите сила на звука.<TAG1/><NL/><TAG2/><TAG3/>Оставете звука достатъчно тих, за да чувате околността, и правете почивки при дълго ползване.<TAG4/><TAG5/>"
- source: "Whenever the save data stored via the Save Data Cloud service is newer than the save data on the console, that newer data will automatically download and the older data on your console will be overwritten. Save data will not be automatically downloaded if no save data for the software is on the console."
  target: "Когато данните за запис в услугата \"Данни за запис в облака\" са по-нови от тези на конзолата, по-новите данни ще се изтеглят автоматично и ще презапишат по-старите на конзолата. Данни за запис няма да се изтеглят автоматично, ако на конзолата няма данни за запис за този софтуер."
