- source: "You can move all the save data linked to a user on another console to this console by using Transfer Your User Data.<NL/><TAG1/><TAG2/>To transfer user data, select Transfer Your User Data below to go to <TAG3/><0xE130/> (System Settings)<TAG4/> ⇒ Users, where the transfer can be performed.<TAG5/><TAG6/>"
  target: "Чрез \"Прехвърляне на потребителски данни\" можете да преместите на тази конзола всички данни за запис, свързани с потребител на друга конзола.<NL/><TAG1/><TAG2/>За прехвърляне на потребителски данни изберете \"Прехвърляне на потребителски данни\" по-долу, за да отидете в <TAG3/><0xE130/> (Системни настройки)<TAG4/> ⇒ Потребители, откъдето можете да извършите прехвърлянето.<TAG5/><TAG6/>"
- source: "You can move save data between systems using <TAG1/>Transfer Your Save Data<TAG2/> or <TAG3/>Save Data Cloud.<TAG4/><NL/>To do this, go to the <TAG5/>HOME Menu<TAG6/>, highlight the software, and press <0xE0B3/> to open the Options menu."
  target: "Можете да местите данни за запис между конзоли чрез <TAG1/>Прехвърляне на данни за запис<TAG2/> или <TAG3/>Данни за запис в облака.<TAG4/><NL/>За целта отворете <TAG5/>меню HOME<TAG6/>, маркирайте софтуера и натиснете <0xE0B3/>, за да отворите менюто с опции."
- source: "You can now choose to enter your Parental Controls PIN using control stick input.<TAG1/><NL/><L_DOT1/><TAG2/>Control stick input allows you to enter numbers more quickly.<TAG3/><NL/><L_DOT1/><TAG4/>When using control stick input, others will not be able to see the numbers you are selecting on screen.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>You can hold <TAG9/> to change to keypad input and enter your PIN as before.<TAG10/><TAG11/>"
  target: "Вече можете да изберете въвеждане на PIN кода за родителски контрол чрез контролния стик.<TAG1/><NL/><L_DOT1/><TAG2/>Въвеждането със стик позволява по-бърз избор на цифри.<TAG3/><NL/><L_DOT1/><TAG4/>При въвеждане със стик другите няма да виждат цифрите, които избирате на екрана.<TAG5/><TAG6/><NL/><TAG7/><TAG8/>Можете да задържите <TAG9/>, за да преминете към екранната клавиатура и да въведете PIN кода си както преди.<TAG10/><TAG11/>"
- source: "You can now link a <L_N10/> Account.<NL/><TAG1/><TAG2/>With a linked account, you can access online play, friend features, <L_NEP/>, and more.<TAG3/><TAG4/>"
