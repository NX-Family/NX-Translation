  target: "Това ще изтрие всички данни в системната памет, включително данни за софтуер, екранни снимки и видеоклипове. След това конзолата ще бъде инициализирана и върната към<L_XA0/>фабричните настройки.<TAG1/><NL/>След завършване на инициализацията извадете <L_MSD/> картата от тази<L_XA0/>конзола.<TAG2/><NL/><L_SQR/> Предупреждения<TAG3/><NL/><L_DOT1/> <TAG4/>Всички данни за софтуер на <L_MSD/> картата, освен екранните снимки и видеоклиповете, ще станат неизползваеми. (Данните на <L_MSD/> картата няма да се изтрият.)<TAG5/><TAG6/><NL/><L_DOT1/> <TAG7/>Системната версия няма да се промени или върне към по-стара версия.<TAG8/><TAG9/>"
- source: "This will restrict gameplay in VR mode.<TAG1/><NL/>Set this option to Restricted if a child of 6 years or younger uses this console.<TAG2/><NL/>Visit the <L_N10/> Support website for more information about VR mode.<NL/><TAG3/>"
  target: "Това ще ограничи играта в режим VR.<TAG1/><NL/>Задайте опцията на \"Ограничено\", ако конзолата се използва от дете на 6 години или по-малко.<TAG2/><NL/>За повече информация за режим VR посетете сайта за поддръжка на <L_N10/>.<NL/><TAG3/>"
- source: "This will restrict open communication between users, including sending and receiving messages and images.<TAG1/><NL/>Depending on the software, the following activities will be restricted:<TAG2/><NL/><L_DOT1/><TAG3/>Sending and receiving messages and using chat features.<TAG4/><NL/><L_DOT1/><TAG5/>Reading and sharing profile information that allows users to enter their own text.<TAG6/><NL/><L_DOT1/><TAG7/>Viewing and sharing images that users have created, possibly including text.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Use of applications operating outside of <L_NS/>, such as <L_NS/> App, will not be restricted. If you would like to set restrictions on the app, please do so using your smart device.<TAG12/><TAG13/>"
  target: "Това ще ограничи свободната комуникация между потребители, включително изпращането и получаването на съобщения и изображения.<TAG1/><NL/>В зависимост от софтуера ще се ограничат следните дейности:<TAG2/><NL/><L_DOT1/><TAG3/>Изпращане и получаване на съобщения и използване на чат функции.<TAG4/><NL/><L_DOT1/><TAG5/>Четене и споделяне на профилна информация, която позволява на потребителите да въвеждат собствен текст.<TAG6/><NL/><L_DOT1/><TAG7/>Преглед и споделяне на изображения, създадени от потребители, които може да включват текст.<TAG8/><TAG9/><NL/><TAG10/><TAG11/>Използването на приложения извън <L_NS/>, като <L_NS/> App, няма да бъде ограничено. Ако искате да зададете ограничения за приложението, направете го от смарт устройството си.<TAG12/><TAG13/>"
