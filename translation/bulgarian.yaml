  target: "Друго устройство в мрежата има същия IP адрес като конзолата.<TAG1/><NL/>Опитайте пак по-късно.<TAG2/><NL/>Ако проблемът остане, опитайте следното:<NL/><L_DOT1/><TAG3/>Проверете дали IP адресът е правилен.<TAG4/><NL/><L_DOT1/><TAG5/>Ако сте го задали ръчно, проверете адреса от мрежовия оператор.<TAG6/><NL/><L_DOT1/><TAG7/>Проверете дали друго устройство не ползва IP адреса на конзолата.<TAG8/>"
