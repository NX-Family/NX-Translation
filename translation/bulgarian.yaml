- source: "Notifies you when information arrives from <L_NSO/>, such as when Platinum Points can be collected.<NL/>Earn Platinum Points by<L_XA0/>doing things like completing <L_NSO/> missions.<TAG1/><NL/><L_ROMB/><TAG2/>For info on missions, go to the <TAG3/>HOME Menu<TAG4/> and check the <L_NSO/><L_XA0/>app.<TAG5/>"
