- source: "Present this QR Code to check in at select <L_N10/> events and locations to gain access to exclusive <L_MNT/> member benefits, such as <L_MNT/> points and entry into promotional prize drawings. The benefits will vary each time, so keep an eye out for further details when checking in.<TAG1/><NL/><L_DOT1/><TAG2/>This QR Code allows <L_N10/> to identify your <L_N10/> Account.<TAG3/><NL/><L_DOT1/><TAG4/>By checking in, you can participate in specific promotions, and you may receive e‑mails related to those or other promotions. Additional information will be available at promotional sites.<TAG5/><NL/><L_DOT1/><TAG6/><L_N10/> Account User Agreement and Privacy Policy apply.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR Code generated: <TAG11/><TAG12/><TAG13/>"
  target: "Представете този QR код, за да регистрирате посещение на избрани събития и места на <L_N10/> и да получите достъп до изключителни предимства за членове на <L_MNT/>, като <L_MNT/> точки и участие в промоционални томболи. Предимствата са различни всеки път, затова следете за подробности при регистрирането на посещение.<TAG1/><NL/><L_DOT1/><TAG2/>Този QR код позволява на <L_N10/> да идентифицира вашия <L_N10/> акаунт.<TAG3/><NL/><L_DOT1/><TAG4/>С регистрирането на посещение можете да участвате в определени промоции и е възможно да получавате имейли за тях или други промоции. Допълнителна информация ще има на промоционалните сайтове.<TAG5/><NL/><L_DOT1/><TAG6/>Прилагат се Споразумението с потребителя на <L_N10/> акаунт и Политиката за поверителност.<TAG7/><TAG8/><NL/><TAG9/><TAG10/>QR кодът е създаден: <TAG11/><TAG12/><TAG13/>"
