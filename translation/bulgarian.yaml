- source: "You can load a virtual game card using the system you want to load it on, or you can use a browser on<L_XA0/>a PC or smart device to access the URL above.<NL/><TAG1/><TAG2/>You can also see linked systems on the website.<TAG3/><TAG4/>"
  target: "Можете да заредите виртуална игрова карта от конзолата, на която искате да я заредите, или да отворите адреса по-горе с браузър на<L_XA0/>компютър или смарт устройство.<NL/><TAG1/><TAG2/>На сайта можете да видите и свързаните конзоли.<TAG3/><TAG4/>"
