- source: "Data in the system memory will be deleted, restoring the console to factory settings.<NL/>Save data, screenshots, videos, and user information will not be deleted.<TAG1/><NL/><L_SQR/> Please note:<TAG2/><NL/><L_DOT1/><TAG3/>All software data saved on the <L_MSD/> card, except for screenshots and videos, will become unusable. (Data on the <L_MSD/> card will not be deleted.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>The system version will not be changed or rolled back.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Deleted games and <L_DLC/> can be played again after redownloading the software. (Software that has been discontinued may not be available for redownload in some cases.)<TAG10/>"
  target: "Данните в системната памет ще се изтрият и конзолата ще се върне към фабричните настройки.<NL/>Данните за запис, екранните снимки, видеоклиповете и потребителската информация няма да се изтрият.<TAG1/><NL/><L_SQR/> Важно:<TAG2/><NL/><L_DOT1/><TAG3/>Всички софтуерни данни на <L_MSD/> картата, с изключение на екранните снимки и видеоклиповете, ще станат неизползваеми. (Данните на <L_MSD/> картата няма да се изтрият.)<TAG4/><TAG5/><NL/><L_DOT1/><TAG6/>Версията на системата няма да се промени или върне към по-стара.<TAG7/><TAG8/><NL/><L_DOT1/><TAG9/>Изтритите игри и <L_DLC/> могат да се играят отново след повторно изтегляне на софтуера. (В някои случаи софтуер с прекратено разпространение може да не е достъпен за повторно изтегляне.)<TAG10/>"
