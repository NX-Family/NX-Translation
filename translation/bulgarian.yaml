- source: "Entering your Parental Controls PIN will temporarily disable all restrictions until <NL/>the console is put into sleep mode or until Parental Controls are enabled again.<TAG1/><NL/>All features that may have been restricted by Parental Controls will be available:<NL/><L_DOT1/><TAG2/>Enables all software.<TAG3/><NL/><L_DOT1/><TAG4/>Enables posting of screenshots and videos to social media.<TAG5/><NL/><L_DOT1/><TAG6/>Enables communication with others.<TAG7/><NL/><L_DOT1/><TAG8/>Enables VR mode.<TAG9/><NL/><L_DOT1/><TAG10/>Disables any play timer set using the <TAG11/><L_NS/><TAG12/> Parental Controls app.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>As all Parental Controls restrictions will be lifted, please be mindful when your child is playing<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
  target: "Въвеждането на PIN кода за родителски контрол временно ще изключи всички ограничения, докато <NL/>конзолата премине в режим на сън или родителският контрол бъде включен отново.<TAG1/><NL/>Всички функции, ограничени от родителския контрол, ще станат достъпни:<NL/><L_DOT1/><TAG2/>Разрешава се целият софтуер.<TAG3/><NL/><L_DOT1/><TAG4/>Разрешава се публикуване на екранни снимки и видеоклипове в социални мрежи.<TAG5/><NL/><L_DOT1/><TAG6/>Разрешава се общуване с други хора.<TAG7/><NL/><L_DOT1/><TAG8/>Разрешава се режимът VR.<TAG9/><NL/><L_DOT1/><TAG10/>Изключват се всички таймери за игра, зададени чрез приложението <TAG11/><L_NS/><TAG12/> Parental Controls.<TAG13/><TAG14/><NL/><TAG15/><TAG16/><L_ROMB/> <TAG17/>Тъй като всички ограничения на родителския контрол ще се премахнат, бъдете внимателни, когато детето ви играе на<NL/><TAG18/><L_NS/><TAG19/>.<TAG20/><TAG21/><TAG22/>"
