- source: "Along with your <L_NS/> console, <L_N10/> sent some hardware to connect your console to a TV. Here's how to enjoy gaming on the big screen:<NL/><NL/>First, find the <L_NS/> dock, the AC adapter, and the <L_HDMI/> cable. <NL/><NL/>Next, open up the back cover on the dock and connect the AC adapter. <NL/><NL/>Then use the <L_HDMI/> cable to connect the dock to the TV.<NL/><NL/><L_DOT3S/>And that's it! If you're planning to use the <L_JC/> controllers separately, detach them, then you can just slide your <L_NS/> console into the dock, and it should show up on the TV like magic."
  target: "Заедно с конзолата <L_NS/>, <L_N10/> изпрати и компоненти за свързването ѝ с телевизор. Ето как да се насладите на играта на голям екран:<NL/><NL/>Първо намерете докинг станцията на <L_NS/>, AC адаптера и <L_HDMI/> кабела. <NL/><NL/>После отворете задния капак на докинг станцията и свържете AC адаптера. <NL/><NL/>След това използвайте <L_HDMI/> кабела, за да свържете докинг станцията с телевизора.<NL/><NL/><L_DOT3S/>Готово! Ако ще използвате контролерите <L_JC/> отделно, откачете ги. После спуснете конзолата <L_NS/> в докинг станцията и картината трябва да се появи на телевизора като с магия."
