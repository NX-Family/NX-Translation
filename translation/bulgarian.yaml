- source: "An error has occurred on the other system.<TAG1/><NL/>Ask the other user to go to the HOME Menu on their system, open their user page, and check the status of<L_XA0/>their <L_N10/> Account.<NL/>If a user's <L_N10/> Account can't be used, <0xE151/><L_XA0/>will appear over their user<L_XA0/>icon on the HOME Menu."
  target: "Възникна грешка на другата конзола.<TAG1/><NL/>Помолете другия потребител да отвори меню HOME на своята конзола, да отвори потребителската си страница и да провери състоянието на<L_XA0/>своя <L_N10/> акаунт.<NL/>Ако <L_N10/> акаунтът на потребител не може да се използва, <0xE151/><L_XA0/>ще се покаже върху потребителската му<L_XA0/>икона в меню HOME."
