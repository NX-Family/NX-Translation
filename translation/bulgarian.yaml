- source: "With these settings turned off, you won't be asked for verification to use the feature, and other users on the system will also be able to freely access the associated feature.<TAG1/><NL/><L_DOT1/><TAG2/>When using <L_NEP/>, other users on this system can use funds and view account information, including payment method, etc.<TAG3/><NL/><L_DOT1/><TAG4/>On the virtual game card menu, other users on this system can view, load, and lend out purchased digital software.<TAG5/>"
  target: "Когато тези настройки са изключени, няма да се иска проверка за използване на функцията и другите потребители на конзолата също ще имат свободен достъп до съответната функция.<TAG1/><NL/><L_DOT1/><TAG2/>В <L_NEP/> другите потребители на тази конзола могат да харчат средства и да виждат информация за акаунта, включително начина на плащане и други данни.<TAG3/><NL/><L_DOT1/><TAG4/>В менюто за виртуални игрови карти другите потребители на тази конзола могат да преглеждат, зареждат и дават назаем закупен цифров софтуер.<TAG5/>"
- source: "With this option enabled, it is recommended that you use dual-controller grip."
