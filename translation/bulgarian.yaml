- source: "Animal Crossing: New Horizons save data cannot be transferred using the save-data transfer feature.<NL/><TAG1/><TAG2/>The save data for other software can still be sent.<TAG3/><TAG4/><TAG5/><NL/>Visit the <L_N10/> Support website for information on how to transfer Animal Crossing: New Horizons save data.<NL/><TAG6/>"
  target: "Данните за запис на Animal Crossing: New Horizons не могат да се прехвърлят чрез функцията за прехвърляне на данни за запис.<NL/><TAG1/><TAG2/>Данните за запис на друг софтуер все още могат да се изпращат.<TAG3/><TAG4/><TAG5/><NL/>За информация как да прехвърлите данните за запис на Animal Crossing: New Horizons посетете сайта за поддръжка на <L_N10/>.<NL/><TAG6/>"
