- source: "Virtual game cards can be lent to family group members after bringing your two systems close together and linking them.<TAG1/><NL/><L_DOT1/><TAG2/>While lent out, software can be freely played on the borrowing user's system, and the lending user gives up access to the software temporarily.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Virtual game cards can be borrowed for up to 14 days. Once that deadline is reached, the virtual game card will be automatically returned.<NL/><TAG6/><TAG7/>Lending users can also collect their virtual game cards from borrowers before the deadline arrives.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Users can lend out one virtual game card per borrower, up to a total of three borrowers at a time-though no more than one can be borrowed using any given system.<NL/><TAG13/><TAG14/>Once collected, a virtual game card can be lent out again.<TAG15/><TAG16/><TAG17/>"
  target: "Виртуални игрови карти могат да се дават назаем на членове на семейната група, след като приближите двете конзоли една до друга и ги свържете.<TAG1/><NL/><L_DOT1/><TAG2/>Докато картата е дадена назаем, софтуерът може да се играе свободно на конзолата на заемателя, а заемодателят временно се отказва от достъпа си до него.<TAG3/><TAG4/><NL/><L_DOT1/><TAG5/>Виртуални игрови карти могат да се вземат назаем за до 14 дни. След изтичане на срока виртуалната игрова карта ще се върне автоматично.<NL/><TAG6/><TAG7/>Заемодателите могат да си върнат виртуалните игрови карти от заемателите и преди крайния срок.<TAG8/><TAG9/><TAG10/><TAG11/><NL/><L_DOT1/><TAG12/>Потребителите могат да дават назаем по една виртуална игрова карта на заемател, на общо до трима заематели едновременно, но на всяка конзола може да има най-много една взета назаем карта.<NL/><TAG13/><TAG14/>След като бъде върната от заемателя, виртуалната игрова карта може да се даде назаем отново.<TAG15/><TAG16/><TAG17/>"
- source: "Virtual game cards you were unable to load (<TAG1/>)"
  target: "Виртуални игрови карти, които не успяхте да заредите (<TAG1/>)"
- source: "Visit the <L_N10/> Support website for further details.<NL/><TAG1/><TAG2/>Other information available there includes:<NL/><L_DOT1/><TAG3/>Using software without loading a virtual game card.<TAG4/><NL/><L_DOT1/><TAG5/>Unlinking a system.<TAG6/><TAG7/><TAG8/>"
  target: "За повече подробности посетете сайта за поддръжка на <L_N10/>.<NL/><TAG1/><TAG2/>Там има и информация за:<NL/><L_DOT1/><TAG3/>Използване на софтуер без зареждане на виртуална игрова карта.<TAG4/><NL/><L_DOT1/><TAG5/>Премахване на връзката с конзола.<TAG6/><TAG7/><TAG8/>"
- source: "Visit the <L_N10/> Support website for more details.<NL/><TAG1/><TAG2/>You can also find information on moving data between systems without performing a system transfer.<TAG3/><TAG4/>"
  target: "За повече подробности посетете сайта за поддръжка на <L_N10/>.<NL/><TAG1/><TAG2/>Там има и информация за преместване на данни между конзоли без системно прехвърляне.<TAG3/><TAG4/>"
- source: "Visit the <L_N10/> Support website on your smart device or PC."
