- source: "Automatic download settings are separate for each console.<NL/><TAG1/><TAG2/>To automatically download save data on another console, you will need to change the settings on that console. To<TAG3/><TAG4/> adjust your settings, go to <0xE130/> (System Settings) ⇒ Data Management ⇒ Save Data Cloud via the HOME Menu.<TAG5/><TAG6/>"
  target: "Настройките за автоматично изтегляне са отделни за всяка конзола.<NL/><TAG1/><TAG2/>За автоматично изтегляне на данни за запис на друга конзола трябва да промените настройките на тази конзола. За<TAG3/><TAG4/> промяна отворете <0xE130/> (Системни настройки) ⇒ Управление на данни ⇒ Данни за запис в облака от меню HOME.<TAG5/><TAG6/>"
